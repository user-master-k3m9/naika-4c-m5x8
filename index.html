<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>内科専門医 4択</title>
<meta name="theme-color" content="#7a3b6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="内科4択">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.offline{max-width:680px;margin-inline:auto;font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.offline b{color:var(--c2)}
</style>
<style>
/* Layout: 家計簿の方眼ノートの上に、1枚ずつめくる問題カード。採点は赤ペンの○ */
:root{
  --paper:#f5f4ee; --grid:rgba(31,107,92,.07); --card:#ffffff; --ink:#1f2a2a; --muted:#5b6866; --line:#d9ddd6;
  --acc:#1f6b5c; --acc-soft:#e1efeb; --maru:#cf3b2a; --maru-soft:#fbe7e3; --batsu:#46566a; --batsu-soft:#e8ecf1;
  --hl:#ffe9a0; --hl-ink:#1f2a2a; --hl-fill:#fff7d6;
  --c1:#1f6b5c; --c2:#2c5d8a; --c3:#a5661a; --c4:#7a4f8f; --c5:#8a5a3c; --c6:#b0405a;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121716; --grid:rgba(120,200,180,.06); --card:#1a2221; --ink:#e4ecea; --muted:#9aa9a6; --line:#2e3a38;
  --acc:#7cc7b3; --acc-soft:#1b332e; --maru:#ff7b67; --maru-soft:#3a201c; --batsu:#a9b8cc; --batsu-soft:#253039;
  --hl:#5c4e10; --hl-ink:#fff6cf; --hl-fill:#332c12;
  --c1:#7cc7b3; --c2:#82b2df; --c3:#e3a75c; --c4:#c59ed8; --c5:#d9a27e; --c6:#ec8ea3; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121716; --grid:rgba(120,200,180,.06); --card:#1a2221; --ink:#e4ecea; --muted:#9aa9a6; --line:#2e3a38;
  --acc:#7cc7b3; --acc-soft:#1b332e; --maru:#ff7b67; --maru-soft:#3a201c; --batsu:#a9b8cc; --batsu-soft:#253039;
  --hl:#5c4e10; --hl-ink:#fff6cf; --hl-fill:#332c12;
  --c1:#7cc7b3; --c2:#82b2df; --c3:#e3a75c; --c4:#c59ed8; --c5:#d9a27e; --c6:#ec8ea3; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.8;
  padding-inline:16px; padding-block:12px 48px;
}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
mark{background:linear-gradient(transparent 45%,var(--hl) 45%);color:inherit;padding:0 2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand .seal{width:40px;height:40px;border-radius:50%;border:3px solid var(--maru);color:var(--maru);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:13px;line-height:1;transform:rotate(-8deg);flex:none}
.brand b{font-family:var(--display);font-size:20px;font-weight:900;letter-spacing:.02em}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}

/* home */
.hero{display:flex;flex-direction:column;gap:10px;padding-block:8px}
.hero h1{font-size:clamp(26px,6vw,34px);font-weight:900}
.hero h1 .ox{color:var(--maru)}
.hero p{margin:0;color:var(--muted);max-width:34em}
.total{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;font-size:14px;color:var(--muted)}
.total strong{font-family:var(--display);font-size:28px;color:var(--ink);font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--maru);border-radius:99px;transition:width .4s}

.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.fields{grid-template-columns:1fr}}
.field{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;border-top:5px solid var(--fc)}
.field:hover{border-color:var(--fc)}
.field .tag{font-size:12px;letter-spacing:.08em;color:var(--fc);font-weight:700}
.field h3{font-size:19px}
.field p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.field .stat{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.field .meter i{background:var(--fc)}
.field .go{margin-top:2px;font-family:var(--display);font-weight:700;color:var(--fc);font-size:15px}

.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-family:var(--display);font-weight:700;font-size:16px;background:var(--acc);color:var(--card)}
.btn.sub{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel summary{font-family:var(--display);font-weight:700;font-size:17px;cursor:pointer}
.panel[open] summary{margin-bottom:10px}
.panel p{margin:.4em 0}
.stack{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:10px 0 6px}
.stack span{display:grid;place-items:center;color:var(--card);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px;font-size:13px}
.legend div{display:flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.qhead .fl{color:var(--fc);font-weight:700}
.qhead .n{margin-left:auto;font-variant-numeric:tabular-nums}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:18px;position:relative}
.qno{font-family:var(--display);font-size:13px;color:var(--fc);letter-spacing:.1em;font-weight:700}
.qtext{font-size:clamp(18px,4.6vw,21px);line-height:1.75;font-weight:700;font-family:var(--body)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:14px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s}
.choice:active{transform:scale(.97)}
.choice .mk{font-family:var(--display);font-size:46px;font-weight:900;line-height:1}
.choice .lb{font-size:13px;color:var(--muted)}
.choice.o .mk{color:var(--maru)}
.choice.x .mk{color:var(--batsu)}
.choice:hover{border-color:var(--acc)}
.choice.picked{border-color:var(--ink)}
.choice[disabled]{cursor:default}
.choice.dim{opacity:.4}

.verdict{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px}
.verdict.ok{background:var(--maru-soft)}
.verdict.ng{background:var(--batsu-soft)}
.verdict .big{font-family:var(--display);font-weight:900;font-size:52px;line-height:1;flex:none;width:58px;text-align:center}
.verdict.ok .big{color:var(--maru)}
.verdict.ng .big{color:var(--batsu)}
.verdict h3{font-size:20px}
.verdict p{margin:0;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.verdict .big{animation:stamp .35s ease-out}}
@keyframes stamp{from{transform:scale(1.8) rotate(-15deg);opacity:0}to{transform:none;opacity:1}}

.exp{display:flex;flex-direction:column;gap:14px}
.exp h4{font-family:var(--display);font-size:15px;margin:0;color:var(--acc);letter-spacing:.04em}
.exp .body p{margin:0 0 .6em}
.point{border:2px dashed var(--maru);border-radius:12px;padding:10px 14px;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.point::before{content:"覚える";flex:none;font-size:11px;background:var(--maru);color:var(--card);border-radius:6px;padding:2px 6px;margin-top:4px;letter-spacing:.06em}
.hon{background:var(--paper);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.75}
.hon .lbl{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:2px}
.words{display:flex;flex-direction:column;gap:6px;font-size:14px}
.words div{display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.words dt{font-weight:700;margin:0}
.words dt rt{font-size:10px;color:var(--muted);font-weight:400}
.words dd{margin:0;color:var(--muted)}
.fig{border:1px solid var(--line);border-radius:12px;padding:14px 10px;background:var(--paper);overflow-x:auto}
.fig .cap{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.qnav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.qnav .btn{flex:1 1 auto}
.kbd{font-size:12px;color:var(--muted);text-align:center}

/* figures */
.fig-svg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.fig-svg text{fill:var(--ink);font-size:13px;font-family:var(--body)}
.fig-svg text.sm{font-size:11px;fill:var(--muted)}
.fig-svg text.b{font-weight:700}
.fig-svg text.red{fill:var(--maru);font-weight:700}
.fig-svg text.acc{fill:var(--acc);font-weight:700}
.fig-svg .bx{fill:var(--card);stroke:var(--ink);stroke-width:1.4}
.fig-svg .ax{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1.4}
.fig-svg .hx{fill:var(--hl-fill);stroke:var(--maru);stroke-width:1.6}
.fig-svg .gx{fill:var(--line);stroke:none}
.fig-svg .ln{stroke:var(--ink);stroke-width:1.4;fill:none}
.fig-svg .ln.d{stroke-dasharray:5 4}
.fig-svg .ln.red{stroke:var(--maru);stroke-width:2}
.fig-svg .ln.thick{stroke-width:5}
.fig-svg .ah{fill:var(--ink)}
.fig-svg .ah.red{fill:var(--maru)}
.fig-svg .dot{fill:var(--maru)}
.fig-svg .tree{fill:var(--c2)}
.ft{width:100%;border-collapse:collapse;font-size:14px;min-width:300px;background:var(--card)}
.ft th,.ft td{border:1px solid var(--line);padding:7px 8px;text-align:center;vertical-align:middle;line-height:1.5}
.ft th{background:var(--acc-soft);font-weight:700}
.ft td.l,.ft th.l{text-align:left}
.ft .y{color:var(--maru);font-weight:700;font-size:17px}
.ft .n{color:var(--batsu);font-weight:700;font-size:17px}
.ft .hit{background:var(--hl-fill)}

/* end */
.end{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.score{font-family:var(--display);font-weight:900;font-size:56px;line-height:1;color:var(--maru);font-variant-numeric:tabular-nums}
.score small{font-size:22px;color:var(--muted)}
.miss{display:flex;flex-direction:column;gap:8px;width:100%}
.miss button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6}
.miss button b{color:var(--batsu);margin-right:6px}
.foot{font-size:12px;color:var(--muted);line-height:1.7}

/* levels */
.lvls{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.lvbtn{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;font-size:14px;text-align:left;line-height:1.3}
.lvbtn:hover{border-color:var(--fc)}
.lvbtn .nm{font-weight:700}
.lvbtn .nm small{font-weight:400;color:var(--muted);margin-left:6px;font-size:12px}
.lvbtn .sc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lvbtn .done{color:var(--maru)}
.lvdot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:13px;color:var(--card);flex:none}
.lvdot.l1,.chip.l1{background:var(--c2)}
.lvdot.l2,.chip.l2{background:var(--c3)}
.lvdot.l3,.chip.l3{background:var(--maru)}
.chip{color:var(--card);font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px}
.lvsum{font-size:13px}
.steps{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.step{display:flex;align-items:center;gap:8px;min-width:0}
.step b{display:block;font-family:var(--display);font-size:15px;line-height:1.2}
.step small{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.steps .arrow{color:var(--muted)}
.goro8{font-family:var(--display);font-size:clamp(16px,4.2vw,19px);line-height:1.7;text-align:center;padding:10px 8px 14px}
.goro8 b{color:var(--maru)}
.goro{border-radius:12px;padding:10px 14px;background:var(--hl-fill);font-size:14px;line-height:1.75}
.goro .lbl{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em}
.goro .g{font-family:var(--display);font-size:16px}
.goro .g b{color:var(--maru)}
.resume{display:flex;flex-direction:column;gap:8px}
.resume h2{font-size:16px}
.resitem{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--fc);border-radius:12px;padding:10px 12px}
.resitem .t{font-weight:700;font-size:15px;line-height:1.4;min-width:0}
.resitem .t small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.resitem .btn{padding:8px 14px;font-size:14px}
.resitem .ghost{font-size:12px}
.qtools{display:flex;justify-content:flex-end;gap:8px;margin-top:-10px}
.qtools .ghost{font-size:12px;padding:4px 12px}

.flead{margin:0 4px 10px;font-weight:700;font-size:15px;line-height:1.6}
.fnote{margin:8px 4px 0;font-size:13px;color:var(--muted);line-height:1.6}
.point::before{content:none}
.point{flex-direction:column;gap:2px}
.plbl{display:inline-block;font-size:11px;background:var(--maru);color:var(--card);border-radius:6px;padding:1px 8px;margin-bottom:4px;letter-spacing:.06em}
.point > span{display:flex;flex-direction:column;align-items:flex-start}
.ft td{text-align:left}
.ft td:has(.y:only-child),.ft td:has(.n:only-child){text-align:center}
.ft{font-size:13.5px}
.ft th:not(:first-child),.ft td{min-width:5.2em}
.ft tbody th.l{min-width:7em;max-width:14em}
/* 第5版：今日のおすすめ・本番形式 */
.today{background:var(--card);border:2px solid var(--maru);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.tdhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.tdlbl{font-family:var(--display);font-weight:900;font-size:20px}
.tdsub{font-size:13px;color:var(--muted)}
.btn.big{font-size:18px;padding:14px 18px;background:var(--maru)}
.tdstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tdstats div{display:flex;flex-direction:column;align-items:flex-start;gap:0;background:var(--paper);border-radius:10px;padding:8px 10px;min-width:0}
.tdstats b{font-family:var(--display);font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.tdstats span{font-size:12px;color:var(--muted);line-height:1.4}
.tdstats small{display:block;font-size:10px}
.est{margin:0;font-size:14px}
.est b{font-family:var(--display);font-size:18px;color:var(--maru)}
.est small{color:var(--muted)}
.exam{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.exam h2,.sec{font-size:18px}
.exam p{margin:0;font-size:14px;color:var(--muted)}
.hi{color:var(--c3);font-size:13px;letter-spacing:.05em}
.exhead{font-weight:700;font-size:16px;line-height:1.7}
.stl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.stl li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:15px;line-height:1.75;padding:10px 12px;border-radius:10px;background:var(--paper)}
.stl li.sf{background:var(--batsu-soft)}
.stl li.st{background:var(--maru-soft)}
.stl .sn{font-family:var(--display);font-weight:900;font-size:16px;min-width:1.4em;text-align:center;color:var(--acc)}
.stl .tx{min-width:0}
.stl .tv{display:block;font-size:13px;margin-top:2px}
.stl li.sf .tv{color:var(--batsu)}
.stl li.st .tv{color:var(--maru)}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 4px;font-size:16px;font-family:var(--display);font-weight:700}
.opt:hover{border-color:var(--acc)}
.opt.right{border-color:var(--maru);background:var(--maru-soft);color:var(--maru)}
.opt.wrongpick{border-color:var(--batsu);background:var(--batsu-soft)}
.opt.dim{opacity:.45}
.opt[disabled]{cursor:default}
.exexp{display:flex;flex-direction:column;gap:8px}
.stexp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
.stexp summary{cursor:pointer;font-weight:700;font-size:14px;line-height:1.6}
.stexp summary .y{color:var(--maru)}
.stexp summary .n{color:var(--batsu)}
.stexp .exp{margin-top:10px}
.timer{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.byf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.byf div{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--fc);border-radius:10px;padding:8px 12px;font-size:14px}
.byf b{font-variant-numeric:tabular-nums}
.qtools{justify-content:space-between;align-items:center}
.qtools .back{font-weight:700}
.seen{font-size:11px;color:var(--muted);margin-left:8px;letter-spacing:0;font-weight:400}
.miss b.okm{color:var(--maru)}
.qnav .btn.sub{flex:0 1 auto}

.rlist{display:grid;gap:8px}
.rrow{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid var(--line);border-left:5px solid var(--fc);border-radius:10px;padding:8px 12px;background:var(--card)}
.rrow span{font-size:14.5px;font-weight:700}.rrow small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.rrow .ghost{min-height:40px;white-space:nowrap}.rrow .ghost:disabled{opacity:.35}
.ghost.danger{color:var(--ng,#c2410c);border-color:var(--ng,#c2410c)}
.selfmark .qclr{display:block;margin-top:8px;font-size:13px;min-height:36px}
.rbar{margin:28px 0 8px;padding-top:14px;border-top:1px dashed var(--line);text-align:center}
.rbar>.ghost{min-height:40px;color:var(--muted)}

const Q=[{"id":"sogo-6e4a8a45","f":"sogo","u":0,"o":0,"lv":1,"q":"医療倫理の4原則に含まれないものはどれか。","ch":["経済性（医療資源の節約を最優先する）","自律尊重（患者の自己決定を尊重する）","無危害（害を与えない）","正義（公平に医療資源を配分する）"],"a":0,"cx":["","自律尊重は4原則の1つ。インフォームド・コンセントの土台。","無危害は4原則の1つ（ヒポクラテス以来の「害をなすなかれ」）。","正義（公正）は4原則の1つ。医療資源の公平な配分を含む。"],"core":"Beauchamp と Childress の4原則＝自律尊重・無危害・善行（与益）・正義。経済性は原則ではない。","e":"臨床での使い方：原則どうしがぶつかるとき（例：本人の拒否＝自律尊重 vs 命を救う＝善行）に、どれを重くみるかを話し合う道具。\n実際の検討には Jonsen の4分割表（医学的適応・患者の意向・QOL（quality of life：生活の質）・周囲の状況）を使う。\nインフォームド・コンセントの要素：①判断能力がある ②十分な説明（病名・治療・代替案・しないときの見通し）③理解 ④自発的な同意。","tg":[]},{"id":"sogo-0dc170a1","f":"sogo","u":0,"o":1,"lv":2,"q":"意思決定能力（判断能力）の評価について正しいものはどれか。","ch":["決める内容ごとに評価し、認知症でも能力は残りうる","MMSE（Mini-Mental State Examination：認知機能の検査） が 24点未満なら、同意能力はないと判定する","精神科医でなければ、意思決定能力の評価はできない","認知症と診断されたら、すべての決定能力がないとみなす"],"a":0,"cx":["","MMSE は認知機能の検査で、決定能力そのものを測るものではない。","主治医が評価してよい。難しいときに精神科へ相談する。","認知症の診断名だけで能力を否定しない。軽い決定はできることが多い。"],"core":"意思決定能力＝その決定について「理解・認識・論理的思考・選択の表明」の4つができるか。決定ごと・時点ごとに評価する。","e":"4つの要素（Appelbaum）：①説明を理解する ②自分のこととして認識する ③選択肢を比べて考える ④選んだ結果を伝える。\nせん妄・痛み・薬で一時的に落ちることがあるので、治せる原因を除いてから評価し直す。\n能力がないときは、本人の推定意思（以前の言葉・価値観）を家族などから聞き、本人にとって最善の方針を医療・ケアチームで話し合う（厚生労働省「人生の最終段階における医療・ケアの決定プロセスに関するガイドライン」）。","tg":[]},{"id":"sogo-99a973ef","f":"sogo","u":0,"o":2,"lv":2,"q":"アドバンス・ケア・プランニング（ACP（advance care planning：アドバンス・ケア・プランニング））について正しいものはどれか。","ch":["一度書面にしたら内容を変えてはならない事前指示書のこと","家族の同意があれば、本人と話し合わずに決めてよい","本人の価値観や希望を、家族・医療者と繰り返し話し合う","終末期と診断されてから、初めて行うものである"],"a":2,"cx":["ACP は書類を作ることより、繰り返し話し合う「過程」が中心。気持ちが変われば何度でも見直す。","ACP の中心は本人。本人が話せるうちに本人と話す。","","元気なうちから、病気の早い段階から始めることが勧められる。"],"core":"ACP（愛称「人生会議」）＝本人が大切にしていることを、家族・医療ケアチームと前もって繰り返し話し合い、共有する過程。","e":"話し合う内容：大切にしていること、望む療養場所、受けたい・受けたくない治療（心肺蘇生・人工呼吸・胃ろう・透析など）、代わりに決めてほしい人（代理意思決定者）。\n事前指示（リビングウィル）は ACP の結果の一部で、ACP そのものではない。\nDNAR（心停止時に心肺蘇生をしない）の指示は「ほかの治療もしない」という意味ではない。抗菌薬・輸液などは別に話し合う。","tg":[]},{"id":"sogo-1037163b","f":"sogo","u":0,"o":3,"lv":3,"q":"82歳の男性。進行した肺癌で入院中、意識はしっかりしており判断能力もある。本人は「抗がん剤はもうやめて家に帰りたい」と話しているが、長男は「できる治療は全部続けてほしい」と強く希望している。主治医の対応として最も適切なのはどれか。","ch":["本人の意向を中心に、家族も交えて話し合いを重ねる","本人の希望どおりにし、長男には知らせずに退院させる","倫理委員会の結論が出るまで本人に説明しない","長男の希望に従い、抗がん剤の治療を続ける"],"a":0,"cx":["","本人の希望は尊重するが、家族を締め出すのではなく、本人の了解を得て家族と共有するのが望ましい。","委員会に相談することはあっても、本人への説明や話し合いを止める理由にはならない。","判断能力のある本人の意思が優先。家族の希望で治療を押しつけることはできない。"],"core":"判断能力のある成人の治療拒否は尊重する（自律尊重）。家族とは対立させず、本人の意向を中心に合意をつくる。","e":"家族が反対する背景には「見捨てるようで申し訳ない」という気持ちや、病状の理解の差があることが多い。病状・見通し・緩和ケアでできることを説明し、家族の気持ちも聞く。\n話し合いの経過は診療録に残す。\n本人が判断できない場合は、推定意思→最善の利益の順で考え、家族と医療・ケアチームで合意を目指す。決まらないときは複数の専門職からなる話し合いの場（倫理コンサルテーションなど）を使う。","tg":["cs"]},{"id":"sogo-3ff78276","f":"sogo","u":1,"o":4,"lv":1,"q":"ある検査の感度が 90%、特異度が 80% である。陽性尤度比はどれか。","ch":["9.0","1.1","0.125","4.5"],"a":3,"cx":["感度÷（1－感度）ではない。","感度÷特異度ではない。","陰性尤度比＝（1－感度）÷特異度＝0.1÷0.8＝0.125。",""],"core":"陽性尤度比＝感度÷（1－特異度）＝0.9÷0.2＝4.5。陰性尤度比＝（1－感度）÷特異度。","e":"使い方：検査前オッズ×尤度比＝検査後オッズ。\n目安：陽性尤度比が10以上・陰性尤度比が0.1以下なら、診断を大きく動かす。\n感度が高い検査は陰性のとき除外に強い（SnNout）。特異度が高い検査は陽性のとき確定に強い（SpPin）。\n尤度比は有病率に左右されないので、どの集団にも使える。","tg":[]},{"id":"sogo-0d24b1b8","f":"sogo","u":1,"o":5,"lv":2,"q":"感度・特異度が同じ検査を、有病率の低い集団（健診）で使った。有病率の高い集団（専門外来）と比べて正しいものはどれか。","ch":["陽性的中率が下がり、陰性的中率が上がる","陽性尤度比が下がり、陰性尤度比が上がる","陽性的中率も陰性的中率も、どちらも上がる","感度が下がり、そのぶん特異度が上がる"],"a":0,"cx":["","尤度比も有病率に左右されない。","陽性的中率は有病率が低いと下がる。両方が上がることはない。","感度・特異度は検査そのものの性質で、有病率では（原則）変わらない。"],"core":"的中率（陽性・陰性）は有病率で変わる。有病率が低い→偽陽性の割合が増え、陽性的中率が下がる。","e":"例：感度・特異度 90% の検査で、有病率1%なら陽性者の約92%は偽陽性（陽性的中率 約8%）。\n健診（スクリーニング）で陽性でも、確定のための精密検査が必要な理由。\n検査前確率（有病率）を見積もってから検査を選び、結果を読むのが診断の基本（ベイズの考え方）。","tg":[]},{"id":"sogo-a8020379","f":"sogo","u":1,"o":6,"lv":2,"q":"治療薬 A のランダム化比較試験で、5年間の心筋梗塞の発症が対照群 10%、A 群 6% だった。治療必要数（NNT（number needed to treat：治療必要数））はどれか。","ch":["40人","60人","25人","4人"],"a":2,"cx":["相対リスク減少は 40%（4÷10）。NNT ではない。","計算が合わない。NNT＝1÷0.04＝25。","","4 は絶対リスク減少（%）そのもので、NNT ではない。"],"core":"NNT＝1÷絶対リスク減少（ARR（absolute risk reduction：絶対リスク減少））。ARR＝10%－6%＝4%＝0.04 → NNT＝25（5年間で25人に使うと1人の心筋梗塞を防ぐ）。","e":"相対リスク減少（RRR（relative risk reduction：相対リスク減少））＝ARR÷対照群のリスク＝40%。数字は大きく見えるが、もともとのリスクが低いと ARR・NNT は小さくなる。\n有害事象についての同じ計算が NNH（number needed to harm）。\n期間（5年間など）を必ず一緒に言う。","tg":[]},{"id":"sogo-224109d9","f":"sogo","u":1,"o":7,"lv":2,"q":"研究デザインと特徴の組み合わせで正しいものはどれか。","ch":["症例対照研究 ― まれな病気の危険因子の検討に向く","横断研究 ― 原因と結果の時間の順がはっきりわかる","コホート研究 ― 発症率は計算できない","ランダム化比較試験 ― 交絡因子の影響が最も大きい"],"a":0,"cx":["","横断研究は1時点の調査で、どちらが先かはわからない。","コホート研究は曝露のある人とない人を追うので、発症率・相対リスクが計算できる。","ランダム化は、未知の交絡因子まで両群に均等に分ける。交絡が最も小さい。"],"core":"症例対照研究：病気の人と病気でない人を集め、過去の曝露を比べる（オッズ比）。まれな病気に向くが、思い出しのバイアスが出やすい。","e":"エビデンスの強さ（目安）：システマティックレビュー・メタ解析＞ランダム化比較試験＞コホート研究＞症例対照研究＞症例集積・症例報告＞専門家の意見。\nITT（intention-to-treat）解析：割り付けた群のまま解析し、ランダム化の利点を保つ。\n第1種の過誤（α）＝本当は差がないのに差があるとする誤り、第2種の過誤（β）＝本当は差があるのに見逃す誤り。検出力＝1－β。","tg":[]},{"id":"sogo-007f00ad","f":"sogo","u":1,"o":8,"lv":3,"q":"検査前確率 20% の患者に、陽性尤度比 9 の検査を行い陽性だった。検査後確率に最も近いのはどれか。","ch":["約 29%","約 90%","約 99%","約 70%"],"a":3,"cx":["検査前確率に尤度比を足したり掛けたりした値ではない。オッズに直して計算する。","尤度比 9 でも、検査前確率が 20% なら 90% までは上がらない。","99% になるには検査前確率がもっと高いか、尤度比がずっと大きい必要がある。",""],"core":"検査前オッズ＝0.2/0.8＝0.25。検査後オッズ＝0.25×9＝2.25。検査後確率＝2.25/(1＋2.25)≒69%。","e":"確率→オッズ：p/(1－p)、オッズ→確率：o/(1＋o)。\nFagan のノモグラムで、線を引いて読むこともできる。\n同じ検査でも、検査前確率が低い（5%）なら検査後確率は約32% にとどまる。だから「誰に検査するか」が大事。\n複数の独立した検査は尤度比を掛け合わせられる（独立でないと過大評価になる）。","tg":["cs"]},{"id":"sogo-7cb8e9cd","f":"sogo","u":2,"o":9,"lv":1,"q":"フレイルの診断（Fried の基準・日本版 J-CHS 基準）の項目に含まれないものはどれか。","ch":["認知機能の低下","握力の低下","歩行速度の低下","体重減少"],"a":0,"cx":["","握力の低下（男性28 kg 未満・女性18 kg 未満）は項目の1つ。","歩行速度の低下（1.0 m/秒未満）は項目の1つ。","体重減少は項目の1つ（6か月で2 kg 以上の意図しない減少）。"],"core":"J-CHS の5項目＝体重減少・筋力（握力）低下・疲労感・歩行速度低下・身体活動の低下。3つ以上でフレイル、1〜2つでプレフレイル。","e":"フレイルは「健康と要介護の間」で、適切な介入で戻りうる状態。身体的だけでなく、精神・心理的（うつ・認知機能）、社会的（独居・閉じこもり）フレイルもあるが、J-CHS の5項目は身体的フレイルの評価。\nサルコペニア（AWGS（Asian Working Group for Sarcopenia） 2019）：筋肉量の低下＋筋力（握力 男性28 kg 未満・女性18 kg 未満）または身体機能（歩行速度1.0 m/秒未満など）の低下。\n介入：レジスタンス運動＋十分なたんぱく質（1.0〜1.2 g/kg/日 程度）。","tg":[]},{"id":"sogo-17c80afc","f":"sogo","u":2,"o":10,"lv":2,"q":"高齢者のせん妄について正しいものはどれか。","ch":["発症は数か月かけてゆっくりである","低活動型が多く、見逃されやすい","予防には夜間のベンゾジアゼピン系薬が有効である","症状は1日中変わらず続くのが特徴である"],"a":1,"cx":["発症は急（数時間〜数日）。数か月かけて進むのは認知症。","","ベンゾジアゼピン系薬はせん妄の原因になる（アルコール離脱せん妄は別）。","症状は日内変動があり、夕方〜夜に悪化しやすい。"],"core":"せん妄＝急に起こる注意の障害と意識の変容。日内変動がある。原因（感染・脱水・薬・痛み・便秘・尿閉・低酸素・電解質）を探して治す。","e":"低活動型（ぼんやり・反応が鈍い）はうつや認知症と間違われやすく、予後が悪い。\n評価：CAM（急性発症と変動＋注意障害、に加えて思考の解体か意識レベルの変化）。\n予防（多面的介入）：見当識の手がかり（時計・カレンダー）、眼鏡・補聴器、早期離床、睡眠リズムを整える、脱水を防ぐ、不要な薬・カテーテルを外す。\n薬：原因治療が基本。興奮が強く危険なときに抗精神病薬を少量・短期間。","tg":[]},{"id":"sogo-fa04004c","f":"sogo","u":2,"o":11,"lv":2,"q":"高齢者で「特に慎重な投与を要する薬物」（Beers 基準・日本老年医学会のリスト）として転倒・せん妄の原因になりやすいのはどれか。","ch":["鎮痛薬のアセトアミノフェン（常用量）","ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬（エナラプリル（レニベース）など）の常用量","スタチン（HMG-CoA 還元酵素阻害薬）","抗コリン作用の強い第一世代抗ヒスタミン薬"],"a":3,"cx":["アセトアミノフェンは高齢者の鎮痛でまず使いやすい薬（肝障害と量に注意）。","ACE 阻害薬はリストで避ける薬に入らない。誤嚥性肺炎の予防効果が報告されている。","スタチンは避ける薬に入らない。",""],"core":"高齢者で避けたい代表：抗コリン薬（第一世代抗ヒスタミン薬・三環系抗うつ薬・過活動膀胱治療薬の一部）、ベンゾジアゼピン系、長期の NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）、スルホニル尿素薬（低血糖）。","e":"抗コリン作用の害：せん妄・認知機能低下・便秘・尿閉・口渇・転倒。\n多剤併用（ポリファーマシー）：6種類以上で有害事象・転倒が増える（日本の報告）。薬の見直しでは、目的のはっきりしない薬・重複・相互作用・腎機能に合わない量を探す。\n処方カスケード：副作用を新しい症状と見て、さらに薬を足すこと（例：カルシウム拮抗薬の浮腫に利尿薬）。","tg":[],"mt":["dmdrugs"]},{"id":"sogo-6ae9dcea","f":"sogo","u":2,"o":12,"lv":3,"q":"84歳の女性。要介護2で独居。この1か月で3回転倒した。服用薬はアムロジピン（アムロジン、ノルバスク）、ドキサゾシン（カルデナリン）、ゾルピデム（マイスリー）、フロセミド（ラシックス）、オキシブチニン（ポラキス）、酸化マグネシウム。血圧は座位 128/70 mmHg、立位3分後 98/60 mmHg。まず行うべき対応として最も適切なのはどれか。","ch":["起立性低血圧に対して昇圧薬ミドドリン（メトリジン）を追加する","転倒予防と不安の軽減のために抗不安薬を追加する","ドキサゾシン・ゾルピデム・オキシブチニンの中止を検討","骨折予防のためにビスホスホネートを追加して経過を見る"],"a":2,"cx":["薬による起立性低血圧に薬を足すのは処方カスケード。まず原因薬を減らす。","抗不安薬（ベンゾジアゼピン系）は転倒をさらに増やす。","","骨粗鬆症の評価は大事だが、まず転倒の原因（薬）を取り除く。"],"core":"高齢者の転倒は薬から見直す：α遮断薬（起立性低血圧）、睡眠薬、抗コリン薬、利尿薬。足すより「減らす」。","e":"起立性低血圧の基準：立位3分以内に収縮期 20 mmHg 以上または拡張期 10 mmHg 以上の低下。\n転倒の評価：薬・起立性低血圧・視力・筋力とバランス（Timed Up & Go）・認知機能・住環境・足の状態・夜間頻尿。\n効果のある介入：運動（筋力とバランス）、薬の見直し、住宅改修、ビタミンD 不足の補正、白内障の手術。","tg":["cs"]},{"id":"sogo-59f7f676","f":"sogo","u":2,"o":13,"lv":2,"q":"高齢者の総合機能評価（CGA）について正しいものはどれか。","ch":["血液検査の結果だけで、総合的に評価する","認知症がある人には、評価を行わない","入院患者だけが対象で、外来・在宅では使わない","生活機能・認知・気分・栄養・社会環境を多面的に評価"],"a":3,"cx":["CGA は検査値だけでなく、生活機能・心理・社会的な面を含めて評価する。","認知症の人こそ、介護・生活環境の評価が大切。","外来・在宅・施設どこでも使える。",""],"core":"CGA＝ADL（Barthel 指数など）・手段的 ADL（買い物・服薬管理など）・認知機能（MMSE（Mini-Mental State Examination：認知機能の検査）・HDS-R）・気分（GDS）・栄養（MNA）・社会環境（家族・介護・経済）を評価し、多職種で目標を決める。","e":"ADL：食事・移動・整容・トイレ・入浴・歩行・階段・更衣・排便・排尿の自立度。\n手段的 ADL（IADL）：電話・買い物・食事の準備・家事・洗濯・移動・服薬管理・金銭管理。認知症の初期は IADL から落ちる。\n高齢者の診療の目標は、病気を治すことだけでなく、生活機能と QOL（quality of life：生活の質） を保つこと。","tg":[]},{"id":"sogo-2bcfea9b","f":"sogo","u":3,"o":14,"lv":1,"q":"腫瘍随伴症候群と原因の組み合わせで正しいものはどれか。","ch":["胸腺腫 ― Lambert-Eaton 筋無力症候群","腎細胞癌 ― 低カルシウム血症とテタニー","肺扁平上皮癌 ― 異所性 ACTH（adrenocorticotropic hormone：副腎皮質刺激ホルモン） 症候群（Cushing）","肺小細胞癌 ― 抗利尿ホルモン不適合分泌症候群"],"a":3,"cx":["胸腺腫は重症筋無力症（抗アセチルコリン受容体抗体）。Lambert-Eaton は小細胞癌。","腎細胞癌は多血症（エリスロポエチン）や高カルシウム血症（PTHrP（PTH-related protein：副甲状腺ホルモン関連蛋白））を起こす。","異所性 ACTH 症候群は小細胞癌やカルチノイドに多い。扁平上皮癌は PTHrP（PTH-related protein：副甲状腺ホルモン関連蛋白） による高カルシウム血症。",""],"core":"小細胞癌（神経内分泌）＝SIADH（syndrome of inappropriate secretion of antidiuretic hormone：抗利尿ホルモン不適合分泌症候群）・異所性 ACTH・Lambert-Eaton。扁平上皮癌＝PTHrP（PTH-related protein：副甲状腺ホルモン関連蛋白） の高カルシウム血症。","e":"ほかの代表：\n・腎細胞癌：多血症、高カルシウム血症、発熱、Stauffer 症候群（肝転移のない肝機能異常）\n・肝細胞癌：多血症、低血糖\n・胸腺腫：重症筋無力症、赤芽球癆、低ガンマグロブリン血症（Good 症候群）\n・卵巣奇形腫：抗 NMDA（N-methyl-D-aspartate） 受容体脳炎\n・胃癌など腺癌：Trousseau 症候群（凝固亢進で脳梗塞）、黒色表皮腫、Leser-Trélat 徴候\n・皮膚筋炎（とくに抗 TIF1-γ抗体）：成人では悪性腫瘍の合併を探す","tg":[],"fig":["lowna","hpaxis"],"mt":["paraneo"]},{"id":"sogo-7d275967","f":"sogo","u":3,"o":15,"lv":2,"q":"腫瘍崩壊症候群で見られる検査所見の組み合わせはどれか。","ch":["低尿酸・高カリウム・低リン・低カルシウム","高尿酸・低カリウム・低リン・高カルシウム","低尿酸・低カリウム・低リン・高カルシウム","高尿酸・高カリウム・高リン・低カルシウム"],"a":3,"cx":["尿酸は核酸の分解で上がる。リンは上がる。","カリウム・リンは細胞内に多いので上がる。カルシウムはリンと結合して下がる。","すべて逆。細胞の中身があふれる所見になる。",""],"core":"細胞内に多いもの（K・P・核酸→尿酸）が血中にあふれ、リン酸カルシウムが沈着して Ca が下がる。急性腎障害・不整脈・けいれん。","e":"起こりやすい：腫瘍量が多く増殖の速い腫瘍（Burkitt リンパ腫、急性白血病、とくに白血球数が多い）を治療し始めたとき。自然発症もある。\n予防：大量の補液（尿量を保つ）、尿酸生成抑制薬（アロプリノール（ザイロリック）・フェブキソスタット）、高リスクではラスブリカーゼ（尿酸を分解。G6PD（glucose-6-phosphate dehydrogenase：グルコース-6-リン酸脱水素酵素） 欠損症では溶血するので禁忌）。\n尿のアルカリ化は、リン酸カルシウムの沈着を増やすので今は勧められない。","tg":[],"mt":["potassium"]},{"id":"sogo-d4b892d4","f":"sogo","u":3,"o":16,"lv":2,"q":"免疫チェックポイント阻害薬による免疫関連有害事象（irAE（immune-related adverse event：免疫関連有害事象））として正しいものはどれか。","ch":["ステロイドを使うと抗腫瘍効果が必ず消える","甲状腺機能異常はまれである","発症は投与開始から1週間以内に限られる","劇症1型糖尿病が起こることがある"],"a":3,"cx":["必要なステロイドで抗腫瘍効果が大きく落ちる証拠は乏しい。重い irAE には迷わず使う。","甲状腺機能異常は最も多い内分泌の irAE（甲状腺炎→一過性の中毒症→低下症）。","irAE は投与中いつでも、中止後に起こることもある。",""],"core":"irAE は全身のどこにでも起こる自己免疫：皮膚・大腸炎・肝炎・肺臓炎・甲状腺・下垂体炎・1型糖尿病・心筋炎・筋炎・腎炎など。","e":"内分泌の irAE はステロイドで戻らないことが多く、ホルモンの補充を続ける（甲状腺ホルモン、ヒドロコルチゾン（静注はソル・コーテフ、内服はコートリル）、インスリン）。\n劇症1型糖尿病：急な高血糖とケトアシドーシス、HbA1c（ヘモグロビン A1c、過去1〜2か月の平均血糖の指標） は比較的低い。インスリンが必要。\n下垂体炎（とくに抗 CTLA-4（cytotoxic T-lymphocyte-associated protein 4） 抗体）：ACTH（adrenocorticotropic hormone：副腎皮質刺激ホルモン） 単独欠損が多く、倦怠感・低ナトリウム。副腎不全は命にかかわるので先にヒドロコルチゾンを補う。\n心筋炎・筋炎・重症筋無力症の重なりは致死率が高い。CK（creatine kinase：クレアチンキナーゼ）・トロポニンを測る。\n重症度（Grade）3以上は原則休薬し、ステロイド（プレドニゾロン（プレドニン） 1〜2 mg/kg）。","tg":["ae"],"fig":["hpaxis"],"mt":["irae","thyroid"]},{"id":"sogo-31cf3726","f":"sogo","u":3,"o":17,"lv":2,"q":"がんの全身状態（パフォーマンスステータス：ECOG（Eastern Cooperative Oncology Group） PS（performance status：全身状態の指標））で「PS 2」にあたるのはどれか。","ch":["まったく動けず、終日ベッドか椅子で過ごす","歩行や身の回りのことはできるが、日中の半分以上は起きている","軽い症状があるが、軽い家事や事務作業はできる","身の回りのことが一部しかできず、日中の半分以上を寝て過ごす"],"a":1,"cx":["これは PS 4。","","これは PS 1。","これは PS 3。"],"core":"ECOG PS：0＝無症状で普段どおり、1＝軽作業可、2＝身の回りは可・日中50%以上は起きている、3＝身の回りも一部・50%以上臥床、4＝全介助。","e":"多くの抗がん薬治療は PS 0〜1（〜2）が対象。PS 3〜4 では、効果より害が大きいことが多く、緩和ケアが中心になる（例外：分子標的薬が劇的に効く遺伝子変異があるときなど）。\n予後や治療の選択の、最も強い因子の1つ。","tg":[]},{"id":"sogo-92a60b7e","f":"sogo","u":4,"o":18,"lv":2,"q":"がんの痛みに対するオピオイドの使い方として正しいものはどれか。","ch":["吐き気には耐性ができないので、ずっと制吐薬を使う","痛みが取れなくても、量の上限はモルヒネ 60 mg/日である","便秘はほぼ必ず起こるので、最初から緩下薬を使う","腎機能が低い人にはモルヒネが最も安全である"],"a":2,"cx":["吐き気は1〜2週で耐性ができることが多い。制吐薬は始めの頃に使い、漫然と続けない。","強オピオイドに天井効果（上限）はない。副作用が許せる範囲で痛みに合わせて増やす。","","モルヒネは代謝物（M6G（モルヒネ-6-グルクロニド、活性のある代謝物）・M3G（モルヒネ-3-グルクロニド、神経毒性のある代謝物））が腎から出るので、腎機能が低いと眠気・せん妄・ミオクローヌス。オキシコドン（オキシコンチン）・フェンタニル・ヒドロモルフォンを選ぶ。"],"core":"オピオイドの副作用で耐性ができないのは便秘（縮瞳も）。最初から緩下薬（酸化マグネシウム・刺激性下剤・ナルデメジン）を併用する。","e":"基本：経口で・時間を決めて・痛みの強さに合わせて・一人ひとりに合わせて。突出痛には頓用（レスキュー：1日量の1/6 程度の速放性製剤）。\nナルデメジン（スインプロイク）：腸の μ 受容体だけを止める（脳に入りにくい）オピオイド誘発性便秘の薬。\n呼吸抑制は、眠気が先に出ることが多い。急に量を増やしたとき・腎機能の悪化時に注意。拮抗薬はナロキソン。\nオピオイドの換算（経口モルヒネ 60 mg/日 ≒ 経口オキシコドン（オキシコンチン） 40 mg/日 ≒ フェンタニル（デュロテップ MT パッチなど）貼付 0.6 mg/日（25 μg/時））。","tg":["ae"]},{"id":"sogo-02c25e73","f":"sogo","u":4,"o":19,"lv":3,"q":"70歳の男性。膵癌の多発肝転移で在宅療養中。この数日で、昼夜が逆転し、つじつまの合わないことを言うようになった。経口摂取は少量。オキシコドン（オキシコンチン）徐放錠 40 mg/日を服用。血清カルシウム 12.8 mg/dL（アルブミン 3.0 g/dL）。まず考えるべき対応はどれか。","ch":["抗精神病薬だけを使い、血液検査などは追加しない","痛みが強くなったと考えてオキシコドンを倍量にする","終末期のせん妄と考えて、すぐに持続的な鎮静を始める","補液とビスホスホネートで高カルシウム血症を治療"],"a":3,"cx":["抗精神病薬は症状を抑えるだけ。原因を治さないと良くならない。","痛みの悪化ではなく意識の変化。増量はせん妄を悪くするおそれがある。","原因の治る可能性があるせん妄を、すぐに終末期と決めない。",""],"core":"補正 Ca＝12.8＋（4－3.0）＝13.8 mg/dL。がんの高カルシウム血症は、意識障害・脱水・便秘の原因で、治療で戻る。","e":"補正カルシウム＝測定値＋（4－アルブミン）（アルブミンが4 g/dL 未満のとき）。\nがんの高カルシウム血症：PTHrP（扁平上皮癌・腎細胞癌・成人T細胞白血病など）、骨転移（溶骨性：乳癌・多発性骨髄腫）、まれにリンパ腫の活性型ビタミンD。\n治療：生理食塩水の補液（脱水を直す）→ ビスホスホネート（ゾレドロン酸（ゾメタ、がんの高カルシウム血症、リクラスト、骨粗鬆症）、効くまで2〜4日）、デノスマブ（プラリア、骨粗鬆症）、即効性のカルシトニン（数日で効かなくなる）。\nせん妄の治る原因：高カルシウム血症、低ナトリウム、脱水、感染、オピオイド・ステロイド・抗コリン薬、便秘・尿閉、低酸素、脳転移。","tg":["cs"],"mt":["emergency_dx"]},{"id":"sogo-14e84ff9","f":"sogo","u":4,"o":20,"lv":2,"q":"終末期の患者で、死が近づいた時期（数日〜数時間）によく見られる徴候はどれか。","ch":["食欲が戻り、水分を多くとるようになる","尿量が増え、口の渇きがすっかりなくなる","下顎呼吸や死前喘鳴（喉のゴロゴロ音）が出る","手足が温かくなり、橈骨動脈の脈が強くなる"],"a":2,"cx":["経口摂取はほとんどできなくなる。","尿量は減る（乏尿）。口は渇く。","","末梢は冷たく、チアノーゼやまだら模様（網状皮斑）が出て、脈は弱くなる。"],"core":"死が近い徴候：意識低下、下顎呼吸・Cheyne-Stokes 呼吸・無呼吸、死前喘鳴、手足の冷えとチアノーゼ、橈骨動脈が触れない、尿量低下。","e":"死前喘鳴：咽頭の分泌物を飲み込めずに出る音。本人は苦しくないことが多いと家族に説明し、体位の工夫、輸液を減らす、抗コリン薬（ブチルスコポラミン（ブスコパン））。\n終末期の過剰な輸液は、浮腫・胸水・腹水・気道分泌を増やし、苦痛を増すことがある（1日 500〜1,000 mL 以下を目安に見直す）。\n苦痛緩和のための鎮静：ほかの方法で取れない耐え難い苦痛に、本人・家族と話し合い、チームで判断し、ミダゾラム（ドルミカム）などで、苦痛が取れる最小限の深さにする。","tg":[]},{"id":"sogo-7edc1f0c","f":"sogo","u":5,"o":21,"lv":1,"q":"国が勧める対策型がん検診（指針）の組み合わせで正しいものはどれか。","ch":["胃癌 ― 20歳以上・年1回の胃内視鏡検査（全員）","乳癌 ― 30歳以上・年1回の乳房超音波検査（全員）","大腸癌 ― 40歳以上・年1回の便潜血検査（2日法）","肺癌 ― 40歳以上・年1回の胸部 CT（computed tomography：コンピュータ断層撮影） 検査（全員）"],"a":2,"cx":["胃癌は50歳以上・2年に1回の胃内視鏡か胃X線（胃X線は40歳以上・年1回も可）。","乳癌は40歳以上・2年に1回のマンモグラフィ。","","肺癌は40歳以上・年1回の胸部X線（重喫煙者は喀痰細胞診も）。CT は国の指針の対策型検診には入っていない。"],"core":"国の指針の5つのがん検診：胃（50歳〜・2年に1回 内視鏡かX線）、大腸（40歳〜・毎年 便潜血2日法）、肺（40歳〜・毎年 胸部X線）、乳（40歳〜・2年に1回 マンモグラフィ）、子宮頸（20歳〜・2年に1回 細胞診）。","e":"子宮頸がん検診は、2024年度から30〜60歳で HPV（human papillomavirus：ヒトパピローマウイルス） 検査の単独法（陰性なら5年に1回）も選べるようになった。\n対策型検診（集団の死亡率を下げる目的）と、任意型検診（人間ドックなど個人の判断）を区別する。\n検診の害：偽陽性による不安と精密検査の合併症、過剰診断（命にかかわらないがんを見つけて治療すること）。","tg":[]},{"id":"sogo-b05327d8","f":"sogo","u":5,"o":22,"lv":2,"q":"成人の予防接種について正しいものはどれか。","ch":["帯状疱疹の組換えワクチンは、免疫抑制状態の人にも使える","生ワクチンはステロイド大量投与中でも安全に接種できる","肺炎球菌ワクチンは一度打てば効果は一生続く","インフルエンザワクチンは卵アレルギーがあれば必ず禁忌である"],"a":0,"cx":["","生ワクチン（麻疹・風疹・水痘・おたふくかぜ・黄熱・BCG（Bacille Calmette-Guérin、結核のワクチン））は、強い免疫抑制中は禁忌。","肺炎球菌ワクチンは1回で一生ではない。結合型（PCV20（20価肺炎球菌結合型ワクチン） など）は免疫の記憶をつくるが、ハイリスク者では追加接種を考える。","現在のインフルエンザワクチンの卵の成分はごく微量で、重い卵アレルギー以外は接種できることが多い。"],"core":"帯状疱疹ワクチン：組換え（シングリックス、不活化・2回）は免疫抑制者にも使え、効果が高く長い。生ワクチン（乾燥弱毒生水痘ワクチン）は免疫抑制者に禁忌。","e":"帯状疱疹ワクチンは2025年度から65歳などを対象に定期接種になった。\n高齢者の定期接種：インフルエンザ（65歳以上）、肺炎球菌（65歳など。2026年4月から定期接種のワクチンが PPSV23（23価肺炎球菌莢膜ポリサッカライドワクチン） から結合型の PCV20（20価肺炎球菌結合型ワクチン） に変わった。1回接種）、新型コロナ（65歳以上）、帯状疱疹（65歳など）。\n生ワクチンは、免疫抑制治療を始める4週以上前に済ませる。\n成人の麻疹・風疹：抗体価が低ければ2回接種。妊婦には生ワクチンは禁忌（接種後2か月は避妊）。","tg":["ae"],"mt":["vaccine"]},{"id":"sogo-0eb0d07d","f":"sogo","u":5,"o":23,"lv":2,"q":"喫煙について正しいものはどれか。","ch":["ニコチンパッチは心筋梗塞の急性期にこそ最も勧められる","禁煙しても肺癌の危険は一生まったく下がらない","加熱式たばこは健康への害がないと証明されている","バレニクリン（チャンピックス）はニコチン受容体の部分作動薬である"],"a":3,"cx":["急性心筋梗塞・不安定狭心症・重い不整脈の直後はニコチン製剤を慎重に（添付文書では禁忌の扱い）。","禁煙すると危険は年とともに下がる（10年で肺癌死亡のリスクは喫煙継続者の約半分）。","加熱式たばこにも有害物質が含まれ、害がないとは言えない。",""],"core":"バレニクリン＝α4β2 ニコチン受容体の部分作動薬：離脱症状を和らげ（作動）、吸っても満足感を減らす（拮抗）。吐き気が多い。","e":"保険での禁煙治療：ニコチン依存症のスクリーニングテスト（TDS（Tobacco Dependence Screener））5点以上、35歳以上はブリンクマン指数（1日の本数×年数）200以上（35歳未満は不要）、禁煙の意思、文書で同意。12週で5回の診察。\nバレニクリン（チャンピックス）は不純物（N-ニトロソバレニクリン）のため2021年から出荷が止まっていたが、製造法を変えて2025年10月に出荷が再開された。\n禁煙の5A：Ask（喫煙を聞く）・Advise（禁煙を勧める）・Assess（意思を確かめる）・Assist（支援する）・Arrange（フォローを決める）。","tg":[]},{"id":"sogo-c1eabcac","f":"sogo","u":6,"o":24,"lv":2,"q":"古典的不明熱の原因として、成人で頻度の高い3つのグループの組み合わせはどれか。","ch":["悪性腫瘍・精神疾患・先天性の遺伝性疾患","感染症・悪性腫瘍・非感染性炎症性疾患","感染症・内分泌疾患・中毒（薬物を含む）","心疾患・腎疾患・皮膚疾患（この3つだけ）"],"a":1,"cx":["詐熱（作為的な発熱）はまれ。遺伝性（自己炎症性疾患）は非感染性炎症に含める。","","内分泌（甲状腺炎・副腎不全）や薬剤熱も原因になるが、3大グループではない。","臓器別ではなく、病気の性質で分けて考える。"],"core":"不明熱（38.3℃以上が3週以上、基本的な検査で原因不明）の3大原因＝感染症（結核・膿瘍・感染性心内膜炎）・悪性腫瘍（リンパ腫）・非感染性炎症（成人スチル病・巨細胞性動脈炎・血管炎）。原因不明のまま残る例も多い。","e":"手順：詳しい問診（渡航・動物・性交渉・薬・職業）と診察の繰り返し、血液培養の反復、CT（胸腹部骨盤）、心エコー、FDG-PET（フルオロデオキシグルコースを使った PET）/CT（診断の手がかりになりやすい）、骨髄・肝・リンパ節・側頭動脈の生検。\n薬剤熱：比較的徐脈、元気なわりに高熱、好酸球増多、薬の中止で48〜72時間で解熱。\n詐熱：検温の時だけ高い、脈が上がらない。\n高齢者では巨細胞性動脈炎、結核、リンパ腫、偽痛風を忘れない。","tg":[]},{"id":"sogo-b76209cc","f":"sogo","u":6,"o":25,"lv":3,"q":"72歳の男性。6か月で体重が 8 kg 減った。食欲は少し落ちたが、腹痛・下痢はない。喫煙 40本×50年。血液検査で軽い貧血（Hb 11.2 g/dL）、CRP（C-reactive protein：C反応性タンパク） 1.8 mg/dL、アルブミン 3.2 g/dL。最初に行う評価として最も適切なのはどれか。","ch":["まず全身の FDG-PET（フルオロデオキシグルコースを使った PET） だけを行い、ほかの検査はすべて省く","うつ病として抗うつ薬を始め、検査は症状が増えてから行う","年齢相応の変化として、栄養剤を処方して経過を見るだけでよい","胸腹部 CT（computed tomography：コンピュータ断層撮影）・上下部内視鏡・甲状腺・血糖などを系統的に調べる"],"a":3,"cx":["PET（positron emission tomography） は有用な場面もあるが、まず基本の検査（血液・尿・画像・内視鏡）を積み上げる。","うつは重要な原因だが、喫煙者の体重減少・貧血・炎症反応では悪性腫瘍などを先に除く。","半年で 5% 以上の意図しない体重減少は精査の対象。年齢のせいにしない。",""],"core":"意図しない体重減少（6〜12か月で 5% 以上）＝悪性腫瘍（消化器・肺）、消化器疾患、内分泌（甲状腺機能亢進・糖尿病・副腎不全）、精神（うつ・認知症）、感染症（結核・HIV（human immunodeficiency virus：ヒト免疫不全ウイルス））、慢性臓器不全、薬、社会的要因（独居・経済・歯の問題）。","e":"高齢者の体重減少の覚え方（MEALS ON WHEELS など）：薬・精神・食事の問題・嚥下・口腔・社会的孤立など、医学以外の原因も多い。\n喫煙者では肺癌・食道癌・頭頸部癌・膀胱癌、飲酒があれば膵癌・肝癌も考える。\n体重が減るのに食欲が増えるなら、甲状腺機能亢進症・糖尿病・吸収不良を考える。","tg":["cs"],"mt":["thyroid"]},{"id":"sogo-2817b793","f":"sogo","u":7,"o":26,"lv":3,"q":"64歳の男性。前立腺癌の骨転移で治療中。1週間前から背部痛が強くなり、今朝から両下肢に力が入りにくく、尿が出にくい。第10胸髄以下の感覚低下がある。最も適切な対応はどれか。","ch":["鎮痛薬を増やして、来週の定期外来まで経過を見る","腰椎穿刺をして、髄液の細胞診を待ってから治療を決める","尿閉に導尿だけを行い、精査は完全麻痺になってから行う","デキサメタゾンを始め、全脊椎 MRI（magnetic resonance imaging：磁気共鳴画像） を急いで撮り専門科へ"],"a":3,"cx":["神経症状が出た転移性脊髄圧迫は緊急。治療が遅れると歩けなくなる。","腰椎穿刺は圧迫がある状態で神経症状を悪化させうる。まず MRI（magnetic resonance imaging：磁気共鳴画像）。","完全麻痺になると回復は難しい。歩けるうちに治療を始めることが予後を決める。",""],"core":"転移性脊髄圧迫＝背部痛の悪化→筋力低下・感覚障害・膀胱直腸障害。疑ったら即ステロイド（デキサメタゾン）＋全脊椎 MRI→放射線治療か手術（除圧・固定）。","e":"起こしやすい癌：肺癌・乳癌・前立腺癌・腎癌・多発性骨髄腫。胸椎に多い。\n予後を決める最大の因子は治療開始時に歩けるかどうか。\nほかのオンコロジック・エマージェンシー：上大静脈症候群（顔・腕のむくみ、ステント・放射線）、高カルシウム血症、腫瘍崩壊症候群、発熱性好中球減少症、心タンポナーデ、SIADH（syndrome of inappropriate secretion of antidiuretic hormone：抗利尿ホルモン不適合分泌症候群）、頭蓋内圧亢進（脳転移）、過粘稠度症候群（マクログロブリン血症）。","tg":["cs"],"fig":["spinal"]},{"id":"sogo-29892803","f":"sogo","u":7,"o":27,"lv":2,"q":"抗がん薬と代表的な副作用の組み合わせで正しいものはどれか。","ch":["ドキソルビシン（アドリアシン） ― 出血性膀胱炎","シスプラチン（ランダ） ― 腎障害・聴力障害・強い吐き気","ブレオマイシン（ブレオ） ― 心筋障害（総投与量で増える）","シクロホスファミド（エンドキサン） ― 肺線維症だけで膀胱は障害しない"],"a":1,"cx":["出血性膀胱炎はシクロホスファミド（エンドキサン）・イホスファミド（代謝物アクロレイン、メスナ（ウロミテキサン）で予防）。","","ブレオマイシンは肺線維症（総投与量で増える）。心筋障害はアントラサイクリン系。","シクロホスファミドは出血性膀胱炎・骨髄抑制・不妊・二次がん。"],"core":"覚えたい組み合わせ：シスプラチン＝腎障害（大量の補液・Mg）・聴力・末梢神経・高度催吐性。アントラサイクリン（ドキソルビシン）＝心筋障害（総投与量）。ブレオマイシン＝肺線維症。ビンクリスチン（オンコビン）＝末梢神経・便秘。パクリタキセル（タキソール）＝末梢神経・アレルギー。イリノテカン（カンプト、トポテシン）＝下痢（UGT1A1（ビリルビンを抱合する酵素の遺伝子） 多型）。","e":"5-FU：DPD（dihydropyrimidine dehydrogenase、5-FU を分解する酵素） 欠損症で重い毒性。カペシタビン（ゼローダ）：手足症候群。\nオキサリプラチン（エルプラット）：寒冷で誘発される急性の末梢神経障害。\nメトトレキサート（リウマトレックス）大量：腎障害→ホリナート（ロイコボリン）救援・尿のアルカリ化。\n分子標的薬：ベバシズマブ（高血圧・蛋白尿・消化管穿孔）、EGFR（上皮成長因子受容体、肺癌の遺伝子／推算 GFR は eGFR） 阻害薬（ざ瘡様皮疹・間質性肺炎）、トラスツズマブ（心機能低下：可逆的）。\n制吐：高度催吐性には NK1（neurokinin 1） 受容体拮抗薬＋5-HT3 受容体拮抗薬＋デキサメタゾン（＋オランザピン）。","tg":["ae"],"fig":["lungvol"],"mt":["ild"]},{"id":"sogo-f3b13d4b","f":"sogo","u":8,"o":28,"lv":2,"q":"医療事故・死亡に関する対応として正しいものはどれか。","ch":["予期しない医療起因の死亡はセンターに報告し院内調査","インシデント報告は、当事者の処分を目的としている","異状死の届け出（医師法21条）は24時間以内に保健所へ行う","患者・家族への説明は、調査がすべて終わるまで一切しない"],"a":0,"cx":["","インシデント報告は再発防止（システムの改善）が目的で、個人の処罰のためではない。","医師法21条の届け出先は所轄の警察署で、24時間以内。","わかっている事実は早く誠実に説明する。調査の結果もあとで説明する。"],"core":"医療事故調査制度（2015年〜）：医療に起因し、管理者が予期しなかった死亡・死産 → 医療事故調査・支援センターへ報告 → 院内調査 → 遺族とセンターへ結果を報告。目的は再発防止。","e":"医師法21条：死体を検案して異状があると認めたら24時間以内に所轄警察署へ届け出る。\n死亡診断書と死体検案書：診療中の患者がその病気で死亡したら死亡診断書（最終の診察から24時間を過ぎても、診療中の病気による死亡と判断できれば交付できる）。\nヒヤリ・ハット（インシデント）：患者に実害がなかった（または軽微）事象。報告を集めて対策を立てる。\nスイスチーズモデル：複数の防護の穴が重なったときに事故が起こる。\n確認の方法：患者本人に名乗ってもらう（2つの識別子：氏名と生年月日）、指差し呼称、ダブルチェック、タイムアウト。","tg":[]},{"id":"sogo-c7e151e0","f":"sogo","u":8,"o":29,"lv":2,"q":"臨床研究と個人情報について正しいものはどれか。","ch":["観察研究であれば、倫理審査委員会の審査は一切不要である","診療録の情報は、患者の同意なしにいつでも学会発表に使ってよい","利益相反（COI（conflict of interest：利益相反））は研究結果に影響しないので、開示の必要はない","特定臨床研究は認定臨床研究審査委員会の審査と jRCT（Japan Registry of Clinical Trials：臨床研究の登録システム） 登録が必要"],"a":3,"cx":["観察研究も「人を対象とする生命科学・医学系研究に関する倫理指針」に従い、倫理審査委員会の審査を受ける（同意の取り方は研究の種類で違う）。","症例報告でも、個人が特定されないよう配慮し、原則として同意を得る。","COI は研究の信頼性に関わり、適切に開示・管理する。",""],"core":"臨床研究法の特定臨床研究＝未承認・適応外の医薬品等の臨床研究、または製薬企業等から資金提供を受けた医薬品等の臨床研究。認定臨床研究審査委員会（CRB（certified review board：認定臨床研究審査委員会））の審査・jRCT への登録・モニタリングが必要。","e":"ヘルシンキ宣言：人を対象とする医学研究の倫理原則（インフォームド・コンセント、倫理委員会の審査、弱い立場の人への配慮）。\n治験は GCP（医薬品の臨床試験の実施の基準）に従う。\n個人情報保護法：要配慮個人情報（病歴など）の取り扱いに本人の同意が必要（例外あり：法令に基づく場合、生命の保護、公衆衛生など）。\n守秘義務：刑法134条（医師の秘密漏示罪）。感染症法などの届け出は正当な理由になる。","tg":[]},{"id":"sogo-871ac1b7","f":"sogo","u":9,"o":30,"lv":2,"q":"介護保険について正しいものはどれか。","ch":["65歳以上は原因を問わず、40〜64歳は特定疾病が原因のとき","40歳未満でも、申請すれば誰でも介護保険のサービスを使える","要介護度は、医師が診察で決めて本人と家族に直接伝える","主治医意見書は、主治医でなく家族が書いて提出すればよい"],"a":0,"cx":["","介護保険の被保険者は40歳以上。40歳未満は障害福祉サービスなどで対応する。","要介護度は、認定調査と主治医意見書をもとに介護認定審査会が判定する（要支援1・2、要介護1〜5）。","主治医意見書は主治医が書く（心身の状態・特別な医療・認知症の程度など）。"],"core":"介護保険：第1号被保険者（65歳以上）は原因を問わず、第2号（40〜64歳）は16の特定疾病（末期がん・関節リウマチ・ALS（amyotrophic lateral sclerosis：筋萎縮性側索硬化症）・脳血管疾患・初老期の認知症・Parkinson 病関連疾患・糖尿病の三大合併症・COPD（chronic obstructive pulmonary disease：慢性閉塞性肺疾患） など）による場合。","e":"申請→認定調査＋主治医意見書→介護認定審査会→要支援/要介護の認定→ケアマネジャーがケアプランを作る。\n訪問看護：医療保険と介護保険のどちらかで使う（末期がんや厚生労働大臣が定める疾病などは医療保険）。\n地域包括ケアシステム：住まい・医療・介護・予防・生活支援を一体的に提供する。相談窓口は地域包括支援センター。\n在宅での看取り：医師が継続して診療していれば、死亡後に診察して死亡診断書を書ける。","tg":[],"fig":["flowvol"]},{"id":"sogo-884c2d06","f":"sogo","u":9,"o":31,"lv":3,"q":"86歳の女性。脳梗塞の後遺症で寝たきり。経口摂取が少なく、仙骨部に 4 cm の褥瘡があり、皮下組織まで達している。家族は自宅で介護を続けたいと希望している。対応として最も適切なのはどれか。","ch":["寝たきりなので治る見込みはなく、褥瘡の処置は不要である","栄養は関係ないので、局所の消毒だけを毎日ていねいに行う","体圧分散マットレス・体位変換・栄養の評価を多職種で行う","褥瘡はすぐに乾かすため、ドライヤーで毎日しっかり乾燥させる"],"a":2,"cx":["適切な除圧・栄養・創の管理で治ることも多い。","低栄養は褥瘡の大きな危険因子で、エネルギーとたんぱく質・亜鉛などを補う。消毒の常用は組織を傷める。","","創は適度に湿った状態（湿潤環境）で治りやすい。乾かしすぎると治りが遅れる。"],"core":"褥瘡の対策＝除圧（体圧分散寝具・2時間ごとを目安の体位変換・30度側臥位）、栄養、皮膚の清潔と湿潤の管理、創の評価（DESIGN-R®）と処置（壊死組織の除去・感染の管理・適切な外用薬/被覆材）。","e":"危険因子の評価：ブレーデンスケール（知覚・湿潤・活動性・可動性・栄養・摩擦とずれ）。\n感染の徴候（発赤・熱感・腫脹・膿・悪臭・発熱）があれば、デブリドマン・抗菌薬。骨髄炎も考える。\n介護者の負担に配慮し、訪問看護・訪問入浴・福祉用具（介護保険のレンタル）を使う。","tg":["cs"]},{"id":"gi-23c428af","f":"gi","u":10,"o":32,"lv":1,"q":"胃酸の分泌について正しいものはどれか。","ch":["ガストリンは胃底腺の G 細胞から分泌される","主細胞が塩酸と内因子を分泌し、壁細胞がペプシノゲンを出す","壁細胞のプロトンポンプが最後の段階で H⁺ を出す","ソマトスタチン（D 細胞）は胃酸の分泌を強める"],"a":2,"cx":["ガストリンは主に前庭部（幽門腺）の G 細胞から分泌される。","主細胞はペプシノゲンを出す。塩酸と内因子は壁細胞。","","ソマトスタチン（D 細胞）は胃酸・ガストリンの分泌を抑える。"],"core":"胃酸＝壁細胞のプロトンポンプが出す。刺激はアセチルコリン（迷走神経）・ガストリン・ヒスタミン（ECL（enterochromaffin-like：腸クロム親和性細胞様） 細胞→H2 受容体）。PPI（proton pump inhibitor：プロトンポンプ阻害薬） はプロトンポンプを、H2 受容体拮抗薬はヒスタミンの刺激を止める。","e":"消化管ホルモンのまとめ：\n・ガストリン（G 細胞・前庭部）：胃酸↑\n・セクレチン（S 細胞・十二指腸）：膵臓から重炭酸↑・胃酸↓\n・コレシストキニン（I 細胞・十二指腸）：胆嚢の収縮・膵酵素↑\n・GIP（glucose-dependent insulinotropic polypeptide）・GLP-1（腸）：インスリン分泌↑（インクレチン）\n・グレリン（胃）：食欲↑\n・ソマトスタチン（D 細胞）：ほとんどのホルモンを抑える\n内因子（壁細胞）はビタミン B12 と結びつき、回腸末端で吸収される。萎縮性胃炎（A 型）では壁細胞が壊れて B12 欠乏と高ガストリン血症。","tg":[]},{"id":"gi-657ec74f","f":"gi","u":10,"o":33,"lv":1,"q":"肝機能検査の読み方で正しいものはどれか。","ch":["プロトロンビン時間は肝臓の合成能を反映しない","アルブミンは急性肝障害の1日目から鋭敏に下がる","ALP（alkaline phosphatase：アルカリホスファターゼ）・γ-GTP（γ-glutamyl transpeptidase、γ-GTP） が主に上がるのは胆汁うっ滞型である","ALT（alanine aminotransferase） は肝臓以外の筋肉や赤血球に多く、肝特異性が低い"],"a":2,"cx":["PT（凝固因子：半減期が短い）は肝臓の合成能の鋭敏な指標。","アルブミンの半減期は約3週と長く、急性期にはすぐには下がらない。","","肝特異性が高いのは ALT。AST（aspartate aminotransferase） は筋肉・心筋・赤血球にも多い。"],"core":"肝細胞障害型＝AST（aspartate aminotransferase）・ALT が主に上がる。胆汁うっ滞型＝ALP・γ-GTP（直接ビリルビン）が主に上がる。合成能＝アルブミン（遅い）・PT（速い）・コリンエステラーゼ・総コレステロール。","e":"AST/ALT 比：アルコール性・肝硬変・筋疾患で AST 優位、ウイルス性・脂肪肝（初期）で ALT 優位。\nALP の由来：肝・骨（成長期・骨転移・骨軟化症・副甲状腺機能亢進）・胎盤（妊娠）・小腸。γ-GTP が一緒に上がれば肝胆道由来。\n薬物性肝障害の型（R 値＝（ALT/基準上限）÷（ALP/基準上限））：5 以上＝肝細胞障害型、2 以下＝胆汁うっ滞型、その間＝混合型。\nAST・ALT が数千：急性ウイルス性肝炎・虚血性肝炎（ショック肝）・薬物（アセトアミノフェン（カロナール））・自己免疫性。","tg":[],"mt":["lipid"]},{"id":"gi-e8b0e9b3","f":"gi","u":10,"o":34,"lv":1,"q":"門脈圧亢進症で発達する側副血行路と症状の組み合わせで正しいものはどれか。","ch":["左胃静脈 → 食道静脈瘤","上直腸静脈 → 胃静脈瘤","脾静脈 → 臍周囲の静脈怒張（メドゥーサの頭）","傍臍静脈 → 痔核（下部直腸の静脈瘤）"],"a":0,"cx":["","上直腸静脈の側副路は直腸静脈瘤（痔核と区別）になる。","脾静脈は門脈の一部で、脾静脈だけの閉塞は孤立性の胃静脈瘤（左側門脈圧亢進症）になる。","傍臍静脈の側副路は臍周囲の静脈怒張（メドゥーサの頭）。"],"core":"門脈と体循環のつながり：食道（左胃静脈→奇静脈）・直腸（上直腸→中・下直腸静脈）・臍周囲（傍臍静脈→腹壁の静脈）・後腹膜。門脈圧亢進で静脈瘤・脾腫（血小板減少）・腹水。","e":"原因：肝前性（門脈血栓）、肝内性（肝硬変が最多・特発性門脈圧亢進症・日本住血吸虫）、肝後性（Budd-Chiari 症候群・右心不全・収縮性心膜炎）。\n脾腫による脾機能亢進で、血小板が最も早く減る。\n胃静脈瘤（孤立性）にはバルーン下逆行性経静脈的塞栓術（B-RTO）。","tg":[],"fig":["portal"]},{"id":"gi-b13586fc","f":"gi","u":11,"o":35,"lv":1,"q":"胃食道逆流症（GERD（gastroesophageal reflux disease：胃食道逆流症））の初期治療として、日本のガイドライン（2021）で重症の逆流性食道炎に最も勧められる薬はどれか。","ch":["アルギン酸ナトリウム（粘膜保護薬）だけ","H2 受容体拮抗薬（ファモチジン（ガスター））の単独","消化管運動改善薬（モサプリド（ガスモチン））だけ","ボノプラザン（カリウムイオン競合型）"],"a":3,"cx":["粘膜保護薬は症状を和らげる補助。重症例の治療の主役ではない。","H2 受容体拮抗薬は酸を抑える力が PPI（proton pump inhibitor：プロトンポンプ阻害薬）・ボノプラザンより弱く、効果が落ちやすい（耐性）。","運動改善薬は補助的な位置づけで、単独では治りにくい。",""],"core":"重症（LA（lupus anticoagulant：ループスアンチコアグラント） 分類 C・D）の逆流性食道炎＝ボノプラザン 20 mg で初期治療（4週）。軽症（A・B）は PPI（proton pump inhibitor：プロトンポンプ阻害薬） かボノプラザン。","e":"ボノプラザン（P-CAB）は酸で活性化される必要がなく、すぐに強く・長く効く（食事の影響を受けにくい）。\n維持療法：重症は続けて、軽症は必要なときだけ（オンデマンド）でもよい。\n長期の酸分泌抑制の注意：高ガストリン血症、胃底腺ポリープ、腸の感染症（Clostridioides difficile）、骨折、鉄・ビタミンB12 の吸収低下の報告。\nGERD 以外を考える警告症状：飲み込みにくさ・体重減少・吐血/黒色便・貧血 → まず内視鏡。","tg":["gl"]},{"id":"gi-c3755449","f":"gi","u":11,"o":36,"lv":2,"q":"好酸球性食道炎について正しいものはどれか。","ch":["高齢女性に多く、食べ物のつかえ感はまれである","治療の第一選択は、食道の外科的切除である","内視鏡で正常に見えることは決してない","生検で高倍率1視野に15個以上の好酸球が見られる"],"a":3,"cx":["若年〜中年の男性に多く、食べ物のつかえ（嚥下障害）が主な症状。","治療は PPI（proton pump inhibitor：プロトンポンプ阻害薬）・局所ステロイド（嚥下）・食事療法。手術はしない。","内視鏡で異常がわかりにくい例もあり、つかえ感があれば正常に見えても生検する。",""],"core":"好酸球性食道炎＝食べ物のつかえ＋生検で好酸球 15個以上/高倍率視野。内視鏡：縦走溝・輪状溝・白斑。PPI（proton pump inhibitor：プロトンポンプ阻害薬） がまず効くことが多い。","e":"アレルギー疾患（喘息・アトピー性皮膚炎・アレルギー性鼻炎）を合併しやすい。\n治療：①PPI（まず8週）②局所ステロイドの嚥下（吸入用ステロイドを吸わずに飲み込む。国内では保険適用外）③原因になりやすい食べ物の除去食 ④狭窄にはバルーン拡張 ⑤難治例の生物学的製剤（デュピルマブ（デュピクセント）は海外で承認）。\n食べ物がつかえて取れない（食片の嵌頓）で見つかることもある。\n好酸球性胃腸炎：胃・腸の壁に好酸球が浸潤し、腹痛・下痢・腹水。ステロイドが効く。","tg":[]},{"id":"gi-a9851509","f":"gi","u":11,"o":37,"lv":2,"q":"食道アカラシアについて正しいものはどれか。","ch":["固形物だけがつかえ、液体は通りやすい","バリウム造影で「りんごの芯」のような狭窄を示す","下部食道括約筋が弛緩せず、食道の蠕動も消える","治療の第一選択はプロトンポンプ阻害薬である"],"a":2,"cx":["アカラシアは固形物も液体も最初からつかえるのが特徴。固形物から始まるのは器質的な狭窄（癌など）。","りんごの芯（apple core）は大腸癌の像。アカラシアは「鳥のくちばし（bird beak）」状。","","酸を抑えても通過障害は治らない。"],"core":"アカラシア＝食道の筋層間神経叢（Auerbach）の障害 → 下部食道括約筋（LES（lower esophageal sphincter：下部食道括約筋））が緩まない＋蠕動消失。診断は高解像度食道内圧検査（シカゴ分類）。","e":"治療：経口内視鏡的筋層切開術（POEM（peroral endoscopic myotomy：経口内視鏡的筋層切開術））、腹腔鏡下 Heller 筋層切開術＋噴門形成、内視鏡的バルーン拡張術。薬（カルシウム拮抗薬・亜硝酸薬）・ボツリヌス毒素は補助的。\n長く続くと食道癌の危険が上がる。\n偽性アカラシア：噴門部の癌が同じ像をつくる。高齢・急な発症・体重減少では内視鏡で癌を除く。\n南米ではシャーガス病（Trypanosoma cruzi）が同じ病態を起こす。","tg":[]},{"id":"gi-3fa4367c","f":"gi","u":11,"o":38,"lv":2,"q":"食道癌について正しいものはどれか。","ch":["飲酒でアルコールの分解が速い人ほど、危険が高い","ヨード染色で、癌の部分は濃い褐色に染まる","日本では腺癌が大部分で、主に食道下部（バレット）に発生","日本では扁平上皮癌が大部分で、飲酒と喫煙が危険因子"],"a":3,"cx":["アセトアルデヒドを分解しにくい人（ALDH2（aldehyde dehydrogenase 2：アルデヒド脱水素酵素2） の働きが弱く、飲むと顔が赤くなる人）ほど危険が高い。","癌の部分はグリコーゲンが少なく、ヨードで染まらない（不染帯）。","欧米ではバレット食道からの腺癌が増えたが、日本ではいまも扁平上皮癌が約9割。",""],"core":"日本の食道癌＝扁平上皮癌が約9割・胸部中部に多い。危険因子：飲酒（とくにフラッシャー）・喫煙・熱い飲食物。頭頸部癌の合併が多い。","e":"ALDH2（アルデヒド脱水素酵素2）の働きが弱い人が飲酒を続けると、発癌物質アセトアルデヒドがたまる。\n内視鏡：ヨード不染帯、NBI（狭帯域光観察）で茶色の領域（brownish area）。\nバレット食道：胃から続く円柱上皮が食道に伸びた状態で、腺癌の母地。逆流（GERD（gastroesophageal reflux disease：胃食道逆流症））が原因。\n表在癌（粘膜内）は内視鏡的粘膜下層剥離術（ESD（endoscopic submucosal dissection：内視鏡的粘膜下層剥離術））で治せる。進行癌は術前化学療法＋手術、化学放射線療法、免疫チェックポイント阻害薬（ニボルマブ（オプジーボ）・ペムブロリズマブ）。","tg":[]},{"id":"gi-a52e5371","f":"gi","u":12,"o":39,"lv":1,"q":"Helicobacter pylori の一次除菌療法（国内の保険診療）の組み合わせはどれか。","ch":["PPI（proton pump inhibitor：プロトンポンプ阻害薬）＋レボフロキサシン（クラビット）＋ミノサイクリン（7日間）","PPI（proton pump inhibitor：プロトンポンプ阻害薬）＋ビスマス＋テトラサイクリン（3日間）","ボノプラザン（タケキャブ）＋アモキシシリン（サワシリン、パセトシン）＋メトロニダゾール（14日間）","ボノプラザン（タケキャブ）＋アモキシシリン（サワシリン、パセトシン）＋クラリスロマイシン（7日間）"],"a":3,"cx":["レボフロキサシンなどは三次除菌として自費で使われる。保険の一次除菌ではない。","ビスマスの4剤療法は国内では使えない（海外の標準の一つ）。","メトロニダゾールを使うのは二次除菌（7日間）。",""],"core":"一次除菌＝酸分泌抑制薬（ボノプラザンか PPI）＋アモキシシリン＋クラリスロマイシンを7日間。二次除菌＝クラリスロマイシンをメトロニダゾールに替える。","e":"ボノプラザンは酸を強く抑えるので、PPI よりクラリスロマイシン耐性菌でも除菌率が高い。\n除菌の判定は、治療が終わって4週以上あけて（酸分泌抑制薬は2週止めて）、尿素呼気試験か便中抗原で行う。血清抗体は除菌後もしばらく陽性が続くので判定に向かない。\nペニシリンアレルギー：ボノプラザン＋クラリスロマイシン＋メトロニダゾール（保険の扱いは添付文書・学会の案内を確認）。\n保険で除菌できる病気：胃・十二指腸潰瘍、胃 MALT（mucosa-associated lymphoid tissue：粘膜関連リンパ組織） リンパ腫、特発性血小板減少性紫斑病、早期胃癌の内視鏡治療後、内視鏡で確かめた H. pylori 感染胃炎。","tg":[]},{"id":"gi-884b4024","f":"gi","u":12,"o":40,"lv":2,"q":"消化性潰瘍の原因と特徴について正しいものはどれか。","ch":["十二指腸潰瘍は胃酸の分泌が少ない人に多い","低用量アスピリンを続ける人の潰瘍予防には PPI（proton pump inhibitor：プロトンポンプ阻害薬） を使う","胃潰瘍は空腹時に痛み、食事で軽くなるのが特徴である","H. pylori 陰性・NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） 内服なしの潰瘍は存在しない"],"a":1,"cx":["十二指腸潰瘍は胃酸の分泌が多い人（前庭部優位の H. pylori 胃炎）に多い。","","空腹時痛で食べると軽くなるのは十二指腸潰瘍に多い。胃潰瘍は食後に痛みやすい。","どちらも陰性の潰瘍（特発性潰瘍）は増えている。ガストリノーマ（Zollinger-Ellison 症候群）・Crohn 病・ウイルスなども考える。"],"core":"潰瘍の二大原因＝H. pylori と NSAIDs（低用量アスピリンを含む）。NSAIDs・アスピリンを続けるなら PPI（またはボノプラザン（タケキャブ））で予防。","e":"低用量アスピリンは心血管の予防のため中止しないことが多い。出血しても、止血を確かめたら早めに再開する（中止を続けると血栓症が増える）。\nZollinger-Ellison 症候群：多発・難治・空腹時の高ガストリン血症。膵頭部〜十二指腸のガストリノーマ。MEN1（multiple endocrine neoplasia type 1：多発性内分泌腫瘍症1型） の合併に注意（副甲状腺機能亢進症）。\n穿孔：突然の激しい腹痛、板状硬、遊離ガス（立位の胸部X線・CT（computed tomography：コンピュータ断層撮影））→ 外科。","tg":["ae"]},{"id":"gi-e7161c49","f":"gi","u":12,"o":41,"lv":2,"q":"胃 MALT（mucosa-associated lymphoid tissue：粘膜関連リンパ組織） リンパ腫について正しいものはどれか。","ch":["API2（apoptosis inhibitor 2、遺伝子）-MALT1（MALT リンパ腫関連の遺伝子） 融合遺伝子があると除菌がよく効く","H. pylori 陽性なら、まず除菌療法を行う","びまん性大細胞型 B 細胞リンパ腫より進行が速い","T 細胞由来のリンパ腫である"],"a":1,"cx":["API2-MALT1（t(11;18)）があると除菌が効きにくい。放射線療法などを選ぶ。","","MALT リンパ腫は低悪性度（ゆっくり進む）。DLBCL（diffuse large B-cell lymphoma：びまん性大細胞型 B 細胞リンパ腫） は高悪性度。","辺縁帯の B 細胞由来。"],"core":"胃 MALT リンパ腫（節外性辺縁帯 B 細胞リンパ腫）＝H. pylori の慢性炎症から。限局期は除菌で6〜8割が寛解。","e":"除菌が効かない・陰性・t(11;18) 陽性：放射線療法（胃全体に30 Gy 前後）、進行期はリツキシマブ（リツキサン）併用の化学療法。\n大細胞型への転化に注意（内視鏡と生検で経過を見る）。\nほかの感染と MALT リンパ腫：眼付属器（オウム病クラミジア）、皮膚（ボレリア）、小腸（カンピロバクター：免疫増殖性小腸疾患）。","tg":[],"mt":["hemetumor"]},{"id":"gi-496abb99","f":"gi","u":12,"o":42,"lv":2,"q":"胃癌のリスクと検査について正しいものはどれか。","ch":["除菌後も胃癌の危険は残り、内視鏡で経過を見る","萎縮性胃炎（腸上皮化生）は、胃癌の危険と関係がない","血清ペプシノゲン法で陰性なら、内視鏡検査は不要である","H. pylori を除菌すれば、胃癌の危険はゼロになる"],"a":0,"cx":["","萎縮（腸上皮化生）が広いほど胃癌の危険が高い。","ペプシノゲン法は萎縮の程度を見る検査。陰性でも癌は否定できない。","除菌で危険は下がるが、萎縮の進んだ胃では癌ができ続ける。除菌後の定期的な内視鏡が勧められる。"],"core":"胃癌の最大の危険因子は H. pylori 感染による萎縮性胃炎。除菌は危険を下げるが消さない。","e":"除菌後胃癌は、平坦・陥凹で見つけにくいことがある。\nABC 分類（血清 H. pylori 抗体＋ペプシノゲン）は危険度の層別化に使うが、国の対策型検診には入っていない。\n未分化型（印環細胞癌を含む）は若い人・女性にも見られ、スキルス胃癌（壁が硬く厚くなる）は見つかりにくい。\n遺伝性：CDH1（E-カドヘリン）変異のびまん性胃癌、Lynch 症候群。\nHER2（human epidermal growth factor receptor 2） 陽性の進行胃癌にトラスツズマブ（ハーセプチン）、CLDN18（claudin 18、胃癌の標的）.2 陽性にゾルベツキシマブ（ビロイ）、免疫チェックポイント阻害薬（ニボルマブ（オプジーボ））。","tg":[]},{"id":"gi-a14b1286","f":"gi","u":12,"o":43,"lv":3,"q":"38歳の女性。半年前から食後のもたれ感と早期満腹感が続く。体重減少・貧血・嘔吐はない。上部内視鏡で異常はなく、H. pylori は陰性。最も考えられる診断と治療の組み合わせはどれか。","ch":["機能性ディスペプシア ― アコチアミド（アコファイド）","胃食道逆流症 ― 内視鏡的な噴門形成術","胃癌 ― 外科的切除を急ぐ","十二指腸潰瘍 ― 除菌療法と PPI（proton pump inhibitor：プロトンポンプ阻害薬）"],"a":0,"cx":["","主な症状はもたれ・早期満腹感で、胸やけ・逆流ではない。手術の適応もない。","内視鏡で異常がなく、警告症状もない。癌は考えにくい。","内視鏡で潰瘍はなく、H. pylori も陰性。"],"core":"機能性ディスペプシア＝内視鏡などで器質的な異常がないのに、食後のもたれ・早期満腹感（食後愁訴症候群）や心窩部痛（心窩部痛症候群）が続く。H. pylori 陽性ならまず除菌。","e":"治療：酸分泌抑制薬（心窩部痛型）、消化管運動機能改善薬アコチアミド（食後愁訴型、国内で FD（functional dyspepsia：機能性ディスペプシア） に保険適用がある唯一の薬）、六君子湯、抗不安薬・抗うつ薬、心理療法。\n警告症状（体重減少・嚥下障害・吐血/黒色便・貧血・嘔吐の持続・50歳以上の新しい症状）があれば内視鏡を急ぐ。\n胃の排出の遅れを起こす病気（糖尿病の胃不全麻痺・強皮症）や薬（オピオイド・GLP-1（glucagon-like peptide-1） 受容体作動薬）も考える。","tg":["cs"]},{"id":"gi-a37f5232","f":"gi","u":13,"o":44,"lv":1,"q":"潰瘍性大腸炎と Crohn 病の特徴の組み合わせで正しいものはどれか。","ch":["潰瘍性大腸炎 ― 縦走潰瘍と敷石像","Crohn 病 ― 全層性炎症・非乾酪性肉芽腫・痔瘻","潰瘍性大腸炎 ― 非連続性病変（skip lesion）","Crohn 病 ― 病変は大腸に限られ直腸から連続する"],"a":1,"cx":["縦走潰瘍・敷石像は Crohn 病の典型像。","","潰瘍性大腸炎は直腸から口側へ連続する病変が特徴。非連続性は Crohn 病。","大腸に限られ直腸から連続するのは潰瘍性大腸炎。Crohn 病は口から肛門までどこにでも。"],"core":"UC（ulcerative colitis：潰瘍性大腸炎）＝粘膜に限る・直腸から連続・陰窩膿瘍・喫煙で軽くなる。CD（Crohn disease：Crohn 病）＝全層性・非連続・縦走潰瘍/敷石像・非乾酪性肉芽腫・瘻孔/狭窄・痔瘻・喫煙で悪化。","e":"腸管外合併症：関節炎・強直性脊椎炎、結節性紅斑・壊疽性膿皮症、ぶどう膜炎、原発性硬化性胆管炎（UC に多い）、血栓症。\nCD：回腸末端の病変でビタミンB12・胆汁酸の吸収が落ちる→ 胆石・シュウ酸カルシウム結石（腸管でカルシウムが脂肪と結びつき、シュウ酸の吸収が増える）。\n長い経過の UC（広範囲・8〜10年以上）は大腸癌の危険が上がり、定期的な内視鏡を行う。PSC（primary sclerosing cholangitis：原発性硬化性胆管炎） 合併ではさらに高い。","tg":[],"mt":["ibd"]},{"id":"gi-9e4d15c0","f":"gi","u":13,"o":45,"lv":2,"q":"中等症の潰瘍性大腸炎（左側大腸炎型）の寛解導入で、最初に使う薬として正しいものはどれか。","ch":["5-ASA 製剤（内服＋局所製剤）","アザチオプリン（チオプリン製剤）","抗 TNF（tumor necrosis factor：腫瘍壊死因子）-α抗体（インフリキシマブ（レミケード））","抗菌薬（メトロニダゾール（フラジール））の長期投与"],"a":0,"cx":["","アザチオプリンは寛解の維持（ステロイド依存例）に使う。効くまで2〜3か月かかり、導入には向かない。","抗 TNF-α 抗体はステロイド抵抗・依存などの難治例で使う。","抗菌薬は UC（ulcerative colitis：潰瘍性大腸炎） の標準治療ではない。"],"core":"UC（ulcerative colitis：潰瘍性大腸炎） の軽症〜中等症＝5-ASA（メサラジン（ペンタサ、アサコール、リアルダ））の内服＋局所製剤。効かなければステロイド（プレドニゾロン（プレドニン））。寛解維持は 5-ASA。","e":"重症・難治：ステロイド抵抗→ タクロリムス（プログラフ）、シクロスポリン（ネオーラル）、抗 TNF-α 抗体（インフリキシマブなど）、抗 α4β7 インテグリン抗体（ベドリズマブ（エンタイビオ））、抗 IL-12（interleukin-12：インターロイキン12）/23・IL-23（interleukin-23：インターロイキン23） 抗体（ウステキヌマブ（ステラーラ）・ミリキズマブなど）、JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬（トファシチニブ（ゼルヤンツ）・ウパダシチニブ・フィルゴチニブ）、S1P（sphingosine-1-phosphate：スフィンゴシン1-リン酸） 受容体調節薬（エトラシモド（ベルスピティ））、血球成分除去療法。\n劇症・中毒性巨大結腸症・穿孔・大量出血・癌 → 大腸全摘。\nアザチオプリンを始める前に NUDT15（nudix hydrolase 15、チオプリンを分解する酵素の遺伝子） 遺伝子の検査（日本人に多い変異で、重い白血球減少・脱毛）。\n5-ASA で発熱・下痢の悪化（不耐）が起こることがある。","tg":[]},{"id":"gi-1b07a93b","f":"gi","u":13,"o":46,"lv":2,"q":"過敏性腸症候群（IBS（irritable bowel syndrome：過敏性腸症候群））の診断（Rome IV 基準）について正しいものはどれか。","ch":["血便や体重減少があっても IBS と診断してよい","50歳以上で初めて症状が出た人は大腸内視鏡は不要である","腹痛が排便と関連し、最近3か月に週1日以上ある","腹痛がなく便通異常だけでも IBS と診断できる"],"a":2,"cx":["血便・体重減少・発熱・貧血・夜間の症状などの警告徴候があれば、器質的疾患（大腸癌・IBD（inflammatory bowel disease：炎症性腸疾患） など）を先に除く。","50歳以上の新しい症状・大腸癌の家族歴では大腸内視鏡を行う。","","IBS は「腹痛」が必須。腹痛がなければ機能性便秘・機能性下痢。"],"core":"Rome IV：繰り返す腹痛（最近3か月で平均週1日以上）＋次の2つ以上：排便に関係する、排便の回数の変化、便の形の変化。6か月以上前から。","e":"分類（便の形で）：便秘型・下痢型・混合型・分類不能型。\n治療：食事（低 FODMAP（発酵しやすい糖質、オリゴ糖・二糖類・単糖類・ポリオール） など）・運動・生活の見直し、高分子重合体（ポリカルボフィルカルシウム（ポリフル、コロネル））、下痢型にラモセトロン（5-HT3 拮抗薬）、便秘型にリナクロチド（リンゼス）・ルビプロストン、抗コリン薬（痛み）、抗うつ薬、心理療法。\n感染性腸炎のあとに起こる IBS（感染後 IBS）もある。","tg":[]},{"id":"gi-61612652","f":"gi","u":14,"o":47,"lv":2,"q":"Lynch 症候群について正しいものはどれか。","ch":["子宮内膜癌の危険は、一般の人と比べて変わらない","APC（adenomatous polyposis coli、がん抑制遺伝子） 遺伝子の変異で、大腸に数百〜数千のポリープができる","癌の組織は、マイクロサテライト安定（MSS（microsatellite stable：マイクロサテライト安定））である","ミスマッチ修復遺伝子の生殖細胞系列変異（常染色体顕性）"],"a":3,"cx":["Lynch 症候群は子宮内膜癌（女性で最も多い関連癌）・卵巣癌・胃癌・小腸癌・尿路上皮癌なども起こしやすい。","APC 遺伝子の変異は家族性大腸腺腫症（FAP（familial adenomatous polyposis：家族性大腸腺腫症））。","Lynch 症候群の癌はマイクロサテライト不安定性（MSI-High（マイクロサテライト不安定性が高い））を示す。",""],"core":"Lynch 症候群＝MLH1（ミスマッチ修復遺伝子）・MSH2（ミスマッチ修復遺伝子）・MSH6（ミスマッチ修復遺伝子）・PMS2（・EPCAM（epithelial cell adhesion molecule、遺伝子））の生殖細胞系列変異。若い大腸癌（右側に多い）＋子宮内膜癌など。MSI-High（マイクロサテライト不安定性が高い）。","e":"スクリーニング：大腸癌・子宮内膜癌の組織で MSI（microsatellite instability：マイクロサテライト不安定性） 検査か、ミスマッチ修復タンパクの免疫染色。\nMSI-High（dMMR）の癌は免疫チェックポイント阻害薬（ペムブロリズマブ（キイトルーダ）など）がよく効く。臓器を問わず使える（がん種横断）。\nFAP（familial adenomatous polyposis：家族性大腸腺腫症）：APC 変異、100個以上の腺腫、放置すればほぼ全例が大腸癌 → 予防的大腸切除。デスモイド腫瘍・十二指腸乳頭部癌・甲状腺癌。\n散発性の大腸癌の多くは「腺腫→癌」の経路（APC→KRAS（Kirsten rat sarcoma、がん遺伝子）→TP53（tumor protein p53、がん抑制遺伝子））。","tg":[]},{"id":"gi-98b047c2","f":"gi","u":14,"o":48,"lv":3,"q":"74歳の女性。心房細動があるが抗凝固薬は飲んでいない。2時間前から突然の強い腹痛があり、のたうち回っている。腹部は軟らかく、圧痛は軽い。乳酸 5.8 mmol/L。まず行う検査として最も適切なのはどれか。","ch":["前処置をしたうえでの大腸内視鏡検査","腹部の単純X線のみで経過を見る","腹部の造影 CT（動脈相を含む）","翌日の腹部超音波検査（ドプラを含む）"],"a":2,"cx":["内視鏡は空気を入れて腸をふくらませ、虚血の腸に負担をかける。まず CT（computed tomography：コンピュータ断層撮影） で血管を見る。","単純X線では早期の腸管虚血はほとんどわからない。","","時間がたつと腸が壊死する。今すぐ造影 CT（computed tomography：コンピュータ断層撮影）。"],"core":"「痛みの強さのわりに腹部所見が乏しい」＋心房細動＝急性腸間膜動脈閉塞症（塞栓）を疑い、すぐ造影 CT（血管造影相）。","e":"急性腸間膜虚血の原因：①塞栓（心房細動・心臓内血栓、上腸間膜動脈の本幹の途中で詰まる）②血栓（動脈硬化の上に、慢性の食後腹痛の既往）③非閉塞性（NOMI（non-occlusive mesenteric ischemia：非閉塞性腸管虚血）：低心拍出・血管収縮薬・透析）④静脈血栓（凝固異常・門脈圧亢進）。\n治療：ヘパリン、血行再建（カテーテル・手術）、壊死腸管の切除。時間が勝負。\n虚血性大腸炎（多いのはこちら）：便秘の後の腹痛→下痢・血便、高齢者、左側大腸（脾彎曲〜S状結腸）、多くは保存的に治る。","tg":["cs"]},{"id":"gi-f26ceaa5","f":"gi","u":14,"o":49,"lv":2,"q":"大腸癌検診と大腸ポリープの扱いについて正しいものはどれか。","ch":["便潜血をもう一度やり直し、陰性なら精査は不要である","5 mm 以下の腺腫はすべて癌化しないので放置してよい","便潜血陽性なら、痔があっても大腸内視鏡で精査する","大腸内視鏡より便潜血の再検のほうが癌を見つけやすい"],"a":2,"cx":["便潜血の再検で陰性でも、1回目の陽性の意味は消えない。精査は大腸内視鏡。","小さな腺腫も切除することが多い（とくに 6 mm 以上は切除が勧められる）。","","大腸内視鏡が精密検査の標準（できなければ CT（computed tomography：コンピュータ断層撮影） コロノグラフィなど）。"],"core":"便潜血（2日法）で1回でも陽性＝大腸内視鏡で精査する。痔があっても、再検で陰性でも省かない。","e":"大腸ポリープの扱い：腺腫は「腺腫→癌」の経路の前段階。6 mm 以上の腺腫は切除、5 mm 以下でも平坦・陥凹型や癌が疑われるものは切除。過形成ポリープ（直腸の小さなもの）は経過観察が多い。鋸歯状病変（右側結腸の SSL）は癌化しうる。\n切除後は所見に応じて3年後などに内視鏡で経過を見る。\n家族歴（第一度近親者の大腸癌）があれば早めに検査を始める。","tg":[]},{"id":"gi-b40f5a1a","f":"gi","u":15,"o":50,"lv":2,"q":"上部消化管出血の初期対応について正しいものはどれか。","ch":["すべての患者に、緊急手術（胃切除）を考える","内視鏡は止血を確かめてから、1週間あけて行う","Hb 10 g/dL を保つように、積極的に輸血する","循環が安定していれば Hb 7 g/dL を目安に輸血する"],"a":3,"cx":["多くは内視鏡で止血できる。手術・IVR（interventional radiology：画像下治療） は内視鏡で止まらないとき。","内視鏡は24時間以内に行う。止血と診断を同時にできる。","輸血を多くしすぎると、とくに静脈瘤出血で再出血が増え、死亡も多い（制限輸血のほうが良い）。",""],"core":"上部消化管出血：輸液で循環を保ち、Hb 7 g/dL を目安に輸血（心疾患があれば 8 g/dL 程度）、PPI（proton pump inhibitor：プロトンポンプ阻害薬） 静注、24時間以内の内視鏡。","e":"重症度：Glasgow-Blatchford スコア（BUN（blood urea nitrogen：血中尿素窒素）・Hb・収縮期血圧・脈拍・黒色便・失神・肝疾患・心不全）が0〜1なら外来でも見られる。\nBUN/Cr（BUN とクレアチニンの比） 比の上昇（血液のたんぱくが腸で吸収される）は上部出血を示唆。\n潰瘍の内視鏡所見（Forrest 分類）：噴出性出血・湧出性出血・露出血管は止血処置の対象。\n肝硬変の患者の出血：静脈瘤を考え、抗菌薬の予防投与（セフトリアキソン（ロセフィン）など）で感染と再出血を減らす。","tg":[]},{"id":"gi-cad80cd7","f":"gi","u":16,"o":51,"lv":1,"q":"B型肝炎ウイルスのマーカーで、「過去の感染（既往感染）」を最もよく示す組み合わせはどれか。","ch":["HBs（hepatitis B surface：B型肝炎ウイルス表面） 抗原陽性・HBe（HBe 抗原、B 型肝炎ウイルスの増殖の目安） 抗原陽性・HBc（hepatitis B core：B型肝炎ウイルスコア） 抗体陽性","HBs（hepatitis B surface：B型肝炎ウイルス表面） 抗原陽性・IgM-HBc（IgM 型 HBc 抗体） 抗体高力価陽性","HBs（hepatitis B surface：B型肝炎ウイルス表面） 抗原陰性・HBc（hepatitis B core：B型肝炎ウイルスコア） 抗体陰性・HBs 抗体陽性","HBs（hepatitis B surface：B型肝炎ウイルス表面） 抗原陰性・HBc（hepatitis B core：B型肝炎ウイルスコア） 抗体陽性・HBs 抗体陽性"],"a":3,"cx":["HBs 抗原陽性は現在の感染。HBe 抗原陽性はウイルスが多く感染力が強い状態。","IgM-HBc 抗体の高力価は急性 B 型肝炎（または慢性の急性増悪）。","HBc 抗体陰性で HBs 抗体だけ陽性は、ワクチン接種後。",""],"core":"HBs 抗原＝今いる。HBs 抗体＝免疫（ワクチンか既往）。HBc 抗体＝感染したことがある（ワクチンでは陽性にならない）。","e":"既往感染（HBs 抗原陰性・HBc 抗体陽性）でも、肝細胞の核の中に cccDNA が残る。強い免疫抑制（リツキシマブ（リツキサン）・造血幹細胞移植・ステロイド大量など）で再活性化し、劇症化する（de novo B 型肝炎）。\n免疫抑制・化学療法の前の対策（日本肝臓学会ガイドライン）：全員に HBs 抗原 → 陰性なら HBc 抗体・HBs 抗体 → どちらか陽性なら HBV-DNA（B 型肝炎ウイルスの DNA 量） を測り、20 IU（international unit：国際単位）/mL（1.3 LogIU/mL）以上ならエンテカビル（バラクルード）などの核酸アナログを始め、未満なら月1回 HBV-DNA を測る。\nHBe 抗原→HBe 抗体への変化（セロコンバージョン）で、多くはウイルスが減り落ち着く。","tg":[],"mt":["hbv"]},{"id":"gi-cb4d7dee","f":"gi","u":16,"o":52,"lv":2,"q":"慢性 B 型肝炎の治療について正しいものはどれか。","ch":["インターフェロンは、妊婦にも安全に使える","治療の目標は ALT（alanine aminotransferase） の正常化で、HBV-DNA（B 型肝炎ウイルスの DNA 量） は問わない","核酸アナログで、HBs（hepatitis B surface：B型肝炎ウイルス表面） 抗原は数か月でほぼ全員が消える","核酸アナログでも cccDNA は消えず、多くは長く続ける"],"a":3,"cx":["インターフェロンは妊娠中は使わない。","目標は HBV-DNA を抑え、ALT を正常にし、最終的に HBs（hepatitis B surface：B型肝炎ウイルス表面） 抗原の消失を目指す。","核酸アナログで HBs 抗原が消える人はごく少ない（年に1%未満）。",""],"core":"第一選択の核酸アナログ＝エンテカビル（バラクルード）・テノホビル（TDF（テノホビル ジソプロキシル）・TAF（テノホビル アラフェナミド））。耐性ができにくい。中止すると再燃しやすく、長期に飲み続けることが多い。","e":"テノホビル：TDF（テノホビル ジソプロキシル）は腎障害・骨密度低下に注意、TAF（テノホビル アラフェナミド（ベムリディ））は腎・骨への影響が少ない。妊娠中は TDF が使われる。\nPEG-インターフェロン：期間を決めて（48週）治療し、薬なしで落ち着く（HBs 抗原消失）可能性を狙う。若い人・遺伝子型 A などで効きやすい。発熱・うつ・血球減少。\n肝癌の危険：肝硬変、HBV-DNA 高値、男性、高齢、家族歴。B 型は肝硬変がなくても肝癌が起こるので、定期的な超音波と腫瘍マーカー。\n母子感染予防：HBs 抗原陽性の母から生まれた児に、出生直後の HB（hepatitis B：B 型肝炎） ワクチン＋HBIG（hepatitis B immunoglobulin：抗 HBs ヒト免疫グロブリン）。","tg":[]},{"id":"gi-42c035cc","f":"gi","u":16,"o":53,"lv":2,"q":"C型慢性肝炎の治療について正しいものはどれか。","ch":["非代償性肝硬変には、DAA（direct-acting antiviral：直接作用型抗ウイルス薬） はどれも使えない","インターフェロンを含む治療が、今も第一選択である","ウイルスが消えれば、肝癌の危険はゼロになる","DAA（direct-acting antiviral：直接作用型抗ウイルス薬） で9割以上がウイルスを排除できる"],"a":3,"cx":["ソホスブビル・ベルパタスビル（エプクルーサ）は非代償性肝硬変にも使える。","インターフェロンを使わない DAA（direct-acting antiviral：直接作用型抗ウイルス薬） だけの治療が標準。","ウイルスが消えても肝癌の危険は残る。とくに線維化の進んだ人は超音波で経過を見る。",""],"core":"C型肝炎＝DAA の内服8〜12週で SVR（治療終了12週後にウイルスが検出されない）が95%以上。","e":"代表：グレカプレビル・ピブレンタスビル（マヴィレット、8週、全遺伝子型、腎不全にも使える）、ソホスブビル・ベルパタスビル（エプクルーサ、12週、非代償性肝硬変は12週）、レジパスビル・ソホスブビル（ハーボニー）。\n注意：ソホスブビルはアミオダロン（アンカロン）との併用で高度の徐脈（禁忌・併用注意）。DAA 治療中に HBV（hepatitis B virus：B 型肝炎ウイルス） 共感染があると B 型肝炎が再燃することがあり、治療前に HBs（hepatitis B surface：B型肝炎ウイルス表面） 抗原・HBc（hepatitis B core：B型肝炎ウイルスコア） 抗体を確かめる。\n肝外病変：クリオグロブリン血症（膜性増殖性糸球体腎炎・紫斑・末梢神経障害）、晩発性皮膚ポルフィリン症、扁平苔癬、B 細胞リンパ腫。\nC型肝炎の抗体陽性＝感染したことがある。今の感染は HCV-RNA（C 型肝炎ウイルスの RNA） で確かめる。","tg":[]},{"id":"gi-d43e3871","f":"gi","u":16,"o":54,"lv":2,"q":"E型肝炎について正しいものはどれか。","ch":["加熱不足の豚レバー・イノシシ・シカの肉で感染","妊婦が感染しても、重症化することはない","国内では、ワクチンが定期接種になっている","主に輸血と性交渉で感染し、慢性化しやすい"],"a":0,"cx":["","妊婦（とくに妊娠後期）は劇症化しやすく、死亡率が高い（主に遺伝子型1）。","国内で使えるワクチンはない。","輸血でもまれに感染するが、国内の主な経路は食べ物。免疫が正常なら慢性化はまれ。"],"core":"E型肝炎＝経口感染（豚・イノシシ・シカの生や加熱不足の肉・レバー）。中高年男性に多い。IgA-HEV（IgA 型 E 型肝炎ウイルス抗体） 抗体で診断（保険適用）。","e":"A型肝炎も経口感染（生の貝・海外渡航・男性間の性交渉）で、慢性化しない。IgM-HA（IgM 型 A 型肝炎ウイルス抗体） 抗体で診断。ワクチンあり。\n免疫抑制者（臓器移植後など）では E 型が慢性化することがあり、リバビリン（国内適用外）が使われる。\n急性肝炎の原因の調べ方：IgM-HA 抗体、HBs（hepatitis B surface：B型肝炎ウイルス表面） 抗原と IgM-HBc（IgM 型 HBc 抗体） 抗体、HCV（hepatitis C virus：C型肝炎ウイルス） 抗体と HCV-RNA（C 型肝炎ウイルスの RNA）、IgA-HEV 抗体、EBV（Epstein-Barr virus）・CMV（cytomegalovirus：サイトメガロウイルス）、自己免疫性（抗核抗体・IgG（immunoglobulin G：免疫グロブリン G））、薬物。","tg":[]},{"id":"gi-bceed59d","f":"gi","u":17,"o":55,"lv":2,"q":"自己免疫性肝炎（AIH（autoimmune hepatitis：自己免疫性肝炎））について正しいものはどれか。","ch":["中年女性に多く、IgG（immunoglobulin G：免疫グロブリン G） 高値と抗核抗体陽性、ステロイドがよく効く","病理で胆管の数珠状の拡張と狭窄が見られる","男性に多く、潰瘍性大腸炎の合併が多い","抗ミトコンドリア抗体が陽性で、ウルソデオキシコール酸（ウルソ）が第一選択である"],"a":0,"cx":["","胆管の数珠状の変化は PSC（primary sclerosing cholangitis：原発性硬化性胆管炎） の胆道造影（MRCP（MR cholangiopancreatography：MR 胆管膵管撮影））の所見。","男性・潰瘍性大腸炎の合併は原発性硬化性胆管炎（PSC（primary sclerosing cholangitis：原発性硬化性胆管炎））。","抗ミトコンドリア抗体・ウルソデオキシコール酸は原発性胆汁性胆管炎（PBC（primary biliary cholangitis：原発性胆汁性胆管炎））。"],"core":"AIH＝中年女性・IgG↑・抗核抗体（または抗平滑筋抗体）陽性・病理で interface hepatitis と形質細胞浸潤。プレドニゾロン（プレドニン）がよく効く。","e":"急性発症（急性肝炎のように来る）型もあり、そのときは IgG・抗核抗体が上がっていないことがある。\nステロイドで効果が不十分・減らせないとき：アザチオプリン（イムラン、アザニン）。\n骨粗鬆症の予防（ステロイド）。\n三つの比較：AIH＝肝細胞の障害（AST（aspartate aminotransferase）・ALT（alanine aminotransferase） 主体）、PBC（primary biliary cholangitis：原発性胆汁性胆管炎）＝小葉間胆管の破壊（ALP（alkaline phosphatase：アルカリホスファターゼ）・γ-GTP（γ-glutamyl transpeptidase、γ-GTP） 主体・IgM（immunoglobulin M：免疫グロブリン M）↑）、PSC（primary sclerosing cholangitis：原発性硬化性胆管炎）＝大きな胆管も含む線維性狭窄（ALP・γ-GTP、IgG4（immunoglobulin G4：免疫グロブリン G のサブクラス4） 関連硬化性胆管炎との区別が大事）。","tg":[],"mt":["autoab","liverai"]},{"id":"gi-8d521e9d","f":"gi","u":17,"o":56,"lv":2,"q":"原発性胆汁性胆管炎（PBC（primary biliary cholangitis：原発性胆汁性胆管炎））について正しいものはどれか。","ch":["治療の第一選択は、プレドニゾロン（プレドニン）である","抗ミトコンドリア抗体（抗 M2）が約9割で陽性","かゆみはまれで、皮膚の症状（黄色腫など）は出ない","若い男性に多く、IgG（immunoglobulin G：免疫グロブリン G） が著しく高くなる"],"a":1,"cx":["第一選択はウルソデオキシコール酸（ウルソ）。ステロイドは基本的に使わない（AIH（autoimmune hepatitis：自己免疫性肝炎） の合併は別）。","","かゆみ（胆汁うっ滞）はよく出る症状で、黄疸より先に出ることが多い。黄色腫も。","中年女性に多く、IgM（immunoglobulin M：免疫グロブリン M） が上がりやすい。"],"core":"PBC＝中年女性・ALP（alkaline phosphatase：アルカリホスファターゼ）/γ-GTP（γ-glutamyl transpeptidase、γ-GTP）↑・IgM（immunoglobulin M：免疫グロブリン M）↑・抗ミトコンドリア抗体陽性。治療はウルソデオキシコール酸（ウルソ）。効果不十分ならベザフィブラート（国内では保険適用外）を加えることが多い。","e":"合併しやすい病気：シェーグレン症候群、慢性甲状腺炎、全身性強皮症（抗セントロメア抗体陽性の限局型）、骨粗鬆症、脂溶性ビタミン（A・D・E・K）の吸収低下。\nかゆみの治療：コレスチラミン（クエストラン）、ナルフラフィン（κオピオイド作動薬、慢性肝疾患のかゆみに適用）。\n進行すると黄疸・肝硬変→肝移植。総ビリルビンが上がると予後が悪い（5 mg/dL 超で移植を考える）。","tg":[],"mt":["autoab","liverai"]},{"id":"gi-ab3b9037","f":"gi","u":17,"o":57,"lv":2,"q":"代謝機能障害関連脂肪性肝疾患（MASLD（metabolic dysfunction-associated steatotic liver disease：代謝機能障害関連脂肪性肝疾患））について正しいものはどれか。","ch":["線維化の程度は、肝臓や心血管の予後と関係しない","脂肪肝に、肥満・糖尿病などの代謝の危険因子を伴う","体重を減らしても、肝臓の脂肪は変わらない","アルコールを毎日 60 g 以上飲む人だけに起こる"],"a":1,"cx":["予後（肝関連死・肝癌・心血管死）を最もよく決めるのは線維化の程度。","","体重の 7〜10% の減量で脂肪・炎症・線維化が改善する。","大量飲酒はアルコール関連肝疾患。中間の飲酒量に代謝の異常が重なると MetALD（MASLD と飲酒の両方が関わる脂肪性肝疾患） という区分になる。"],"core":"MASLD（2023年に NAFLD（non-alcoholic fatty liver disease：非アルコール性脂肪性肝疾患、旧称） から改称）＝脂肪肝＋心血管代謝のリスク因子1つ以上。線維化は FIB-4（肝線維化の指数、年齢・AST・ALT・血小板） 指数でまず評価し、高ければエラストグラフィ・専門医へ。","e":"FIB-4＝年齢×AST（aspartate aminotransferase）÷（血小板［万/μL→10⁹/L］×√ALT（alanine aminotransferase））。1.3 未満なら進んだ線維化は否定的、2.67 以上なら疑う。\n死因の第1位は心血管疾患。肝臓だけでなく糖尿病・脂質・血圧を管理する。\n薬：糖尿病があれば SGLT2（sodium-glucose cotransporter 2：ナトリウム・グルコース共輸送体2） 阻害薬・GLP-1（glucagon-like peptide-1） 受容体作動薬（体重・肝脂肪を減らす）、ピオグリタゾン（体重は増える）、ビタミンE（糖尿病のない人）。\nMASH（脂肪肝炎）＝脂肪＋炎症＋風船様変性。肝硬変・肝癌へ進みうる。","tg":[]},{"id":"gi-bc28fadb","f":"gi","u":17,"o":58,"lv":2,"q":"Wilson 病について正しいものはどれか。","ch":["治療は鉄キレート薬のデフェラシロクスである","角膜の Kayser-Fleischer 輪は鉄の沈着による","血清セルロプラスミンが低く、尿中の銅が増える","常染色体潜性遺伝の鉄の過剰症である"],"a":2,"cx":["治療は銅キレート薬（D-ペニシラミン・トリエンチン）と、銅の吸収を抑える酢酸亜鉛。","Kayser-Fleischer 輪は角膜周辺（Descemet 膜）への銅の沈着。","","鉄の過剰症はヘモクロマトーシス。Wilson 病は銅。"],"core":"Wilson 病＝ATP7B（銅を運ぶ ATPase の遺伝子） 遺伝子の変異（常染色体潜性）で銅を胆汁に出せない。肝障害・錐体外路症状/精神症状・Kayser-Fleischer 輪。セルロプラスミン↓、尿中銅↑。","e":"若い人の原因不明の肝障害・溶血を伴う急性肝不全（ALP（alkaline phosphatase：アルカリホスファターゼ） が低いのが特徴）・パーキンソン症状では必ず考える。\n治療は一生続け、銅の多い食べ物（貝・レバー・ナッツ・チョコレート）を控える。劇症型は肝移植。\nヘモクロマトーシス：トランスフェリン飽和度・フェリチン↑、肝硬変・糖尿病・皮膚の色素沈着（青銅色糖尿病）・心筋症・性腺機能低下。日本では輸血後（二次性）が多い。治療は瀉血・鉄キレート薬。","tg":[]},{"id":"gi-f7ebfcf8","f":"gi","u":18,"o":59,"lv":2,"q":"肝硬変の腹水の治療について正しいものはどれか。","ch":["塩分制限とスピロノラクトン（アルダクトン A）を基本にする","大量の腹水穿刺（排液）は禁忌である","アルブミン製剤は効果がないので使わない","1日の水分を、全員 500 mL 以下に必ず制限する"],"a":0,"cx":["","大量穿刺（＋アルブミン）は難治性腹水の治療の1つ。","低アルブミン血症の難治性腹水や大量穿刺のあと（循環不全の予防）にアルブミンを使う。","水分制限は血清ナトリウムが低い（125 mEq/L 未満など）ときに考える。全員に必要ではない。"],"core":"腹水＝塩分制限（1日 5〜7 g）＋抗アルドステロン薬（スピロノラクトン）→ ループ利尿薬（フロセミド（ラシックス））を併用 → 効かなければトルバプタン（バソプレシン V2 受容体拮抗薬）。","e":"肝硬変の腹水は二次性アルドステロン症（有効循環血漿量の低下→レニン・アルドステロン↑）が中心なので、抗アルドステロン薬がよく効く。\n難治性腹水：大量穿刺＋アルブミン、腹水濾過濃縮再静注法（CART（cell-free and concentrated ascites reinfusion therapy：腹水濾過濃縮再静注法））、経頸静脈的肝内門脈体循環シャント（TIPS（transjugular intrahepatic portosystemic shunt：経頸静脈的肝内門脈体循環シャント））、肝移植。\n腹水の性状：血清−腹水アルブミン較差（SAAG（serum-ascites albumin gradient：血清-腹水アルブミン較差））1.1 g/dL 以上なら門脈圧亢進（肝硬変・心不全）、未満なら腹膜の病気（癌性腹膜炎・結核）・ネフローゼなど。\n特発性細菌性腹膜炎（SBP（spontaneous bacterial peritonitis：特発性細菌性腹膜炎））：腹水の好中球 250/μL 以上。発熱・腹痛がなくても、肝性脳症や腎機能悪化で見つかることがある。第3世代セフェムで治療し、予防にはキノロンなど。","tg":["ae"],"fig":["nephron","portal"],"mt":["adrenal"]},{"id":"gi-3a1a1f6d","f":"gi","u":18,"o":60,"lv":3,"q":"62歳の男性。アルコール性肝硬変で通院中。2日前から便秘があり、今朝から日時を間違え、つじつまの合わないことを言う。両手を前に伸ばすと手が羽ばたくように震える。発熱はない。血中アンモニア 182 μg/dL。最初に行う治療として適切なのはどれか。","ch":["アンモニアを下げるためにループ利尿薬を増やす","高たんぱく食（1日 2.0 g/kg 以上）にする","便通を整え、ラクツロース（モニラック）などの非吸収性二糖類を使う","鎮静のためにベンゾジアゼピン系薬を使う"],"a":2,"cx":["利尿薬による脱水・低カリウムは肝性脳症の誘因になる。","長期のたんぱく制限は筋肉を減らし悪化させる。急性期だけ一時的に控え、分岐鎖アミノ酸製剤を使う。過剰に増やすのも誤り。","","ベンゾジアゼピン系薬は肝性脳症を悪化させる。"],"core":"肝性脳症＝まず誘因（便秘・消化管出血・感染・脱水・利尿薬・低カリウム・鎮静薬・たんぱくのとりすぎ）を除き、ラクツロース（またはラクチトール（ポルトラック））＋リファキシミン（リフキシマ）。","e":"羽ばたき振戦（asterixis）は代謝性脳症の所見（肝性脳症・尿毒症・CO₂ ナルコーシス）。\nリファキシミン（リフキシマ）：腸からほとんど吸収されない抗菌薬で、アンモニアをつくる腸内細菌を減らす。\n分岐鎖アミノ酸（BCAA（branched-chain amino acids：分岐鎖アミノ酸））製剤：アミノ酸の不均衡（Fischer 比の低下）を直す。\n亜鉛の補充（亜鉛はアンモニアを処理する酵素に必要）、カルニチン。\n消化管出血は血液のたんぱくがアンモニアになるので強い誘因。","tg":["cs"]},{"id":"gi-e1f225e0","f":"gi","u":18,"o":61,"lv":2,"q":"肝細胞癌のサーベイランス（定期検査）について、ガイドラインで「超高危険群」とされるのはどれか。","ch":["A型肝炎の既往がある人","HBs（hepatitis B surface：B型肝炎ウイルス表面） 抗体だけが陽性のワクチン接種者","飲酒をしない人の単純性脂肪肝","B型肝硬変・C型肝硬変"],"a":3,"cx":["A型肝炎は慢性化せず、肝癌の危険因子ではない。","ワクチン接種者（HBs 抗体のみ陽性）は感染していない。","単純性の脂肪肝だけでは高危険群に入らない（線維化が進めば危険が上がる）。",""],"core":"超高危険群（B型・C型肝硬変）は3〜4か月ごと、高危険群（B型・C型慢性肝炎、ウイルス以外の肝硬変）は6か月ごとに、超音波検査＋腫瘍マーカー（AFP（α-fetoprotein：α-フェトプロテイン）・PIVKA-II（protein induced by vitamin K absence-II）・AFP-L3（AFP のレクチン結合分画）分画）。","e":"造影 CT（computed tomography：コンピュータ断層撮影）・MRI（magnetic resonance imaging：磁気共鳴画像） の典型像：動脈相で濃く染まり、門脈相〜平衡相で抜ける（washout）。EOB-MRI（ガドキセト酸、EOBを使った造影 MRI） の肝細胞相で低信号。\n治療は肝予備能（Child-Pugh）・腫瘍の数と大きさ・脈管侵襲・肝外転移で選ぶ：切除、ラジオ波焼灼（3 cm 以下・3個以下）、肝動脈化学塞栓療法（TACE（transarterial chemoembolization：肝動脈化学塞栓療法））、薬物療法（アテゾリズマブ（テセントリク）＋ベバシズマブ（アバスチン）、デュルバルマブ（イミフィンジ）＋トレメリムマブ（イジュド）、レンバチニブ（レンビマ）など）、肝移植（ミラノ基準など）。\nPIVKA-II はワルファリン（ワーファリン）内服やビタミン K 欠乏でも上がる。","tg":["gl"],"mt":["tumormarker"]},{"id":"gi-47a24fc8","f":"gi","u":18,"o":62,"lv":2,"q":"Child-Pugh 分類の項目に含まれないものはどれか。","ch":["プロトロンビン時間","血清ビリルビン","血小板数","血清アルブミン"],"a":2,"cx":["プロトロンビン時間（％または INR（international normalized ratio：国際標準比））は項目の1つ。","ビリルビンは項目の1つ。","","アルブミンは項目の1つ。"],"core":"Child-Pugh＝脳症・腹水・ビリルビン・アルブミン・プロトロンビン時間の5項目（各1〜3点）。5〜6点 A、7〜9点 B、10〜15点 C。","e":"覚え方：「ABCDE」＝Albumin・Bilirubin・Coagulation（PT（prothrombin time：プロトロンビン時間））・Distension（腹水）・Encephalopathy（脳症）。\nMELD（Model for End-stage Liver Disease） スコア（ビリルビン・INR（international normalized ratio：国際標準比）・クレアチニン、新しい版はナトリウムも）：肝移植の優先度など短期の予後。\n血小板の減少（脾機能亢進）は肝硬変・門脈圧亢進の目安だが、Child-Pugh には入らない。\n食道静脈瘤：内視鏡的静脈瘤結紮術（EVL（endoscopic variceal ligation：内視鏡的静脈瘤結紮術））・硬化療法（EIS（endoscopic injection sclerotherapy：内視鏡的硬化療法））、予防に非選択的β遮断薬（プロプラノロール（インデラル）・カルベジロール）。","tg":[],"fig":["portal"]},{"id":"gi-0445abe5","f":"gi","u":19,"o":63,"lv":3,"q":"28歳の女性。自殺目的でアセトアミノフェン（カロナール） 15 g を4時間前に飲んだ。今は吐き気だけで、意識は清明。AST（aspartate aminotransferase）・ALT（alanine aminotransferase） は正常。最も適切な対応はどれか。","ch":["肝機能が正常なので帰宅させ、翌日に外来で診る","血中濃度とノモグラムで判断し、N-アセチルシステイン（アセチルシステイン内用液）","ビタミン K を投与して、凝固の経過を見る","利尿薬を使って、尿中への排泄を促す"],"a":1,"cx":["肝障害は24〜72時間後に出てくる。最初の数時間は検査が正常でも安心できない。","","ビタミン K は解毒にならない。","アセトアミノフェンは肝臓で処理され、利尿で排泄は増えない。"],"core":"アセトアミノフェン中毒＝飲んで4時間以降の血中濃度をノモグラムに当てる。治療線を超えれば N-アセチルシステイン（8〜10時間以内が最も効く）。大量（体重あたり150 mg/kg〜）なら結果を待たずに始める。","e":"機序：大量だとグルクロン酸・硫酸抱合が飽和し、CYP2E1（cytochrome P450 2E1：薬物代謝酵素） で毒性代謝物 NAPQI（N-acetyl-p-benzoquinone imine、アセトアミノフェンの毒性代謝物） がつくられる。グルタチオンが枯渇すると肝細胞が壊死する。N-アセチルシステインはグルタチオンを補う。\n危険が高い人：常習飲酒（CYP2E1 誘導）、低栄養・絶食（グルタチオン減少）、イソニアジド（イスコチン）など。\n1時間以内なら活性炭。\n急性肝不全（PT-INR（プロトロンビン時間の国際標準比） 1.5 以上や PT（prothrombin time：プロトロンビン時間） 40% 以下＋肝性脳症など）に進めば、肝移植ができる施設へ早めに相談する。","tg":["ae","cs"],"mt":["antidote"]},{"id":"gi-fd402f9a","f":"gi","u":19,"o":64,"lv":2,"q":"急性肝不全（劇症肝炎）について正しいものはどれか。","ch":["PT（prothrombin time：プロトロンビン時間） の延長と肝性脳症が中心で、肝移植も考える","AST（aspartate aminotransferase）・ALT（alanine aminotransferase） が下がってくれば、必ず回復に向かっている","黄疸がなければ、急性肝不全ではないと判断する","国内で最も多い原因は、アセトアミノフェン（カロナール）である"],"a":0,"cx":["","肝細胞がほとんど残っていないため AST・ALT が下がることがある（悪い徴候）。ビリルビン上昇と PT（prothrombin time：プロトロンビン時間） の悪化を伴えば重い。","発症早期は黄疸が軽いこともある。凝固能（PT（prothrombin time：プロトロンビン時間））と脳症で判断する。","欧米ではアセトアミノフェンが最多だが、日本ではウイルス（とくに B 型）・自己免疫性・薬物・成因不明が多い。"],"core":"急性肝不全（日本の基準）：正常肝に肝障害が起こり、8週以内に PT 40% 以下（INR（international normalized ratio：国際標準比） 1.5 以上）。脳症の有無と発症までの日数で、急性型・亜急性型・遅発性肝不全に分ける。","e":"予後が悪い徴候：亜急性型、高ビリルビン、直接/総ビリルビン比の低下、肝の萎縮、高齢。\n治療：原因の治療（B 型には核酸アナログ、AIH（autoimmune hepatitis：自己免疫性肝炎） にはステロイド）、血漿交換＋血液濾過透析、肝移植（予後予測のスコアで判断）。\n脳浮腫・感染症・腎障害・出血に注意。","tg":[],"mt":["bleeding"]},{"id":"gi-4fbd3448","f":"gi","u":20,"o":65,"lv":2,"q":"急性胆管炎の診断と治療（Tokyo Guidelines 2018）について正しいものはどれか。","ch":["中等症でも胆道ドレナージは不要で、抗菌薬だけでよい","重症度に応じ、抗菌薬と胆道ドレナージを行う","診断には、腹部の強い圧痛と筋性防御が必ず必要である","黄疸がなければ、急性胆管炎は否定できる"],"a":1,"cx":["中等症では早期の胆道ドレナージが勧められる。重症では臓器障害の治療とともに緊急ドレナージ。","","腹膜刺激症状は胆嚢炎の所見。胆管炎の古典的三徴は発熱・黄疸・右上腹部痛（Charcot 三徴）。","黄疸を伴わない胆管炎もある。全身の炎症＋胆汁うっ滞＋画像（胆管拡張・原因）で判断する。"],"core":"急性胆管炎＝胆管の閉塞（結石・腫瘍）＋感染。Charcot 三徴（発熱・黄疸・腹痛）、重症は Reynolds 五徴（＋ショック・意識障害）。治療は抗菌薬＋胆道ドレナージ（ERCP（endoscopic retrograde cholangiopancreatography：内視鏡的逆行性胆膵管造影） など）。","e":"重症度：重症（Grade III）＝循環・中枢神経・呼吸・腎・肝・血液のどれかの臓器障害。中等症（Grade II）＝白血球の著しい増減・39℃以上・75歳以上・高ビリルビン・低アルブミンのうち2つなど。\n血液培養は必ず採る（胆管炎は菌血症が多い）。\n胆嚢炎：Murphy 徴候、超音波で胆嚢の腫大・壁肥厚・周囲の液体。治療は早期の腹腔鏡下胆嚢摘出術、手術できなければ経皮的胆嚢ドレナージ。\n総胆管結石は、胆管炎を起こしていなくても見つけたら内視鏡で取る。","tg":[],"mt":["abx"]},{"id":"gi-80f5f653","f":"gi","u":20,"o":66,"lv":3,"q":"52歳の女性。脂っこい食事の後から右季肋部痛が続き、38.2℃の発熱がある。右季肋部を押さえて深呼吸させると痛みで息が止まる。白血球 13,500/μL、ビリルビン・肝酵素は正常。超音波で胆嚢の腫大、壁の肥厚、胆嚢頸部の結石がある。最も適切な治療はどれか。","ch":["緊急 ERCP（endoscopic retrograde cholangiopancreatography：内視鏡的逆行性胆膵管造影） で、総胆管の結石を取る","抗菌薬と早期の腹腔鏡下胆嚢摘出術","胆石溶解薬（ウルソデオキシコール酸（ウルソ））だけを始める","発熱が治まるまで、鎮痛薬だけで外来で経過を見る"],"a":1,"cx":["ビリルビン・肝酵素が正常で、胆管の閉塞（胆管炎）の所見はない。ERCP の適応ではない。","","溶解薬は症状のない小さなコレステロール結石の一部が対象で、急性胆嚢炎の治療にならない。","急性胆嚢炎は入院で治療する。放置すると壊疽・穿孔を起こす。"],"core":"急性胆嚢炎＝Murphy 徴候・発熱・炎症反応・超音波（腫大・壁肥厚・周囲の液体・嵌頓結石）。手術に耐えられる人は早期の腹腔鏡下胆嚢摘出術。耐えられない重症例は経皮経肝胆嚢ドレナージ。","e":"TG18 の重症度：重症（臓器障害）、中等症（白血球 18,000 超・右季肋部の腫瘤・症状が72時間以上・壊疽性/気腫性など）、軽症。\n無石胆嚢炎：重症患者・ICU・絶食・高カロリー輸液、壊疽になりやすい。\n気腫性胆嚢炎：糖尿病、ガス産生菌（クロストリジウム）、緊急手術。\n高齢者では Murphy 徴候や発熱がはっきりしないことがある。","tg":["cs"],"mt":["abx"]},{"id":"gi-4aac09fe","f":"gi","u":21,"o":67,"lv":2,"q":"急性膵炎の初期治療について正しいものはどれか。","ch":["胆石性膵炎では、胆管炎がなくても全例で緊急 ERCP（endoscopic retrograde cholangiopancreatography：内視鏡的逆行性胆膵管造影）","軽症でも、2週間は絶食を続けて膵臓を休ませる","細胞外液を、尿量と循環を見ながら過不足なく入れる","全例で、予防的に広域抗菌薬（カルバペネム）を投与する"],"a":2,"cx":["緊急 ERCP は胆管炎の合併や胆道の通過障害が続くときに行う。","腸を使うほうが感染症を減らす。軽症は痛みが落ち着けば早めに食事を再開、重症は早期（48時間以内）に経腸栄養。","","予防的な抗菌薬は、軽症では勧められない。重症・壊死性でも一律の予防投与には議論がある。感染が疑われるときに使う。"],"core":"急性膵炎＝早期の十分な輸液（細胞外液。最初の数時間を手厚く、その後は過剰にしない）、鎮痛（オピオイドも可）、重症度の判定、早期の経腸栄養。","e":"診断（3つのうち2つ）：上腹部の痛み・圧痛、血中/尿中の膵酵素（リパーゼが特異的）上昇、画像（CT（computed tomography：コンピュータ断層撮影）・超音波）。\n重症度（厚生労働省の基準）：予後因子（BE（base excess：塩基過剰）・Ca・BUN/Cr（BUN とクレアチニンの比）・LDH（lactate dehydrogenase：乳酸脱水素酵素）・血小板・CRP（C-reactive protein：C反応性タンパク）・SIRS（systemic inflammatory response syndrome：全身性炎症反応症候群）・年齢 70歳以上など）3点以上、または造影 CT Grade 2 以上で重症。\n原因：アルコール・胆石が多い。ほかに高トリグリセリド血症（1,000 mg/dL 以上）、ERCP 後、高カルシウム血症、薬、自己免疫性、膵腫瘍（IPMN（intraductal papillary mucinous neoplasm：膵管内乳頭粘液性腫瘍）・膵癌）。\n合併症：膵仮性嚢胞・被包化壊死（感染したら内視鏡でドレナージ・ネクロセクトミー、発症4週以降が目安）、腹部コンパートメント症候群。","tg":[]},{"id":"gi-0c15ad4c","f":"gi","u":21,"o":68,"lv":2,"q":"自己免疫性膵炎（1型）について正しいものはどれか。","ch":["IgG4（immunoglobulin G4：免疫グロブリン G のサブクラス4） が高く、膵臓がびまん性に腫れる（ソーセージ様）","若い女性に多く、急性の激しい腹痛で発症することが多い","膵癌とは画像で必ず区別できるので、生検は不要である","ステロイドは効かないので、手術が第一選択である"],"a":0,"cx":["","中高年の男性に多く、無痛性の黄疸で来ることが多い。","限局型は膵癌とまぎらわしい。超音波内視鏡下の生検などで癌を除く。","ステロイドがよく効く（効くこと自体が診断の助けになる）。"],"core":"1型自己免疫性膵炎＝IgG4 関連疾患の膵病変。高齢男性・閉塞性黄疸・IgG4↑・膵のびまん性腫大と被膜様構造（capsule-like rim）。プレドニゾロン（プレドニン） 0.6 mg/kg/日 で始める。","e":"ほかの IgG4 関連病変：硬化性胆管炎、涙腺・唾液腺炎（Mikulicz 病）、後腹膜線維症、間質性腎炎、大動脈周囲炎。\n病理：リンパ球・形質細胞浸潤、花むしろ状線維化、閉塞性静脈炎、IgG4 陽性形質細胞の増加。\n2型自己免疫性膵炎：若い人、IgG4 は上がらず、好中球の浸潤（顆粒球上皮病変）、潰瘍性大腸炎の合併。\n再燃が多く、少量のステロイドで維持することがある。","tg":[]},{"id":"gi-c1e1b9d7","f":"gi","u":21,"o":69,"lv":2,"q":"膵管内乳頭粘液性腫瘍（IPMN（intraductal papillary mucinous neoplasm：膵管内乳頭粘液性腫瘍））で、手術を勧める「高リスク所見（high-risk stigmata）」はどれか。","ch":["主膵管径 4 mm","主膵管径 10 mm 以上","嚢胞の大きさが1年で変わらない","分枝型で嚢胞径 15 mm"],"a":1,"cx":["主膵管の 5〜9 mm は「懸念される所見（worrisome features）」。4 mm は正常範囲に近い。","","大きさが変わらないことは良い所見。","分枝型で小さい嚢胞は経過観察でよい。"],"core":"IPMN の高リスク所見＝閉塞性黄疸、造影される 5 mm 以上の充実成分（壁在結節）、主膵管 10 mm 以上、（細胞診で悪性疑い）→ 手術。","e":"懸念される所見：嚢胞 30 mm 以上、5 mm 未満の造影される壁在結節、壁の肥厚、主膵管 5〜9 mm、主膵管の急な口径変化と尾側の萎縮、リンパ節腫大、CA19-9（carbohydrate antigen 19-9） 上昇、嚢胞の急な増大、膵炎 → 超音波内視鏡で詳しく見る。\nIPMN は、それ自体の癌化だけでなく、離れた場所に通常型の膵癌ができる（併存癌）ことにも注意。\n膵癌の危険因子：家族歴、糖尿病（とくに新しく出た・急に悪くなった）、慢性膵炎、IPMN、喫煙、肥満、大量飲酒。","tg":[]},{"id":"gi-daae623a","f":"gi","u":21,"o":70,"lv":3,"q":"68歳の男性。2か月で体重が 6 kg 減り、最近、糖尿病の血糖コントロールが急に悪くなった。皮膚と眼球結膜の黄染があり、痛みはない。右季肋部に、痛みのない腫大した胆嚢を触れる。最も考えられる診断はどれか。","ch":["膵頭部癌","急性胆嚢炎","総胆管結石","原発性胆汁性胆管炎"],"a":0,"cx":["","急性胆嚢炎は右上腹部の痛みと発熱、Murphy 徴候。","総胆管結石は痛み・発熱を伴うことが多く、胆嚢は慢性炎症で萎縮していることが多い。","PBC（primary biliary cholangitis：原発性胆汁性胆管炎） は中年女性の慢性の胆汁うっ滞で、胆嚢が腫れることはない。"],"core":"Courvoisier 徴候（痛みのない胆嚢の腫大＋黄疸）＝胆管の下部の悪性閉塞（膵頭部癌・下部胆管癌・乳頭部癌）。新しい糖尿病・体重減少は膵癌のサイン。","e":"検査：造影 CT（膵癌は乏血性で造影されにくい腫瘤）、MRCP（MR cholangiopancreatography：MR 胆管膵管撮影）、超音波内視鏡と穿刺吸引による組織診断、CA19-9（Lewis 抗原陰性の人では上がらない。胆汁うっ滞でも上がる）。\n治療：切除できるか（主要な動脈への浸潤）で決める。術前化学療法（ゲムシタビン（ジェムザール）＋S-1 など）→手術→術後の S-1。切除できなければ FOLFIRINOX（5-FU・ロイコボリン・イリノテカン・オキサリプラチンの併用療法）、ゲムシタビン＋ナブパクリタキセル。\n黄疸には胆道ステント（金属ステント）。\n遺伝性：BRCA1（遺伝性乳癌卵巣癌の原因遺伝子）/2 の生殖細胞系列変異があれば、白金製剤が効いた後の維持療法にオラパリブ（リムパーザ）。","tg":["cs"]},{"id":"gi-faf406be","f":"gi","u":22,"o":71,"lv":3,"q":"22歳の男性。半年前から腹痛と下痢、体重が 6 kg 減った。肛門周囲膿瘍の手術歴がある。Hb 10.8 g/dL、CRP（C-reactive protein：C反応性タンパク） 3.2 mg/dL。大腸内視鏡で回腸末端に縦走潰瘍と敷石像があり、生検で非乾酪性肉芽腫を認めた。治療の説明として正しいものはどれか。","ch":["喫煙を続けると再燃が減る","狭窄や瘻孔は起こらないので画像検査は不要である","直腸から連続する病変なので 5-ASA 注腸だけで治る","禁煙を強く勧める"],"a":3,"cx":["喫煙は Crohn 病を悪化させ、手術・再燃を増やす（潰瘍性大腸炎とは逆）。","Crohn 病は全層性の炎症で、狭窄・瘻孔・膿瘍を起こす。小腸の画像（MR（mineralocorticoid receptor：ミネラルコルチコイド受容体） エンテログラフィ・カプセル内視鏡）も行う。","Crohn 病は非連続性の病変で、全消化管に起こりうる。5-ASA 注腸だけでは不十分。",""],"core":"Crohn 病＝若年・腹痛/下痢/体重減少・肛門病変・回盲部の縦走潰瘍/敷石像・非乾酪性肉芽腫。禁煙が最も大事な生活指導。中等症以上はステロイド・生物学的製剤（抗 TNF（tumor necrosis factor：腫瘍壊死因子）-α・ウステキヌマブ・ベドリズマブ・リサンキズマブなど）、栄養療法。","e":"腸結核との区別：輪状潰瘍・萎縮瘢痕帯、乾酪性肉芽腫、IGRA（interferon-gamma release assay：インターフェロンγ遊離試験）。誤ってステロイド・抗 TNF 抗体を使うと悪化するので必ず除く。\nCrohn 病の栄養療法（成分栄養剤）は寛解導入に有効。\n狭窄にはバルーン拡張・手術、瘻孔・膿瘍には抗菌薬・ドレナージ・手術。\n小腸の病変：ビタミン B12・胆汁酸の吸収不良、胆石、尿路結石（シュウ酸）。","tg":["cs"],"mt":["ibd"]},{"id":"gi-5c1dbad2","f":"gi","u":22,"o":72,"lv":2,"q":"大腸憩室について正しいものはどれか。","ch":["憩室出血は激しい腹痛を伴うのが特徴である","低用量アスピリンや NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） は憩室出血の危険と関係しない","憩室炎はすべて手術が必要である","日本では右側結腸の憩室も多く、憩室出血は自然に止まることが多い"],"a":3,"cx":["憩室出血は痛みのない大量の血便が典型。","NSAIDs・抗血栓薬は憩室出血の危険因子。","多くの憩室炎は抗菌薬（軽症なら抗菌薬なしでも）で治る。膿瘍・穿孔・狭窄では処置や手術。",""],"core":"大腸憩室出血＝高齢者の痛みのない大量の血便。7〜8割は自然に止まるが再出血が多い。造影 CT（computed tomography：コンピュータ断層撮影） で出血部位を見て、大腸内視鏡でクリップ・結紮（EBL（endoscopic band ligation：内視鏡的結紮術））。止まらなければ IVR（interventional radiology：画像下治療）・手術。","e":"日本は右側（上行結腸）の憩室が多かったが、高齢化とともに左側（S 状結腸）も増えている。\n憩室炎：左下腹部（S 状結腸）や右下腹部（虫垂炎と区別）の痛み・発熱、CT で診断。膿瘍は経皮的ドレナージ。\n大量の下部消化管出血のときも、まず上部消化管出血（BUN/Cr（BUN とクレアチニンの比） 上昇）を除く。","tg":[]},{"id":"gi-e170b09c","f":"gi","u":22,"o":73,"lv":3,"q":"70歳の男性。腹部手術の既往がある。昨日から腹部の膨満と間欠的な腹痛、嘔吐があり、排便・排ガスがない。腹部 CT（computed tomography：コンピュータ断層撮影） で小腸が拡張し、径の変化する部位（caliber change）がある。腸管の造影効果は保たれ、腹水はない。まず行う治療として適切なのはどれか。","ch":["下剤を大量に飲ませて、便を出させる","すぐに大腸内視鏡を行い、閉塞部位を確かめる","絶食・輸液・胃管（イレウス管）による減圧","腸の動きを強める薬（消化管運動促進薬）を大量に使う"],"a":2,"cx":["閉塞のある腸に下剤を入れると悪化する。","小腸の癒着性閉塞で、大腸内視鏡は役に立たない。","","閉塞があるのに腸の動きを強めると、穿孔の危険がある。"],"core":"単純性（癒着性）の小腸閉塞＝絶食・輸液（電解質の補正）・減圧（胃管・イレウス管）。水溶性造影剤（ガストログラフイン）の通過で手術の要否を判断することもある。","e":"絞扼性腸閉塞（血流障害）を示すサイン：持続する強い痛み・腹膜刺激症状・発熱・頻脈・乳酸上昇・CT で腸管壁の造影不良・腹水・closed loop → 緊急手術。\n原因：癒着（最多）、ヘルニア（閉鎖孔ヘルニアは高齢のやせた女性）、腫瘍、胆石イレウス、腸重積。\n大腸の閉塞：大腸癌・S 状結腸軸捻転（内視鏡で整復）。\n麻痺性イレウス：術後・電解質異常（低 K）・薬（オピオイド）・腹膜炎。","tg":["cs"]},{"id":"gi-8a459f3c","f":"gi","u":23,"o":74,"lv":3,"q":"45歳の男性。毎日日本酒 5合を20年飲んでいる。2週間前から黄疸と発熱、腹部の膨満が出てきた。肝腫大と圧痛、腹水がある。AST（aspartate aminotransferase） 220 U/L、ALT（alanine aminotransferase） 80 U/L、総ビリルビン 12.5 mg/dL、PT-INR（プロトロンビン時間の国際標準比） 2.0、白血球 18,000/μL。最も考えられる病態はどれか。","ch":["急性 A 型肝炎","原発性胆汁性胆管炎","体質性黄疸（Gilbert 症候群）","アルコール性肝炎（重症）"],"a":3,"cx":["A 型肝炎では AST・ALT が数千まで上がることが多い。AST/ALT 比が2以上で数百程度はアルコール性に典型的。","PBC（primary biliary cholangitis：原発性胆汁性胆管炎） は中年女性の慢性の胆汁うっ滞。急な発熱・白血球増多は合わない。","Gilbert 症候群は間接ビリルビンが軽く上がるだけで、肝障害・凝固異常はない。",""],"core":"アルコール性肝炎＝大量飲酒の人の黄疸・発熱・肝腫大・白血球増多、AST 優位（AST/ALT 2以上、AST は 300〜400 を超えにくい）。重症（Maddrey の判別関数 32以上など）ではステロイドを考える。断酒が最も大事。","e":"AST 優位の理由：アルコールで補酵素のピリドキサールリン酸（ALT に必要）が不足し、ミトコンドリアの AST が漏れる。γ-GTP（γ-glutamyl transpeptidase、γ-GTP）・MCV（mean corpuscular volume：平均赤血球容積） も上がる。\n重症例は感染症（肝硬変の SBP（spontaneous bacterial peritonitis：特発性細菌性腹膜炎）・肺炎）・消化管出血・腎障害（肝腎症候群）で死亡しうる。\n断酒の支援：アルコール依存症の専門治療、家族の支援。\nアルコール性肝障害の段階：脂肪肝→肝炎→線維症→肝硬変（肝癌）。","tg":["cs"]},{"id":"gi-f3615bb9","f":"gi","u":23,"o":75,"lv":2,"q":"体質性黄疸と、上がるビリルビンの組み合わせで正しいものはどれか。","ch":["Dubin-Johnson 症候群 ― 直接ビリルビン（肝臓が黒い）","Gilbert 症候群 ― 直接ビリルビン（絶食で下がる）","Rotor 症候群 ― 間接ビリルビン（肝生検で黒色色素）","Crigler-Najjar 症候群 ― 直接ビリルビン（生後すぐは軽い）"],"a":0,"cx":["","Gilbert 症候群は間接ビリルビンが上がり、絶食・ストレス・感染で悪化する（下がるのではない）。","Rotor 症候群は直接ビリルビンが上がり、肝臓の黒色色素はない（黒いのは Dubin-Johnson）。","Crigler-Najjar 症候群は UGT1A1（ビリルビンを抱合する酵素の遺伝子） が欠けて間接ビリルビンが著しく上がる（I 型は核黄疸）。"],"core":"間接（非抱合型）が上がる＝Gilbert・Crigler-Najjar（UGT1A1（ビリルビンを抱合する酵素の遺伝子） の働きの低下）、溶血。直接（抱合型）が上がる＝Dubin-Johnson（MRP2（multidrug resistance-associated protein 2） の異常・肝臓が黒い）・Rotor、胆汁うっ滞・肝細胞障害。","e":"Gilbert 症候群：人口の数%、絶食・疲労・発熱で軽い黄疸。治療は不要。イリノテカン（UGT1A1 で代謝）の副作用が強く出る（UGT1A1*28・*6 の多型）。\n間接ビリルビン上昇＋貧血・網状赤血球増加・LDH（lactate dehydrogenase：乳酸脱水素酵素） 上昇・ハプトグロビン低下＝溶血。\n直接ビリルビン上昇なら超音波で胆管の拡張（閉塞性黄疸）をまず見る。","tg":[]},{"id":"gi-2688362f","f":"gi","u":23,"o":76,"lv":3,"q":"58歳の女性。健診で肝機能異常を指摘された。飲酒はほとんどしない。BMI（body mass index：体格指数） 29、2型糖尿病。AST（aspartate aminotransferase） 48 U/L、ALT（alanine aminotransferase） 62 U/L、血小板 15万/μL。腹部超音波で脂肪肝。FIB-4（肝線維化の指数、年齢・AST・ALT・血小板） 指数 2.9。次に行う対応として最も適切なのはどれか。","ch":["ウイルス性肝炎として、抗ウイルス薬を開始する","エラストグラフィで肝の硬さを測り、専門医に紹介","脂肪肝は良性なので、肝臓については評価は不要と説明する","線維化を確かめるため、すぐに全例で肝生検を行う"],"a":1,"cx":["ウイルス性ではない（B 型・C 型を除いたうえで）。","","MASLD（metabolic dysfunction-associated steatotic liver disease：代謝機能障害関連脂肪性肝疾患） は線維化が進むと肝硬変・肝癌・心血管病の危険が上がる。FIB-4 が高い人は放置しない。","まず非侵襲的な検査（エラストグラフィ）で絞り込み、必要な人に生検を考える。"],"core":"MASLD（metabolic dysfunction-associated steatotic liver disease：代謝機能障害関連脂肪性肝疾患） の線維化の評価：FIB-4 が 1.3 未満なら低リスク（かかりつけで管理）、1.3 以上（とくに 2.67 以上）ならエラストグラフィ（Fibroscan・MR（mineralocorticoid receptor：ミネラルコルチコイド受容体） エラストグラフィ）→ 高ければ専門医。糖尿病の人は進みやすい。","e":"治療の基本は減量（7〜
