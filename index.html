ス）・アトバコン。","e":"予防：プレドニゾロン 20 mg/日以上を4週以上使う人、免疫抑制薬の併用、高齢、肺病変などでは ST 合剤（週3回〜毎日の少量）の予防投与を考える。\nST 合剤の副作用：皮疹、骨髄抑制、高カリウム、腎機能（クレアチニンの見かけの上昇）、低ナトリウム、メトトレキサートとの併用で骨髄抑制（治療中は MTX（methotrexate：メトトレキサート） を止める）。\n診断：誘発喀痰・BAL（bronchoalveolar lavage：気管支肺胞洗浄） の PCR（polymerase chain reaction）・染色。PCR 陽性は定着のこともあり、臨床像と合わせて判断する。","tg":["cs"],"mt":["pneumonia"]},{"id":"inf-4500bb59","f":"inf","u":117,"o":349,"lv":3,"q":"45歳の男性。腎移植から3か月後。発熱・倦怠感・下痢があり、白血球減少と肝酵素の上昇がある。予防の抗ウイルス薬は1か月前に終了していた。血中の CMV（cytomegalovirus：サイトメガロウイルス） 抗原血症（または CMV-DNA）が高い。最も適切な治療はどれか。","ch":["抗菌薬（セフトリアキソン（ロセフィン））だけ","ガンシクロビル（バルガンシクロビル（バリキサ））","アシクロビル（ゾビラックス）の低用量内服","オセルタミビル（タミフル）の内服"],"a":1,"cx":["ウイルス感染で、抗菌薬は効かない。","","アシクロビルは CMV にはほとんど効かない。","オセルタミビルはインフルエンザの薬。"],"core":"サイトメガロウイルス感染症＝移植後（とくに1〜3か月、予防終了後）・HIV（CD4（CD4 陽性 T 細胞、ヘルパー T 細胞） 50 未満）・ステロイド大量で起こる。発熱・白血球/血小板減少・肝炎・腸炎・肺炎・網膜炎。治療はガンシクロビル（骨髄抑制）・バルガンシクロビル、耐性にはホスカルネット（腎障害・電解質異常）。","e":"予防：造血幹細胞移植後はレテルモビル（プレバイミス）、臓器移植後はバルガンシクロビル、または CMV のウイルス量を監視して上がれば治療（先制治療）。\nCMV 腸炎は潰瘍性大腸炎の治療抵抗性の原因にもなる。\n新生児の先天性 CMV 感染症：難聴の原因。","tg":["cs"],"mt":["pneumonia"]},{"id":"er-359eed55","f":"er","u":118,"o":350,"lv":2,"q":"成人の心停止で、心電図が心室細動のときの対応として正しいものはどれか。","ch":["胸骨圧迫は1分間に60回のテンポで、深さ 2 cm を目安にする","ショックの後、脈を10秒以上かけて確かめてから胸骨圧迫","アドレナリン（ボスミン、自己注射はエピペン）を投与するまで、電気ショックは行わない","すぐ電気ショック、すぐ胸骨圧迫を2分"],"a":3,"cx":["胸骨圧迫は1分間に100〜120回、深さ約 5 cm（6 cm を超えない）、圧迫の中断を最小にする。","ショックの後は脈を確かめず、すぐに胸骨圧迫を再開する（2分後にリズム確認）。","VF（ventricular fibrillation：心室細動） には電気ショックが最優先。アドレナリンは2回目のショックの後に。",""],"core":"VF（ventricular fibrillation：心室細動）/無脈性 VT（ventricular tachycardia：心室頻拍）＝電気ショック→すぐ胸骨圧迫2分→リズム確認。2回目のショックの後にアドレナリン 1 mg（3〜5分ごと）、3回目のショックの後にアミオダロン（アンカロン） 300 mg（2回目は 150 mg）。","e":"心静止・無脈性電気活動（PEA（pulseless electrical activity：無脈性電気活動））：電気ショックの適応ではない。胸骨圧迫とできるだけ早いアドレナリン。原因（治せるもの）を探す：\n・5H：低酸素・循環血液量減少・アシドーシス（H⁺）・高/低カリウム・低体温\n・5T：緊張性気胸・心タンポナーデ・中毒・肺塞栓・冠動脈血栓\n質の高い胸骨圧迫：圧迫の割合 60% 以上、毎回の胸郭の戻りを待つ、2分ごとに交代。\n呼気終末 CO₂（ETCO（呼気終末二酸化炭素、ETCO₂）₂）の波形：気管チューブの位置の確認、胸骨圧迫の質、自己心拍再開の目安（急な上昇）。\nJMECC（日本内科学会認定内科救急・ICLS（Immediate Cardiac Life Support） 講習会）は内科専門研修で必須。","tg":[],"fig":["acls"],"mt":["shock"]},{"id":"er-c973709f","f":"er","u":118,"o":351,"lv":2,"q":"心停止から自己心拍が再開した後の管理として正しいものはどれか。","ch":["低血圧があっても、昇圧薬は使わない","高濃度の酸素を長く続け、PaO₂ をできるだけ高く保つ","24時間以内に神経学的な予後を判定し、治療を止めるか決める","昏睡なら発熱を防ぐ体温管理、ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 上昇なら冠動脈造影"],"a":3,"cx":["平均血圧 65 mmHg 以上などを目標に、輸液と昇圧薬で臓器の灌流を保つ。","高すぎる酸素は害になりうる。SpO₂ 92〜98% を目標に下げる。","予後の判定は早すぎると誤る。72時間以上たってから、複数の方法（診察・脳波・画像・血液のマーカー）で行う。",""],"core":"心拍再開後症候群の管理：酸素化（SpO₂ 92〜98%）・換気（正常の PaCO₂）・血圧の維持、ST 上昇（または心原性が強く疑われる）なら冠動脈造影、昏睡なら体温管理（少なくとも 72時間は発熱を防ぐ。32〜36℃の管理も選択肢）、けいれんの治療、血糖の管理。","e":"原因の検索：急性冠症候群、肺塞栓、大動脈解離、くも膜下出血（頭部 CT（computed tomography：コンピュータ断層撮影））、電解質、中毒。\n予後が悪い所見（72時間以降）：瞳孔・角膜反射の消失、ミオクローヌス重積、脳波の平坦・バーストサプレッション、NSE（neuron-specific enolase：神経特異エノラーゼ） 高値、CT/MRI（magnetic resonance imaging：磁気共鳴画像） の広い低酸素性脳症。\n院外心停止の予後を良くするもの：目撃者による心肺蘇生、早い AED（automated external defibrillator：自動体外式除細動器）。","tg":[],"fig":["ecg","coronary"]},{"id":"er-6e84e9d3","f":"er","u":119,"o":352,"lv":2,"q":"ショックの分類と所見の組み合わせで正しいものはどれか。","ch":["閉塞性ショック ― 頸静脈怒張・心タンポナーデや緊張性気胸・肺塞栓","血液分布異常性ショック ― 皮膚が冷たく湿り、心拍出量は著しく低い","循環血液量減少性ショック ― 頸静脈が怒張し、下大静脈が拡張する","心原性ショック ― 下大静脈は虚脱し、肺はきれいである"],"a":0,"cx":["","血液分布異常性（敗血症・アナフィラキシー・神経原性）は初期には手足が温かく、心拍出量はむしろ高いことが多い（warm shock）。","循環血液量減少（出血・脱水）では頸静脈・下大静脈は虚脱する。","心原性ショックでは心臓に血液がたまり、下大静脈の拡張・肺うっ血が起こる。"],"core":"ショックの4分類：循環血液量減少性（出血・脱水）、心原性（心筋梗塞・不整脈・弁膜症）、閉塞性（タンポナーデ・緊張性気胸・肺塞栓）、血液分布異常性（敗血症・アナフィラキシー・脊髄損傷・副腎不全）。エコーで素早く区別する（RUSH など）。","e":"ショックの徴候：低血圧（収縮期 90 未満か普段より 40 以上の低下）、頻脈、意識の変化、皮膚の冷汗・蒼白・毛細血管再充満時間の延長、尿量減少、乳酸上昇。\nショック指数＝心拍数÷収縮期血圧。1.0 を超えるとかなりの出血（循環血液量の約 30%）を示唆。\n神経原性ショック（頸髄・高位胸髄損傷）：低血圧に徐脈を伴う。\n高齢者・β遮断薬内服中は頻脈が出にくい。","tg":[],"mt":["shock"]},{"id":"er-191d3065","f":"er","u":119,"o":353,"lv":2,"q":"意識障害の初期対応として正しいものはどれか。","ch":["頭部 CT（computed tomography：コンピュータ断層撮影） の結果が出るまで、血糖は測らない","原因は必ず脳の病気なので、頭部 MRI（magnetic resonance imaging：磁気共鳴画像） だけを行う","ABC を確かめ、すぐに血糖を測る","酸素飽和度が保たれていれば、呼吸の評価は不要である"],"a":2,"cx":["低血糖は数分で測れて、すぐ治せる。CT を待たない。","意識障害の原因は脳以外（低血糖・電解質・肝/腎不全・中毒・感染症・ショック・低酸素/CO₂ ナルコーシス）も多い。","","CO₂ ナルコーシスは SpO₂ が保たれていても起こる（とくに酸素投与中）。血液ガスで PaCO₂ を確かめる。"],"core":"意識障害＝ABC → 血糖 → 原因の検索（AIUEOTIPS：Alcohol・Insulin（低/高血糖）・Uremia・Encephalopathy/Electrolytes/Endocrine・Opiate/O₂/CO₂・Trauma/Temperature・Infection・Psychiatric/Porphyria・Stroke/Seizure/Shock/Syncope）。","e":"意識レベルの評価：JCS（3-3-9 度方式）、GCS（開眼 E4・言語 V5・運動 M6、合計 3〜15、8 以下は気道確保を考える）。\n低血糖の対応：50% ブドウ糖 20〜40 mL 静注。アルコール依存・低栄養が疑われればビタミン B1 を先に（同時に）。SU（sulfonylurea：スルホニル尿素） 薬による低血糖は遷延・再発しやすく、入院で観察する。\n瞳孔：両側の縮瞳＝オピオイド・有機リン・橋出血、散瞳＝抗コリン薬・交感神経刺激薬・低酸素脳症、片側の散瞳＝脳ヘルニア（動眼神経）。","tg":[],"mt":["emergency_dx"]},{"id":"er-d915a6a1","f":"er","u":119,"o":354,"lv":3,"q":"22歳の女性。満員電車で立っていたところ、気分が悪くなり、目の前が暗くなって倒れ、数十秒で意識が戻った。倒れる前に冷汗と吐き気があった。けいれん・尿失禁はない。心電図・血圧の起立試験は正常で、心疾患の既往・家族歴はない。最も考えられる診断と対応の組み合わせはどれか。","ch":["血管迷走神経性失神 ― 誘因を避ける指導","脳梗塞 ― 静注の血栓溶解療法を行う","心原性失神 ― 緊急の植込み型除細動器","てんかん発作 ― 抗てんかん薬を開始する"],"a":0,"cx":["","失神（一過性の全脳の血流低下）は脳卒中とは違い、神経症状は残らない。","前ぶれ（冷汗・吐き気）があり、長い立位という典型的な誘因があり、心電図・心疾患の既往・家族歴がない。心原性は考えにくい。","意識はすぐ戻り、けいれん・尿失禁・発作後のもうろう状態がない。"],"core":"血管迷走神経性失神＝長い立位・痛み・恐怖・人混みなどの誘因、前ぶれ（冷汗・吐き気・視野が暗くなる）、すぐ回復。予後は良好。危険な失神（心原性）を見逃さないことが大事。","e":"心原性を疑うサイン：運動中・臥位での失神、前ぶれのない突然の失神、動悸の先行、心疾患（心不全・弁膜症・肥大型心筋症）、若い突然死の家族歴、心電図異常（QT（QT 間隔、心室の興奮の始まりから回復まで） 延長・Brugada 型・WPW（Wolff-Parkinson-White）・房室ブロック・洞停止）。→ 入院・心電図モニター・心エコー。\n起立性低血圧による失神：立ち上がった直後、脱水・出血・薬（降圧薬・利尿薬・α遮断薬）・自律神経障害（Parkinson 病・糖尿病）。\n状況失神：排尿・排便・咳・嚥下で起こる。\n指導：前ぶれでしゃがむ・横になる、足を組んで力を入れる（physical counterpressure maneuver）、水分と塩分。","tg":["cs"]},{"id":"er-1c6390d4","f":"er","u":120,"o":355,"lv":1,"q":"中毒の原因と解毒薬（拮抗薬）の組み合わせで正しいものはどれか。","ch":["オピオイド ― フルマゼニル（静注）","ベンゾジアゼピン ― ナロキソン","アセトアミノフェン（カロナール） ― 硫酸アトロピン","有機リン ― アトロピンと PAM（pralidoxime：プラリドキシム、有機リン中毒の解毒薬）"],"a":3,"cx":["オピオイドの拮抗薬はナロキソン（作用が短く、再び呼吸が抑えられることがある）。","ベンゾジアゼピンの拮抗薬はフルマゼニル（けいれんの危険があり、常用者・三環系の同時服用では慎重に）。","アセトアミノフェンの解毒薬は N-アセチルシステイン（アセチルシステイン内用液）。",""],"core":"主な解毒薬：有機リン＝アトロピン（気道分泌が乾くまで）＋PAM、アセトアミノフェン＝N-アセチルシステイン（アセチルシステイン内用液）、オピオイド＝ナロキソン、ベンゾジアゼピン＝フルマゼニル、メタノール・エチレングリコール＝ホメピゾール（透析も）、シアン＝ヒドロキソコバラミン（シアノキット、シアン中毒）、一酸化炭素＝高濃度酸素（高気圧酸素）、ジゴキシン（ジゴシン）＝抗ジゴキシン抗体、ワルファリン（ワーファリン）＝ビタミン K・プロトロンビン複合体、三環系抗うつ薬＝炭酸水素ナトリウム、メトヘモグロビン血症＝メチレンブルー、Ca 拮抗薬・β遮断薬＝カルシウム・グルカゴン・高用量インスリン。","e":"有機リン（コリンエステラーゼ阻害）の症状：ムスカリン様（縮瞳・流涎・気道分泌・徐脈・下痢・尿失禁＝SLUDGE）、ニコチン様（線維束性収縮・筋力低下・呼吸筋麻痺）。血清コリンエステラーゼの低下。\n医療者は防護具をつけて二次被害を防ぐ（衣服を脱がせて除染）。\n中間症候群：数日後の呼吸筋・近位筋・脳神経の麻痺。","tg":["ae"],"fig":["coag"],"mt":["antidote"]},{"id":"er-a24f9637","f":"er","u":120,"o":356,"lv":3,"q":"35歳の男性。冬、締め切った部屋で練炭を燃やしているところを発見された。頭痛と吐き気があり、意識はもうろうとしている。パルスオキシメータで SpO₂ 98%（室内気）。最も適切な対応はどれか。","ch":["まず鎮静薬で落ち着かせてから、帰宅させる","COHb（carboxyhemoglobin：一酸化炭素ヘモグロビン） を測り、高濃度酸素（重症は高気圧酸素）","SpO₂ が 98% なので、酸素投与は不要である","利尿薬で、一酸化炭素の排泄を促す"],"a":1,"cx":["意識障害がある CO 中毒で帰宅させてはいけない。遅発性の神経症状もある。","","一般のパルスオキシメータは COHb（carboxyhemoglobin：一酸化炭素ヘモグロビン） を酸素化ヘモグロビンと区別できず、SpO₂ が見かけ上高く出る。","CO は呼吸で出る。利尿薬は役に立たない。"],"core":"一酸化炭素中毒＝SpO₂ は正常に見える。CO-オキシメトリー（血液ガス）で COHb を測る。100% 酸素で半減期が約 300分→約 60〜90分に短くなる。意識障害・妊婦・心筋障害などでは高気圧酸素療法を考える。","e":"症状：頭痛・吐き気・めまい→意識障害・けいれん・心筋障害。皮膚の「鮮紅色」は実際には少ない。\n間欠型（遅発性）CO 中毒：いったん回復して数日〜数週後に、認知症・パーキンソン症状・無言無動。淡蒼球の病変。\n火災ではシアン中毒も合併しうる（乳酸の著明な上昇）→ ヒドロキソコバラミン（シアノキット、シアン中毒）。\n自殺目的の場合は精神科と連携する。","tg":["ae","cs"],"mt":["emergency_dx","antidote"]},{"id":"er-3baf382f","f":"er","u":120,"o":357,"lv":3,"q":"28歳の女性。うつ病でアミトリプチリン（トリプタノール）を処方されている。大量に飲んで2時間後に搬送された。意識障害、散瞳、皮膚の乾燥、頻脈 136/分、血圧 84/50 mmHg。心電図で QRS（QRS 波、心室の興奮） 幅 0.14 秒。最も適切な治療はどれか。","ch":["β遮断薬の静注","フルマゼニル（アネキセート）の静注","炭酸水素ナトリウムの静注","プロカインアミド（アミサリン）の静注"],"a":2,"cx":["β遮断薬は低血圧を悪化させる。","フルマゼニルはベンゾジアゼピンの拮抗薬。三環系の中毒ではけいれんを誘発するので禁忌に近い。","","Ia 群の抗不整脈薬は Na チャネルをさらに遮断し、QRS を広げて悪化させる。"],"core":"三環系抗うつ薬中毒＝抗コリン症状（散瞳・皮膚の乾燥・頻脈・尿閉・腸蠕動の低下）＋Na チャネル遮断（QRS 幅の拡大・心室性不整脈・低血圧）＋けいれん。QRS 0.10 秒以上なら炭酸水素ナトリウム（血液をアルカリにし、ナトリウムを負荷）。","e":"心電図：QRS の拡大、aVR の R 波の増高（3 mm 以上）。\nけいれんにはベンゾジアゼピン。\n活性炭は意識・気道を確保してから（誤嚥に注意）。\n抗コリン症候群の覚え方：「hot as a hare（発熱）, dry as a bone（乾燥）, red as a beet（紅潮）, blind as a bat（散瞳）, mad as a hatter（せん妄）」。\n透析では除けない（蛋白結合・分布容積が大きい）。","tg":["ae","cs"],"fig":["ecg"],"mt":["antidote"]},{"id":"er-4f697e05","f":"er","u":120,"o":358,"lv":2,"q":"リチウム中毒について正しいものはどれか。","ch":["活性炭がよく吸着するので、活性炭だけで治療できる","脱水・NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）・ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬）/ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬で濃度が上がり、透析で除ける","リチウムは肝臓で代謝されるので、腎機能の影響を受けない","血中濃度は、中毒の症状と全く関係しない"],"a":1,"cx":["リチウムは活性炭に吸着されない（金属イオン）。","","リチウムはほぼすべて腎臓から出るので、腎機能・脱水の影響を強く受ける。","濃度は目安になる（慢性中毒では濃度が低めでも症状が重いことがある）。"],"core":"リチウム中毒＝振戦・失調・意識障害・けいれん、吐き気・下痢、腎性尿崩症、甲状腺機能低下、心電図異常。治療は輸液（生理食塩水）、重症（高濃度・意識障害・腎障害）は血液透析。","e":"濃度を上げる薬：NSAIDs、ARB/ACE 阻害薬、サイアザイド系利尿薬（ループ利尿薬も）、脱水・減塩。\n長期の副作用：腎性尿崩症、慢性腎臓病、甲状腺機能低下症、副甲状腺機能亢進症（高カルシウム）。\n透析で除ける中毒の例：リチウム、メタノール・エチレングリコール、サリチル酸、バルプロ酸（大量）、テオフィリン（テオドール）、カルバマゼピン（高性能膜）。","tg":["ae"],"fig":["ecg"],"mt":["antidote","thyroid"]},{"id":"er-daa37715","f":"er","u":121,"o":359,"lv":3,"q":"78歳の女性。独居でエアコンを使っていなかった。8月の猛暑日に自宅で倒れているのを発見された。体温（深部）41.2℃、意識障害（GCS（Glasgow Coma Scale） 9）、皮膚は乾燥。血圧 92/50 mmHg、クレアチニン 2.4 mg/dL、CK（creatine kinase：クレアチンキナーゼ） 5,600 U/L、血小板 6 万/μL。最も適切な治療はどれか。","ch":["意識が戻るまで経過を見て、冷却はしない","解熱薬（アセトアミノフェン（カロナール））だけで体温を下げる","水分は誤嚥の危険があるので、輸液はしない","急いで冷却し、輸液と臓器障害の治療を行う"],"a":3,"cx":["冷却の遅れが予後を悪くする。できるだけ早く 38℃台まで下げる。","熱中症は体温調節の中枢が壊れた状態ではなく熱の蓄積で、解熱薬（体温の設定点を下げる薬）は効かない。","脱水・横紋筋融解・腎障害があり、輸液は必須。",""],"core":"重症熱中症（III 度）＝中枢神経症状・肝/腎障害・DIC（disseminated intravascular coagulation：播種性血管内凝固）。迅速な冷却（目標は 38℃台、早いほど良い）、輸液、臓器障害の治療。古典的熱中症（高齢者・持病・暑い室内）と労作性熱中症（若い人・運動）がある。","e":"日本の分類：I 度（めまい・こむら返り・大量の汗）→ その場で冷やし水分・塩分、II 度（頭痛・吐き気・倦怠感）→ 医療機関で輸液、III 度（意識障害・けいれん・臓器障害）→ 入院・集中治療。2024年の改訂で、III 度のうち重いものを IV 度（深部体温 40℃以上・GCS 8 以下）とする分類が示された。\n冷却の方法：蒸散冷却（霧吹き＋送風）、冷水浸漬（労作性の若い人で最も速い）、氷嚢、冷却ブランケット、血管内冷却・胃洗浄。\n合併症：横紋筋融解・急性腎障害、DIC、肝障害（数日後にピーク）。\n悪性高熱症（吸入麻酔薬・スキサメトニウム→ダントロレン（ダントリウム））・悪性症候群・甲状腺クリーゼ・セロトニン症候群・抗コリン中毒も高体温の原因。","tg":["cs"]},{"id":"er-9f389c3c","f":"er","u":121,"o":360,"lv":2,"q":"偶発性低体温症について正しいものはどれか。","ch":["低体温の人は、乱暴に動かしても不整脈は起こらない","30℃未満では心室細動が起こりやすく、愛護的に扱う","体温が低くても、心停止なら通常の蘇生とまったく同じでよい","心停止の低体温症は、蘇生を直ちに中止する"],"a":1,"cx":["乱暴な体位変換・移動で心室細動が誘発される。","","低体温の心停止では、薬が効きにくく、電気ショックも効きにくいことがある。復温しながら蘇生を続ける（ECMO（extracorporeal membrane oxygenation：体外式膜型人工肺） による復温）。","「温めてから死亡と判断せよ（not dead until warm and dead）」。低体温は脳を守るので、長い蘇生でも回復した例がある。"],"core":"偶発性低体温症（深部体温 35℃未満）：軽度 32〜35℃（震え）、中等度 28〜32℃（震えが止まる・意識低下）、高度 28℃未満（心室細動・心停止の危険）。心電図の Osborn 波（J 波）。","e":"復温：受動的（毛布）→ 能動的な体表（加温ブランケット）→ 能動的な中心部（加温輸液・加温加湿酸素・体腔の洗浄・ECMO（extracorporeal membrane oxygenation：体外式膜型人工肺）・透析）。高度の低体温・心停止は ECMO が最も有効。\n復温中の注意：after drop（末梢の冷たい血液が戻って体温がさらに下がる）、復温ショック（血管拡張で血圧低下）、高カリウム（予後不良の指標）。\n原因：寒冷の環境、アルコール・薬、低血糖、甲状腺機能低下、副腎不全、敗血症、高齢者。","tg":[],"fig":["ecg","acls"]},{"id":"er-88fec476","f":"er","u":121,"o":361,"lv":3,"q":"19歳の男性。前日に部活動で長時間の筋力トレーニングをした。今朝から筋肉痛が強く、コーラ色の尿が出た。CK（creatine kinase：クレアチンキナーゼ） 48,000 U/L、尿潜血 3+ だが尿沈渣の赤血球はほとんどない。血清 K 5.4 mEq/L、クレアチニン 1.3 mg/dL。まず行う治療はどれか。","ch":["NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） で筋肉痛を抑えて、帰宅させる","血液透析を、すぐに全例で行う","大量の細胞外液で尿量を多く保つ","ループ利尿薬だけを使い、輸液は控える"],"a":2,"cx":["NSAIDs は腎障害を悪化させる。入院での輸液が必要。","透析は輸液で治らない高カリウム・体液過剰・腎不全のとき。","","輸液をせずに利尿薬だけでは脱水が進み、腎障害が悪くなる。"],"core":"横紋筋融解症＝ミオグロビン尿（尿潜血陽性なのに赤血球がない）・CK 著明高値。早期の大量輸液でミオグロビンを洗い流し、急性腎障害を防ぐ。高カリウム・低カルシウム・高リン・コンパートメント症候群に注意。","e":"原因：激しい運動、長時間の圧迫（意識障害で倒れていた・クラッシュ症候群）、熱中症、薬（スタチン＋フィブラート、抗精神病薬の悪性症候群）、アルコール、てんかん重積、低カリウム・低リン、感染症（インフルエンザ・レジオネラ）、遺伝性の代謝性ミオパチー。\n初期の低カルシウムは、症状がなければ補わない（あとで高カルシウムになる）。\nコンパートメント症候群：激痛・他動伸展で痛む・腫脹 → 筋膜切開。","tg":["cs"],"mt":["potassium"]},{"id":"er-fa3197e4","f":"er","u":121,"o":362,"lv":2,"q":"セロトニン症候群と悪性症候群の違いとして正しいものはどれか。","ch":["セロトニン症候群では、高度の筋強剛と徐脈が特徴である","悪性症候群の治療薬は、シプロヘプタジン（ペリアクチン）である","セロトニン症候群は数時間で起こり、ミオクローヌスが目立つ","悪性症候群は、SSRI（selective serotonin reuptake inhibitor：選択的セロトニン再取り込み阻害薬） の増量の直後に数時間で起こることが多い"],"a":2,"cx":["高度の鉛管様筋強剛は悪性症候群の特徴。セロトニン症候群は頻脈が多い。","シプロヘプタジンはセロトニン症候群の治療薬。悪性症候群はダントロレン（ダントリウム）・ブロモクリプチン。","","悪性症候群は抗精神病薬（ドパミン遮断）の開始・増量や、抗パーキンソン病薬の急な中止で、数日かけて起こる。"],"core":"セロトニン症候群＝セロトニン作動薬（SSRI・SNRI（serotonin-noradrenaline reuptake inhibitor：セロトニン・ノルアドレナリン再取り込み阻害薬）・トラマドール・リネゾリド・トリプタン・MAO（monoamine oxidase：モノアミン酸化酵素） 阻害薬など）の併用・増量の数時間後。精神状態の変化・自律神経症状（発汗・頻脈・下痢）・神経筋症状（ミオクローヌス・腱反射亢進・クローヌス、下肢に強い）。原因薬の中止・ベンゾジアゼピン・シプロヘプタジン。","e":"悪性症候群：抗精神病薬（制吐薬のメトクロプラミド（プリンペラン）も）・抗パーキンソン病薬の中止。高熱・鉛管様筋強剛・意識障害・自律神経症状・CK（creatine kinase：クレアチンキナーゼ） 上昇。原因薬の中止（パーキンソン病では再開）、冷却・輸液、ダントロレン（ダントリウム）、ブロモクリプチン（パーロデル）。\n悪性高熱症：吸入麻酔薬・スキサメトニウムで手術中に急な高体温・筋強剛・高 CO₂。ダントロレン。","tg":["ae"]},{"id":"er-a5623a36","f":"er","u":121,"o":363,"lv":2,"q":"アルコール離脱症候群について正しいものはどれか。","ch":["振戦せん妄は、命にかかわることはない","離脱症状は、最後の飲酒から2週間たってから初めて出る","治療は抗精神病薬だけで、ベンゾジアゼピンは使ってはならない","6〜24時間で振戦、48〜96時間で振戦せん妄が起こりうる"],"a":3,"cx":["振戦せん妄（DT（delirium tremens：振戦せん妄））は死亡しうる（自律神経の嵐・脱水・電解質異常・誤嚥）。","離脱症状は飲酒をやめて数時間〜1日で始まる。","アルコール離脱の第一選択はベンゾジアゼピン（抗精神病薬はけいれんの閾値を下げる）。",""],"core":"アルコール離脱：6〜24時間＝振戦・発汗・不安・頻脈、12〜48時間＝離脱けいれん、48〜96時間＝振戦せん妄（幻視・見当識障害・高熱・頻脈）。ベンゾジアゼピン（症状に応じて）、ビタミン B1、電解質（Mg・K・P）と栄養の補正。","e":"Wernicke 脳症の予防のため、ブドウ糖の前（同時）にビタミン B1。\nアルコール性ケトアシドーシス：大量飲酒の後の嘔吐・飢餓、血糖は正常〜軽い上昇、β-ヒドロキシ酪酸が主（尿ケトンの試験紙では弱く出る）。輸液・ブドウ糖・B1 で治る。\nアルコール依存症の断酒の薬：アカンプロサート（レグテクト）、ジスルフィラム・シアナミド（抗酒薬）、飲酒量を減らすナルメフェン（セリンクロ）。","tg":[]},{"id":"er-b08afd8e","f":"er","u":122,"o":364,"lv":3,"q":"70歳の男性。めまいで搬送された。意識はもうろう、血圧 70/40 mmHg、脈拍 32/分。心電図は完全房室ブロック。アトロピン 0.5 mg を静注したが改善しない。次に行うべき治療はどれか。","ch":["経過観察し、翌日に外来で心電図を再検する","アトロピンを 10 mg 一度に静注する","経皮ペーシング（かカテコールアミン静注）","β遮断薬を静注して、心筋の酸素消費を減らす"],"a":2,"cx":["ショックを伴う徐脈は緊急。","アトロピンは 1 mg ずつ（総量 3 mg まで）。His 束以下の障害には効きにくい。","","β遮断薬は徐脈を悪化させる。"],"core":"症状のある徐脈（ショック・意識障害・心不全・胸痛）＝アトロピン → 効かなければ経皮ペーシング、ドパミン・アドレナリンの持続静注 → 経静脈ペーシング → 恒久的ペースメーカ。","e":"原因を探す：急性心筋梗塞（とくに下壁）、高カリウム血症、薬（β遮断薬・Ca 拮抗薬・ジゴキシン）、低体温、甲状腺機能低下、睡眠時無呼吸。\nβ遮断薬・Ca 拮抗薬の中毒：グルカゴン・カルシウム・高用量インスリン療法。\n頻脈で不安定（ショック・意識障害）なら同期下カルディオバージョン。","tg":["cs"],"fig":["conduct"]},{"id":"er-f00c649f","f":"er","u":123,"o":365,"lv":3,"q":"30歳の女性。3時間前から心窩部痛があり、徐々に右下腹部に移ってきた。吐き気と 37.8℃の発熱がある。McBurney 点に圧痛と反跳痛がある。最初に確かめるべき検査はどれか。","ch":["腹部の単純X線だけで手術を決める","妊娠反応（尿 hCG）","大腸内視鏡検査","上部消化管造影"],"a":1,"cx":["単純X線では虫垂炎の診断は難しい。超音波・CT（computed tomography：コンピュータ断層撮影） を使う。","","急性虫垂炎が疑われる時期の大腸内視鏡は穿孔の危険があり、行わない。","上部消化管造影は虫垂炎の診断に役立たない。"],"core":"妊娠可能な年齢の女性の腹痛＝まず妊娠反応（異所性妊娠の破裂は命にかかわる・CT（computed tomography：コンピュータ断層撮影） の被ばくの判断）。そのうえで超音波・CT。","e":"急性虫垂炎：心窩部痛→右下腹部への痛みの移動、食欲低下、発熱、McBurney 点の圧痛。Alvarado スコア。CT で腫大した虫垂・糞石。治療は手術か抗菌薬（合併症のない例）。\n女性の右下腹部痛の鑑別：異所性妊娠、卵巣嚢腫の茎捻転・出血、骨盤内炎症性疾患（クラミジア・淋菌、Fitz-Hugh-Curtis 症候群）、子宮内膜症。\n高齢者の虫垂炎は症状が軽く、穿孔して見つかることが多い。","tg":["cs"]},{"id":"er-dcff36fe","f":"er","u":123,"o":366,"lv":3,"q":"84歳の男性。抗凝固薬（ワルファリン（ワーファリン））を飲んでいる。黒色便が2日前から続き、今朝ふらついて倒れた。血圧 84/50 mmHg、脈拍 118/分、Hb 6.4 g/dL、PT-INR（プロトロンビン時間の国際標準比） 4.8。最初に行う対応として適切なのはどれか。","ch":["循環を保ち、ワルファリンを中和し、緊急内視鏡","黒色便なので、まず大腸内視鏡を行う","ワルファリンを続けたまま、内視鏡は1週間後に行う","輸血は、Hb 10 g/dL になるまで急速に大量に行う"],"a":0,"cx":["","黒色便は上部消化管出血が多い。まず上部内視鏡。","出血性ショックで、ワルファリンの過量（INR（international normalized ratio：国際標準比） 4.8）がある。中止・中和が必要。","過剰な輸血は避ける（目安は Hb 7〜8 程度、心疾患があればやや高め）。"],"core":"抗凝固薬内服中の大出血＝原因の薬の中止、中和（ワルファリン＝プロトロンビン複合体製剤＋ビタミン K、ダビガトラン（プラザキサ）＝イダルシズマブ（プリズバインド）、Xa 阻害薬＝アンデキサネット アルファ（オンデキサ）など）、輸液・輸血、出血源の止血（内視鏡）。","e":"止血を確かめたら、血栓症の危険と出血の危険を比べて、抗凝固薬の再開時期を決める（多くは1〜2週以内）。\nワルファリンの効果を強める：抗菌薬・アゾール系・アミオダロン・食事量の低下（ビタミン K 不足）。弱める：リファンピシン（リファジン）・カルバマゼピン・納豆・青汁。\n上部消化管出血には PPI（proton pump inhibitor：プロトンポンプ阻害薬） 静注。","tg":["cs"],"fig":["coag"]},{"id":"er-fba6fef6","f":"er","u":124,"o":367,"lv":3,"q":"45歳の男性。自宅で倒れているのを発見された。そばに農薬の容器がある。縮瞳・流涎・大量の気道分泌・徐脈・筋線維束性収縮があり、尿便失禁がある。SpO₂ 86%。最初に行う治療として適切なのはどれか。","ch":["アトロピンは、徐脈が治ったらすぐにやめる","ベンゾジアゼピン中毒としてフルマゼニル（アネキセート）を静注","除染し、気道確保とアトロピン反復・PAM（pralidoxime：プラリドキシム、有機リン中毒の解毒薬）","オピオイド中毒としてナロキソンを静注"],"a":2,"cx":["アトロピンの目標は気道分泌が乾くこと（心拍数ではない）。大量に必要なことがある。","フルマゼニルはベンゾジアゼピンの拮抗薬。","","ナロキソンはオピオイドの拮抗薬。縮瞳は共通だが、大量の分泌・線維束性収縮は有機リンを示す。"],"core":"有機リン中毒＝コリンエステラーゼ阻害でアセチルコリンが過剰。ムスカリン様症状（縮瞳・分泌・徐脈・下痢）とニコチン様症状（線維束性収縮・筋力低下・呼吸筋麻痺）。気道確保、アトロピン（分泌が乾くまで）、PAM（プラリドキシム（パム））。","e":"医療者は手袋・ガウンで二次被害を防ぎ、衣服を除去して皮膚を洗う。\n死因は呼吸不全（気道分泌・気管支攣縮・呼吸筋麻痺）。\nカーバメート系も同じ症状だが、可逆的で回復が早い（PAM の意義は低い）。\nサリン（地下鉄サリン事件）も同じ機序。\nパラコート（除草剤）：肺線維症で死亡、酸素投与は肺障害を悪化させうる。","tg":["ae","cs"],"mt":["antidote"]},{"id":"er-d708d178","f":"er","u":124,"o":368,"lv":2,"q":"メタノール・エチレングリコール中毒について正しいものはどれか。","ch":["活性炭が非常によく吸着し、活性炭だけで治療できる","治療は利尿薬だけで十分である","アニオンギャップは正常で、浸透圧ギャップも正常である","AG（anion gap：アニオンギャップ） と浸透圧ギャップが開き、ホメピゾールと透析"],"a":3,"cx":["アルコール類は活性炭にほとんど吸着されない。","利尿薬では除けない。代謝を止める薬（ホメピゾール）と透析。","毒性のある代謝物（ギ酸・グリコール酸・シュウ酸）でアニオンギャップが開き、もとのアルコールで浸透圧ギャップが開く。",""],"core":"メタノール＝視力障害（視神経・網膜、「吹雪の中にいるよう」）・代謝性アシドーシス。エチレングリコール（不凍液）＝腎障害・シュウ酸カルシウム結晶尿・低カルシウム。治療：アルコール脱水素酵素を止めるホメピゾール（なければエタノール）、血液透析。","e":"浸透圧ギャップ＝実測の血漿浸透圧－計算値（2×Na＋血糖/18＋BUN（blood urea nitrogen：血中尿素窒素）/2.8）。10 を超えると、アルコール類などの浸透圧物質を疑う。\nメタノールにはホリナート（葉酸）でギ酸の代謝を促す。エチレングリコールにはビタミン B1・B6。\nイソプロパノール（消毒用アルコール）：浸透圧ギャップは開くがアシドーシスは起こさない（アセトンになる）。","tg":["ae"],"fig":["acidbase"]},{"id":"er-2c2119c0","f":"er","u":124,"o":369,"lv":3,"q":"6月、山で作業中の48歳の男性がマムシに右手を咬まれた。1時間後、咬まれた所から前腕まで腫れが広がり、痛みが強い。目がかすみ、物が二重に見える。対応として正しいものはどれか。","ch":["入院で経時的に評価し、重症なら抗毒素を使う","腫れが手だけなので、帰宅させてよい","上腕をきつく縛って、数時間そのままにする","咬まれた所を切開して、口で毒を吸い出す"],"a":0,"cx":["","腫れは数時間〜1日かけて広がる。複視（眼筋麻痺）もあり、入院での観察が必要。","強い緊縛は組織の障害を悪化させる。手足を心臓の高さに保ち、安静にして搬送する。","切開・吸引は勧められない（組織を傷め感染を増やす）。"],"core":"マムシ咬傷＝咬傷部の腫れ・痛み・皮下出血が体幹に向かって広がる、横紋筋融解・急性腎障害・血小板減少・DIC（disseminated intravascular coagulation：播種性血管内凝固）、複視（日本のマムシに特徴的）。腫れの広がりで重症度を判断し、重症ならマムシ抗毒素（ウマ血清：アナフィラキシーに注意）、セファランチン。破傷風の予防。","e":"ヤマカガシ：毒牙が奥にあり、腫れはほとんどないのに、数時間後から凝固障害・出血（DIC）・腎障害。ヤマカガシ抗毒素。\nハブ（南西諸島）：局所の腫れと壊死、抗毒素。\nスズメバチ：アナフィラキシー（2回目以降に多い）、大量に刺されると毒そのもので横紋筋融解・腎障害。\n破傷風：咬傷・汚染された傷では破傷風トキソイド（接種歴によって破傷風免疫グロブリンも）。","tg":["cs"]},{"id":"er-d8682638","f":"er","u":124,"o":370,"lv":3,"q":"82歳の女性。1月、自宅で長時間倒れていた。入浴後に動けなくなったらしい。来院時、深部体温 29.2℃、意識障害、脈拍 38/分、血圧 82/50 mmHg。心電図で J 波（Osborn 波）。正しい対応はどれか。","ch":["愛護的に扱い、加温輸液などで積極的に復温する","体を激しくこすって、急いで温める","脈が触れていても、すぐに胸骨圧迫を始める","心停止に移ったら、薬を3分ごとに無制限に使う"],"a":0,"cx":["","乱暴な扱い・こすることで心室細動を誘発しうる。","脈が触れて循環があれば胸骨圧迫は不要（むしろ心室細動を誘発しうる）。","30℃未満では薬の効果が乏しく蓄積するので、薬・電気ショックの回数を控える考え方がある。復温を優先する。"],"core":"中等度〜高度の偶発性低体温症（30℃前後）＝愛護的な扱い、モニター、加温輸液（40〜42℃）・加温加湿酸素・加温ブランケット。循環が不安定・心停止なら ECMO（extracorporeal membrane oxygenation：体外式膜型人工肺） による復温。","e":"高齢者の冬の入浴関連の事故（ヒートショック）、屋内での低体温症は日本で多い。\n低体温の原因として、低血糖・甲状腺機能低下・副腎不全・敗血症・薬（睡眠薬）・アルコールを考える。\n寒冷利尿で脱水になっていることが多い。\n血清カリウムが著しく高い（12 mEq/L 超など）心停止は予後が非常に悪い。","tg":["cs"],"fig":["acls"]}];
const FIGS={"ecg":{"t":"心電図の波形の名前と意味。PR は房室伝導、QRS は心室の興奮、QT は心室の興奮から回復までの時間。ST の上昇・低下は虚血や心膜炎で見る。","s":"<svg viewBox=\"0 0 600 400\" role=\"img\" aria-label=\"心電図の波形\"><defs><marker id=\"ra\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--ink)\"/></marker><marker id=\"rr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--maru)\"/></marker></defs><text class=\"L\" x=\"300\" y=\"28\" text-anchor=\"middle\"><tspan x=\"300\" dy=\"0\">心電図の波形と、それぞれの意味</tspan></text><path class=\"ln d\" d=\"M30 200 L570 200\"/><path d=\"M30 200 L80 200 Q100 165 120 200 L150 200 L160 218 L172 70 L186 236 L198 200 L250 200 Q285 140 320 200 L345 200 Q357 186 369 200 L570 200\" fill=\"none\" stroke=\"var(--maru)\" stroke-width=\"3\"/><path class=\"ln\" d=\"M97 112.05 L100 182\"/><circle class=\"dot\" cx=\"100\" cy=\"182\" r=\"4\"/><text class=\"M\" x=\"8\" y=\"118\" text-anchor=\"start\"><tspan x=\"8\" dy=\"0\">P 波：</tspan><tspan x=\"8\" dy=\"1.25em\">心房の興奮</tspan></text><path class=\"ln\" d=\"M196 58.05 L174 78\"/><circle class=\"dot\" cx=\"174\" cy=\"78\" r=\"4\"/><text class=\"M\" x=\"200\" y=\"64\" text-anchor=\"start\"><tspan x=\"200\" dy=\"0\">QRS 波：心室の興奮（R 波の頂点）</tspan></text><path class=\"ln\" d=\"M326 114.05 L290 160\"/><circle class=\"dot\" cx=\"290\" cy=\"160\" r=\"4\"/><text class=\"M\" x=\"330\" y=\"120\" text-anchor=\"start\"><tspan x=\"330\" dy=\"0\">T 波：心室の回復（再分極）</tspan></text><path class=\"ln\" d=\"M396 166.75 L360 194\"/><circle class=\"dot\" cx=\"360\" cy=\"194\" r=\"4\"/><text class=\"S\" x=\"400\" y=\"172\" text-anchor=\"start\"><tspan x=\"400\" dy=\"0\">U 波（低 K で目立つ）</tspan></text><path class=\"ln\" d=\"M225 156.0 L225 198\"/><circle class=\"dot\" cx=\"225\" cy=\"198\" r=\"4\"/><text class=\"S\" x=\"215\" y=\"150\" text-anchor=\"start\"><tspan x=\"215\" dy=\"0\">ST 部分</tspan></text><path class=\"ln\" d=\"M80 250 L160 250\" marker-start=\"url(#ra)\" marker-end=\"url(#ra)\"/><text class=\"S\" x=\"120\" y=\"272\" text-anchor=\"middle\"><tspan x=\"120\" dy=\"0\">PR 間隔</tspan></text><path class=\"ln\" d=\"M160 300 L198 300\" marker-start=\"url(#ra)\" marker-end=\"url(#ra)\"/><text class=\"S\" x=\"179\" y=\"322\" text-anchor=\"middle\"><tspan x=\"179\" dy=\"0\">QRS 幅</tspan></text><path class=\"ln\" d=\"M160 350 L320 350\" marker-start=\"url(#ra)\" marker-end=\"url(#ra)\"/><text class=\"S\" x=\"240\" y=\"372\" text-anchor=\"middle\"><tspan x=\"240\" dy=\"0\">QT 間隔</tspan></text><rect class=\"bx\" x=\"350\" y=\"236\" width=\"240\" height=\"150\" rx=\"10\"/><text class=\"S\" x=\"470.0\" y=\"279.5\" text-anchor=\"middle\"><tspan x=\"470.0\" dy=\"0\">PR：0.12〜0.20 秒</tspan><tspan x=\"470.0\" dy=\"1.25em\">（延長＝房室ブロック）</tspan><tspan x=\"470.0\" dy=\"1.25em\">QRS：0.12 秒未満</tspan><tspan x=\"470.0\" dy=\"1.25em\">（広い＝脚ブロック・心室性）</tspan><tspan x=\"470.0\" dy=\"1.25em\">QT：心拍で補正（QTc）</tspan></text></svg>"},"conduct":{"t":"刺激伝導系の順番と、障害される場所ごとの病名。房室結節の障害は予後が良く、His 束より下の障害はペースメーカが必要になりやすい。","s":"<svg viewBox=\"0 0 600 475\" role=\"img\" aria-label=\"刺激伝導系\"><defs><marker id=\"ra\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--ink)\"/></marker><marker id=\"rr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--maru)\"/></marker></defs><text class=\"L\" x=\"300\" y=\"28\" text-anchor=\"middle\"><tspan x=\"300\" dy=\"0\">刺激伝導系と、障害されたときの病名</tspan></text><rect class=\"ax\" x=\"40\" y=\"55\" width=\"280\" height=\"56\" rx=\"10\"/><text class=\"M\" x=\"180.0\" y=\"89.0\" text-anchor=\"middle\"><tspan x=\"180.0\" dy=\"0\">洞結節（60〜100/分）</tspan></text><rect class=\"ax\" x=\"40\" y=\"135\" width=\"280\" height=\"56\" rx=\"10\"/><text class=\"M\" x=\"180.0\" " refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--ink)\"/></marker><marker id=\"rr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--maru)\"/></marker></defs><text class=\"L\" x=\"300\" y=\"28\" text-anchor=\"middle\"><tspan x=\"300\" dy=\"0\">低ナトリウム血症の考え方</tspan></text><rect class=\"bx\" x=\"20\" y=\"45\" width=\"290\" height=\"44\" rx=\"10\"/><text class=\"M\" x=\"165.0\" y=\"73.0\" text-anchor=\"middle\"><tspan x=\"165.0\" dy=\"0\">① 血漿浸透圧は低いか</tspan></text><path class=\"ln\" d=\"M310 67 L325 67\"/><text class=\"S\" x=\"330\" y=\"62\" text-anchor=\"start\"><tspan x=\"330\" dy=\"0\">正常・高い → 高血糖、</tspan></text><text class=\"S\" x=\"330\" y=\"82\" text-anchor=\"start\"><tspan x=\"330\" dy=\"0\">偽性（高脂血症・高蛋白）</tspan></text><path class=\"ln\" d=\"M165 89 L165 110\" marker-end=\"url(#ra)\"/><rect class=\"bx\" x=\"20\" y=\"110\" width=\"290\" height=\"44\" rx=\"10\"/><text class=\"M\" x=\"165.0\" y=\"138.0\" text-anchor=\"middle\"><tspan x=\"165.0\" dy=\"0\">② 尿浸透圧 100 未満か</tspan></text><path class=\"ln\" d=\"M310 132 L325 132\"/><text class=\"S\" x=\"330\" y=\"127\" text-anchor=\"start\"><tspan x=\"330\" dy=\"0\">未満 → 水のとりすぎ</tspan></text><text class=\"S\" x=\"330\" y=\"147\" text-anchor=\"start\"><tspan x=\"330\" dy=\"0\">（多飲・ビール・溶質不足）</tspan></text><path class=\"ln\" d=\"M165 154 L165 175\" marker-end=\"url(#ra)\"/><rect class=\"bx\" x=\"20\" y=\"175\" width=\"290\" height=\"44\" rx=\"10\"/><text class=\"M\" x=\"165.0\" y=\"203.0\" text-anchor=\"middle\"><tspan x=\"165.0\" dy=\"0\">③ 体液量（と尿中 Na）</tspan></text><path class=\"ln\" d=\"M110 219 L100 250\" marker-end=\"url(#ra)\"/><path class=\"ln\" d=\"M165 219 L300 250\" marker-end=\"url(#ra)\"/><path class=\"ln\" d=\"M250 219 L500 250\" marker-end=\"url(#ra)\"/><rect class=\"hx\" x=\"10\" y=\"250\" width=\"180\" height=\"150\" rx=\"10\"/ .mynote .mn-imgs{display:flex;flex-wrap:wrap;gap:8px}
.mynote .mn-im{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.mynote .mn-im img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.mynote .mn-im button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:26px;padding:0;cursor:pointer}
.mynote .mn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mynote .mn-add{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--acc);color:var(--acc);background:transparent;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer}
.mynote .mn-add input{display:none}
.mynote .mn-st{font-size:12px;color:var(--muted)}
.mn-zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;cursor:zoom-out}
.mn-zoom img{max-width:100%;max-height:100%;object-fit:contain}
.mn-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mn-tools label{cursor:pointer}
.mn-tools input{display:none}`;

  function db() {
    if (!dbp) dbp = new Promise((ok, ng) => {
      const r = indexedDB.open(DBN, 1);
      r.onupgradeneeded = () => r.result.createObjectStore("notes");
      r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error);
    });
    return dbp;
  }
  async function tx(mode, fn) {
    const d = await db();
    return new Promise((ok, ng) => { const t = d.transaction("notes", mode); const s = t.objectStore("notes"); const p = Promise.resolve(fn(s)); t.oncomplete = () => p.then(ok, ng); t.onerror = () => ng(t.error); t.onabort = () => ng(t.error); });
  }
  const req = r => new Promise((ok, ng) => { r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error); });
  const get = id => tx("readonly", s => req(s.get(id)));
  const put = (id, v) => tx("readwrite", s => { s.put(v, id); });
  const del = id => tx("readwrite", s => { s.delete(id); });
  /* 2つの読み出しを同時に出す（await をはさむと、途中で取引が閉じるブラウザがある） */
  const all = () => tx("readonly", s => Promise.all([req(s.getAllKeys()), req(s.getAll())]).then(([ks, vs]) => ks.map((k, i) => [k, vs[i]])));

  const saveIdx = () => { try { localStorage.setItem(IDXK, JSON.stringify(idx)); } catch (e) {} };
  function setIdx(id, v) { const has = !!(v && ((v.text || "").trim() || (v.imgs || []).length)); if (has) idx[id] = 1; else delete idx[id]; saveIdx(); return has; }

  /* 画像を縮小して JPEG の Blob にする（長い辺を最大1600px） */
  function shrink(file) {
    return new Promise((ok, ng) => {
      const url = URL.createObjectURL(file); const im = new Image();
      im.onload = () => {
        const k = Math.min(1, MAXW / Math.max(im.naturalWidth, im.naturalHeight));
        const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob(b => b ? ok(b) : ng(new Error("画像を変換できませんでした")), "image/jpeg", QUAL);
      };
      im.onerror = () => { URL.revokeObjectURL(url); ng(new Error("この画像は読み込めませんでした")); };
      im.src = url;
    });
  }

  function zoom(src) {
    const z = document.createElement("div"); z.className = "mn-zoom"; z.innerHTML = `<img src="${src}" alt="メモの画像（拡大）">`;
    z.addEventListener("click", () => z.remove()); document.body.appendChild(z);
  }

  async function mount(el) {
    if (el.dataset.mnOn) return; el.dataset.mnOn = "1";
    const id = el.dataset.q; let v = { text: "", imgs: [], ts: 0 };
    try { v = Object.assign(v, await get(id) || {}); } catch (e) {}
    const urls = [];
    const draw = () => {
      urls.forEach(u => URL.revokeObjectURL(u)); urls.length = 0;
      el.classList.toggle("has", !!((v.text || "").trim() || v.imgs.length));
      el.innerHTML = `<div class="mn-h"><span>自分メモ</span><small>${v.ts ? "保存：" + new Date(v.ts).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "この端末にだけ保存されます"}</small></div>
        <textarea placeholder="覚えたいこと・まちがえた理由・教科書のページなどを書けます" aria-label="この問題の自分メモ">${esc(v.text || "")}</textarea>
        <div class="mn-imgs">${v.imgs.map((b, i) => { const u = URL.createObjectURL(b); urls.push(u); return `<div class="mn-im"><img src="${u}" alt="メモの画像${i + 1}" data-i="${i}"><button type="button" aria-label="この画像を消す" data-del="${i}">×</button></div>`; }).join("")}</div>
        <div class="mn-row"><label class="mn-add">＋ 画像を追加<input type="file" accept="image/*" multiple></label><span class="mn-st" aria-live="polite"></span></div>`;
      const ta = el.querySelector("textarea"), st = el.querySelector(".mn-st");
      /* メモの入力中に、アプリの答えのキー（1〜4・O・X・Enter など）が反応しないようにする */
      ta.addEventListener("keydown", e => e.stopPropagation());
      let tm = null;
      ta.addEventListener("input", () => { v.text = ta.value; st.textContent = "保存中…"; clearTimeout(tm); tm = setTimeout(save, 500); });
      ta.addEventListener("blur", () => { if (tm) { clearTimeout(tm); save(); } });
      async function save() { tm = null; v.ts = Date.now(); try { if (setIdx(id, v)) await put(id, v); else await del(id); st.textContent = "保存しました"; el.classList.toggle("has", !!idx[id]); } catch (e) { st.textContent = "保存できませんでした（空き容量を確認してください）"; } }
      el.querySelector("input[type=file]").addEventListener("change", async e => {
        const fs = Array.from(e.target.files || []); if (!fs.length) return; st.textContent = "画像を保存中…";
        try { for (const f of fs) v.imgs.push(await shrink(f)); v.text = ta.value; v.ts = Date.now(); setIdx(id, v); await put(id, v); draw(); el.querySelector(".mn-st").textContent = fs.length + "枚の画像を保存しました"; }
        catch (err) { st.textContent = err.message || "画像を保存できませんでした"; }
      });
      el.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
        if (!confirm("この画像を消しますか？")) return;
        v.imgs.splice(+b.dataset.del, 1); v.text = ta.value; v.ts = Date.now();
        try { if (setIdx(id, v)) await put(id, v); else await del(id); } catch (e) {} draw();
      }));
      el.querySelectorAll(".mn-im img").forEach(im => im.addEventListener("click", () => zoom(im.src)));
    };
    draw();
  }

  function scan(root) { (root || document).querySelectorAll(".mynote:not([data-mn-on])").forEach(mount); }

  /* ---- 書き出し・読み込み（機種変更やブラウザのデータ消去に備える） ---- */
  const b64 = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });
  async function exportAll() {
    const rows = await all(); const out = [];
    for (const [k, v] of rows) out.push({ id: k, text: v.text || "", ts: v.ts || 0, imgs: await Promise.all((v.imgs || []).map(b64)) });
    const blob = new Blob([JSON.stringify({ app: DBN, v: 1, notes: out })], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = DBN + "-" + new Date().toISOString().slice(0, 10) + ".json"; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return out.length;
  }
  async function importFile(file) {
    const j = JSON.parse(await file.text()); if (!j || !Array.isArray(j.notes)) throw new Error("メモのファイルではありません");
    let n = 0;
    for (const r of j.notes) {
      const imgs = await Promise.all((r.imgs || []).map(u => fetch(u).then(x => x.blob())));
      const cur = await get(r.id);
      /* すでにメモがあるときは、新しい方を残す */
      if (cur && (cur.ts || 0) > (r.ts || 0)) continue;
      const v = { text: r.text || "", imgs, ts: r.ts || Date.now() };
      if (setIdx(r.id, v)) { await put(r.id, v); n++; }
    }
    return n;
  }
  /* ホームに置く道具（件数・書き出し・読み込み）。onChange で画面を描き直す */
  function tools(onChange) {
    const wrap = document.createElement("div"); wrap.className = "mn-tools";
    wrap.innerHTML = `<button type="button" class="btn sub" data-mn="exp">メモを書き出す（保存用ファイル）</button><label class="btn sub">メモを読み込む<input type="file" accept="application/json,.json"></label><span class="mn-st mini"></span>`;
    const st = wrap.querySelector(".mn-st");
    wrap.querySelector("[data-mn=exp]").addEventListener("click", async () => { try { const n = await exportAll(); st.textContent = n + "問分のメモを書き出しました"; } catch (e) { st.textContent = "書き出せませんでした"; } });
    wrap.querySelector("input").addEventListener("change", async e => { const f = e.target.files[0]; if (!f) return; try { const n = await importFile(f); st.textContent = n + "問分のメモを読み込みました"; if (onChange) setTimeout(onChange, 800); } catch (err) { st.textContent = err.message || "読み込めませんでした"; } });
    return wrap;
  }

  return {
    init(name) {
      DBN = name; IDXK = name + "-idx";
      try { idx = JSON.parse(localStorage.getItem(IDXK) || "{}") || {}; } catch (e) { idx = {}; }
      const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);
      /* ブラウザに「消さないで」と頼む（ホーム画面のアプリでは通常そのまま残る） */
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
      new MutationObserver(() => scan()).observe(document.body, { childList: true, subtree: true });
      /* 記録の一覧を IndexedDB から作り直す（localStorage が消えた場合の保険） */
      all().then(rows => { idx = {}; rows.forEach(([k, v]) => setIdx(k, v)); }).catch(() => {});
      scan();
    },
    slot: id => `<div class="mynote" data-q="${esc(id)}"></div>`,
    ids: () => Object.keys(idx),
    has: id => !!idx[id],
    count: () => Object.keys(idx).length,
    tools
  };
})();

/* ---------- 問題の移動バーと問題一覧：3つの学習アプリで共通の部品 ----------
   問題画面の進み具合のバー（.qhead のすぐ後ろの .meter）を、指でなぞって問題を移動できるようにする。
   バーを長押し、または「一覧」ボタンで、問題の一覧（○×・まだ）を開き、タップでその問題へ移動する。
   QNav.init({ state: () => ({ n, cur, status: ["ok"|"mid"|"ng"|"", ...], text: k => "問題文" }) | null, jump: k => {...}, mark: (k, g) => {...} })
   state は問題画面のときだけ値を返す（それ以外は null）。画面の描き直しは MutationObserver で検出する。
   mark を渡すと、一覧の各行に ○・△・× のボタンが出て、評価を付け直せる（復習の予定 srs.js に反映する）。 */
const QNav = (() => {
  let OPT = null, sheet = null;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const plain = s => String(s || "").replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
  const css = `
.qn-wrap{position:relative;padding:10px 0;margin:-10px 0;touch-action:pan-y}
.qn-wrap .meter{position:relative}
.qn-range{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);width:100%;height:34px;margin:0;opacity:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.qn-knob{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--card,#fff);border:3px solid var(--acc,#1f6b5c);box-shadow:0 1px 3px rgba(0,0,0,.25);pointer-events:none}
.qn-tip{position:absolute;bottom:100%;transform:translateX(-50%);margin-bottom:6px;background:var(--ink,#222);color:var(--card,#fff);font-size:12px;line-height:1.4;border-radius:8px;padding:4px 8px;white-space:nowrap;max-width:70vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none;display:none;z-index:5}
.qn-wrap.drag .qn-tip{display:block}
.qn-btn{border:1px solid var(--line,#ccc);background:var(--card,#fff);color:var(--ink,#222);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;cursor:pointer;line-height:1.6}
.qn-sheet{position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.qn-panel{background:var(--card,#fff);color:var(--ink,#222);width:100%;max-width:640px;max-height:82vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -4px 20px rgba(0,0,0,.2)}
.qn-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line,#ddd)}
.qn-head b{font-size:16px}
.qn-head small{color:var(--muted,#666);font-size:12px;display:block}
.qn-close{border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;color:var(--muted,#666);padding:4px 8px}
.qn-list{overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 8px 16px}
.qn-item{display:grid;grid-template-columns:44px 28px 1fr;align-items:center;gap:6px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line,#eee);background:transparent;color:inherit;padding:10px 8px;font-size:14px;line-height:1.5;cursor:pointer}
.qn-row{display:flex;align-items:center;border-bottom:1px solid var(--line,#eee)}
.qn-row .qn-item{border-bottom:0;flex:1;min-width:0}
.qn-row.cur{background:var(--acc-soft,#e1efeb);border-radius:8px}
.qn-row.cur .qn-item{background:transparent}
.qn-marks{display:flex;gap:4px;padding-right:6px;flex:none}
.qn-mk{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line,#ccc);background:var(--card,#fff);font-size:16px;font-weight:900;line-height:1;cursor:pointer;color:var(--muted,#888);padding:0}
.qn-mk.ok.on{background:var(--maru,#cf3b2a);border-color:var(--maru,#cf3b2a);color:#fff}
.qn-mk.mid.on{background:var(--sankaku,#d08a12);border-color:var(--sankaku,#d08a12);color:#fff}
.qn-mk.ng.on{background:var(--batsu,#46566a);border-color:var(--batsu,#46566a);color:#fff}
.qn-item .st.mid{color:var(--sankaku,#d08a12)}
.qn-item:hover{background:var(--paper,#f6f6f6)}
.qn-item.cur{background:var(--acc-soft,#e1efeb);border-radius:8px}
.qn-item .no{font-weight:700;color:var(--muted,#666);font-variant-numeric:tabular-nums}
.qn-item .st{font-weight:900;font-size:16px;text-align:center}
.qn-item .st.ok{color:var(--maru,#cf3b2a)}
.qn-item .st.ng{color:var(--batsu,#46566a)}
.qn-item .st.no{color:var(--line,#bbb)}
.qn-item .tx{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qn-legend{display:flex;gap:12px;font-size:12px;color:var(--muted,#666);padding:6px 16px 0}`;

  function status() { try { return OPT && OPT.state(); } catch (e) { return null; } }
  /* バーの背景を、1問ずつ ○（赤）・×（灰青）・まだ（薄い色）で塗り分ける */
  function paint(meter, st) {
    const n = st.n, seg = [];
    for (let k = 0; k < n; k++) {
      const c = st.status[k] === "ok" ? "var(--maru,#cf3b2a)" : st.status[k] === "ng" ? "var(--batsu,#46566a)" : st.status[k] === "mid" ? "var(--sankaku,#d08a12)" : "transparent";
      seg.push(`${c} ${(k / n * 100).toFixed(3)}% ${((k + 1) / n * 100).toFixed(3)}%`);
    }
    const i = meter.querySelector("i"); if (i) i.style.opacity = ".35";
    meter.style.backgroundImage = `linear-gradient(90deg,${seg.join(",")})`;
  }
  function place(wrap, st, k) {
    const pos = st.n > 1 ? k / (st.n - 1) * 100 : 50;
    const kn = wrap.querySelector(".qn-knob"), tip = wrap.querySelector(".qn-tip");
    kn.style.left = pos + "%"; tip.style.left = Math.min(85, Math.max(15, pos)) + "%";
    tip.textContent = `${k + 1} / ${st.n}　${plain(st.text(k)).slice(0, 28)}`;
  }

  function enhance() {
    const st = status(); if (!st || !st.n) return;
    const head = document.querySelector(".qhead"); if (!head) return;
    const meter = head.nextElementSibling; if (!meter || !meter.classList.contains("meter") || meter.dataset.qn) return;
    meter.dataset.qn = "1";
    const wrap = document.createElement("div"); wrap.className = "qn-wrap";
    meter.parentNode.insertBefore(wrap, meter); wrap.appendChild(meter);
    wrap.insertAdjacentHTML("beforeend", `<span class="qn-knob" aria-hidden="true"></span><span class="qn-tip" aria-hidden="true"></span><input class="qn-range" type="range" min="1" max="${st.n}" step="1" value="${st.cur + 1}" aria-label="問題を移動（左右にずらす。長押しで一覧）">`);
    paint(meter, st); place(wrap, st, st.cur);
    if (!head.querySelector(".qn-btn")) head.insertAdjacentHTML("beforeend", `<button type="button" class="qn-btn" aria-label="問題の一覧を開く">一覧</button>`);
    head.querySelector(".qn-btn").addEventListener("click", open);
    const r = wrap.querySelector(".qn-range");
    let timer = null, moved = false, startX = 0;
    r.addEventListener("pointerdown", e => { moved = false; startX = e.clientX; clearTimeout(timer); timer = setTimeout(() => { if (!moved) { wrap.classList.remove("drag"); r.value = st.cur + 1; place(wrap, st, st.cur); open(); } }, 550); });
    r.addEventListener("pointermove", e => { if (Math.abs(e.clientX - startX) > 6) { moved = true; clearTimeout(timer); } });
    ["pointerup", "pointercancel", "pointerleave"].forEach(t => r.addEventListener(t, () => clearTimeout(timer)));
    /* 長押しで出るメニュー（iPhone）を出さない */
    r.addEventListener("contextmenu", e => { e.preventDefault(); clearTimeout(timer); open(); });
    r.addEventListener("input", () => { moved = true; clearTimeout(timer); wrap.classList.add("drag"); place(wrap, st, +r.value - 1); });
    r.addEventListener("change", () => { wrap.classList.remove("drag"); const k = +r.value - 1; if (k !== st.cur) OPT.jump(k); });
    /* キー操作が答えのキー（1〜4 など）に化けないようにする */
    r.addEventListener("keydown", e => e.stopPropagation());
  }

  function close() { if (sheet) { sheet.remove(); sheet = null; document.body.style.overflow = ""; } }
  const SYM = { ok: "○", mid: "△", ng: "×" };
  function listHtml(st) {
    const cnt = g => st.status.filter(s => s === g).length;
    const ok = cnt("ok"), mid = cnt("mid"), ng = cnt("ng"), canMark = !!OPT.mark;
    const rows = Array.from({ length: st.n }, (_, k) => {
      const s = st.status[k] || "";
      const item = `<button type="button" class="qn-item ${!canMark && k === st.cur ? "cur" : ""}" data-k="${k}"><span class="no">${k + 1}</span><span class="st ${s || "no"}">${SYM[s] || "－"}</span><span class="tx">${esc(plain(st.text(k)).slice(0, 80))}</span></button>`;
      if (!canMark) return item;
      return `<div class="qn-row ${k === st.cur ? "cur" : ""}">${item}<span class="qn-marks" role="group" aria-label="${k + 1}問目の評価">${["ok", "mid", "ng"].map(g => `<button type="button" class="qn-mk ${g} ${s === g ? "on" : ""}" data-k="${k}" data-g="${g}" aria-pressed="${s === g}" aria-label="${k + 1}問目を${{ ok: "○（できた）", mid: "△（あいまい）", ng: "×（まちがい）" }[g]}にする">${SYM[g]}</button>`).join("")}</span></div>`;
    }).join("");
    return `<div class="qn-panel"><div class="qn-head"><div><b>問題の一覧（全${st.n}問）</b><small>○ ${ok}・△ ${mid}・× ${ng}・まだ ${st.n - ok - mid - ng}　${canMark ? "問題文をタップで移動、右の○△×で評価を変更" : "タップでその問題へ"}</small></div><button type="button" class="qn-close" aria-label="閉じる">×</button></div>
      <div class="qn-legend"><span><b style="color:var(--maru,#cf3b2a)">○</b> できた</span><span><b style="color:var(--sankaku,#d08a12)">△</b> あいまい</span><span><b style="color:var(--batsu,#46566a)">×</b> まちがい</span><span><b style="color:var(--line,#bbb)">－</b> まだ</span></div>
      ${canMark ? `<div class="qn-legend" style="padding-top:2px">評価に合わせて、ホームの「今日の復習」に出ます（×・△は明日。○は明日→3日後→1週間後→2週間後→1か月後と間隔をのばす）。</div>` : ""}
      <div class="qn-list">${rows}</div></div>`;
  }
  function open() {
    const st = status(); if (!st) return; close();
    sheet = document.createElement("div"); sheet.className = "qn-sheet"; sheet.setAttribute("role", "dialog"); sheet.setAttribute("aria-label", "問題の一覧");
    sheet.innerHTML = listHtml(st);
    sheet.addEventListener("click", e => {
      if (e.target === sheet || e.target.closest(".qn-close")) { close(); return; }
      const m = e.target.closest(".qn-mk");
      if (m) {
        const k = +m.dataset.k, g = m.dataset.g;
        OPT.mark(k, g);
        /* 一覧を開いたまま、行の表示と見出しの数を更新する（スクロール位置は保つ） */
        const ns = status(); if (!ns) return;
        const list = sheet.querySelector(".qn-list"), top = list ? list.scrollTop : 0;
        sheet.innerHTML = listHtml(ns);
        const nl = sheet.querySelector(".qn-list"); if (nl) nl.scrollTop = top;
        const b = sheet.querySelector(`.qn-mk[data-k="${k}"][data-g="${g}"]`); if (b) b.focus();
        return;
      }
      const b = e.target.closest(".qn-item"); if (b) { const k = +b.dataset.k; close(); if (k !== st.cur) OPT.jump(k); }
    });
    sheet.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Escape") close(); });
    document.body.appendChild(sheet); document.body.style.overflow = "hidden";
    const cur = sheet.querySelector(".qn-row.cur, .qn-item.cur"); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "center" });
    const c = sheet.querySelector(".qn-close"); if (c) c.focus();
  }

  return {
    init(opt) {
      OPT = opt;
      const s = document.createElement("style"); s.textContent = css; document.head.appendChild(s);
      new MutationObserver(() => enhance()).observe(document.body, { childList: true, subtree: true });
      enhance();
    },
    open, close

})();

/* ---------- 復習の予定（エビングハウスの忘却曲線）：3つの学習アプリで共通の部品 ----------
   問題ごとに ○（できた）・△（あいまい）・×（まちがい）の評価を持ち、次に出す日を決める。
   ○を重ねるほど間隔をのばす：翌日 → 3日後 → 1週間後 → 2週間後 → 1か月後 → 2か月後。
   △と×は翌日にもう一度（×は最初の段階からやり直し、△は段階を進めない）。
   同じ日に評価を付け直したときは、その日の最初の評価の前の段階から計算し直す（一覧で△に直したとき用）。
   hold（SRS.init(保存名, {hold:true})）：復習が残っている間は「復習の日」を進めない。
   前の復習を全部済ませるまで次の日の分は出さず、たまらない（済ませた翌日に次の1日分が出る）。
   予定日は「復習の日」で数えるので、休んだ日の分だけ予定全体が後ろにずれる。SRS.scope(ids) で今ある問題に限る。
   SRS.init(保存名) / SRS.set(id, "ok"|"mid"|"ng") / SRS.grade(id) / SRS.isDue(id) / SRS.dueIds(ids) / SRS.seed(id, ok) */
const SRS = (() => {
  const GAP = [1, 3, 7, 14, 30, 60];
  let KEY = null, D = {}, HOLD = false, C = null, SCOPE = null;
  const css = `
.review{margin:14px 0;padding:14px 16px;border:2px solid var(--maru,#cf3b2a);border-radius:16px;background:var(--card,#fff)}
.review .rvhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.review .rvhead b{font-size:18px}
.review .rvhead small{color:var(--muted,#666);font-size:12px}
.review .rvnum{margin:8px 0 10px;font-size:15px}
.review .rvnum strong{font-size:26px;color:var(--maru,#cf3b2a);margin-right:2px}
.review .rvnote{margin:10px 0 0;font-size:12.5px;line-height:1.7;color:var(--muted,#666)}
.review .btn{width:100%}
.selfmark{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:12px 0 4px;padding:10px 12px;border:1px solid var(--line,#ddd);border-radius:12px;background:var(--card,#fff)}
.selfmark>span{font-size:13px;font-weight:700;margin-right:2px}
.selfmark small{flex-basis:100%;color:var(--muted,#666);font-size:12px}
.smk{border:1.5px solid var(--line,#ccc);background:var(--card,#fff);color:var(--ink,#222);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer;min-height:38px}
.smk.ok.on{background:var(--maru,#cf3b2a);border-color:var(--maru,#cf3b2a);color:#fff}
.smk.mid.on{background:var(--sankaku,#d08a12);border-color:var(--sankaku,#d08a12);color:#fff}
.smk.ng.on{background:var(--batsu,#46566a);border-color:var(--batsu,#46566a);color:#fff}`;
  const day = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const addDays = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return day(d.getTime()); };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(D)); if (C) localStorage.setItem(KEY + "-clock", JSON.stringify(C)); } catch (e) {} };
  /* 復習の日：hold のときは、前の復習が残っている間は進めない（C.v＝復習の日、C.r＝最後に見た本当の日） */
  const pending = () => Object.keys(D).some(id => (!SCOPE || SCOPE.has(id)) && D[id].due <= C.v);
  function vt() {
    const real = day(Date.now());
    if (!HOLD) return real;
    if (!C || !(C.v > 0) || !(C.r > 0) || C.r > real) { C = { v: real, r: real }; save(); return real; }
    if (C.r < real) { while (C.r < real) { C.r = addDays(C.r, 1); if (!pending()) C.v = addDays(C.v, 1); } save(); }
    return C.v;
  }
  function set(id, g) {
    const now = Date.now(), today = day(now), vd = vt();
    const r = D[id] || { st: 0 };
    if (r.t === undefined || day(r.t) !== today) r.base = r.st || 0;   // その日の最初の評価の前の段階
    const b = r.base || 0;
    if (g === "ok") { r.st = Math.min(b + 1, GAP.length); r.due = addDays(vd, GAP[r.st - 1]); }
    else if (g === "mid") { r.st = b; r.due = addDays(vd, 1); }
    else { r.st = 0; r.due = addDays(vd, 1); }
    r.g = g; r.t = now; D[id] = r; save();
  }
  return {
    GAP,
    init(key, opt) { KEY = key; HOLD = !!(opt && opt.hold); try { C = HOLD ? JSON.parse(localStorage.getItem(KEY + "-clock") || "null") : null; } catch (e) { C = null; } try { const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st); } catch (e) {} try { D = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { D = {}; } },
    set,
    scope(ids) { SCOPE = new Set(ids); },
    /* 復習の日（hold でなければ今日）。今日の復習の続きを保存する名前に使う */
    vday: () => vt(),
    /* 本当の日より遅れている日数（前の復習が残っていて止まっている日数） */
    held: () => Math.round((day(Date.now()) - vt()) / 864e5),
    has: id => !!D[id],
    grade: id => (D[id] && D[id].g) || "",
    stage: id => (D[id] && D[id].st) || 0,
    /* 今日（または前から）予定日になっている問題 */
    isDue: id => !!(D[id] && D[id].due <= vt()),
    dueIds(ids) { const t = vt(); return ids.filter(id => D[id] && D[id].due <= t).sort((a, b) => ({ ng: 0, mid: 1, ok: 2 }[D[a].g] - { ng: 0, mid: 1, ok: 2 }[D[b].g]) || D[a].due - D[b].due); },
    /* 明日・1週間以内に予定がある問題の数 */
    upcoming(ids) { const t = vt(), t1 = addDays(t, 1), t7 = addDays(t, 7); let a = 0, w = 0; ids.forEach(id => { const r = D[id]; if (!r || r.due <= t) return; if (r.due <= t1) a++; if (r.due <= t7) w++; }); return { tomorrow: a, week: w }; },
    /* 今日つけた評価か */
    today: id => !!(D[id] && day(D[id].t) === day(Date.now())),
    /* この部品を入れる前の記録（○×だけ）から予定を作る：×は今日、○は3日後 */
    seed(id, ok) { if (D[id]) return; const t = vt(); D[id] = ok ? { st: 1, g: "ok", due: addDays(t, 3), t: 0 } : { st: 0, g: "ng", due: t, t: 0 }; },
    seedRaw(id, r) { if (!D[id]) D[id] = r; },
    /* 次に出す日の説明（「明日」「3日後」など） */
    nextLabel(id) { const r = D[id]; if (!r) return ""; const n = Math.round((r.due - vt()) / 864e5); return n <= 0 ? "今日" : n === 1 ? "明日" : n === 7 ? "1週間後" : n === 14 ? "2週間後" : n === 30 ? "1か月後" : n === 60 ? "2か月後" : n + "日後"; },
    flush: save,
    clear() { D = {}; if (C) C = { v: day(Date.now()), r: day(Date.now()) }; save(); },
    /* 指定した問題の予定だけ消す（分野ごと・1問ごとのリセット） */
    del(ids) { ids.forEach(id => { delete D[id]; }); save(); },
    dump: () => D
  };
})();

/* ---------- 内科専門医 4択（皮膚科4択と同じ流れ：ホーム → ステップ・章・単元 → 1問ずつ → 結果） ---------- */
const MK = ["1", "2", "3", "4", "5"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nl = s => esc(s).replace(/\n/g, "<br>");

const KEY = "naika4-v1";

function saveSes() { if (!S.key) return; store.ses[S.key] = { list: S.list, i: S.i, picked: S.picked, picks: S.picks, results: S.results, label: S.label, ts: Date.now() }; save(); }

const nextNo = v => v.i + 1 + (v.picked !== null && v.i + 1 < v.list.length ? 1 : 0);

/* ---------- 画面 ---------- */
const app = document.getElementById("app");

const todayKey = () => { const d = new Date(SRS.vday()); return "review:" + d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };
/* 復習の予定（エビングハウスの忘却曲線、共通部品 srs.js）。復習が残っている間は次の分をためない */
SRS.init("naika4-srs", { hold: true }); SRS.scope(Q.map(q => q.id));
Object.keys(store.ses).forEach(k => { if (k.startsWith("review:") && k !== todayKey()) delete store.ses[k]; });
/* 「解いていない」状態に戻す：解答ずみの位置から外し、今の位置（次に解く所）に入れ直す */
function unsolveIn(v, set) { if (!v || !Array.isArray(v.list)) return;
  const L = v.list.slice(), P = L.map((_, k) => v.picks ? v.picks[k] : undefined);
  let p = v.i + (v.picked !== null && v.picked !== undefined ? 1 : 0); const mv = [];
  for (let k = L.length - 1; k >= 0; k--) { if (!set.has(L[k])) continue; if (k < p) { mv.unshift(L[k]); L.splice(k, 1); P.splice(k, 1); p--; } else P[k] = undefined; }
  L.splice(p, 0, ...mv); P.splice(p, 0, ...mv.map(() => undefined));
  v.list = L; v.picks = P; v.results = (v.results || []).filter(r => !set.has(r.id));
  if (mv.length) { v.i = Math.min(p, L.length - 1); v.picked = null; } }
function clearIds(ids, keys) { const set = new Set(ids); ids.forEach(id => { delete store.res[id]; }); SRS.del(ids); (keys || []).forEach(k => { delete store.ses[k]; });
  Object.values(store.ses).forEach(v => unsolveIn(v, set));

const ASK = "\n\n本当に消しますか？";

function rate(id, g) { SRS.set(id, g); const r = store.res[id] || { n: 0 }; store.res[id] = { ok: g === "ok", n: r.n || 1 }; save(); }
const markOf = (id, answered) => answered || SRS.today(id) ? SRS.grade(id) : "";

/* 進み具合のバーで問題を移動・長押しで一覧（共通部品 qnav.js） */

/* 絞り込み：薬・副作用と対策の問題／ガイドライン・基準の問題（build.py が tg を付ける） */

const header = () => `<div class="top"><button class="brand" data-act="home" aria-label="ホームへ"><span class="seal">内科</span><span><b>内科専門医 4択</b><small>13分野・ガイドライン・症例・救急</small></span></button>${S.view !== "home" ? `<button class="ghost" data-act="home">ホーム</button>` : ""}</div>`;

const wrongIds = () => KO.filter(q => store.res[q.id] && !store.res[q.id].ok).map(q => q.id);

const keyColor = k => { const m = /:f:(\w+)/.exec(k); return m && FIELDS[m[1]] ? FIELDS[m[1]].color : "var(--acc)"; };

/* 3ステップ（基本→標準→実戦）。どのステップの中も教科書の順（基礎→検査→各疾患）。8割で次へ */

  r.readAsText(f); });
function selfMarkHtml(id) {
  const g = SRS.grade(id), lab = { ok: "○ できた", mid: "△ あいまい", ng: "× まちがい" };
  return `<div class="selfmark" role="group" aria-label="この問題の評価"><span>この問題の評価</span>${["ok", "mid", "ng"].map(k => `<button type="button" class="smk ${k} ${g === k ? "on" : ""}" data-act="smark" data-g="${k}" aria-pressed="${g === k}">${lab[k]}</button>`).join("")}<small>次は${SRS.nextLabel(id)}の「今日の復習」に出ます（○を続けるほど間隔がのびます）</small></div>`;
}
function end() {
  const n = S.results.length, ok = S.results.filter(r => r.ok).length; const miss = S.results.filter(r => !r.ok);
  const msg = ok === n ? "全問正解！ この調子で次へ。" : n && ok / n >= .8 ? "8割をこえています。まちがえた所だけ、もう一度見ておきましょう。" : "だいじょうぶ。「ここだけ読めば大丈夫」を読んで、もう一度解けば必ず覚えられます。";
  app.innerHTML = header() + `<section class="end">
    <span class="qhead">${esc(S.label)} の結果</span>
    <div class="score">${ok}<small> / ${n}問</small></div>
    <p style="margin:0">${msg}</p>
    ${miss.length ? `<div class="miss"><b style="font-size:14px">まちがえた問題</b>${miss.map(r => { const q = QI[r.id]; return `<button data-act="one" data-id="${q.id}"><b>×</b>${esc(q.q.slice(0, 80))}</button>`; }).join("")}</div>` : ""}
    <div class="row">${miss.length ? `<button class="btn" data-act="retry">まちがえた${miss.length}問をやり直す</button>` : ""}<button class="btn sub" data-act="home">ホームへ</button></div>
  </section>`;
}

function render() { S.view === "home" ? home() : S.view === "quiz" ? quiz() : end(); if (S.view === "quiz") resetBar(); }
/* 問題画面のいちばん下のリセット（この問題／この単元を選ぶ） */
function resetBar() { const q = QI[S.list[S.i]]; if (!q) return; const d = document.createElement("div"); d.className = "rbar";
  d.innerHTML = `<button type="button" class="ghost" data-act="rmenu">リセット</button><div class="rmenu" hidden><p>どちらをリセットしますか？（まだ解いていない状態に戻します）</p><button type="button" class="ghost" data-act="qclr">この問題をリセット</button><button type="button" class="ghost" data-act="uclr" data-u="${q.u}">この単元（${esc(UNITS[q.u][1])}）をリセット</button><button type="button" class="ghost" data-act="rmenu">やめる</button></div>`;
  app.appendChild(d); }

function pick(v) {
  if (S.picked !== null) return;
  const q = QI[S.list[S.i]];
  S.picked = v; S.picks = S.picks || {}; S.picks[S.i] = v; const ok = v === q.a; const r = store.res[q.id] || { n: 0 };
  store.res[q.id] = { ok, n: r.n + 1 }; S.results.push({ id: q.id, ok }); SRS.set(q.id, ok ? "ok" : "ng"); saveSes(); save();
  render();
  const vd = document.querySelector(".verdict"); if (vd && vd.scrollIntoView) vd.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}
function prev() { if (S.i > 0) { S.i--; S.picked = pickAt(S.i); S.edit = null; saveSes(); render(); window.scrollTo(0, 0); } }
function next() {
  S.edit = null;
  if (S.i + 1 < S.list.length) { S.i++; S.picked = pickAt(S.i); saveSes(); render(); window.scrollTo(0, 0); }
  else { dropSes(S.key); S.view = "end"; render(); window.scrollTo(0, 0); }
}

app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return; const a = b.dataset.act;
  if (a === "home") { S.view = "home"; render(); window.scrollTo(0, 0); }
  else if (a === "klv") { const n = +b.dataset.n, k = "k2:lv:" + n, lb = KN[n].replace("　", " "); if (validSes(k)) resumeOr(k, () => [], lb); else startAtYet(kIds(n), lb, k); }
  else if (a === "kf") { const c = b.dataset.c; resumeOr("k:f:" + c, () => KO.filter(q => q.f === c).map(q => q.id), FIELDS[c].name); }
  else if (a === "kall") { if (validSes("k:all")) resumeOr("k:all", () => [], ""); else startAtYet(KO.map(q => q.id), "全問（教科書の順）", "k:all"); }
  else if (a === "ku") { const u = +b.dataset.u; resumeOr("k:u:" + u, () => kuIds(u), UNITS[u][1]); }
  else if (a === "tag") { const t = b.dataset.t; resumeOr("all:tag:" + t, () => KO.filter(q => (q.tg || []).includes(t)).map(q => q.id), TAGN[t] + "だけ"); }
  else if (a === "all") resumeOr("all:all", () => shuffle(Q.map(q => q.id)), "全問シャッフル");
  else if (a === "yet") resumeOr("all:yet", () => yetIds(), "まだの問題");
  else if (a === "wrong") resumeOr("all:wrong", () => shuffle(wrongIds()), "まちがえた問題");
  else if (a === "review") resumeOr(todayKey(), () => SRS.dueIds(Q.map(q => q.id)), "今日の復習");
  else if (a === "smark") { rate(S.list[S.i], b.dataset.g); render(); }
  else if (a === "memo") { const ids = MyNote.ids().filter(id => QI[id]); if (ids.length) start(KO.filter(q => ids.includes(q.id)).map(q => q.id), "メモした問題"); }
  else if (a === "resume") { const k = b.dataset.k; if (validSes(k)) resumeOr(k, () => [], ""); }
  else if (a === "drop") { dropSes(b.dataset.k); render(); }
  else if (a === "retry") start(S.results.filter(r => !r.ok).map(r => r.id), "やり直し");
  else if (a === "one") start([b.dataset.id], "1問だけ");
  else if (a === "srun") { const ids = searchHits(SQ); if (ids.length) start(ids, "検索：" + SQ); }
  else if (a === "sclear") { SQ = ""; render(); }
  else if (a === "edopen") { S.edit = S.list[S.i]; render(); const t = document.getElementById("edcore"); if (t) t.focus(); }
  else if (a === "edcancel") { S.edit = null; render(); }
  else if (a === "edsave") { const id = S.list[S.i], q = QI[id], c = document.getElementById("edcore").value, ee = document.getElementById("ede").value; const o = {}; if (c !== (q.core || "")) o.core = c; if (ee !== (q.e || "")) o.e = ee; if (Object.keys(o).length) EDIT[id] = Object.assign(o, { t: Date.now() }); else delete EDIT[id]; edSave(); S.edit = null; render(); }
  else if (a === "edreset") { const id = S.list[S.i]; if (confirm("この問題の解説を元に戻します。自分で編集した内容は消えます。\n\n本当に戻しますか？")) { delete EDIT[id]; edSave(); S.edit = null; render(); } }
  else if (a === "share") { const u = APPURL(); if (navigator.share) navigator.share({ title: "内科専門医 4択", url: u }).catch(() => {}); else { try { navigator.clipboard.writeText(u); alert("アドレスをコピーしました"); } catch (e) { prompt("このアドレスをコピーしてください", u); } } }
  else if (a === "copyurl") { const u = APPURL(); try { navigator.clipboard.writeText(u).then(() => alert("アドレスをコピーしました"), () => prompt("このアドレスをコピーしてください", u)); } catch (e) { prompt("このアドレスをコピーしてください", u); } }
  else if (a === "lgexport") logExport();
  else if (a === "edexport") { const blob = new Blob([JSON.stringify({ app: "naika4", date: new Date().toISOString(), edits: EDIT }, null, 1)], { type: "application/json" }); const ua = document.createElement("a"); ua.href = URL.createObjectURL(blob); ua.download = "内科4択_編集した解説.json"; document.body.appendChild(ua); ua.click(); setTimeout(() => { URL.revokeObjectURL(ua.href); ua.remove(); }, 1000); }
  else if (a === "pickc") pick(+b.dataset.v);
  else if (a === "next") next();
  else if (a === "prev") prev();
  else if (a === "reset") {
    if (confirm("全部の問題を「まだ解いていない」状態に戻します（正解・まちがい、○△×の評価、復習の予定、途中の続きを消します）。自分メモは残ります。" + ASK)) { store = { res: {}, ses: {} }; save(); SRS.clear(); render(); }
  }
  else if (a === "rmenu") { const m = document.querySelector(".rmenu"); if (m) { m.hidden = !m.hidden; if (!m.hidden) m.scrollIntoView({ block: "nearest" }); } }
  else if (a === "resetf") {
    const c = b.dataset.c, f = FIELDS[c], ids = qsOf(c).map(q => q.id), n = ids.filter(id => store.res[id] || SRS.has(id)).length;
    if (confirm(`「${f.name}」の${n}問を「まだ解いていない」状態に戻します。\n正解・まちがい、○△×の評価、復習の予定、この章の途中の続きが消えます。自分メモは残ります。` + ASK)) { clearIds(ids, Object.keys(store.ses).filter(k => k === "k:f:" + c)); render(); }
  }
  else if (a === "uclr") {
    const u = +b.dataset.u, ids = kuIds(u), n = ids.filter(id => store.res[id] || SRS.has(id)).length;
    if (confirm(`単元「${UNITS[u][1]}」の${ids.length}問（記録あり${n}問）を「まだ解いていない」状態に戻します。\n正解・まちがい、○△×の評価、復習の予定が消えます。自分メモは残ります。` + ASK)) { clearIds(ids, ["k:u:" + u]); render(); }
  }
  else if (a === "qclr") {
    const id = S.list[S.i];
    if (confirm("この問題を「まだ解いていない」状態に戻します（正解・まちがい、○△×の評価、復習の予定を消します）。自分メモは残ります。" + ASK)) { clearIds([id]); render(); }
  }
});
document.addEventListener("keydown", e => {
  if (S.view !== "quiz" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase(); const q = QI[S.list[S.i]];
  if (k === "arrowleft" || k === "p") { e.preventDefault(); prev(); return; }
  if (S.picked === null) { if (/^[1-5]$/.test(k) && +k <= q.ch.length) pick(+k - 1); }
  else if (k === "arrowright") { e.preventDefault(); next(); }
  else if (k === "enter" || k === "n" || k === " ") { if (document.activeElement && document.activeElement.id !== "nextBtn") { e.preventDefault(); next(); } }
});
render();
