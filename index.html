Cockcroft-Gault 式のクレアチニンクリアランスを使うことが多い（とくに体格が平均と違う人）。","シスタチン C は筋肉量の影響を受けにくい（甲状腺機能・ステロイドで変わる）。","BUN は脱水・消化管出血・高たんぱく食・ステロイド・異化亢進で上がり、低たんぱく・肝不全で下がる。",""],"core":"eGFR（クレアチニン）は筋肉量が少ない人（高齢・やせ・寝たきり・四肢切断）で高く出る。シスタチン C の eGFR も使う。","e":"Cockcroft-Gault 式：CCr（creatinine clearance：クレアチニンクリアランス）＝（140－年齢）×体重÷（72×Cr）（女性は×0.85）。\nクレアチニンを上げる薬（尿細管分泌を阻害）：トリメトプリム（ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 合剤（スルファメトキサゾール・トリメトプリム：バクタ））・シメチジン。GFR（glomerular filtration rate：糸球体濾過量） は実際には変わらない。\n急な腎機能の変化（AKI（acute kidney injury：急性腎障害））では、クレアチニンが追いつかないので eGFR の式は使えない。\n24時間蓄尿のクレアチニンクリアランスは、GFR より少し高く出る（尿細管分泌のため）。","tg":[],"mt":["lipid"]},{"id":"kid-15a2afa9","f":"kid","u":49,"o":169,"lv":1,"q":"抗利尿ホルモン（AVP（arginine vasopressin：アルギニンバソプレシン、抗利尿ホルモン））の作用について正しいものはどれか。","ch":["集合管の V2 受容体→アクアポリン2で水を再吸収","血管の V2 受容体を介して、血管を収縮させる","血漿浸透圧が下がると、分泌が増える","近位尿細管で、ナトリウムの再吸収を増やす"],"a":0,"cx":["","血管の収縮は V1 受容体。","血漿浸透圧が上がると分泌が増える（下がると止まる）。","AVP は主に集合管で水の再吸収を増やす。ナトリウムの再吸収はアルドステロンなど。"],"core":"AVP（バソプレシン）＝血漿浸透圧の上昇（と大きな循環血液量の低下）で分泌 → 集合管の V2 受容体 → アクアポリン2 → 水の再吸収 → 濃い尿。","e":"浸透圧の調節：浸透圧受容体（視床下部）→ 口渇と AVP。\n循環血液量が大きく減ると、浸透圧が低くても AVP が出る（低 Na の一因：心不全・肝硬変・脱水）。\nトルバプタン（V2 受容体拮抗薬）：水だけを出す（水利尿）。心不全の体液貯留・SIADH（syndrome of inappropriate secretion of antidiuretic hormone：抗利尿ホルモン不適合分泌症候群）・ADPKD（autosomal dominant polycystic kidney disease：常染色体顕性多発性嚢胞腎） に使う。急な Na 上昇・肝障害に注意。\nデスモプレシン（V2 作動薬）：AVP 分泌低下症・夜間多尿・軽症の血友病 A/von Willebrand 病。","tg":[],"fig":["nephron"]},{"id":"kid-1afc2b77","f":"kid","u":50,"o":170,"lv":2,"q":"低ナトリウム血症の原因の区別について正しいものはどれか。","ch":["尿中ナトリウムが低ければ、SIADH（syndrome of inappropriate secretion of antidiuretic hormone：抗利尿ホルモン不適合分泌症候群） と診断できる","尿浸透圧 100 mOsm/kg 未満なら、水のとりすぎを考える","高血糖による低ナトリウム血症は、血漿浸透圧が低い","SIADH（syndrome of inappropriate secretion of antidiuretic hormone：抗利尿ホルモン不適合分泌症候群） では、循環血漿量が明らかに減少している"],"a":1,"cx":["尿中ナトリウムが低い（20〜30 mEq/L 未満）なら、体液量の減少（脱水・下痢）か浮腫性疾患（心不全・肝硬変）。SIADH は尿中 Na が高い。","","高血糖では血漿浸透圧が高く、水が細胞外へ移る（高張性・偽性の低ナトリウム）。","SIADH は体液量がほぼ正常（正常〜わずかに増加）。減少していれば脱水・副腎不全などを考える。"],"core":"低 Na の考え方：①血漿浸透圧（低張か）②尿浸透圧（100 未満＝水のとりすぎ・溶質不足）③体液量と尿中 Na。SIADH＝低張・尿浸透圧 100 以上・体液量正常・尿中 Na 高値（20〜30 以上）・腎/副腎/甲状腺の機能正常。","e":"SIADH の原因：肺（肺炎・肺癌、とくに小細胞癌）、中枢神経（髄膜炎・脳出血・外傷）、薬（カルバマゼピン（テグレトール）・SSRI（selective serotonin reuptake inhibitor：選択的セロトニン再取り込み阻害薬）・シクロホスファミド・ビンクリスチン・サイアザイドは別の機序）、痛み・吐き気・術後。\n治療：水制限、塩分・たんぱくの補給、トルバプタン（SIADH に適用）、原因の治療。\n鉱質コルチコイド反応性低ナトリウム血症（MRHE（mineralocorticoid-responsive hyponatremia of the elderly：鉱質コルチコイド反応性低ナトリウム血症））：高齢者で SIADH に似るが、体液が少なめで、フルドロコルチゾン（フロリネフ）が効く。\n副腎不全・甲状腺機能低下症も SIADH のように見えるので必ず除く。\n脳性塩類喪失：くも膜下出血などで、体液が減っているのに尿中 Na が多い（水制限は禁忌）。","tg":[],"fig":["lowna"],"mt":["thyroid","adrenal"]},{"id":"kid-1b6d4501","f":"kid","u":50,"o":171,"lv":3,"q":"74歳の女性。食欲がなく、3日前から水ばかり飲んでいた。今朝けいれんを起こし搬送された。血清 Na 112 mEq/L。けいれんは止まったが、意識はもうろうとしている。治療として正しいものはどれか。","ch":["3% 食塩水で症状を改善し、24時間の上昇は 10 以内に","トルバプタン（サムスカ）を高用量で投与し、急速に補正する","重い症状があっても、水制限だけで経過を見る","24時間で Na を 140 mEq/L まで一気に戻す"],"a":0,"cx":["","トルバプタンは急な上昇を起こしうる。重症の急性期には使わない。","けいれん・意識障害は脳浮腫の症状。高張食塩水で少し上げる（4〜6 mEq/L で症状が改善することが多い）。","急に戻しすぎると浸透圧性脱髄症候群（橋中心髄鞘崩壊症）を起こす。"],"core":"重症症状のある低 Na＝3% 食塩水（100〜150 mL を20分ほどで、必要なら繰り返す）で 4〜6 mEq/L 上げる。その後の補正は24時間で 10 mEq/L 以内（危険の高い人は 8 以内）。","e":"浸透圧性脱髄症候群の危険が高い：Na 105 以下、低カリウム、アルコール依存、低栄養、肝疾患、高齢女性のサイアザイドによる低 Na。\n補正しすぎたら：5% ブドウ糖液やデスモプレシン（ミニリンメルト）で下げ戻す。\n原因が取れる（水の飲みすぎ・サイアザイド中止・副腎不全の補充）と、尿が大量に出て急に Na が上がることがあるので、尿量と Na を数時間ごとに測る。\n慢性（48時間以上）か急性かで危険が違う。わからなければ慢性として扱う。","tg":["cs"]},{"id":"kid-29b5bf86","f":"kid","u":50,"o":172,"lv":2,"q":"高ナトリウム血症について正しいものはどれか。","ch":["多くは水の不足で起こり、自由水を補う","口渇があれば、高齢者でも必ず自分で水を飲める","補正は、24時間で 20 mEq/L 以上下げてよい","ナトリウムのとりすぎが、最も多い原因である"],"a":0,"cx":["","高齢者は口渇の感覚が鈍く、寝たきり・認知症では自分で飲めない。","急に下げると脳浮腫になる。慢性なら24時間で 10 mEq/L 以内（8〜10）を目安に。","塩分のとりすぎ（高張食塩水・重炭酸の大量投与など）は少ない原因。多くは水の喪失と飲めないこと。"],"core":"高 Na＝水の不足。原因：飲水できない（高齢者・意識障害）＋水の喪失（発熱・下痢・浸透圧利尿・尿崩症）。5% ブドウ糖液などで自由水をゆっくり補う。","e":"自由水欠乏量（目安）＝体内水分量（体重×0.5〜0.6）×（Na/140－1）。\n尿浸透圧で区別：濃い尿（600 以上）＝腎外性の喪失か飲水不足、薄い尿＝尿崩症（AVP（arginine vasopressin：アルギニンバソプレシン、抗利尿ホルモン） 分泌低下症・AVP 抵抗症）。\n高血糖の浸透圧利尿（HHS（hyperosmolar hyperglycemic state：高浸透圧高血糖状態））でも高 Na になる。","tg":[]},{"id":"kid-4bd63f3c","f":"kid","u":51,"o":173,"lv":2,"q":"動脈血ガス：pH 7.30、PaCO₂ 25 Torr、HCO₃⁻ 12 mEq/L、Na 138、Cl 102 mEq/L、アルブミン 4.0 g/dL。正しい解釈はどれか。","ch":["呼吸性アシドーシスに、代謝性の代償がある","代謝性アシドーシスに、呼吸性アシドーシスが合併","AG（anion gap：アニオンギャップ） 開大性の代謝性アシドーシスで、代償は適切","アニオンギャップ正常の代謝性アシドーシスである"],"a":2,"cx":["PaCO₂ は低い。呼吸性アシドーシスではない。","Winters の式で予測 PaCO₂＝1.5×12＋8±2＝24〜28。実測 25 は範囲内で、呼吸性アシドーシスの合併はない。","","AG（anion gap：アニオンギャップ）＝138－（102＋12）＝24 で開大している。"],"core":"酸塩基の読み方：①pH ②一次性の変化（HCO₃⁻ か PaCO₂）③代償が適切か（代謝性アシドーシスは Winters：PaCO₂＝1.5×HCO₃⁻＋8±2）④AG＝Na－（Cl＋HCO₃⁻）、正常 12 前後 ⑤AG 開大なら補正 HCO₃⁻＝HCO₃⁻＋（AG－12）で隠れたアルカローシス/アシドーシスを探す。","e":"この例の補正 HCO₃⁻＝12＋（24－12）＝24 で、ほかの代謝性異常の合併はない。\nAG 開大性の原因：乳酸アシドーシス、ケトアシドーシス（糖尿病・アルコール・飢餓）、腎不全、中毒（メタノール・エチレングリコール・サリチル酸）。浸透圧ギャップ（実測−計算浸透圧）が開いていればアルコール類の中毒。\nAG 正常（高 Cl 性）：下痢、尿細管性アシドーシス、生理食塩水の大量投与、尿路変更、炭酸脱水酵素阻害薬。尿 AG（尿 Na＋K－Cl）で、陰性なら下痢（NH₄⁺ の排泄は保たれる）、陽性なら RTA（renal tubular acidosis：尿細管性アシドーシス）。\nアルブミンが 1 g/dL 下がるごとに AG は約 2.5 下がるので補正する。","tg":[],"fig":["acidbase"]},{"id":"kid-a3349950","f":"kid","u":51,"o":174,"lv":2,"q":"代謝性アルカローシスで、尿中 Cl が 10 mEq/L 未満（生理食塩水で治りやすい）となるものはどれか。","ch":["嘔吐・胃液の吸引","利尿薬を今まさに使用中","Bartter 症候群","原発性アルドステロン症"],"a":0,"cx":["","利尿薬の使用中は尿中 Cl が多い（やめた後は少なくなる）。","Bartter・Gitelman 症候群は尿中 Cl が多い（利尿薬を飲んでいるのと同じ状態）。","原発性アルドステロン症は尿中 Cl が多く、高血圧を伴う。生理食塩水では治らない。"],"core":"代謝性アルカローシス：尿中 Cl が少ない（＜10〜20）＝嘔吐・胃液吸引・利尿薬の使用後（生理食塩水反応性）。尿中 Cl が多い＝鉱質コルチコイド過剰（高血圧あり）、Bartter・Gitelman（血圧正常）、利尿薬使用中。","e":"嘔吐では胃酸（HCl）を失い、体液量の減少でアルドステロンが上がり、尿から K が失われて低カリウム血症も起こる。\nGitelman 症候群（遠位尿細管の NaCl 共輸送体＝サイアザイドの標的の異常）：低マグネシウム、低カルシウム尿。成人で見つかることが多い。\nBartter 症候群（ヘンレループ上行脚の異常＝ループ利尿薬の標的）：高カルシウム尿、小児期に多い。\n偽性 Bartter：利尿薬・下剤の隠れた使用、神経性やせ症での嘔吐。","tg":[],"fig":["acidbase","nephron"]},{"id":"kid-6c219a7e","f":"kid","u":51,"o":175,"lv":2,"q":"低カリウム血症について正しいものはどれか。","ch":["低 Mg 血症があると、Mg を補わないと K が戻りにくい","インスリンは、血清カリウムを上げる","尿中カリウム排泄が多ければ、下痢が原因と考える","心電図では、T 波が高くとがる（テント状 T 波）"],"a":0,"cx":["","インスリンは K を細胞内へ移し、血清 K を下げる。","下痢など腎臓以外からの喪失では、腎は K を保持して尿中 K は少ない（20 mEq/日 未満）。尿中 K が多いのは腎性の喪失（利尿薬・鉱質コルチコイド過剰・RTA（renal tubular acidosis：尿細管性アシドーシス） など）。","T 波の増高は高カリウム血症。低 K では T 平低・U 波・ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 低下。"],"core":"低 K の考え方：①細胞内への移動（インスリン・β2 刺激・アルカローシス・周期性四肢麻痺）②摂取不足 ③喪失（腎性か腎外性かを尿中 K で）。Mg も一緒に補う。","e":"甲状腺中毒性周期性四肢麻痺：アジア人の若い男性、炭水化物の多い食事・運動後の夜間に急な脱力、低 K。甲状腺中毒症を治す。\n症状：筋力低下・麻痺、横紋筋融解、イレウス、不整脈（ジギタリス中毒を起こしやすい）、腎性尿崩症。\n補充：内服（塩化カリウム）が安全。静注は濃度・速度の上限を守る（末梢から 40 mEq/L 以下、20 mEq/時 以下が目安）。","tg":[]},{"id":"kid-584f01ad","f":"kid","u":51,"o":176,"lv":3,"q":"70歳の男性。CKD（eGFR（estimated glomerular filtration rate：推算糸球体濾過量） 22）と心不全で、エナラプリル（レニベース）・スピロノラクトンを飲んでいる。数日前から脱力があり、心電図でテント状 T 波と QRS（QRS 波、心室の興奮） 幅の拡大（0.14 秒）がある。血清 K 7.6 mEq/L。最初に行う治療はどれか。","ch":["カリウムを含む輸液で脱水を補正する","グルコン酸カルシウム（カルチコール）の静注","スピロノラクトン（アルダクトン A）を増量する","ポリスチレンスルホン酸（カリメート、ケイキサレート）の内服だけで経過を見る"],"a":1,"cx":["カリウムの入った輸液は悪化させる。","","スピロノラクトンはカリウムを上げる。中止する。","陽イオン交換樹脂は効くまで数時間〜。心電図変化のある高カリウムには、まず心筋を守る。"],"core":"心電図変化を伴う高カリウム血症＝①グルコン酸カルシウム静注（数分で心筋膜を安定化、K は下がらない）②インスリン＋ブドウ糖・β2 刺激薬吸入（K を細胞内へ）③体外への排泄（利尿薬・陽イオン交換樹脂/ジルコニウム・透析）。","e":"原因の薬を止める：ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬・ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬）・MR（mineralocorticoid receptor：ミネラルコルチコイド受容体） 拮抗薬・ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 合剤・NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）・ヘパリン・カルシニューリン阻害薬・β遮断薬・ジゴキシン。\n偽性高カリウム血症：溶血・血小板/白血球の著増・採血時の手の握り込み。\nジゴキシン（ジゴシン）中毒による高カリウムでは、カルシウム静注は慎重に（抗ジゴキシン抗体）。\nジルコニウムシクロケイ酸ナトリウム（ロケルマ）は効き始めが早い（1時間程度）。","tg":["cs"],"fig":["ecg"],"mt":["potassium"]},{"id":"kid-ba35b5a3","f":"kid","u":51,"o":177,"lv":2,"q":"動脈血ガス：pH 7.52、PaCO₂ 28 Torr、HCO₃⁻ 22 mEq/L。最も考えられる原因はどれか。","ch":["嘔吐による代謝性アルカローシス","不安による過換気（呼吸性アルカローシス）","COPD（chronic obstructive pulmonary disease：慢性閉塞性肺疾患） の CO₂ 貯留","糖尿病ケトアシドーシス"],"a":1,"cx":["代謝性アルカローシスなら HCO₃⁻ が上がる（ここではほぼ正常）。","","CO₂ 貯留なら PaCO₂ は上がり、アシドーシスになる。","DKA（diabetic ketoacidosis：糖尿病ケトアシドーシス） は代謝性アシドーシス（pH 低下・HCO₃⁻ 低下）。"],"core":"pH↑・PaCO₂↓＝呼吸性アルカローシス。急性では HCO₃⁻ は PaCO₂ 10 低下あたり約 2 だけ下がる（ここではほぼ急性）。原因：不安・痛み・低酸素（肺塞栓・肺炎）・敗血症初期・サリチル酸・妊娠・肝硬変・中枢神経疾患。","e":"過換気症候群と決める前に、低酸素・肺塞栓・代謝性アシドーシスへの代償を除く（A-aDO₂・D ダイマー）。\nサリチル酸中毒：呼吸性アルカローシス＋AG（anion gap：アニオンギャップ） 開大性代謝性アシドーシスの混合、耳鳴り。尿のアルカリ化・透析。\n代償の目安：\n・代謝性アシドーシス：PaCO₂＝1.5×HCO₃⁻＋8±2\n・代謝性アルカローシス：PaCO₂ は HCO₃⁻ 1 上昇あたり 0.7 上がる\n・呼吸性アシドーシス：HCO₃⁻ は急性で 1、慢性で 3.5（PaCO₂ 10 上昇あたり）上がる\n・呼吸性アルカローシス：HCO₃⁻ は急性で 2、慢性で 4〜5（PaCO₂ 10 低下あたり）下がる","tg":[],"fig":["acidbase"]},{"id":"kid-43cdca37","f":"kid","u":52,"o":178,"lv":2,"q":"急性腎障害（AKI（acute kidney injury：急性腎障害））の KDIGO（Kidney Disease: Improving Global Outcomes、国際腎臓病ガイドライン機構） 基準について正しいものはどれか。","ch":["48時間以内に Cr が 0.3 mg/dL 以上上がれば AKI","クレアチニンが基礎値の1.2倍になれば AKI と診断する","尿量が 24時間で 1,000 mL 未満なら AKI と診断する","eGFR（estimated glomerular filtration rate：推算糸球体濾過量） が 60 未満が3か月続けば、AKI と診断する"],"a":0,"cx":["","クレアチニンは基礎値の1.5倍以上（7日以内）。","尿量の基準は 0.5 mL/kg/時 未満が6時間以上。1日 1,000 mL ではない。","3か月以上続く腎機能低下は CKD（chronic kidney disease：慢性腎臓病） の定義。"],"core":"KDIGO の AKI：①48時間以内に Cr 0.3 mg/dL 以上の上昇 ②7日以内に基礎値の1.5倍以上 ③尿量 0.5 mL/kg/時 未満が6時間以上、のどれか。","e":"重症度（ステージ1〜3）：Cr の上がり方（1.5〜1.9倍・2.0〜2.9倍・3倍以上か 4.0 以上か透析開始）と尿量。\n原因の区別：\n・腎前性：脱水・出血・心不全・肝硬変・NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）/ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬）。尿 Na＜20、FENa（fractional excretion of sodium：ナトリウム排泄分画）＜1%（利尿薬使用中は FEUN（fractional excretion of urea nitrogen：尿素窒素排泄分画）＜35%）、BUN/Cr（BUN とクレアチニンの比）＞20、尿沈渣はきれい\n・腎性：急性尿細管壊死（虚血・造影剤・アミノグリコシド・横紋筋融解）＝顆粒円柱（泥のような茶色の円柱）、FENa＞2%。急性間質性腎炎（薬：抗菌薬・PPI（proton pump inhibitor：プロトンポンプ阻害薬）・NSAIDs、免疫チェックポイント阻害薬）＝白血球円柱・発熱・皮疹・好酸球。糸球体腎炎＝赤血球円柱\n・腎後性：前立腺肥大・腫瘍・結石 → まず超音波で水腎症を見る。","tg":[]},{"id":"kid-2814e1eb","f":"kid","u":52,"o":179,"lv":2,"q":"緊急透析の適応として正しいものはどれか。","ch":["尿量が1日 800 mL に減ったら、全例で透析を始める","BUN（blood urea nitrogen：血中尿素窒素） が 40 mg/dL を超えたら、全例で透析を始める","クレアチニンが 3.0 mg/dL を超えたら、全例で透析","治療抵抗性の高 K・肺水腫・アシドーシス、尿毒症"],"a":3,"cx":["乏尿だけでは適応にならない。体液過剰で困っているかで判断する。","BUN 40 はまだ透析の理由にならない（尿毒症の症状は BUN 100 前後から）。","数値だけで一律には決めない。症状と合併症で判断する。",""],"core":"緊急透析の適応（AEIOU）：Acidosis（重い代謝性アシドーシス）・Electrolytes（治らない高カリウム）・Intoxication（透析で除ける中毒：リチウム・メタノール・エチレングリコール・サリチル酸など）・Overload（利尿薬で治らない肺水腫）・Uremia（心膜炎・脳症・出血傾向）。","e":"透析で除きやすい物質：分子量が小さく、蛋白結合が少なく、分布容積が小さいもの（リチウム・アルコール類・サリチル酸・バルプロ酸の大量など）。\n除きにくい：三環系抗うつ薬・ジゴキシン・ベンゾジアゼピン（蛋白結合や分布容積が大きい）。\n血行動態が不安定なら持続的腎代替療法（CRRT（continuous renal replacement therapy：持続的腎代替療法））。","tg":["ae"],"fig":["acidbase"]},{"id":"kid-9620079f","f":"kid","u":52,"o":180,"lv":3,"q":"72歳の男性。腰痛で2週間前から整形外科のロキソプロフェン（ロキソニン）を飲み、最近高血圧でロサルタン（ニューロタン）に加えてヒドロクロロチアジドが追加された。暑い日が続き食欲が落ちていた。血清クレアチニンが 0.9 から 2.6 mg/dL に上がった。尿沈渣に異常はなく、FENa（fractional excretion of sodium：ナトリウム排泄分画） 0.4%。最も考えられる病態はどれか。","ch":["急速進行性糸球体腎炎（ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） 関連など）","ヨード造影剤による造影剤腎症","NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）・ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬）・利尿薬の併用による腎前性 AKI（acute kidney injury：急性腎障害）","前立腺肥大による腎後性腎不全（尿閉）"],"a":2,"cx":["尿沈渣がきれいで、RPGN（rapidly progressive glomerulonephritis：急速進行性糸球体腎炎） を示す赤血球円柱・蛋白尿がない。","造影剤の使用歴がない。","","腎後性は超音波で水腎症を確かめる。FENa が低く、薬の組み合わせからまず腎前性を考える。"],"core":"triple whammy＝NSAIDs（輸入細動脈を収縮）＋ARB/ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬（輸出細動脈を拡張）＋利尿薬（体液量の減少）で、糸球体の圧が保てず腎前性 AKI。高齢者・脱水で起こりやすい。","e":"対応：原因の薬を中止し、輸液で体液量を戻す。\nシックデイ・ルール：脱水になりそうなとき（発熱・下痢・食事がとれない）は ARB/ACE 阻害薬・利尿薬・SGLT2（sodium-glucose cotransporter 2：ナトリウム・グルコース共輸送体2） 阻害薬・メトホルミン・NSAIDs を一時休む。\n高齢者の鎮痛にはアセトアミノフェン（カロナール）を優先する。","tg":["ae","cs"],"fig":["nephron"],"mt":["glomerular"]},{"id":"kid-f5cfbfb5","f":"kid","u":53,"o":181,"lv":1,"q":"CKD（chronic kidney disease：慢性腎臓病） の重症度分類（KDIGO（Kidney Disease: Improving Global Outcomes、国際腎臓病ガイドライン機構）・日本腎臓学会）について正しいものはどれか。","ch":["糖尿病のときは尿蛋白で、それ以外は尿アルブミンで評価する","原因（C）・GFR（glomerular filtration rate：糸球体濾過量） 区分（G）・蛋白尿区分（A）で分類する","G3a は eGFR（estimated glomerular filtration rate：推算糸球体濾過量） 15〜29 mL/分/1.73 m² である","GFR（glomerular filtration rate：糸球体濾過量） だけで分類し、蛋白尿は考えない"],"a":1,"cx":["逆。糖尿病は尿アルブミン（保険で測れる）、それ以外は尿蛋白で評価する。","","G3a は 45〜59。15〜29 は G4。","蛋白尿（アルブミン尿）が多いほど、同じ GFR でも末期腎不全・心血管病の危険が高い。"],"core":"CKD＝腎障害（とくに蛋白尿）か GFR 60 未満が3か月以上。重症度＝原因（Cause）＋GFR 区分（G1〜G5）＋蛋白尿区分（A1〜A3）。","e":"GFR 区分：G1 ≧90、G2 60〜89、G3a 45〜59、G3b 30〜44、G4 15〜29、G5 ＜15。\n蛋白尿区分（糖尿病）：尿アルブミン/Cr 比 ＜30（A1）・30〜299（A2）・300 以上（A3）mg/gCr。（それ以外）：尿蛋白/Cr 比 ＜0.15・0.15〜0.49・0.50 以上 g/gCr。\n腎臓専門医への紹介：蛋白尿 0.5 g/gCr 以上か蛋白尿と血尿が両方陽性、GFR 45 未満（40歳未満は 60 未満）、急な腎機能の低下など。\nクレアチニンは筋肉量に影響される（やせた高齢者では GFR を高く見積もる）。シスタチン C による eGFR も使う。","tg":[]},{"id":"kid-0f61bdc8","f":"kid","u":53,"o":182,"lv":2,"q":"CKD（chronic kidney disease：慢性腎臓病） の進行を抑える治療について正しいものはどれか。","ch":["ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬） と ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬を併用すると、腎保護効果が最も強い","蛋白尿がなければ、降圧目標は 150/90 mmHg 未満でよい","糖尿病がなくても、SGLT2（sodium-glucose cotransporter 2：ナトリウム・グルコース共輸送体2） 阻害薬で腎機能の低下が遅くなる","CKD の人には、NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） が最も安全な鎮痛薬である"],"a":2,"cx":["ARB と ACE 阻害薬の併用は高カリウム・AKI（acute kidney injury：急性腎障害） が増え、勧められない。","CKD の降圧目標は 130/80 mmHg 未満（JSH2025）。高齢者・蛋白尿のない人は個別に。","","NSAIDs は腎機能を悪化させる。アセトアミノフェン（カロナール）を優先する。"],"core":"CKD の進行を抑える4本柱：降圧（130/80 未満）、蛋白尿があれば ARB/ACE 阻害薬、SGLT2 阻害薬（ダパグリフロジン（フォシーガ）・エンパグリフロジン、糖尿病がなくても）、糖尿病性腎臓病にはフィネレノン（非ステロイド型 MR（mineralocorticoid receptor：ミネラルコルチコイド受容体） 拮抗薬）。","e":"ARB/ACE 阻害薬・SGLT2 阻害薬を始めると eGFR（estimated glomerular filtration rate：推算糸球体濾過量） が一時的に少し下がる（糸球体の過剰ろ過が減るため）。30% 以内なら続ける。\nほかに：減塩（6 g/日未満）、適切なたんぱく制限（ステージに応じて、高齢者のサルコペニアに注意）、禁煙、血糖・脂質・尿酸の管理、肥満の是正。\n腎排泄の薬は量を調節する（抗菌薬・抗ウイルス薬・DOAC（direct oral anticoagulant：直接経口抗凝固薬）・メトホルミン（eGFR 30 未満は禁忌）・SU（sulfonylurea：スルホニル尿素） 薬・ガバペンチノイドなど）。\n造影剤腎症の予防：検査前後の輸液（生理食塩水など）、NSAIDs などを控える。","tg":[],"mt":["dmdrugs"]},{"id":"kid-13ebaf97","f":"kid","u":53,"o":183,"lv":2,"q":"CKD（chronic kidney disease：慢性腎臓病） に伴う貧血と骨ミネラル代謝異常（CKD-MBD（CKD に伴う骨ミネラル代謝異常））について正しいものはどれか。","ch":["腎性貧血の治療では、Hb を 14 g/dL 以上に保つ","腎性貧血ではエリスロポエチンが高く、血液疾患は考えなくてよい","CKD-MBD では、リンが下がり PTH（parathyroid hormone：副甲状腺ホルモン） が下がる","ESA（erythropoiesis-stimulating agent：赤血球造血刺激因子製剤） か HIF-PH（hypoxia-inducible factor prolyl hydroxylase：低酸素誘導因子プロリン水酸化酵素） 阻害薬を使い、鉄の不足も補う"],"a":3,"cx":["Hb を高くしすぎると脳卒中・血栓症が増える。目標は 10〜12（13）g/dL 程度。","腎性貧血はエリスロポエチンの「相対的な」不足（貧血の程度に比べて上がらない）。消化管出血・ほかの血液疾患は除く。","GFR（glomerular filtration rate：糸球体濾過量） が落ちるとリンがたまり、活性型ビタミン D が減り、PTH が上がる（二次性副甲状腺機能亢進症）。",""],"core":"腎性貧血＝ESA（エリスロポエチン製剤）か HIF-PH 阻害薬（ダプロデュスタット（ダーブロック）・バダデュスタットなど、内服）。鉄（フェリチン・トランスフェリン飽和度）を確かめて補う。","e":"HIF-PH 阻害薬の注意：血栓塞栓症、悪性腫瘍の増悪の懸念、網膜症の悪化の懸念。\nCKD-MBD：高リン血症（リン吸着薬：炭酸カルシウム・炭酸ランタン・クエン酸第二鉄・セベラマー、腸のリン吸収を抑えるテナパノル（フォゼベル））、二次性副甲状腺機能亢進症（活性型ビタミン D・カルシウム受容体作動薬：シナカルセト（レグパラ）・エテルカルセチド）、血管の石灰化。\nFGF23（fibroblast growth factor 23：線維芽細胞増殖因子23） は CKD の早い時期から上がり、リンの排泄を促し、活性型ビタミン D をつくる酵素を抑える。","tg":[],"mt":["anemia"]},{"id":"kid-a65e4b3d","f":"kid","u":54,"o":184,"lv":2,"q":"IgA（immunoglobulin A：免疫グロブリン A） 腎症について正しいものはどれか。","ch":["感染から2〜3週間たってから肉眼的血尿が出るのが特徴である","上気道炎の直後（1〜3日）に肉眼的血尿が出ることがある","血清補体（C3）が低くなる","腎生検で IgA の沈着は糸球体基底膜に線状に見られる"],"a":1,"cx":["感染後2〜3週で血尿・浮腫・高血圧、が典型なのは溶連菌感染後糸球体腎炎。","","IgA 腎症では補体は正常。低補体は感染後糸球体腎炎・ループス腎炎・膜性増殖性糸球体腎炎など。","IgA はメサンギウムに沈着する。基底膜の線状沈着（IgG（immunoglobulin G：免疫グロブリン G））は抗 GBM（glomerular basement membrane：糸球体基底膜） 抗体病。"],"core":"IgA 腎症＝世界で最も多い原発性糸球体腎炎。上気道炎・扁桃炎の直後（同時期）の肉眼的血尿、健診の血尿・蛋白尿。メサンギウムへの IgA（と C3）の沈着。補体正常。","e":"治療：ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬）/ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬・SGLT2（sodium-glucose cotransporter 2：ナトリウム・グルコース共輸送体2） 阻害薬（蛋白尿を減らす）、ステロイド（パルス療法を含む）、口蓋扁桃摘出＋ステロイドパルス（国内で広く行われる）。\n予後が悪い因子：蛋白尿が多い（1 g/日以上）、高血圧、腎機能低下、組織の慢性病変。\nIgA 血管炎（紫斑病性腎炎）：同じ IgA の沈着で、紫斑・腹痛・関節痛を伴う。\n感染後糸球体腎炎（溶連菌）：ASO（anti-streptolysin O：抗ストレプトリジン O 抗体）・ASK（anti-streptokinase：抗ストレプトキナーゼ抗体） 上昇、C3 低下（8週以内に戻る）、多くは自然に治る。成人ではブドウ球菌感染に伴うもの（IgA 優位）もある。","tg":[],"mt":["glomerular"]},{"id":"kid-c111302c","f":"kid","u":54,"o":185,"lv":2,"q":"成人のネフローゼ症候群と病理の組み合わせで正しいものはどれか。","ch":["巣状分節性糸球体硬化症 ― 蛍光抗体法で IgA（immunoglobulin A：免疫グロブリン A） がメサンギウムに沈着","微小変化型 ― 中高年に多く、ステロイドが効きにくい","膜性腎症 ― 抗 PLA2R（phospholipase A2 receptor：ホスホリパーゼ A2 受容体） 抗体、悪性腫瘍の合併に注意する","膜性増殖性糸球体腎炎 ― 補体は必ず正常である"],"a":2,"cx":["IgA のメサンギウム沈着は IgA 腎症。FSGS（focal segmental glomerulosclerosis：巣状分節性糸球体硬化症） は分節性の硬化で、ステロイドが効きにくいことが多い。","微小変化型は若い人に多く、急に発症し、ステロイドがよく効く（再発は多い）。","","膜性増殖性糸球体腎炎（とくに C3 腎症・HCV（hepatitis C virus：C型肝炎ウイルス） など）では低補体が多い。"],"core":"成人のネフローゼ：膜性腎症（中高年、ゆっくり、抗 PLA2R 抗体、二次性＝悪性腫瘍・薬・SLE（systemic lupus erythematosus：全身性エリテマトーデス）・B 型肝炎）、微小変化型（若年、急な発症、ステロイド反応性良好）、FSGS（ステロイド抵抗性が多い）。","e":"ネフローゼ症候群の基準：尿蛋白 3.5 g/日以上＋血清アルブミン 3.0 g/dL 以下（浮腫・脂質異常症は参考）。\n合併症：血栓症（腎静脈血栓症：膜性腎症に多い、アンチトロンビンの喪失）、感染症、脂質異常症、AKI（acute kidney injury：急性腎障害）。\n治療：原病の治療（ステロイド、免疫抑制薬：シクロスポリン（ネオーラル）・リツキシマブ（難治性の微小変化型・FSGS、膜性腎症））、浮腫には利尿薬、蛋白尿を減らす ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬）/ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬、血栓予防。\n糖尿病性腎症・アミロイドーシス（AL（immunoglobulin light chain：免疫グロブリン軽鎖、AL アミロイドーシス） 型）も成人のネフローゼの重要な原因。","tg":[],"mt":["glomerular","hbv"]},{"id":"kid-351b1323","f":"kid","u":54,"o":186,"lv":3,"q":"68歳の女性。2か月前から微熱と倦怠感があり、2週間でクレアチニンが 1.0 から 3.8 mg/dL に上がった。尿蛋白 2+、尿潜血 3+、尿沈渣で変形赤血球と赤血球円柱。胸部 CT（computed tomography：コンピュータ断層撮影） ですりガラス陰影があり、血痰が出ている。まず確かめる検査はどれか。","ch":["抗ミトコンドリア抗体と IgM（immunoglobulin M：免疫グロブリン M）","MPO-ANCA（ミエロペルオキシダーゼに対する ANCA）・PR3-ANCA（プロテイナーゼ3に対する ANCA） と抗 GBM（glomerular basement membrane：糸球体基底膜） 抗体","血清 IgE（immunoglobulin E：免疫グロブリン E） と末梢血の好酸球数だけ","TSH（thyroid-stimulating hormone：甲状腺刺激ホルモン） と FT4（甲状腺機能）"],"a":1,"cx":["抗ミトコンドリア抗体は原発性胆汁性胆管炎。","","好酸球・IgE が高ければ EGPA（eosinophilic granulomatosis with polyangiitis：好酸球性多発血管炎性肉芽腫症） を考えるが、まず ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） を測る。","甲状腺の検査では、急速に進む腎炎と肺出血は説明できない。"],"core":"急速進行性糸球体腎炎（RPGN（rapidly progressive glomerulonephritis：急速進行性糸球体腎炎））＋肺胞出血＝肺腎症候群。日本の高齢者では MPO-ANCA 関連血管炎（顕微鏡的多発血管炎）が最多。抗 GBM 抗体病も同時に調べる。","e":"RPGN の分類（蛍光抗体法）：①線状沈着（抗 GBM 抗体病：Goodpasture）②顆粒状の沈着（免疫複合体：ループス腎炎・IgA（immunoglobulin A：免疫グロブリン A） 腎症・感染後など）③沈着がほとんどない pauci-immune（ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） 関連血管炎）。\n治療（ANCA 関連血管炎）：ステロイド＋リツキシマブ（リツキサン）かシクロホスファミド（エンドキサン）。ステロイドを減らす目的でアバコパン（C5a 受容体拮抗薬）。重い腎障害・肺出血で血漿交換を考える。\n抗 GBM 抗体病：血漿交換＋ステロイド＋シクロホスファミド。ANCA と両方陽性の人もいる。\nRPGN は数週〜数か月で腎不全になるので、尿所見（血尿・円柱）とクレアチニンの急な上昇を見たらすぐ腎臓専門医へ。","tg":["cs"],"mt":["vasculitis","glomerular"]},{"id":"kid-152ebf9a","f":"kid","u":55,"o":187,"lv":2,"q":"遠位尿細管性アシドーシス（1型 RTA（renal tubular acidosis：尿細管性アシドーシス））について正しいものはどれか。","ch":["Fanconi 症候群を伴い、尿糖・アミノ酸尿が出る","高カリウム血症が特徴で、低アルドステロンが原因である","アニオンギャップが開大した代謝性アシドーシスになる","尿を酸性にできず、腎結石・腎石灰化を起こしやすい"],"a":3,"cx":["Fanconi 症候群は近位尿細管（2型 RTA）。","高カリウムを伴うのは4型 RTA（低レニン・低アルドステロン：糖尿病など）。","RTA はどれもアニオンギャップ正常（高 Cl 性）の代謝性アシドーシス。",""],"core":"1型（遠位）RTA＝H⁺ を尿に出せない。尿 pH 5.5 以上・低 K・腎石灰化/結石（尿中クエン酸↓）。原因：Sjögren 症候群・自己免疫疾患・薬（アムホテリシン B（ファンギゾン、アムビゾーム））。","e":"2型（近位）RTA：HCO₃⁻ の再吸収障害。Fanconi 症候群（尿糖・アミノ酸尿・リン酸尿）を伴うことが多い。原因：多発性骨髄腫（軽鎖）、薬（テノホビル・イホスファミド・バルプロ酸）、Wilson 病。\n4型 RTA：高カリウム。糖尿病性腎症・ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬）/ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬・スピロノラクトン・ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 合剤（トリメトプリム）・カルシニューリン阻害薬・ヘパリン。\n治療：アルカリ（クエン酸カリウム・ナトリウム）。4型は K を下げる治療（利尿薬・食事・フルドロコルチゾン）。","tg":[]},{"id":"kid-0acdfe34","f":"kid","u":55,"o":188,"lv":2,"q":"常染色体顕性多発性嚢胞腎（ADPKD（autosomal dominant polycystic kidney disease：常染色体顕性多発性嚢胞腎））について正しいものはどれか。","ch":["常染色体潜性遺伝で、小児期に腎不全になることが多い","トルバプタン（サムスカ）は腎臓が大きくなるのを促すので使わない","脳動脈瘤を合併しやすく、家族歴があれば MRA（mineralocorticoid receptor antagonist：ミネラルコルチコイド受容体拮抗薬） を考える","肝嚢胞は合併せず、腎臓以外の病変はない"],"a":2,"cx":["ADPKD は常染色体顕性（PKD1（polycystin-1 の遺伝子）・PKD2（polycystin-2 の遺伝子））。小児期に腎不全になる重い型は常染色体潜性（ARPKD（autosomal recessive polycystic kidney disease：常染色体潜性多発性嚢胞腎））。","トルバプタン（バソプレシン V2 受容体拮抗薬）は腎容積の増大と腎機能の低下を遅らせる（条件を満たす人に）。","","肝嚢胞は最も多い腎外病変（女性・妊娠回数で大きくなる）。"],"core":"ADPKD＝両側の腎に多数の嚢胞、成人で腎不全に（60歳頃までに約半数）。合併症：高血圧、脳動脈瘤（くも膜下出血）、肝嚢胞、心臓弁膜症（僧帽弁逸脱）、大腸憩室、腎の痛み・感染・出血・結石。","e":"トルバプタンの条件：腎容積 750 mL 以上かつ増大速度が年 5% 以上などの進行が速い人。副作用：多尿・口渇（水分をしっかりとる）、肝障害（毎月の肝機能検査）。\n嚢胞感染：嚢胞の中に届きやすい脂溶性の抗菌薬（キノロン・ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 合剤）。\n血圧は ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬）/ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬で厳しめに管理する。\n家族歴がない新規の変異もある。","tg":[]},{"id":"kid-3064c605","f":"kid","u":56,"o":189,"lv":3,"q":"68歳の女性。逆流性食道炎でオメプラゾール（オメプラール）を2か月前から飲んでいる。微熱と倦怠感があり、クレアチニンが 0.8 から 2.1 mg/dL に上がった。尿蛋白は軽度、尿沈渣に白血球と白血球円柱があり、尿中 β2 ミクログロブリンが高い。尿路感染症は否定的。最も考えられる診断と対応はどれか。","ch":["急性間質性腎炎 ― 原因薬の中止","腎後性腎不全 ― 尿道カテーテルの留置","IgA（immunoglobulin A：免疫グロブリン A） 腎症 ― 扁桃摘出とステロイドパルス","急性尿細管壊死 ― 大量の輸液だけを行う"],"a":0,"cx":["","腎後性は水腎症で、尿沈渣はきれいなことが多い。","IgA 腎症は血尿（変形赤血球・赤血球円柱）が中心。","急性尿細管壊死は虚血・腎毒性物質の後で、顆粒円柱（泥状の褐色円柱）が典型。"],"core":"急性間質性腎炎＝薬（PPI（proton pump inhibitor：プロトンポンプ阻害薬）・NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）・抗菌薬：β-ラクタム・キノロン・リファンピシン）、免疫チェックポイント阻害薬、感染、サルコイドーシス、シェーグレン病、IgG4（immunoglobulin G4：免疫グロブリン G のサブクラス4） 関連疾患、TINU（tubulointerstitial nephritis and uveitis） 症候群（ぶどう膜炎）。白血球尿・白血球円柱・尿細管マーカー（β2MG・NAG（N-acetyl-β-D-glucosaminidase、尿細管障害のマーカー））上昇。","e":"発熱・皮疹・好酸球増多の三徴がそろうのは一部（とくに PPI では目立たない）。\n腎生検で間質の炎症細胞浸潤（好酸球を含む）。\n原因薬の中止で改善しなければ早めにステロイド（遅れると線維化が残る）。\n尿中好酸球の検査は感度・特異度が低い。","tg":["cs"],"fig":["nephron"],"mt":["ild","glomerular"]},{"id":"kid-a9db637b","f":"kid","u":56,"o":190,"lv":2,"q":"尿検査の読み方として正しいものはどれか。","ch":["潜血陽性で沈渣に赤血球がなければ、ミオグロビン尿などを考える","試験紙の尿蛋白は、軽鎖（Bence Jones 蛋白）を鋭敏に検出する","変形赤血球と赤血球円柱は、膀胱癌に特徴的である","無症候性血尿は、年齢にかかわらず精査は不要である"],"a":0,"cx":["","試験紙は主にアルブミンを検出し、軽鎖は見逃しやすい。尿蛋白定量（スルホサリチル酸法）・免疫固定法で調べる。","変形赤血球・赤血球円柱は糸球体からの出血（糸球体腎炎）を示す。膀胱癌は形の均一な赤血球。","40歳以上・喫煙者・肉眼的血尿の既往などでは、膀胱癌・腎癌を除く（尿細胞診・膀胱鏡・CT（computed tomography：コンピュータ断層撮影））。"],"core":"尿潜血（試験紙）はヘモグロビンのペルオキシダーゼ様活性を見る。沈渣に赤血球がない陽性＝ミオグロビン尿（横紋筋融解）・ヘモグロビン尿（血管内溶血）。","e":"円柱の意味：赤血球円柱＝糸球体腎炎、白血球円柱＝腎盂腎炎・間質性腎炎、顆粒円柱（泥状）＝急性尿細管壊死、脂肪円柱・卵円形脂肪体＝ネフローゼ、硝子円柱＝正常でも少数（脱水・運動）。\n尿比重と尿浸透圧で尿の濃縮能を見る。\n糖尿病がないのに尿糖陽性：腎性糖尿、Fanconi 症候群、SGLT2（sodium-glucose cotransporter 2：ナトリウム・グルコース共輸送体2） 阻害薬、妊娠。","tg":[]},{"id":"kid-defb21f7","f":"kid","u":57,"o":191,"lv":3,"q":"19歳の男性。1週間前からまぶたと足のむくみが急に出た。尿蛋白 8.2 g/日、血清アルブミン 1.6 g/dL、LDL-C（LDL コレステロール） 320 mg/dL。血尿はほとんどなく、血圧・クレアチニンは正常、補体は正常。最も考えられる診断と治療の組み合わせはどれか。","ch":["ループス腎炎 ― 血漿交換","溶連菌感染後糸球体腎炎 ― 抗菌薬だけ","膜性腎症 ― まず悪性腫瘍の検索だけを行い治療しない","微小変化型ネフローゼ症候群 ― ステロイド"],"a":3,"cx":["ループス腎炎なら補体低下・抗核抗体・ほかの全身症状がある。","感染後糸球体腎炎は血尿・高血圧・補体低下を伴い、ネフローゼになることは少ない。","膜性腎症は中高年でゆっくり発症することが多い。若い人の急な発症・選択性の高い蛋白尿は微小変化型を考える。",""],"core":"微小変化型ネフローゼ症候群＝若年・急な発症・高度の蛋白尿（選択性が高い：IgG（immunoglobulin G：免疫グロブリン G）/トランスフェリンのクリアランス比 0.2 以下）、血尿・腎機能低下は少ない。光学顕微鏡では正常、電子顕微鏡で足突起の消失。ステロイドがよく効くが再発が多い。","e":"再発を繰り返す・ステロイド依存：シクロスポリン（ネオーラル）、リツキシマブ（リツキサン）。\n二次性：NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）、ホジキンリンパ腫、アレルギー。\n合併症：急性腎障害（とくに高齢者）、血栓症、感染症。\n巣状分節性糸球体硬化症（FSGS（focal segmental glomerulosclerosis：巣状分節性糸球体硬化症））：ステロイド抵抗性が多い。二次性（肥満・腎量の減少・HIV（human immunodeficiency virus：ヒト免疫不全ウイルス）・ヘロイン・遺伝性）では蛋白尿を減らす治療が中心。","tg":["cs"],"mt":["glomerular"]},{"id":"kid-61259e78","f":"kid","u":57,"o":192,"lv":2,"q":"糖尿病性腎臓病について正しいものはどれか。","ch":["アルブミン尿のない GFR（glomerular filtration rate：糸球体濾過量） 低下型もある","顕性アルブミン尿になったら、ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬） は中止する","網膜症のない人の急な蛋白尿でも、他の腎疾患は考えない","糖尿病の人の腎障害は、すべて糖尿病性腎症と考えてよい"],"a":0,"cx":["","ARB/ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬は蛋白尿を減らし腎を保護する。高カリウム・急な Cr 上昇に注意して続ける。","同上。網膜症の有無は糖尿病性腎症かどうかを考える手がかり。","網膜症がない・急な蛋白尿の増加・血尿・急な GFR（glomerular filtration rate：糸球体濾過量） 低下があれば、ほかの腎疾患（IgA（immunoglobulin A：免疫グロブリン A） 腎症・膜性腎症など）を考えて腎生検を検討する。"],"core":"糖尿病性腎臓病（DKD（diabetic kidney disease：糖尿病性腎臓病））＝典型的な糖尿病性腎症（アルブミン尿→GFR 低下）に加え、アルブミン尿のない GFR 低下（動脈硬化・高血圧）も含む広い概念。治療：血糖・血圧・脂質の管理、ARB/ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬、SGLT2（sodium-glucose cotransporter 2：ナトリウム・グルコース共輸送体2） 阻害薬、フィネレノン（ケレンディア）、GLP-1（glucagon-like peptide-1） 受容体作動薬（セマグルチド（オゼンピック・リベルサス、糖尿病、ウゴービ、肥満症）で腎イベント減少）。","e":"日本の透析導入の原因の第1位は糖尿病性腎症（近年は腎硬化症が増えている）。\n腎機能が落ちるとインスリン・SU（sulfonylurea：スルホニル尿素） 薬の作用が長引き低血糖が増える。\nHbA1c（ヘモグロビン A1c、過去1〜2か月の平均血糖の指標） は腎性貧血・ESA（erythropoiesis-stimulating agent：赤血球造血刺激因子製剤） で低めに出ることがある。","tg":[],"mt":["dmdrugs"]},{"id":"kid-28a9b1d8","f":"kid","u":57,"o":193,"lv":2,"q":"多発性骨髄腫に伴う腎障害で最も多いものはどれか。","ch":["膜性腎症","溶連菌感染後糸球体腎炎","IgA（immunoglobulin A：免疫グロブリン A） 腎症","円柱腎症（骨髄腫腎）"],"a":3,"cx":["膜性腎症の二次性の原因には固形癌があるが、骨髄腫の腎障害の主な型ではない。","感染後糸球体腎炎は骨髄腫の腎障害ではない。","IgA 腎症は骨髄腫と直接の関係はない。",""],"core":"骨髄腫腎（円柱腎症）＝遊離軽鎖が尿細管で Tamm-Horsfall 蛋白と円柱をつくり詰まる。脱水・高カルシウム・NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）・造影剤で悪化。治療は輸液・原因の除去・早い骨髄腫の治療（遊離軽鎖を速く下げる）。","e":"ほかの軽鎖による腎病変：AL（immunoglobulin light chain：免疫グロブリン軽鎖、AL アミロイドーシス） アミロイドーシス（ネフローゼ）、軽鎖沈着症、Fanconi 症候群（近位尿細管）。\n単クローン性免疫グロブリンが関わる腎症（MGRS（monoclonal gammopathy of renal significance））：骨髄腫の基準を満たさなくても、腎を守るため治療が必要。\n高齢者の原因不明の腎障害・蛋白尿（試験紙で陰性なのに定量で多い）では、血清・尿の M 蛋白・遊離軽鎖を測る。","tg":[],"fig":["nephron"],"mt":["hemetumor"]},{"id":"kid-eb02ea97","f":"kid","u":58,"o":194,"lv":2,"q":"腎代替療法の選択について正しいものはどれか。","ch":["腹膜透析は、残っている腎機能を早く失わせる","腎移植は、透析を始めてからでないと受けられない","高齢者には、腎代替療法の説明をしなくてよい","透析・腎移植について保存期から説明し、本人と選ぶ"],"a":3,"cx":["腹膜透析は残腎機能を比較的保ちやすい。","透析を始める前の腎移植（先行的腎移植）もでき、予後が良い。","高齢者でも、透析を行わない保存的腎臓療法（CKM（conservative kidney management：保存的腎臓療法））を含めて説明し、共同で意思決定する。",""],"core":"腎代替療法の選択＝eGFR（estimated glomerular filtration rate：推算糸球体濾過量） が 30 未満を目安に早めに説明（療法選択外来）。血液透析・腹膜透析・腎移植（生体・献腎）と、透析をしない保存的腎臓療法を、生活・価値観に合わせて選ぶ（共同意思決定）。","e":"血液透析のバスキュラーアクセス（内シャント）は、作ってから使えるまで数週かかるので早めに準備する。シャントの腕で採血・血圧測定をしない。\n透析患者の合併症：心血管病（死因の上位）、感染症、CKD-MBD（CKD に伴う骨ミネラル代謝異常）、透析アミロイドーシス（β2 ミクログロブリン：手根管症候群）、腎性貧血、栄養障害。\n腎移植後：カルシニューリン阻害薬などの免疫抑制薬（薬物相互作用・腎毒性）、感染症（CMV（cytomegalovirus：サイトメガロウイルス）・BK ウイルス）、悪性腫瘍（皮膚癌・移植後リンパ増殖性疾患）。","tg":[]},{"id":"kid-45e76dbf","f":"kid","u":59,"o":195,"lv":3,"q":"42歳の男性。突然、左の腰背部から下腹部・陰嚢に放散する激しい痛みが起こり、じっとしていられない。顕微鏡的血尿がある。発熱はない。CT（computed tomography：コンピュータ断層撮影） で左尿管に 5 mm の結石と軽い水腎症がある。対応として最も適切なのはどれか。","ch":["大動脈解離と考え、緊急手術を行う","NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） で鎮痛し、自然排石を待つ","抗菌薬を3週間使い、結石を溶かす","ただちに開腹手術で、結石を取り出す"],"a":1,"cx":["画像で尿管結石が確認されている。ただし高齢者の初発の「腎疝痛」では腹部大動脈瘤の破裂を必ず考える。","","結石は抗菌薬では溶けない。発熱を伴う閉塞性腎盂腎炎は緊急のドレナージ。","10 mm 未満（とくに 5 mm 以下）の尿管結石は自然排石が多い。手術は排石しない・感染・腎機能障害のとき。"],"core":"尿管結石の疝痛＝NSAIDs（腎機能に注意）が第一選択、排石を促す α遮断薬（タムスロシン、国内では適応外）。発熱を伴う閉塞（閉塞性腎盂腎炎）は尿管ステント・腎瘻で緊急ドレナージ。","e":"結石の成分：シュウ酸カルシウム（最多）、リン酸カルシウム、尿酸（X 線で写らない、尿のアルカリ化で溶ける）、リン酸マグネシウムアンモニウム（感染結石、ウレアーゼ産生菌）、シスチン（遺伝性）。\n再発予防：1日 2 L 以上の尿量、塩分・動物性蛋白・シュウ酸を控え、カルシウムは控えすぎない（腸でシュウ酸と結合）、クエン酸製剤。\n背景の病気：原発性副甲状腺機能亢進症、尿細管性アシドーシス、痛風、Crohn 病（腸性高シュウ酸尿）。","tg":["cs"]},{"id":"kid-0e98a038","f":"kid","u":59,"o":196,"lv":2,"q":"造影剤腎症の予防について正しいものはどれか。","ch":["腎機能が低い人では、検査の前後に生理食塩水などで輸液する","腎機能が低い人には造影 CT（computed tomography：コンピュータ断層撮影） は禁忌で、どんな場合も行わない","N-アセチルシステイン（アセチルシステイン内用液）の内服が最も確実な予防法である","造影剤腎症はクレアチニンが造影直後の数分で上がる"],"a":0,"cx":["","必要性が高ければ、危険と利益を比べて、予防をしながら行う（緊急の診断を遅らせない）。","N-アセチルシステインの予防効果ははっきりしない（推奨されない）。","造影剤腎症は通常、造影の24〜72時間後にクレアチニンが上がる。"],"core":"造影剤腎症の危険因子：eGFR（estimated glomerular filtration rate：推算糸球体濾過量） 低下（とくに 30 未満、静注造影なら 45 未満から注意）、糖尿病性腎症、脱水、心不全、高齢、大量の造影剤、NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） など腎毒性薬。予防：必要性の検討、最小量、前後の輸液。","e":"透析中の患者では造影後の緊急透析は不要とされる（残腎機能の保護を考える場合は別）。\nメトホルミン（メトグルコ）は eGFR に応じて造影の前後で休薬する。\nガドリニウム造影剤（MRI（magnetic resonance imaging：磁気共鳴画像））は重い腎機能低下で腎性全身性線維症の危険。","tg":[],"mt":["hfdrugs"]},{"id":"resp-a73b8715","f":"resp","u":60,"o":197,"lv":1,"q":"酸素解離曲線が右に移動する（酸素を離しやすくなる）条件はどれか。","ch":["体温の低下・アルカローシス・CO₂ の低下","胎児ヘモグロビン（HbF（fetal hemoglobin：胎児ヘモグロビン））の増加","体温↑・アシドーシス・CO₂↑・2,3-DPG（2,3-ジホスホグリセリン酸、2,3-DPG）↑","一酸化炭素ヘモグロビンの増加"],"a":2,"cx":["低体温・アルカローシスは左方移動（酸素を離しにくい）。","胎児ヘモグロビンは酸素との親和性が高い（左方移動）。","","CO は酸素の結合を強めて離しにくくする（左方移動）し、運べる酸素も減らす。"],"core":"右方移動（組織で酸素を渡しやすい）＝体温↑・H⁺↑（pH↓）・CO₂↑・2,3-DPG↑（慢性の低酸素・貧血・高地）。運動中の筋肉で起こる（Bohr 効果）。","e":"SpO₂ 90% ≒ PaO₂ 60 Torr（曲線の肩）。これより下がると急に飽和度が落ちる。\n酸素含量＝1.34×Hb×SaO₂＋0.003×PaO₂。貧血では PaO₂・SpO₂ が正常でも酸素含量は少ない。\nメトヘモグロビン血症（局所麻酔薬・ダプソン・亜硝酸）：チョコレート色の血液、SpO₂ が 85% 前後に固定、メチレンブルー（G6PD（glucose-6-phosphate dehydrogenase：グルコース-6-リン酸脱水素酵素） 欠損症では禁忌）。","tg":[],"fig":["acidbase"]},{"id":"resp-e4c6960a","f":"resp","u":60,"o":198,"lv":1,"q":"胸部X線のシルエットサインについて正しいものはどれか。","ch":["右第2弓（右房）の境界が消えるのは右中葉の病変である","左第4弓（左室）の境界が消えるのは左下葉の病変である","大動脈弓の境界が消えるのは右下葉の病変である","横隔膜の境界が消えるのは上葉の病変である"],"a":0,"cx":["","左第4弓（左室）の境界が消えるのは、左室に接する舌区の病変。","大動脈弓（左第1弓）の境界が消えるのは左上葉（上大区）の病変。","横隔膜の境界が消えるのは下葉の病変。"],"core":"シルエットサイン＝同じ X 線の吸収の物どうしが接すると境界が消える。右第2弓（右房）＝右中葉、左第4弓（左室）＝舌区、横隔膜＝下葉、上行大動脈＝右上葉（前区）、大動脈弓＝左上葉。","e":"胸部X線の読み方：気管の偏位、縦隔、肺門、心胸郭比（50% 以下が正常、立位 PA（primary aldosteronism：原発性アルドステロン症） 像で）、肋骨横隔膜角（胸水）、横隔膜下（遊離ガス）、骨・軟部組織。\n肺門の大きさの左右差、気管支透亮像（air bronchogram：肺胞に液体がたまり気管支だけが空気で見える＝肺炎・肺水腫）。\nKerley B 線：肺の外側の短い水平な線、小葉間隔壁の肥厚（肺水腫・癌性リンパ管症）。","tg":[]},{"id":"resp-d6406855","f":"resp","u":60,"o":199,"lv":1,"q":"呼吸の調節について正しいものはどれか。","ch":["代謝性アシドーシスでは、換気は低下する","頸動脈小体は PaCO₂ だけを感知し、PaO₂ には反応しない","慢性の CO₂ 貯留では、低酸素の刺激は呼吸に全く関係しない","主に延髄の中枢化学受容体が PaCO₂ を感知する"],"a":3,"cx":["代謝性アシドーシスでは換気が増え（Kussmaul 呼吸）、PaCO₂ を下げて代償する。","頸動脈小体（末梢化学受容体）は PaO₂ の低下（60 Torr 以下で強く）、PaCO₂・H⁺ に反応する。","慢性の高 CO₂ 血症では CO₂ への反応が鈍り、低酸素の刺激への依存が高まると考えられている（高濃度酸素で CO₂ ナルコーシス）。",""],"core":"換気の調節＝中枢化学受容体（延髄、CO₂・pH）が主、末梢化学受容体（頸動脈小体・大動脈小体、O₂・CO₂・pH）。換気量で PaCO₂ が決まる（PaCO₂ は肺胞換気量に反比例）。","e":"異常な呼吸パターン：\n・Cheyne-Stokes 呼吸：無呼吸と過呼吸の周期的な繰り返し（心不全・脳卒中）\n・Kussmaul 呼吸：深く速い呼吸（代謝性アシドーシス）\n・Biot 呼吸：不規則な呼吸と無呼吸（延髄・橋の障害）\n・下顎呼吸：死が近い徴候\n高 CO₂ 血症の症状：頭痛・傾眠・羽ばたき振戦・皮膚の紅潮・発汗。","tg":[],"fig":["acidbase"]},{"id":"resp-bc8c5fad","f":"resp","u":61,"o":200,"lv":1,"q":"室内気で PaO₂ 60 Torr、PaCO₂ 40 Torr のときの肺胞気-動脈血酸素分圧較差（A-aDO₂）に最も近いのはどれか（大気圧 760 Torr、呼吸商 0.8 とする）。","ch":["約 10 Torr","約 150 Torr","約 90 Torr","約 40 Torr"],"a":3,"cx":["10 Torr は正常（若い人）。計算が合わない。","150 は吸入気の酸素分圧に近い値で、較差ではない。","計算が合わない。",""],"core":"PAO₂＝0.21×（760－47）－PaCO₂/0.8＝150－50＝100。A-aDO₂＝100－60＝40 Torr（開大）。","e":"A-aDO₂ の正常は 10 Torr 前後（年齢とともに広がり、年齢/4＋4 程度まで）。\n低酸素血症の原因と A-aDO₂：\n・正常：肺胞低換気（PaCO₂ が上がる：薬・神経筋疾患・肥満低換気）、吸入酸素の低下（高地）\n・開大：換気血流比の不均等（最も多い、酸素でよく上がる）、シャント（酸素で上がりにくい：ARDS（acute respiratory distress syndrome：急性呼吸窮迫症候群）・無気肺・動静脈奇形）、拡散障害（間質性肺炎、運動で悪化）\nⅠ型呼吸不全＝PaO₂ 60 以下で PaCO₂ 45 以下、Ⅱ型＝PaCO₂ 45 超。Ⅱ型への高濃度酸素は CO₂ ナルコーシスに注意（目標 SpO₂ 88〜92%）。","tg":[],"fig":["acidbase"]},{"id":"resp-7c3a4260","f":"resp","u":61,"o":201,"lv":1,"q":"呼吸機能検査で閉塞性換気障害と拘束性換気障害を区別する指標の組み合わせとして正しいものはどれか。","ch":["閉塞性＝残気量の低下、拘束性＝残気量の増加","閉塞性＝DLco（diffusing capacity for carbon monoxide：肺拡散能） 低下、拘束性＝DLco 上昇","閉塞性＝1秒率 70% 未満、拘束性＝%肺活量 80% 未満","閉塞性＝%肺活量 80% 未満、拘束性＝1秒率 70% 未満"],"a":2,"cx":["閉塞性（COPD（chronic obstructive pulmonary disease：慢性閉塞性肺疾患）・喘息）では空気がとらえられて残気量が増え、拘束性では減る。","DLco（拡散能）は肺気腫・間質性肺炎・肺血管病変で下がる。区別の主な指標ではない。","","逆になっている。"],"core":"1秒率（FEV1（forced expiratory volume in 1 second：1秒量）/FVC（forced vital capacity：努力肺活量））70% 未満＝閉塞性（COPD（chronic obstructive pulmonary disease：慢性閉塞性肺疾患）・喘息）。%肺活量 80% 未満＝拘束性（間質性肺炎・胸郭の病気・神経筋疾患）。両方＝混合性。","e":"DLco が下がる：肺気腫（肺胞が壊れる）、間質性肺炎、肺高血圧・肺塞栓、貧血。上がる：肺胞出血、多血症、喘息（ときに）。\nCOPD と喘息の区別：気管支拡張薬で 1秒量が 12% かつ 200 mL 以上改善すれば可逆性あり（喘息に多い）。呼気一酸化窒素（FeNO（fractional exhaled nitric oxide：呼気一酸化窒素））高値は好酸球性の気道炎症。\nフローボリューム曲線：閉塞性は下に凸、上気道の固定性狭窄（気管腫瘍）は吸気・呼気とも平らになる。","tg":[],"fig":["lungvol","flowvol"]},{"id":"resp-8ef87d8d","f":"resp","u":62,"o":202,"lv":2,"q":"成人喘息の長期管理について正しいものはどれか。","ch":["ICS（inhaled corticosteroid：吸入ステロイド） は全身の副作用が多いので、症状がなければ使わない","SABA（短時間作用性 β2 刺激薬）だけを毎日使うのが基本である","吸入ステロイドが土台で、重さに応じて LABA（long-acting β2 agonist：長時間作用性 β2 刺激薬） などを加える","生物学的製剤は、ICS（inhaled corticosteroid：吸入ステロイド） を使っていない人にまず使う"],"a":2,"cx":["ICS は全身への影響が少なく、気道の炎症を抑える土台。口腔カンジダ・声がれはうがいで減らす。","SABA だけに頼ると重い発作・死亡が増える。発作止めは必要なときだけ。","","生物学的製剤は高用量 ICS＋ほかの長期管理薬でも抑えられない重症の人に使う。"],"core":"喘息の基本＝ICS（気道の好酸球性炎症を抑える）。治療ステップ1〜4：ICS の量を増やし、LABA・LAMA（long-acting muscarinic antagonist：長時間作用性抗コリン薬）・ロイコトリエン受容体拮抗薬・テオフィリンを加え、重症は生物学的製剤。","e":"重症喘息の生物学的製剤（標的）：\n・オマリズマブ：IgE（アレルギー性、血清 IgE と体重で量を決める）\n・メポリズマブ：IL-5（interleukin-5：インターロイキン5）、ベンラリズマブ（ファセンラ）：IL-5 受容体α（好酸球が多い）\n・デュピルマブ：IL-4（interleukin-4：インターロイキン4） 受容体α（IL-4・IL-13（interleukin-13：インターロイキン13））\n・テゼペルマブ：TSLP（タイプ2 以外にも）\nICS/ホルモテロールを維持と発作時の両方に使う方法（SMART（single maintenance and reliever therapy） 療法）もある。\n喘息のコントロールを悪くするもの：喫煙、鼻炎・副鼻腔炎、肥満、GERD（gastroesophageal reflux disease：胃食道逆流症）、β遮断薬、NSAIDs（アスピリン喘息）。","tg":[]},{"id":"resp-bea2b595","f":"resp","u":62,"o":203,"lv":3,"q":"35歳の女性。喘息で通院中。鼻茸を伴う慢性副鼻腔炎があり、においがわからない。歯痛でロキソプロフェン（ロキソニン）を飲んだ1時間後に、鼻水・鼻づまりに続いて強い喘鳴が出た。この人が今後鎮痛薬を使うときに最も勧められるのはどれか。","ch":["鎮痛薬は、どの薬も全く使えないと説明する","同じ COX-1（cyclooxygenase-1：シクロオキシゲナーゼ1） 阻害作用をもつイブプロフェン（ブルフェン）に変える","アスピリンの大量投与（減感作）にすぐ変える","アセトアミノフェン（カロナール）を少量（1回 300 mg 以下）で使う"],"a":3,"cx":["アセトアミノフェン（少量）や選択的 COX-2（cyclooxygenase-2：シクロオキシゲナーゼ2） 阻害薬（セレコキシブ（セレコックス））は比較的安全に使える。","ほとんどの NSAIDs（COX-1 阻害薬）で同じ発作が起こる。","アスピリンも同じ機序で発作を起こす。",""],"core":"NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） 過敏喘息（アスピリン喘息、N-ERD（NSAIDs-exacerbated respiratory disease：NSAIDs 過敏喘息））＝COX-1 阻害でロイコトリエンが過剰になる。成人発症・鼻茸・嗅覚障害。安全：アセトアミノフェン少量、セレコキシブ（セレコックス）、モルヒネなど。","e":"原因はアレルギー（IgE（immunoglobulin E：免疫グロブリン E））ではなく、薬の作用（不耐症）。ほぼすべての COX-1 阻害薬で起こる。\nほかに注意：コハク酸エステル型のステロイドの急速静注（発作を悪化させうる）、着色料・防腐剤、香料。\n鼻茸を伴う慢性副鼻腔炎（好酸球性副鼻腔炎）：術後も再発が多く、デュピルマブ（デュピクセント）などが使われる。","tg":["cs"]},{"id":"resp-2dfc7faf","f":"resp","u":63,"o":204,"lv":2,"q":"COPD（chronic obstructive pulmonary disease：慢性閉塞性肺疾患） の安定期の治療について正しいものはどれか。","ch":["禁煙が最も重要で、薬は LAMA（long-acting muscarinic antagonist：長時間作用性抗コリン薬）・LABA（long-acting β2 agonist：長時間作用性 β2 刺激薬） が中心","酸素療法は、SpO₂ にかかわらず全員に行う","安定期の COPD には、抗菌薬の連日内服が勧められる","吸入ステロイドを、全員にまず単独で使う"],"a":0,"cx":["","在宅酸素療法は、安静時 PaO₂ 55 Torr 以下（または 60 以下で睡眠時・運動時に著しい低酸素）などの人が対象。","抗菌薬の長期投与は一般には勧められない（マクロライドは増悪の多い人で考えることがある）。","ICS（inhaled corticosteroid：吸入ステロイド） は増悪を繰り返し、末梢血の好酸球が多い人で LAMA（long-acting muscarinic antagonist：長時間作用性抗コリン薬）/LABA（long-acting β2 agonist：長時間作用性 β2 刺激薬） に加える。単独では使わない（肺炎が増える）。"],"core":"COPD＝禁煙が最優先。LAMA か LABA → 効果不十分なら LAMA/LABA。増悪を繰り返し好酸球が多ければ ICS（inhaled corticosteroid：吸入ステロイド） を加える（3剤）。呼吸リハビリ、インフルエンザ・肺炎球菌・RS（respiratory syncytial） ウイルスなどのワクチン。","e":"COPD の診断：気管支拡張薬吸入後の 1秒率 70% 未満で、ほかの病気を除く。病期は %1秒量で I〜IV 期。\n増悪の治療（ABC アプローチ）：Antibiotics（喀痰の膿性化など）、Bronchodilators（SABA（short-acting β2 agonist：短時間作用性 β2 刺激薬））、Corticosteroids（全身ステロイド5日程度）。Ⅱ型呼吸不全には NPPV（non-invasive positive pressure ventilation：非侵襲的陽圧換気）。\n喘息との合併（ACO（asthma-COPD overlap：喘息と COPD のオーバーラップ））は ICS を含めた治療が必要。\n合併症：肺癌・心血管病・骨粗鬆症・うつ・サルコペニア・肺高血圧。\nα1-アンチトリプシン欠乏症：若い人の下肺野優位の肺気腫（日本ではまれ）。","tg":[],"fig":["flowvol"],"mt":["vaccine","pneumonia"]},{"id":"resp-99d40dd7","f":"resp","u":64,"o":205,"lv":2,"q":"特発性肺線維症（IPF（idiopathic pulmonary fibrosis：特発性肺線維症））について正しいものはどれか。","ch":["ステロイドの単独治療がよく効き、予後は良好である","抗線維化薬は咳止めで、病気の進行は変えない","若い女性に多く、ばち指はまれである","HRCT（high-resolution CT：高分解能CT） で胸膜直下・肺底部優位の蜂巣肺（UIP（usual interstitial pneumonia：通常型間質性肺炎））"],"a":3,"cx":["ステロイド単独は効かず、免疫抑制薬との併用はかえって有害（PANTHER 試験）。","ピルフェニドン（ピレスパ）・ニンテダニブは肺活量の低下を遅らせる。","高齢の男性・喫煙者に多く、ばち指・下肺の捻髪音（fine crackles）が多い。",""],"core":"IPF＝原因のわからない UIP パターン（胸膜直下・肺底部の蜂巣肺・牽引性気管支拡張）。治療は抗線維化薬（ピルフェニドン（ピレスパ）・ニンテダニブ）。急性増悪は死亡率が高い。","e":"まず膠原病・過敏性肺炎・薬剤性・じん肺（石綿など）など原因のある間質性肺炎を除く（問診と自己抗体）。\nKL-6（Krebs von den Lungen-6：間質性肺炎のマーカー）・SP-D（surfactant protein-D）：間質性肺炎の活動性のマーカー。\n副作用：ピルフェニドン＝光線過敏・食欲低下、ニンテダニブ（オフェブ）＝下痢・肝障害。\n肺癌の合併が多い。\n進行性肺線維症（PPF（progressive pulmonary fibrosis：進行性肺線維症））：IPF 以外でも線維化が進むものにニンテダニブ。\n急性増悪：ステロイドパルスが使われるが効果は限られる。手術・気管支鏡・感染・一部の抗がん薬が誘因になる。","tg":[]},{"id":"resp-6558f704","f":"resp","u":64,"o":206,"lv":2,"q":"過敏性肺炎について正しいものはどれか。","ch":["BAL（bronchoalveolar lavage：気管支肺胞洗浄） ではリンパ球が減り、好中球が著しく増える","血清 IgE（immunoglobulin E：免疫グロブリン E） と好酸球が著しく上がる I 型アレルギーである","喫煙者に多く、禁煙すると発症しやすくなる","原因の環境（夏型・鳥関連）から離れると良くなる"],"a":3,"cx":["BAL ではリンパ球が増え、CD4（CD4 陽性 T 細胞、ヘルパー T 細胞）/CD8 比は低下することが多い。","主に III 型と IV 型アレルギー。IgE・好酸球は目立たない。","過敏性肺炎は非喫煙者に多い（喫煙で抗体ができにくい）。",""],"core":"過敏性肺炎＝吸い込んだ抗原への免疫反応。日本の急性型は夏型（古い木造家屋のトリコスポロン）が多く、入院（環境から離れる）で良くなり、帰宅で悪化する。慢性型は鳥関連（羽毛布団・鳩）が多い。","e":"CT（computed tomography：コンピュータ断層撮影）：急性型＝小葉中心性の粒状影・すりガラス影、慢性型＝線維化（UIP（usual interstitial pneumonia：通常型間質性肺炎） に似ることがある）、モザイクパターン（エアトラッピング）。\n診断：環境の問診、特異抗体（トリコスポロン抗体・鳥抗原抗体）、帰宅誘発試験。\n治療：抗原の回避が最も大事、必要ならステロイド、線維化が進めば抗線維化薬。\nほかの職業・環境性：農夫肺（好熱性放線菌）、加湿器肺、空調肺、塗装工（イソシアネート）。","tg":[],"mt":["pneumonia","ild"]},{"id":"resp-84afe31e","f":"resp","u":64,"o":207,"lv":3,"q":"70歳の男性。肺腺癌で免疫チェックポイント阻害薬（ニボルマブ（オプジーボ））の投与を3回受けた。1週間前から乾いた咳と息切れが出てきた。SpO₂ 90%（室内気）。CT（computed tomography：コンピュータ断層撮影） で両側にすりガラス影が新たに出現した。発熱はなく、喀痰・血液の検査で感染症は見つからない。最も適切な対応はどれか。","ch":["ニボルマブを休薬し、全身ステロイドを始める","ニボルマブを続け、抗菌薬だけを追加する","ニボルマブを増量して経過を見る","何もせず、次の投与予定日まで待つ"],"a":0,"cx":["","感染症が否定的で、薬剤性肺障害（irAE（immune-related adverse event：免疫関連有害事象） の肺臓炎）を最も考える。抗菌薬だけでは治らない。","肺臓炎が悪化して命にかかわる。増量は誤り。","Grade 2 以上（症状あり）の肺臓炎は休薬とステロイドが必要。待つのは危険。"],"core":"薬剤性肺障害（免疫関連の肺臓炎を含む）＝原因薬の中止、中等症以上は全身ステロイド（プレドニゾロン（プレドニン） 1〜2 mg/kg 相当）。感染症（ニューモシスチス・細菌・ウイルス）・癌の進行・心不全を除く。","e":"肺障害を起こしやすい薬：抗がん薬（EGFR（上皮成長因子受容体、肺癌の遺伝子／推算 GFR は eGFR） 阻害薬ゲフィチニブ、ブレオマイシン（ブレオ）、免疫チェックポイント阻害薬など）、メトトレキサート（リウマトレックス）、アミオダロン（アンカロン）、金製剤、漢方薬（小柴胡湯など：インターフェロンとの併用）、ニトロフラントイン。\n既存の間質性肺炎があると起こりやすく重い。\nアミオダロン肺：高い CT 値の肺病変（ヨウ素）、長期使用で起こる。","tg":["ae","cs"],"mt":["irae","hfdrugs"]},{"id":"resp-7fcd2a37","f":"resp","u":64,"o":208,"lv":2,"q":"サルコイドーシスについて正しいものはどれか。","ch":["両側肺門リンパ節腫脹、ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素）・sIL-2R（soluble interleukin-2 receptor：可溶性IL-2受容体） が上がる","心臓病変は、予後に関係しない","組織は、乾酪壊死を伴う肉芽腫である","高カルシウム血症は、ビタミン D の不足で起こる"],"a":0,"cx":["","心サルコイドーシスは房室ブロック・心室頻拍・心不全・突然死の原因で、予後を大きく左右する。","サルコイドーシスの肉芽腫は乾酪壊死を伴わない（類上皮細胞肉芽腫）。乾酪壊死は結核。","肉芽腫のマクロファージが活性型ビタミン D（1,25(OH)₂D）をつくるので、高カルシウム血症・高カルシウム尿になる。"],"core":"サルコイドーシス＝非乾酪性類上皮細胞肉芽腫。両側肺門リンパ節腫脹（BHL（bilateral hilar lymphadenopathy：両側肺門リンパ節腫脹））、眼（ぶどう膜炎）、皮膚、心臓、神経。ACE・可溶性 IL-2（interleukin-2：インターロイキン2） 受容体・リゾチーム↑。BAL（bronchoalveolar lavage：気管支肺胞洗浄） でリンパ球↑・CD4（CD4 陽性 T 細胞、ヘルパー T 細胞）/CD8 比↑。","e":"ツベルクリン反応は陰性化しやすい（細胞性免疫のアンバランス）。\n心サルコイドーシスの検査：心電図・ホルター、心エコー（心室中隔基部の菲薄化）、FDG-PET（フルオロデオキシグルコースを使った PET）、心臓 MRI（遅延造影）。\n治療：自然に軽快することも多い。臓器の障害（心臓・眼・神経・肺の進行・高カルシウム血症）があればステロイド。\nLöfgren 症候群：BHL・結節性紅斑・関節炎（足関節）・発熱、予後良好。","tg":[],"mt":["ild"]},{"id":"resp-03455fde","f":"resp","u":65,"o":209,"lv":2,"q":"進行非小細胞肺癌の治療方針を決めるために、まず調べるべきものはどれか。","ch":["ドライバー遺伝子と PD-L1（programmed death-ligand 1） の発現","血清 NSE（neuron-specific enolase：神経特異エノラーゼ） と ProGRP（pro-gastrin-releasing peptide） だけ","血清 CEA（carcinoembryonic antigen：癌胎児性抗原）・CYFRA（サイトケラチン19フラグメント） の値だけ","喫煙歴の有無と喫煙指数だけ"],"a":0,"cx":["","NSE・ProGRP は小細胞肺癌のマーカー。","CEA は経過を見るマーカー。治療薬は決められない。","非喫煙者に EGFR（上皮成長因子受容体、肺癌の遺伝子／推算 GFR は eGFR） 変異は多いが、喫煙歴だけで決めず、必ず検査する。"],"core":"進行した非小細胞肺癌（とくに腺癌）は、まず遺伝子パネル検査でドライバー変異を調べ、あれば分子標的薬（EGFR（上皮成長因子受容体、肺癌の遺伝子／推算 GFR は eGFR）→オシメルチニブ（タグリッソ）、ALK（anaplastic lymphoma kinase、肺癌の融合遺伝子）→アレクチニブ（アレセンサ）・ロルラチニブなど）。なければ PD-L1 の発現で免疫チェックポイント阻害薬（±化学療法）。","e":"日本人の肺腺癌では EGFR 変異が多い（約4〜5割）。女性・非喫煙者に多い。\n扁平上皮癌：中枢型・喫煙者・PTHrP（PTH-related protein：副甲状腺ホルモン関連蛋白） による高カルシウム血症・空洞。\n小細胞癌：中枢型・喫煙者・急速に進行・早くから転移、化学療法と放射線がよく効くが再発が多い。SIADH（syndrome of inappropriate secretion of antidiuretic hormone：抗利尿ホルモン不適合分泌症候群）・Lambert-Eaton・異所性 ACTH（adrenocorticotropic hormone：副腎皮質刺激ホルモン）。限局型は化学放射線療法、進展型は化学療法＋免疫チェックポイント阻害薬。\n肺尖部の癌（Pancoast 腫瘍）：Horner 症候群・腕神経叢の障害（尺側の痛み）。\n上大静脈症候群：顔・上肢のむくみ、胸壁の静脈怒張。","tg":[],"mt":["irae"]},{"id":"resp-54c1c9a6","f":"resp","u":66,"o":210,"lv":2,"q":"胸水の Light の基準で滲出性と判断されるのはどれか。","ch":["胸水/血清の総蛋白比が 0.3 より小さい","胸水の糖が血糖と同じである","胸水/血清の LDH（lactate dehydrogenase：乳酸脱水素酵素） 比が 0.6 より大きい","胸水の LDH（lactate dehydrogenase：乳酸脱水素酵素） が血清 LDH 正常上限の 1/3 より小さい"],"a":2,"cx":["蛋白比は 0.5 より大きいと滲出性。","糖は Light の基準に入らない。","","胸水 LDH が血清正常上限の 2/3 より大きいと滲出性。"],"core":"Light の基準（1つでも当てはまれば滲出性）：①胸水/血清 蛋白比＞0.5 ②胸水/血清 LDH 比＞0.6 ③胸水 LDH＞血清 LDH 正常上限の 2/3。","e":"漏出性：心不全（最多、利尿薬で滲出性に見えることがある→血清−胸水アルブミン差 1.2 g/dL 超なら漏出性）、肝硬変、ネフローゼ。\n滲出性：肺炎随伴性胸水・膿胸、悪性（肺癌・乳癌・中皮腫）、結核（リンパ球優位・ADA（adenosine deaminase：アデノシンデアミナーゼ） 高値）、膠原病（RA（rheumatoid arthritis：関節リウマチ） は糖が低い）、肺塞栓、膵炎（アミラーゼ高値）。\n胸腔ドレナージが必要な肺炎随伴性胸水：膿・グラム染色/培養陽性・pH 7.2 未満・糖 40 mg/dL 未満・隔壁形成。\n悪性胸膜中皮腫：石綿（アスベスト）の曝露から30〜40年、胸膜プラーク、胸水のヒアルロン酸高値。","tg":[],"mt":["pleural"]},{"id":"resp-a48b5f45","f":"resp","u":66,"o":211,"lv":2,"q":"自然気胸について正しいものはどれか。","ch":["緊張性気胸は、胸部 CT（computed tomography：コンピュータ断層撮影） で確かめてから脱気する","原発性はやせ型の若い男性に多く、喫煙で再発が増える","月経随伴性気胸は、左側に多い","軽い気胸でも、全例で胸腔ドレナージが必要である"],"a":1,"cx":["緊張性気胸（ショック・気管の偏位・頸静脈怒張）は画像を待たず、すぐ脱気する。","","月経随伴性気胸（胸腔内子宮内膜症）は右側に多い。","軽症（肺の虚脱が軽い）は安静や外来での経過観察、穿刺脱気でよいこともある。"],"core":"原発性自然気胸＝若い・やせ型・長身・男性・喫煙、肺尖部のブラの破裂。続発性＝COPD（chronic obstructive pulmonary disease：慢性閉塞性肺疾患）・間質性肺炎・肺癌・LAM（lymphangioleiomyomatosis：リンパ脈管筋腫症）・Birt-Hogg-Dubé 症候群など、症状が重い。","e":"再発の予防：手術（胸腔鏡下ブラ切除）、胸膜癒着術。2回目の気胸、両側、緊張性、血気胸、続発性、職業（パイロット・ダイバー）では手術を考える。\n緊張性気胸：第2肋間鎖骨中線（または第4〜5肋間中腋窩線）に太い針で緊急脱気→ドレナージ。\n再膨張性肺水腫：長く虚脱した肺を急に膨らませると起こる。ゆっくり脱気する。","tg":[],"fig":["flowvol"],"mt":["pneumonia","ild"]},{"id":"resp-365b3756","f":"resp","u":67,"o":212,"lv":2,"q":"閉塞性睡眠時無呼吸について正しいものはどれか。","ch":["中等症以上で CPAP（continuous positive airway pressure：持続陽圧呼吸） が保険で使え、血圧も下がる","ベンゾジアゼピン系の睡眠薬で治療する","治療しなくても、心血管病の危険は上がらない","肥満がなければ、閉塞性睡眠時無呼吸は起こらない"],"a":0,"cx":["","睡眠薬（とくにベンゾジアゼピン系）や飲酒は上気道の筋肉を緩め、悪化させる。","高血圧（とくに治療抵抗性）・心房細動・脳卒中・心不全の危険を上げる。","日本人は顎が小さく、やせていても起こることがある。"],"core":"OSA（obstructive sleep apnea：閉塞性睡眠時無呼吸）：いびき・日中の眠気・夜間頻尿・朝の頭痛。AHI（1時間あたりの無呼吸・低呼吸の回数）5以上で診断、15以上は中等症、30以上は重症。CPAP は簡易検査で AHI 40 以上、終夜睡眠ポリグラフで 20 以上が保険の目安。","e":"ほかの治療：減量、側臥位、口腔内装置（軽〜中等症）、上気道の手術、舌下神経刺激療法。\n居眠り運転の事故の危険があり、運転について説明する。\n中枢性睡眠時無呼吸：心不全（Cheyne-Stokes 呼吸）・オピオイド。\n肥満低換気症候群：BMI（body mass index：体格指数） 30 以上・日中の PaCO₂ 45 Torr 超。NPPV（non-invasive positive pressure ventilation：非侵襲的陽圧換気）。","tg":[]},{"id":"resp-af27198a","f":"resp","u":67,"o":213,"lv":2,"q":"肺動脈性肺高血圧症（PAH（pulmonary arterial hypertension：肺動脈性肺高血圧症））について正しいものはどれか。","ch":["治療薬は利尿薬だけで、特異的な薬はない","左心不全による肺高血圧と、同じ治療薬を使う","心エコーだけで確定診断し、右心カテーテルは不要","平均肺動脈圧 20 mmHg 超・楔入圧 15 mmHg 以下"],"a":3,"cx":["エンドセリン受容体拮抗薬・PDE5（phosphodiesterase 5：ホスホジエステラーゼ5） 阻害薬/sGC 刺激薬・プロスタサイクリン系の3系統がある。","左心疾患による肺高血圧（楔入圧が高い：第2群）に PAH の薬を使うと肺水腫を起こしうる。分類が大事。","心エコーはスクリーニング。確定と分類には右心カテーテル。",""],"core":"肺高血圧＝平均肺動脈圧 20 mmHg 超（2022年に 25 から変更）。PAH（第1群）＝楔入圧 15 以下・肺血管抵抗 2 Wood 単位超。3系統（ERA（endothelin receptor antagonist：エンドセリン受容体拮抗薬）・PDE5（phosphodiesterase 5：ホスホジエステラーゼ5） 阻害薬/リオシグアト（アデムパス）・プロスタサイクリン系）を組み合わせて早くから治療。","e":"肺高血圧の5分類：1群 PAH（特発性・遺伝性・膠原病（強皮症・MCTD（mixed connective tissue disease：混合性結合組織病））・薬・門脈圧亢進・HIV（human immunodeficiency virus：ヒト免疫不全ウイルス）・先天性心疾患）、2群 左心疾患、3群 肺疾患・低酸素、4群 慢性血栓塞栓性肺高血圧症（CTEPH（chronic thromboembolic pulmonary hypertension：慢性血栓塞栓性肺高血圧症）：肺換気血流シンチで評価、肺動脈内膜摘除術・バルーン肺動脈形成術・リオシグアト）、5群 その他。\n新しい薬：ソタテルセプト（エアウィン、2025年国内承認）＝アクチビンのシグナルを調節して肺血管の平滑筋の増殖を抑える融合タンパク。既存の肺血管拡張薬に加えて3週ごとに皮下注。\n症状は労作時の息切れ・失神。身体所見：II 音の肺動脈成分の亢進、右心不全。","tg":[]},{"id":"resp-63e79d02","f":"resp","u":67,"o":214,"lv":2,"q":"急性呼吸窮迫症候群（ARDS（acute respiratory distress syndrome：急性呼吸窮迫症候群））について正しいものはどれか。","ch":["重症例でも、腹臥位にするのは有害である","1回換気量を少なく（6 mL/kg）し、プラトー圧を低く保つ","高い1回換気量（12 mL/kg）で、酸素化を最優先する","心原性肺水腫と同じく、左房圧の上昇が主な原因である"],"a":1,"cx":["中等症〜重症では、長時間の腹臥位で死亡が減る。","","高い1回換気量は人工呼吸器による肺傷害を起こし、死亡を増やす。","ARDS は肺の血管の透過性が上がった肺水腫（非心原性）。心不全だけでは説明できないことが条件。"],"core":"ARDS＝1週間以内の発症・両側の陰影・心不全だけでは説明できない・P/F 比 300 以下（PEEP（positive end-expiratory pressure：呼気終末陽圧） 5 以上で）。肺保護換気（低1回換気量・プラトー圧 30 cmH₂O 以下・適切な PEEP）、重症は腹臥位。","e":"重症度（ベルリン定義）：P/F 比 200〜300 軽症、100〜200 中等症、100 以下 重症。\n原因：肺炎・誤嚥（直接）、敗血症・外傷・膵炎・大量輸血（間接）。\n輸液は過剰にしない（循環が安定したら控えめに）。\n重症では筋弛緩薬・ECMO（extracorporeal membrane oxygenation：体外式膜型人工肺） を考えることがある。","tg":[],"mt":["hfdrugs"]},{"id":"resp-2167e53b","f":"resp","u":67,"o":215,"lv":3,"q":"72歳の男性。脳梗塞の後で嚥下が悪い。夜間に 38.5℃の発熱があり、右下肺の湿性ラ音、CT（computed tomography：コンピュータ断層撮影） で右下葉背側の浸潤影がある。痰は少ない。再発予防として最も有効なのはどれか。","ch":["経口摂取をすべて禁止し、ずっと点滴だけにする","予防的な抗菌薬を毎日長期に内服する","口腔ケアと嚥下リハビリ、食事の姿勢・形態の工夫","胃酸を強く抑える薬を全員に追加する"],"a":2,"cx":["経口摂取を長く止めると嚥下機能と栄養がさらに落ちる。評価して安全な方法で食べる。","抗菌薬の長期予防は耐性菌を増やし、勧められない。","","酸分泌抑制薬はむしろ肺炎の危険を上げるという報告がある。"],"core":"誤嚥性肺炎の予防＝口腔ケア（口腔内の細菌を減らす）、嚥下評価（嚥下造影・内視鏡）とリハビリ、食後の座位保持・とろみ、鎮静薬の見直し。ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬・シロスタゾール・アマンタジンは嚥下反射を改善する報告がある。","e":"不顕性誤嚥（むせない誤嚥）は夜間に多く、脳梗塞（とくに基底核）・Parkinson 病・認知症で起こりやすい。\n下側・背側の肺（右下葉の背側区など）に起こりやすい。\n治療：口腔内の嫌気性菌もカバー（スルバクタム・アンピシリンなど）。耐性菌の危険があれば広めに。\n胃ろうでも唾液・胃内容物の逆流で誤嚥性肺炎は起こる。","tg":["cs"],"mt":["pneumonia"]},{"id":"resp-c5cbbc1c","f":"resp","u":68,"o":216,"lv":2,"q":"アレルギー性気管支肺アスペルギルス症（ABPA（allergic bronchopulmonary aspergillosis：アレルギー性気管支肺アスペルギルス症））について正しいものはどれか。","ch":["免疫不全の人の肺で、菌が組織に侵入する病気である","治療は抗真菌薬だけで、ステロイドは禁忌である","喘息の悪化・中枢性気管支拡張・粘液栓・IgE（immunoglobulin E：免疫グロブリン E） 高値","慢性好酸球性肺炎と同じく、末梢の浸潤影だけが特徴"],"a":2,"cx":["組織に侵入するのは侵襲性肺アスペルギルス症（好中球減少・移植後など）。","治療の中心は全身ステロイドで、イトラコナゾール（イトリゾール）などの抗真菌薬を併用することがある。","","ABPA の特徴は中枢の気管支拡張と粘液栓（高吸収の粘液栓）。"],"core":"ABPA＝アスペルギルスへのアレルギー反応（I 型・III 型）。喘息の悪化、中枢性気管支拡張、粘液栓（喀痰に褐色の塊）、好酸球↑、総 IgE↑（1,000 IU（international unit：国際単位）/mL 以上が目安）、アスペルギルス特異的 IgE・沈降抗体陽性。","e":"治療：プレドニゾロン（プレドニン）、抗真菌薬（イトラコナゾール（イトリゾール）・ボリコナゾール）、生物学的製剤（オマリズマブ（ゾレア）・メポリズマブ・デュピルマブなど）。\nアスペルギルスの病気のスペクトラム：ABPA（アレルギー）、アスペルギローマ（既存の空洞に菌球：三日月状の空気、血痰）、慢性進行性肺アスペルギルス症、侵襲性（好中球減少：halo sign）。\n好酸球性肺炎：急性（若い人の喫煙開始後、急な呼吸不全、BAL（bronchoalveolar lavage：気管支肺胞洗浄） 好酸球↑、ステロイドがよく効く）、慢性（中年女性、喘息、肺の外側の浸潤影＝肺水腫の陰画像）。","tg":[]},{"id":"resp-0399f5f9","f":"resp","u":69,"o":217,"lv":3,"q":"28歳の女性。喘息で通院中。昨夜から息苦しくなり、話すのも途切れ途切れ。呼吸数 30/分、脈拍 128/分、SpO₂ 89%（室内気）。呼気の喘鳴が強い。最初に行う治療として適切なのはどれか。","ch":["酸素・SABA（short-acting β2 agonist：短時間作用性 β2 刺激薬） の反復吸入・全身ステロイド","抗菌薬の点滴だけを行い、経過を見る","鎮静薬で落ち着かせてから、治療を考える","β遮断薬を静注して、頻脈を抑える"],"a":0,"cx":["","感染の証拠がなければ抗菌薬は不要。発作の治療が先。","鎮静薬は呼吸を抑え、呼吸停止を招きうる。喘息発作では禁忌に近い。","β遮断薬は気管支を収縮させ、発作を悪化させる。"],"core":"喘息の急性増悪（中等度以上）＝酸素（SpO₂ 93〜95%）・SABA の反復吸入（20分ごと）・全身ステロイド（内服か静注）。改善しなければ短時間作用性抗コリン薬・アドレナリン皮下注・アミノフィリン、硫酸マグネシウム、挿管も考える。","e":"危険なサイン：話せない・意識障害・チアノーゼ・呼吸音の減弱（silent chest）・PaCO₂ の正常化〜上昇（呼吸筋疲労）。\n気胸・縦隔気腫の合併も考える。\nNSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） 過敏喘息ではコハク酸エステル型のステロイド（ヒドロコルチゾン（静注はソル・コーテフ、内服はコートリル）・メチルプレドニゾロン）の急速静注を避け、リン酸エステル型（デキサメタゾン・ベタメタゾン）を使う。\n退院時：吸入ステロイドの強化と吸入手技の確認、発作時の行動計画。","tg":["cs"]},{"id":"resp-29ad7c12","f":"resp","u":69,"o":218,"lv":3,"q":"74歳の男性。重い COPD（chronic obstructive pulmonary disease：慢性閉塞性肺疾患）。3日前から痰が増えて膿性になり、息切れが悪化した。意識はやや傾眠。動脈血ガス（鼻カニューレ 2 L/分）：pH 7.26、PaCO₂ 78 Torr、PaO₂ 58 Torr。適切な対応はどれか。","ch":["酸素をすぐに止める","非侵襲的陽圧換気（NPPV（non-invasive positive pressure ventilation：非侵襲的陽圧換気））を始める","鎮静薬で呼吸を楽にする","酸素をリザーバー付きマスク 10 L/分に増やす"],"a":1,"cx":["酸素を急に止めると低酸素血症で危険。少量で調節する。","","鎮静は呼吸を抑え危険。","高濃度の酸素は換気をさらに落とし、CO₂ ナルコーシスを悪化させる。目標は SpO₂ 88〜92%。"],"core":"COPD 増悪の高 CO₂ 血症性呼吸性アシドーシス（pH 7.35 未満・PaCO₂ 45 超）＝NPPV の良い適応（挿管・死亡を減らす）。気管支拡張薬・全身ステロイド・（膿性痰なら）抗菌薬も。","e":"NPPV がうまくいかない・使えない（意識障害が強い・痰が出せない・嘔吐・循環不全）なら気管挿管。\n増悪の原因：ウイルス・細菌の気道感染が多い。肺炎・気胸・心不全・肺塞栓も考える。\n退院後：呼吸リハビリ、ワクチン、吸入薬の見直し（3剤）、禁煙、在宅酸素の評価。","tg":["cs"],"fig":["acidbase","flowvol"],"mt":["abx"]},{"id":"resp-cb39319a","f":"resp","u":70,"o":219,"lv":2,"q":"肺胞蛋白症について正しいものはどれか。","ch":["ステロイドが第一選択で、劇的に効く","細菌が肺胞にたまる感染症である","BAL（bronchoalveolar lavage：気管支肺胞洗浄） 液は透明で、何も混じっていない","多くは抗 GM-CSF（granulocyte-macrophage colony-stimulating factor：顆粒球マクロファージコロニー刺激因子） 抗体による自己免疫性"],"a":3,"cx":["ステロイドは効かず、感染症を増やして悪化させうる。","サーファクタントが肺胞にたまる病気。感染症ではないが、ノカルジアなどの日和見感染を合併しやすい。","BAL 液は米のとぎ汁のように白く濁る（PAS（periodic acid-Schiff、染色） 陽性の物質）。",""],"core":"自己免疫性肺胞蛋白症＝抗 GM-CSF 抗体でマクロファージがサーファクタントを処理できない。CT（computed tomography：コンピュータ断層撮影） で地図状のすりガラス影＋小葉間隔壁の肥厚（crazy-paving）、BAL 液の白濁。全肺洗浄、GM-CSF（サルグラモスチム（サルグマリン））吸入（国内承認）。","e":"血清 KL-6（Krebs von den Lungen-6：間質性肺炎のマーカー）・CEA（carcinoembryonic antigen：癌胎児性抗原） が上がる。\n続発性：骨髄異形成症候群などの血液疾患、粉じんの吸入。\nほかのまれな肺疾患：\n・リンパ脈管筋腫症（LAM（lymphangioleiomyomatosis：リンパ脈管筋腫症））：若い女性、多発する薄壁の嚢胞、気胸・乳び胸、シロリムス\n・Birt-Hogg-Dubé 症候群：下肺・縦隔側の嚢胞、気胸、皮膚線維毛包腫、腎腫瘍\n・びまん性汎細気管支炎：副鼻腔炎の合併、小葉中心性の粒状影、少量長期のエリスロマイシン（エリスロシン）","tg":[]},{"id":"resp-2479b4e7","f":"resp","u":70,"o":220,"lv":2,"q":"石綿（アスベスト）曝露と関係する病気の組み合わせで正しいものはどれか。","ch":["胸膜プラーク・石綿肺・中皮腫・肺癌","サルコイドーシス・肺胞蛋白症","過敏性肺炎・急性好酸球性肺炎","珪肺・Caplan 症候群（じん肺と RA（rheumatoid arthritis：関節リウマチ））"],"a":0,"cx":["","サルコイドーシスは原因不明。肺胞蛋白症は粉じんでも起こるが、石綿の代表的な病気ではない。","これらは石綿とは関係しない。","珪肺は結晶性シリカ（トンネル・鉱山・石工）。Caplan 症候群はじん肺＋関節リウマチ。"],"core":"石綿関連疾患＝胸膜プラーク（曝露のしるし、病気ではない）、良性石綿胸水、びまん性胸膜肥厚、石綿肺（下肺優位の線維化）、肺癌（喫煙で相乗的に増える）、中皮腫（少量の曝露でも、30〜40年後）。","e":"中皮腫の治療：手術（限られた例）、化学療法（シスプラチン（ランダ）＋ペメトレキセド（アリムタ））、免疫チェックポイント阻害薬（ニボルマブ（オプジーボ）＋イピリムマブ（ヤーボイ））。\n労災補償・石綿健康被害救済制度の対象になる。職業歴（造船・建設・断熱材・解体）を詳しく聞く。\n珪肺：上肺優位の粒状影・卵殻状のリンパ節石灰化、結核・肺癌の危険。","tg":[],"mt":["pleural"]},{"id":"resp-a3a2298d","f":"resp","u":71,"o":221,"lv":3,"q":"42歳の女性。かぜの後から2か月、乾いた咳が続き、とくに夜間から明け方に悪化する。喘鳴はなく、胸部X線・呼吸機能検査（1秒率）は正常。呼気一酸化窒素（FeNO（fractional exhaled nitric oxide：呼気一酸化窒素））が高い。最も考えられる診断と治療はどれか。","ch":["心因性の咳 ― 検査も治療も不要","百日咳 ― 吸入ステロイドだけで治療","肺結核 ― 4剤併用療法を始める","咳喘息 ― 吸入ステロイドと気管支拡張薬"],"a":3,"cx":["心因性と決める前に、よくある原因（咳喘息・アトピー咳嗽・後鼻漏・GERD（gastroesophageal reflux disease：胃食道逆流症）・薬）を調べる。","百日咳は発作性の咳込み・吸気時の笛声・咳込み後の嘔吐。マクロライドで治療（早期）。","胸部X線が正常で、2か月の乾いた咳だけでは結核とは言えない（ただし疑えば喀痰検査）。",""],"core":"慢性咳嗽（8週以上）の原因：咳喘息（夜〜朝の咳・気道過敏・FeNO 高値・気管支拡張薬が効く）、アトピー咳嗽（喉のかゆみ・抗ヒスタミン薬）、副鼻腔気管支症候群（湿った咳）、胃食道逆流、感染後咳嗽、ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬。","e":"咳喘息は放置すると約3割が典型的な喘息になる。吸入ステロイドで予防。\n8週以上の咳では、胸部X線で肺癌・結核・間質性肺炎を必ず除く。\n喫煙者の慢性の咳は COPD（chronic obstructive pulmonary disease：慢性閉塞性肺疾患）・肺癌。\n難治性の咳（原因の治療でも残る）：P2X3 受容体拮抗薬ゲーファピキサント（味覚障害）。","tg":["cs"]},{"id":"resp-93e84e7c","f":"resp","u":71,"o":222,"lv":2,"q":"大量喀血の初期対応として正しいものはどれか。","ch":["咳を止めるため、まず強い鎮咳薬だけを使う","出血している側を、上にした側臥位にする","気道を確保し、出血側を下にして止血を図る","喀血はほとんど自然に止まるので、経過観察だけでよい"],"a":2,"cx":["死因は出血量より窒息。鎮咳だけでは不十分で、気道の確保が最優先。","出血している側を下にして、健康な側の肺に血液が流れ込むのを防ぐ。","","大量喀血は窒息で死亡しうる緊急事態。"],"core":"大量喀血＝窒息が最大の危険。患側を下にした側臥位、気道確保（必要なら健側への片肺挿管）、止血薬、気管支鏡（出血部位の確認・止血）、気管支動脈塞栓術（最も有効な止血法）、手術。","e":"原因：気管支拡張症、結核（活動性・後遺症）、非結核性抗酸菌症、アスペルギローマ、肺癌、肺動静脈奇形、血管炎（肺胞出血）、肺塞栓、心不全（僧帽弁狭窄症）、抗凝固薬。\n吐血・鼻出血との区別：喀血は泡が混じった鮮紅色でアルカリ性、吐血は暗赤色で酸性・食物残渣。","tg":[]},{"id":"resp-2afb7825","f":"resp","u":72,"o":223,"lv":3,"q":"62歳の女性。喫煙歴なし。咳が続き、CT（computed tomography：コンピュータ断層撮影） で右上葉に 4 cm の腫瘤と多発する脳転移がある。生検で腺癌、EGFR（上皮成長因子受容体、肺癌の遺伝子／推算 GFR は eGFR） 遺伝子のエクソン19欠失変異が陽性。PS（performance status：全身状態の指標） 1。最も適切な初回治療はどれか。","ch":["オシメルチニブ（EGFR 阻害薬）","イマチニブ（BCR（breakpoint cluster region、BCR::ABL1 融合遺伝子の一部）::ABL1（ABL proto-oncogene 1、BCR::ABL1 融合遺伝子の一部） 阻害薬）","経過観察（症状が出るまで治療しない）","免疫チェックポイント阻害薬の単剤"],"a":0,"cx":["","イマチニブは BCR::ABL1・KIT（KIT、受容体型チロシンキナーゼの遺伝子） などの阻害薬で、EGFR には効かない。","PS が良く、よく効く治療があるので治療する。","EGFR 変異陽性では、免疫チェックポイント阻害薬の効果は乏しく、後で EGFR 阻害薬を使うと間質性肺炎が増える。"],"core":"EGFR 変異陽性の非小細胞肺癌＝第3世代 EGFR-TKI（tyrosine kinase inhibitor：チロシンキナーゼ阻害薬） オシメルチニブ（脳への移行が良い）が標準（白金製剤を含む化学療法との併用も選択肢）。","e":"EGFR-TKI の副作用：皮疹（ざ瘡様）・爪囲炎・下痢・間質性肺炎（日本人で多い、致死的になりうる）・QT（QT 間隔、心室の興奮の始まりから回復まで） 延長（オシメルチニブ）。\n耐性：T790M（第1・2世代の後）、MET（MET、がん遺伝子） 増幅、小細胞癌への形質転換。再生検・リキッドバイオプシー。\n脳転移：定位放射線治療を組み合わせることもある。\nALK（anaplastic lymphoma kinase、肺癌の融合遺伝子） 融合遺伝子：若い非喫煙者、アレクチニブ（アレセンサ）・ロルラチニブ（よく効く、長く効く）。","tg":["ae","cs"]},{"id":"resp-4a6eaf9c","f":"resp","u":72,"o":224,"lv":2,"q":"前縦隔腫瘍について正しいものはどれか。","ch":["胸腺腫は重症筋無力症・赤芽球癆を合併しうる","前縦隔腫瘍で最も多いのは、神経原性腫瘍である","若い男性の前縦隔腫瘍で、AFP（α-fetoprotein：α-フェトプロテイン）・hCG は調べなくてよい","甲状腺腫は、前縦隔に入り込むことはない"],"a":0,"cx":["","神経原性腫瘍は後縦隔に多い。","若い男性では胚細胞性腫瘍（セミノーマ・非セミノーマ）を考え、AFP・hCG・LDH（lactate dehydrogenase：乳酸脱水素酵素） を測る。","胸骨の後ろに入り込む甲状腺腫（胸骨下甲状腺腫）は前縦隔の腫瘤の原因。"],"core":"前縦隔の腫瘍＝4T：胸腺腫（Thymoma）・奇形腫/胚細胞性腫瘍（Teratoma）・甲状腺腫（Thyroid）・悪性リンパ腫（Terrible lymphoma）。中縦隔＝リンパ節・気管支原性嚢胞、後縦隔＝神経原性腫瘍。","e":"胸腺腫：中高年、重症筋無力症（約3割）。治療は手術。\nGood 症候群：胸腺腫＋低ガンマグロブリン血症、繰り返す感染。\n縦隔の悪性リンパ腫：若い女性の原発性縦隔大細胞型 B 細胞リンパ腫・ホジキンリンパ腫、上大静脈症候群。","tg":[],"mt":["thyroid","hemetumor"]},{"id":"resp-4c8ea846","f":"resp","u":73,"o":225,"lv":3,"q":"58歳の女性。子どもの頃から副鼻腔炎があり、数年前から毎日大量の膿性痰と咳が続く。CT（computed tomography：コンピュータ断層撮影） で両側下葉に気管支の拡張と壁の肥厚がある。喀痰から緑膿菌が繰り返し出る。治療と管理として最も適切なのはどれか。","ch":["緑膿菌を完全に消すまで、抗菌薬の静注を毎月繰り返す","排痰の工夫とマクロライド少量長期療法","吸入ステロイドの高用量を、単独で長期に続ける","咳を強く止めて、痰を出さないようにする"],"a":1,"cx":["慢性の定着菌を完全に消すことは難しく、症状のない時期の静注の繰り返しは耐性菌を増やす。","","吸入ステロイドは気管支拡張症の主な治療ではない（喘息・好酸球の多い例は別）。","痰を出すことが大事。強い鎮咳は痰をためる。"],"core":"気管支拡張症＝慢性の咳・膿性痰・血痰、増悪を繰り返す。原因：小児期の感染・結核後・NTM（nontuberculous mycobacteria：非結核性抗酸菌）・副鼻腔気管支症候群・原発性線毛機能不全症・ABPA（allergic bronchopulmonary aspergillosis：アレルギー性気管支肺アスペルギルス症）・免疫不全。治療：気道クリアランス（排痰）・マクロライド少量長期療法・増悪時の抗菌薬・ワクチン。","e":"緑膿菌の定着は予後不良因子。\n喀血は気管支動脈から（大量なら塞栓術）。\n原発性線毛機能不全症：内臓逆位（Kartagener 症候群）・副鼻腔炎・不妊。\nびまん性汎細気管支炎：日本人に多い、HLA（human leukocyte antigen：ヒト白血球抗原）-B54、副鼻腔炎、エリスロマイシン（エリスロシン）が劇的に効く。","tg":["cs"],"mt":["abx","vaccine"]},{"id":"hem-b4ab40c2","f":"hem","u":74,"o":226,"lv":1,"q":"鉄の代謝について正しいものはどれか。","ch":["ヘプシジンは鉄の吸収と放出を抑え、炎症で増える","フェリチンは炎症では下がる","トランスフェリンは鉄を貯蔵するタンパクである","鉄は主に回腸末端で吸収される"],"a":0,"cx":["","フェリチンは急性期反応物質で、炎症・感染・腫瘍・肝障害で上がる（鉄欠乏が隠れることがある）。","トランスフェリンは血液中で鉄を運ぶ。貯蔵はフェリチン・ヘモジデリン。","鉄は主に十二指腸〜空腸上部で吸収される（回腸末端はビタミン B12・胆汁酸）。"],"core":"ヘプシジン（肝臓でつくる）＝フェロポルチン（鉄を細胞から出す出口）を壊し、腸からの吸収とマクロファージからの放出を止める。炎症（IL-6（interleukin-6：インターロイキン6））で増える→慢性炎症に伴う貧血。","e":"体の鉄は失う経路がほとんどなく、吸収で調節される。輸血を繰り返すと鉄がたまる（鉄過剰症：肝・心・内分泌の障害）。\n鉄の吸収を助ける：ビタミン C・胃酸。妨げる：お茶（タンニン）・制酸薬・PPI（proton pump inhibitor：プロトンポンプ阻害薬）・カルシウム。\nIL-6 阻害薬（トシリズマブ（アクテムラ））でヘプシジンが下がり、炎症性の貧血が良くなる。","tg":[],"mt":["anemia"]},{"id":"hem-2e412dc1","f":"hem","u":74,"o":227,"lv":1,"q":"凝固因子とビタミン K について正しいものはどれか。","ch":["ビタミン K 欠乏では APTT（activated partial thromboplastin time：活性化部分トロンボプラスチン時間） だけが延長し、PT（prothrombin time：プロトロンビン時間） は正常","ヘパリンは、ビタミン K に拮抗して効く","ビタミン K 依存性は II・VII・IX・X とプロテイン C・S","ワルファリン（ワーファリン）は、第 VIII 因子の合成を止める"],"a":2,"cx":["最も半減期の短い第 VII 因子が先に減るので、PT が先に（強く）延長する。","ヘパリンはアンチトロンビンを介してトロンビンと Xa を阻害する。","","ワルファリンはビタミン K 依存性因子（II・VII・IX・X）の合成を止める。第 VIII 因子は関係しない。"],"core":"ビタミン K 依存性＝II・VII・IX・X（「肉納豆」：2・7・9・10）＋プロテイン C・S。ビタミン K 欠乏（抗菌薬・絶食・閉塞性黄疸・新生児）とワルファリンで PT が延長。","e":"ワルファリンを始めた直後は、半減期の短いプロテイン C が先に減って一時的に血栓ができやすい（皮膚壊死）。\nワルファリンの拮抗：ビタミン K（効果は数時間〜）、急ぐときはプロトロンビン複合体製剤。\n新生児・乳児のビタミン K 欠乏性出血症の予防にビタミン K シロップ。\n肝不全では、凝固因子もアンチトロンビンなど抗凝固因子も減り、PT 延長でも血栓ができうる。","tg":[],"fig":["coag"],"mt":["bleeding"]},{"id":"hem-a2fef516","f":"hem","u":74,"o":228,"lv":1,"q":"ABO（ABO 式血液型） 血液型と輸血について正しいものはどれか。","ch":["O 型の血漿には、抗 A・抗 B 抗体がある","Rh(D) 陰性の人は、日本人の約 15% である","新鮮凍結血漿は、O 型が全ての血液型に輸注できる","AB 型の血漿には、抗 A・抗 B の両方の抗体がある"],"a":0,"cx":["","日本人の Rh(D) 陰性は約 0.5%（欧米人は約 15%）。","O 型の血漿は抗 A・抗 B を含むので、A・B・AB 型の人には使えない。","AB 型の血漿には抗 A・抗 B のどちらもない（血漿の万能供血者は AB 型）。"],"core":"ABO：赤血球の抗原と血漿の抗体は逆になる（A 型＝A 抗原・抗 B 抗体）。赤血球の緊急輸血は O 型、血漿は AB 型を使える。輸血前には血液型・不規則抗体のスクリーニング・交差適合試験。","e":"不適合輸血を防ぐ：ベッドサイドで2人で患者と製剤を照合する。輸血開始後5分はそばで観察し、15分後にも確かめる。\nRh(D) 陰性の妊婦：抗 D 免疫グロブリンで抗 D 抗体の産生を予防（胎児溶血性疾患）。\n不規則抗体：輸血・妊娠でできる。遅発性溶血性輸血反応の原因。\n血小板輸血の不応：HLA（human leukocyte antigen：ヒト白血球抗原） 抗体（HLA 適合血小板）、発熱・DIC（disseminated intravascular coagulation：播種性血管内凝固）・脾腫などの消費。","tg":[]},{"id":"hem-f609f2ae","f":"hem","u":75,"o":229,"lv":1,"q":"小球性貧血の区別で、鉄欠乏性貧血に合うのはどれか。","ch":["血清鉄↑・TIBC（total iron-binding capacity：総鉄結合能） 正常・フェリチン↑","血清鉄 正常・TIBC（total iron-binding capacity：総鉄結合能） 正常・フェリチン 正常","血清鉄↓・TIBC（total iron-binding capacity：総鉄結合能）↓・フェリチン↑","血清鉄↓・総鉄結合能（TIBC（total iron-binding capacity：総鉄結合能））↑・フェリチン↓"],"a":3,"cx":["鉄が多いのは鉄芽球性貧血・ヘモクロマトーシスなど。","鉄の指標が正常の小球性貧血ではサラセミアを考える（日本では少ないが、Mentzer 指数＝MCV（mean corpuscular volume：平均赤血球容積）/赤血球数が 13 未満で疑う）。","これは慢性炎症に伴う貧血（ヘプシジンが増え、鉄が貯蔵から出られない）。",""],"core":"鉄欠乏＝フェリチン↓（最も特異的、12 ng/mL 未満）、TIBC↑。慢性炎症＝フェリチン正常〜↑、TIBC↓。","e":"鉄欠乏性貧血を見たら原因を探す：月経・妊娠、消化管出血（とくに男性・閉経後女性は胃・大腸の内視鏡で癌を除く）、H. pylori・萎縮性胃炎・胃切除（吸収不良）、セリアック病。\n症状：匙状爪（スプーン爪）、異食症（氷を食べたくなる）、舌炎、むずむず脚症候群。\n治療：経口鉄（吐き気が多い）。足りない・飲めない・吸収できないときは静注鉄（総投与量を計算）。カルボキシマルトース第二鉄は低リン血症に注意。\n網状赤血球は治療開始から1週ほどで上がり、Hb は2か月ほどで戻る。貯蔵鉄（フェリチン）が戻るまでさらに3か月ほど続ける。","tg":[],"mt":["anemia"]},{"id":"hem-8878ebf9","f":"hem","u":75,"o":230,"lv":2,"q":"ビタミン B12 欠乏について正しいものはどれか。","ch":["巨赤芽球性貧血と亜急性連合性脊髄変性症を起こす","溶血の所見（LDH（lactate dehydrogenase：乳酸脱水素酵素） 上昇・間接ビリルビン上昇）は見られない","葉酸だけを補えば、神経症状も必ず良くなる","胃全摘のあとでも、B12 は十分に吸収されるので問題はない"],"a":0,"cx":["","骨髄の中で赤芽球が壊れる（無効造血）ので、LDH・間接ビリルビンが上がる。","葉酸だけを補うと貧血は一時的に良くなるが、神経症状は進む。B12 欠乏を見逃さない。","B12 の吸収には胃の壁細胞の内因子が必要。胃全摘後は数年で欠乏し、生涯の補充（筋注など）が必要。"],"core":"B12 欠乏＝大球性貧血（MCV（mean corpuscular volume：平均赤血球容積） 高値）・好中球の過分葉・汎血球減少・LDH 高値＋神経症状（後索・側索：振動覚低下・Romberg 陽性・痙性）、認知機能低下、Hunter 舌炎。","e":"原因：悪性貧血（抗内因子抗体・抗壁細胞抗体、萎縮性胃炎 A 型）、胃切除、回腸末端の切除・Crohn 病、菜食、メトホルミン（メトグルコ）の長期使用、PPI（proton pump inhibitor：プロトンポンプ阻害薬） の長期使用、亜酸化窒素。\n治療：B12（メコバラミン（メチコバール、ALS（amyotrophic lateral sclerosis：筋萎縮性側索硬化症） の高用量はロゴジン）・シアノコバラミン）の筋注。高用量の内服でも吸収されることがある。\n治療を始めると低カリウム血症になることがある（造血で K が使われる）。\n大球性貧血のほかの原因：葉酸欠乏、アルコール・肝疾患、甲状腺機能低下、骨髄異形成症候群、薬（メトトレキサート（リウマトレックス）・ヒドロキシウレア・抗 HIV（human immunodeficiency virus：ヒト免疫不全ウイルス） 薬）、網状赤血球の増加（溶血・出血の回復）。","tg":[],"fig":["spinal"],"mt":["anemia"]},{"id":"hem-8b4954b1","f":"hem","u":75,"o":231,"lv":2,"q":"自己免疫性溶血性貧血（温式）について正しいものはどれか。","ch":["寒冷で悪化し、IgM（immunoglobulin M：免疫グロブリン M） 抗体と補体が関わる","直接 Coombs 陽性・球状赤血球、ステロイドが第一選択","血管内溶血が主で、ヘモグロビン尿が必ず出る","直接 Coombs 試験は陰性で、破砕赤血球が見られる"],"a":1,"cx":["寒冷で悪化する IgM 型は寒冷凝集素症。","","温式は主に脾臓での血管外溶血。ヘモグロビン尿は血管内溶血（PNH（paroxysmal nocturnal hemoglobinuria：発作性夜間ヘモグロビン尿症）・不適合輸血・寒冷凝集素症の一部）。","破砕赤血球は血栓性微小血管症（TTP（thrombotic thrombocytopenic purpura：血栓性血小板減少性紫斑病）・HUS（hemolytic uremic syndrome：溶血性尿毒症症候群）・DIC（disseminated intravascular coagulation：播種性血管内凝固））や人工弁の機械的溶血。"],"core":"温式 AIHA（autoimmune hemolytic anemia：自己免疫性溶血性貧血）＝IgG（immunoglobulin G：免疫グロブリン G） 抗体で脾臓に赤血球が壊される。直接 Coombs 陽性・球状赤血球・網状赤血球↑・間接ビリルビン↑・LDH（lactate dehydrogenase：乳酸脱水素酵素）↑・ハプトグロビン↓。プレドニゾロン（プレドニン） 1 mg/kg/日 で開始、効かなければリツキシマブ（リツキサン）・脾摘。","e":"原因を探す：特発性のほか、SLE（systemic lupus erythematosus：全身性エリテマトーデス） などの膠原病、慢性リンパ性白血病・リンパ腫、薬。\nEvans 症候群：AIHA＋ITP（immune thrombocytopenia：特発性、免疫性血小板減少性紫斑病）。\n寒冷凝集素症：IgM・補体（直接 Coombs で C3 陽性）、冷えるとチアノーゼ・溶血、マイコプラズマ・EB（Epstein-Barr） ウイルス・リンパ増殖性疾患。保温。ステロイドは効きにくく、リツキシマブ・スチムリマブ（補体 C1s 阻害）。\n溶血のときは葉酸が足りなくなりやすい。","tg":[],"mt":["liverai"]},{"id":"hem-c431cd78","f":"hem","u":75,"o":232,"lv":2,"q":"発作性夜間ヘモグロビン尿症（PNH（paroxysmal nocturnal hemoglobinuria：発作性夜間ヘモグロビン尿症））について正しいものはどれか。","ch":["鉄が体にたまるので、鉄欠乏にはならない","血管外溶血だけで、ヘモグロビン尿は出ない","CD55（補体の働きを抑える膜蛋白、DAF）・CD59（補体の膜侵襲複合体を抑える膜蛋白） が欠けた血球が補体で壊れ、血栓症も起こす","直接 Coombs 試験が陽性になる、自己免疫性の溶血である"],"a":2,"cx":["尿にヘモグロビン・ヘモジデリンとして鉄が失われ、鉄欠乏になりやすい。","血管内溶血が中心で、朝の褐色尿（ヘモグロビン尿）が典型。","","PNH は自己抗体による溶血ではない（Coombs 陰性）。"],"core":"PNH＝造血幹細胞の PIG-A（phosphatidylinositol glycan class A、遺伝子） 遺伝子の変異で GPI（glycosylphosphatidylinositol） アンカー型タンパク（補体を止める CD55・CD59）が欠ける → 補体で血管内溶血。フローサイトメトリーで診断。血栓症（腹部・脳の静脈）が死因に多い。","e":"治療：補体 C5 阻害薬（エクリズマブ（ソリリス）・ラブリズマブ）、C3 阻害薬（ペグセタコプラン（エムパベリ））、B 因子阻害薬（イプタコパン（ファビハルタ）：内服）。補体を止めると髄膜炎菌の感染が重くなるので、髄膜炎菌ワクチンを接種する。\n再生不良性貧血・骨髄異形成症候群と重なることがある（骨髄不全型）。\n溶血の所見：LDH（lactate dehydrogenase：乳酸脱水素酵素）↑（とくに著明）、ハプトグロビン↓、網状赤血球↑。","tg":[]},{"id":"hem-ed9cefcf","f":"hem","u":75,"o":233,"lv":3,"q":"24歳の女性。2週間前から動悸と息切れ、歯肉出血がある。Hb 6.2 g/dL（MCV（mean corpuscular volume：平均赤血球容積） 102 fL）、白血球 1,800/μL（好中球 500/μL）、血小板 1.2 万/μL、網状赤血球 0.2%。脾腫はない。骨髄は脂肪髄で、細胞の形の異常はない。最も考えられる診断はどれか。","ch":["急性骨髄性白血病","鉄欠乏性貧血","特発性血小板減少性紫斑病","再生不良性貧血"],"a":3,"cx":["急性白血病では骨髄は芽球で埋まり、過形成になる。","鉄欠乏は小球性で、白血球・血小板は減らない（血小板はむしろ増える）。","ITP（immune thrombocytopenia：特発性、免疫性血小板減少性紫斑病） は血小板だけが減り、貧血・白血球減少は出血以外では起こらない。",""],"core":"再生不良性貧血＝汎血球減少＋網状赤血球の低下＋低形成（脂肪髄）の骨髄、脾腫なし。多くは T 細胞による造血幹細胞への免疫攻撃。","e":"治療：重症度で選ぶ。若い重症例は HLA（human leukocyte antigen：ヒト白血球抗原） 一致の同胞がいれば造血幹細胞移植。ほかは免疫抑制療法（抗胸腺細胞グロブリン＋シクロスポリン（ネオーラル））＋トロンボポエチン受容体作動薬（エルトロンボパグ（レボレード）・ロミプロスチム）。\n輸血：移植の候補では輸血を減らし、HLA 抗体を作らないよう白血球除去製剤。鉄過剰にはキレート療法。\n二次性：薬（クロラムフェニコール・抗てんかん薬・金製剤）、肝炎後、放射線、妊娠。\nPNH（paroxysmal nocturnal hemoglobinuria：発作性夜間ヘモグロビン尿症） の血球が少し見られることがある。","tg":["cs"],"mt":["anemia"]},{"id":"hem-416f78cf","f":"hem","u":75,"o":234,"lv":3,"q":"45歳の女性。過多月経がある。疲れやすく、氷をよく食べる。Hb 7.8 g/dL、MCV（mean corpuscular volume：平均赤血球容積） 68 fL、フェリチン 4 ng/mL。経口の鉄剤で吐き気が強く飲めなかった。対応として最も適切なのはどれか。","ch":["赤血球輸血を毎月続けて、貧血を補う","エリスロポエチン製剤を開始する","ビタミン B12 の筋注を開始する","静注鉄で補い、過多月経の原因を調べる"],"a":3,"cx":["循環が安定した鉄欠乏性貧血に輸血は原則不要。鉄を補えば戻る。","エリスロポエチンの不足ではない。鉄が足りないと ESA（erythropoiesis-stimulating agent：赤血球造血刺激因子製剤） は効かない。","B12 欠乏は大球性貧血。小球性・フェリチン低値は鉄欠乏。",""],"core":"経口鉄が飲めない・吸収できない・失う量が多い鉄欠乏＝静注鉄（総投与量を計算：Hb と体重から）。原因（過多月経なら子宮筋腫・子宮腺筋症など）の治療を並行する。","e":"経口鉄の工夫：1日1回や隔日投与で吐き気を減らす。ビタミン C と一緒に、お茶・PPI（proton pump inhibitor：プロトンポンプ阻害薬）・制酸薬で吸収が落ちる。\n静注鉄の副作用：過敏反応、低リン血症（カルボキシマルトース第二鉄・含糖酸化鉄）、鉄過剰（総量を超えない）。\n異食症（氷食症）は鉄を補うと消える。\n男性・閉経後女性の鉄欠乏は消化管の検査が必須。","tg":["cs"],"mt":["anemia"]},{"id":"hem-4e591e36","f":"hem","u":75,"o":235,"lv":2,"q":"貧血と特徴的な末梢血の所見の組み合わせで正しいものはどれか。","ch":["血栓性微小血管症 ― 涙滴赤血球と白赤芽球症","骨髄線維症 ― 標的赤血球（だけが特徴）","鉄欠乏性貧血 ― 好中球の過分葉と大球性","遺伝性球状赤血球症 ― 球状赤血球・MCHC（mean corpuscular hemoglobin concentration：平均赤血球ヘモグロビン濃度） 高値"],"a":3,"cx":["血栓性微小血管症（TTP（thrombotic thrombocytopenic purpura：血栓性血小板減少性紫斑病）・HUS（hemolytic uremic syndrome：溶血性尿毒症症候群）・DIC（disseminated intravascular coagulation：播種性血管内凝固））では破砕赤血球。","骨髄線維症では涙滴赤血球と白赤芽球症。","好中球の過分葉は巨赤芽球性貧血（B12・葉酸欠乏）。",""],"core":"遺伝性球状赤血球症＝赤血球膜の異常（スペクトリン・アンキリンなど）、常染色体顕性が多い。溶血・黄疸・脾腫・胆石、MCHC 高値、赤血球浸透圧抵抗の低下。重ければ脾摘。","e":"パルボウイルス B19 感染で無形成発作（網状赤血球が急に減り重い貧血）を起こす。\nほかの所見：標的赤血球（サラセミア・肝疾患）、Howell-Jolly 小体（脾摘後・無脾）、有棘赤血球（肝硬変）、連銭形成（骨髄腫）、Heinz 小体（G6PD（glucose-6-phosphate dehydrogenase：グルコース-6-リン酸脱水素酵素） 欠損症）、鎌状赤血球。\n脾摘後：莢膜をもつ菌（肺炎球菌・髄膜炎菌・インフルエンザ菌）の重症感染（OPSI（overwhelming post-splenectomy infection：脾摘後重症感染症））→ ワクチン。","tg":[]},{"id":"hem-fc56a538","f":"hem","u":76,"o":236,"lv":3,"q":"45歳の男性。発熱と歯肉出血で受診した。白血球 2,400/μL（芽球 60%、Auer 小体を多数含む）、血小板 2.8 万/μL、フィブリノゲン 80 mg/dL、FDP（fibrin/fibrinogen degradation products：フィブリン・フィブリノゲン分解産物） 高値。骨髄の芽球はアズール顆粒の多い前骨髄球様の細胞。最も適切な治療はどれか。","ch":["ATRA（all-trans retinoic acid：全トランス型レチノイン酸） を、確定を待たずに早く始める","止血のため、まず抗線溶薬（トラネキサム酸（トランサミン））を大量に使う","寛解導入をせずに、まず造血幹細胞移植を行う","DIC（disseminated intravascular coagulation：播種性血管内凝固） の治療だけを行い、白血病の治療は1か月後に始める"],"a":0,"cx":["","APL（acute promyelocytic leukemia：急性前骨髄球性白血病） の DIC（disseminated intravascular coagulation：播種性血管内凝固） は線溶が強いタイプだが、ATRA（all-trans retinoic acid：全トランス型レチノイン酸） との併用で抗線溶薬を使うと血栓症の危険が上がるので勧められない。","初回は ATRA（＋亜ヒ酸または化学療法）で寛解導入し、多くが治る。移植は再発時。","APL（acute promyelocytic leukemia：急性前骨髄球性白血病） は DIC による早期の出血死（脳出血）が多い。白血病の治療を遅らせてはいけない。"],"core":"急性前骨髄球性白血病（APL（acute promyelocytic leukemia：急性前骨髄球性白血病））＝t(15;17)・PML（promyelocytic leukemia、遺伝子）-RARA（retinoic acid receptor α、遺伝子）。線溶亢進型 DIC で出血しやすい。疑った時点で ATRA を始め、血小板・フィブリノゲンを輸血で補う。","e":"分化症候群：ATRA・亜ヒ酸で白血病細胞が分化するときに、発熱・呼吸困難・肺浸潤・体重増加・腎障害。デキサメタゾンで治療。\n亜ヒ酸：QT（QT 間隔、心室の興奮の始まりから回復まで） 延長に注意（K・Mg を保つ）。\nほかの AML（acute myeloid leukemia：急性骨髄性白血病）：t(8;21)・inv(16) は予後良好、FLT3（FMS-like tyrosine kinase 3）-ITD・複雑核型は予後不良。FLT3 変異には FLT3 阻害薬（ギルテリチニブ（ゾスパタ）・キザルチニブ）。\nAuer 小体は骨髄系の芽球のしるし（リンパ性では見られない）。","tg":["cs"],"mt":["hemetumor"]},{"id":"hem-6e6ff2fb","f":"hem","u":76,"o":237,"lv":2,"q":"慢性骨髄性白血病（CML（chronic myeloid leukemia：慢性骨髄性白血病））について正しいものはどれか。","ch":["白血球アルカリホスファターゼ（NAP（neutrophil alkaline phosphatase：好中球アルカリホスファターゼ））スコアが上がる","好塩基球・好酸球は減少する","治療しなくても、慢性期のまま一生進行しない","BCR（breakpoint cluster region、BCR::ABL1 融合遺伝子の一部）::ABL1（ABL proto-oncogene 1、BCR::ABL1 融合遺伝子の一部） に対し、チロシンキナーゼ阻害薬を使う"],"a":3,"cx":["CML では NAP スコアが下がる（類白血病反応では上がる）。","CML では好塩基球・好酸球が増える。","治療しないと移行期・急性転化（急性白血病のようになる）に進む。",""],"core":"CML＝t(9;22)・BCR::ABL1。白血球の著増（すべての成熟段階の顆粒球）・好塩基球↑・脾腫・NAP スコア↓。イマチニブ（グリベック）などの TKI（tyrosine kinase inhibitor：チロシンキナーゼ阻害薬） で多くの人が長く生きられる。","e":"TKI：イマチニブ、ニロチニブ（高血糖・心血管）、ダサチニブ（胸水）、ボスチニブ（ボシュリフ）、ポナチニブ（T315I（ABL1 の耐性変異） 変異に効く、血管閉塞）、アシミニブ（STAMP 阻害）。\n効果は BCR::ABL1 mRNA（定量 PCR（polymerase chain reaction））で見る。深い分子遺伝学的奏効が長く続けば、TKI の中止を試みられる人もいる。\nほかの骨髄増殖性腫瘍：真性多血症（JAK2（Janus kinase 2、遺伝子） V617F（JAK2 の変異）、赤血球↑、瀉血・アスピリン）、本態性血小板血症（JAK2・CALR（calreticulin、遺伝子）・MPL（トロンボポエチン受容体の遺伝子）、血栓・出血）、原発性骨髄線維症（涙滴赤血球・白赤芽球症・脾腫、JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬）。","tg":[],"mt":["hemetumor"]},{"id":"hem-e28d9ace","f":"hem","u":76,"o":238,"lv":2,"q":"骨髄異形成症候群（MDS（myelodysplastic syndromes：骨髄異形成症候群））について正しいものはどれか。","ch":["高齢者に多く、異形成と血球減少があり白血病に進みうる","網状赤血球が増えて、溶血が主な病態である","予後は全例で良好で、治療は不要である","若い人に多く、骨髄は必ず低形成である"],"a":0,"cx":["","血球が骨髄の中で壊れる（無効造血）ため網状赤血球は少ない。","予後は IPSS-R（Revised International Prognostic Scoring System） などで大きく違う。高リスクは白血病への移行が多い。","多くは高齢者で、骨髄は正〜過形成が多い（無効造血）。"],"core":"MDS＝造血幹細胞のクローン性疾患。高齢者の大球性貧血・汎血球減少、異形成（偽 Pelger 核異常・環状鉄芽球・微小巨核球）。予後は IPSS-R（芽球・染色体・血球減少）で決める。","e":"低リスク：輸血・ESA（エリスロポエチン）、5q 欠失症候群にはレナリドミド（レブラミド）、環状鉄芽球を伴う MDS にルスパテルセプト（レブロジル）。\n高リスク：アザシチジン（脱メチル化薬）、若ければ造血幹細胞移植。\n治療関連 MDS（抗がん薬・放射線の後）は予後が悪い。\n輸血を繰り返すと鉄過剰症になり、キレート療法を行う。","tg":[],"mt":["hemetumor","anemia"]},{"id":"hem-7f32f56b","f":"hem","u":76,"o":239,"lv":3,"q":"62歳の女性。健診で血小板 98万/μL を指摘された。白血球・Hb は正常、脾腫はわずか。鉄欠乏・炎症・脾摘の既往はない。CALR（calreticulin、遺伝子） 遺伝子の変異が陽性。60歳を超えている。正しいものはどれか。","ch":["慢性骨髄性白血病として、イマチニブ（グリベック）を始める","反応性の血小板増多で、治療は不要である","血小板が多いので、出血は絶対に起こらない","本態性血小板血症で、リスクに応じて治療する"],"a":3,"cx":["BCR（breakpoint cluster region、BCR::ABL1 融合遺伝子の一部）::ABL1（ABL proto-oncogene 1、BCR::ABL1 融合遺伝子の一部） がないことを確かめる（CML（chronic myeloid leukemia：慢性骨髄性白血病） でも血小板が増える）。この例は CALR 変異。","鉄欠乏・炎症・脾摘などの原因がなく、遺伝子変異（CALR）があるので腫瘍性。","血小板が非常に多い（100万以上）と、von Willebrand 因子が吸着されて後天性 von Willebrand 病になり、かえって出血しやすい。",""],"core":"本態性血小板血症＝骨髄増殖性腫瘍の1つ（JAK2（Janus kinase 2、遺伝子）・CALR・MPL（トロンボポエチン受容体の遺伝子） 変異）。血栓症と出血。高リスク（60歳以上・血栓症の既往・JAK2 変異）はヒドロキシカルバミド（ハイドレア）などの細胞減少療法＋低用量アスピリン。","e":"反応性（二次性）血小板増多の原因：鉄欠乏性貧血、炎症・感染、悪性腫瘍、脾摘後、出血後。\n骨髄増殖性腫瘍の比較：CML（BCR（breakpoint cluster region、BCR::ABL1 融合遺伝子の一部）::ABL1（ABL proto-oncogene 1、BCR::ABL1 融合遺伝子の一部））、真性多血症（JAK2 V617F（JAK2 の変異）・赤血球↑）、本態性血小板血症（血小板↑）、原発性骨髄線維症（涙滴赤血球・脾腫・骨髄の線維化）。\n肝静脈・門脈など腹部の血栓症（Budd-Chiari 症候群）で見つかることもある。","tg":["ae","cs"]},{"id":"hem-d11358ca","f":"hem","u":76,"o":240,"lv":3,"q":"35歳の男性。2週間前から高熱が続き、肝脾腫がある。Hb 7.8 g/dL、白血球 1,800/μL、血小板 3.2万/μL、フェリチン 18,000 ng/mL、トリグリセリド 420 mg/dL、フィブリノゲン 110 mg/dL、可溶性 IL-2（interleukin-2：インターロイキン2） 受容体高値。骨髄で組織球が血球を貪食している。EB（Epstein-Barr） ウイルス DNA が血中で高値。最も考えられる診断はどれか。","ch":["血球貪食性リンパ組織球症","特発性血小板減少性紫斑病","鉄欠乏性貧血（消化管出血）","本態性血小板血症（JAK2（Janus kinase 2、遺伝子） 変異）"],"a":0,"cx":["","ITP（immune thrombocytopenia：特発性、免疫性血小板減少性紫斑病） は血小板だけが減り、発熱・肝脾腫・高フェリチンはない。","鉄欠乏ではフェリチンは低い。発熱・肝脾腫・汎血球減少も合わない。","血小板は減っており、増加ではない。"],"core":"HLH（血球貪食症候群）＝過剰な免疫反応（サイトカインストーム）。発熱・肝脾腫・血球減少・フェリチン著明高値・高 TG（triglyceride：トリグリセリド、中性脂肪）・低フィブリノゲン・sIL-2R（soluble interleukin-2 receptor：可溶性IL-2受容体） 高値・骨髄の血球貪食。原因（EBV（Epstein-Barr virus） などの感染・リンパ腫・膠原病＝マクロファージ活性化症候群）を探し、ステロイド・エトポシド・シクロスポリンなど。","e":"診断基準（HLH-2004）は8項目中5項目（発熱・脾腫・2系統以上の血球減少・高 TG か低フィブリノゲン・血球貪食・NK（natural killer） 活性低下・フェリチン 500 以上・sIL-2R 高値）。\n成人ではリンパ腫（とくに T/NK 細胞リンパ腫）に伴うものが多く、予後が悪い。\n家族性（遺伝性）は小児に多い。\n治療が遅れると多臓器不全で死亡しうる。","tg":["cs"],"mt":["anemia","hemetumor"]},{"id":"hem-5182df24","f":"hem","u":77,"o":241,"lv":2,"q":"多発性骨髄腫の典型的な所見（CRAB（高 Ca、Calcium・腎障害、Renal・貧血、Anemia・骨病変、Bone））に含まれないものはどれか。","ch":["腎障害","リンパ節の著しい腫大","溶骨性の骨病変","高カルシウム血症"],"a":1,"cx":["腎障害（R）は CRAB の1つ。円柱腎症（軽鎖）が多い。","","骨病変（B）は CRAB の1つ。打ち抜き像・病的骨折。","高カルシウム血症（C）は CRAB の1つ。"],"core":"CRAB＝高 Ca（Calcium）・腎障害（Renal）・貧血（Anemia）・骨病変（Bone）。リンパ節腫大はリンパ腫を考える。","e":"検査：M 蛋白（血清・尿の免疫固定法）、血清遊離軽鎖（FLC（free light chain：遊離軽鎖））の比、骨髄の形質細胞（10% 以上）、全身の骨の評価（低線量 CT（computed tomography：コンピュータ断層撮影）・PET（positron emission tomography）・MRI（magnetic resonance imaging：磁気共鳴画像））。\n赤沈が著しく亢進、総蛋白とアルブミンの差が大きい、アニオンギャップが小さい、赤血球の連銭形成。\n症状がなくても治療を始める基準（SLiM）：骨髄の形質細胞 60% 以上、FLC 比 100 以上、MRI で 5 mm 以上の病変が2つ以上。\n治療：ダラツムマブ（抗 CD38（形質細胞の表面分子））＋レナリドミド（レブラミド）＋デキサメタゾンなど、移植ができる人は自家移植。\n腎障害を悪くするもの：脱水、NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）、造影剤。\nMGUS（monoclonal gammopathy of undetermined significance：意義不明の単クローン性ガンマグロブリン血症）：M 蛋白 3 g/dL 未満・形質細胞 10% 未満・CRAB なし。年に約1% が骨髄腫などに進む。","tg":[],"mt":["hemetumor","anemia"]},{"id":"hem-8ab48901","f":"hem","u":77,"o":242,"lv":2,"q":"びまん性大細胞型 B 細胞リンパ腫（DLBCL（diffuse large B-cell lymphoma：びまん性大細胞型 B 細胞リンパ腫））の初回治療として標準的なのはどれか。","ch":["H. pylori 除菌療法だけ","ABVD（ドキソルビシン・ブレオマイシン・ビンブラスチン・ダカルバジン） 療法（ホジキンリンパ腫の標準）","R-CHOP（シクロホスファミド・ドキソルビシン・ビンクリスチン・プレドニゾロン） 療法（または Pola-R-CHP）","イマチニブ（グリベック）単剤の内服"],"a":2,"cx":["除菌は胃の MALT（mucosa-associated lymphoid tissue：粘膜関連リンパ組織） リンパ腫の治療。DLBCL には化学療法が必要。","ABVD はホジキンリンパ腫の標準治療。","","イマチニブは CML（chronic myeloid leukemia：慢性骨髄性白血病） などの治療。"],"core":"DLBCL＝最も多いリンパ腫で、急速に進む（中〜高悪性度）が治る可能性が高い。R-CHOP（リツキシマブ（リツキサン）・シクロホスファミド・ドキソルビシン・ビンクリスチン・プレドニゾロン）。","e":"予後：国際予後指標（IPI（International Prognostic Index：国際予後指標）：年齢 60歳超・LDH（lactate dehydrogenase：乳酸脱水素酵素）↑・PS（performance status：全身状態の指標） 2 以上・病期 III/IV・節外病変2か所以上）。\n再発・難治：CAR-T（chimeric antigen receptor T 細胞） 細胞療法、二重特異性抗体（エプコリタマブ（エプキンリ）・グロフィタマブ）、自家移植。\n中枢神経に再発しやすい人（精巣・腎/副腎・IPI 高値）には予防を考える。\nB 型肝炎の既往がある人にリツキシマブを使うときは HBV（hepatitis B virus：B 型肝炎ウイルス） の再活性化に注意（HBV-DNA（B 型肝炎ウイルスの DNA 量） の監視か予防投与）。\n低悪性度（濾胞性リンパ腫など）は進行がゆっくりで、症状がなければ経過観察もある。\nホジキンリンパ腫：Reed-Sternberg 細胞（CD15（顆粒球の表面分子）・CD30（活性化リンパ球の表面分子））、若年と高齢の二峰性、頸部リンパ節が連続して広がる。","tg":[],"mt":["hemetumor"]},{"id":"hem-a78c8d23","f":"hem","u":77,"o":243,"lv":2,"q":"成人T細胞白血病・リンパ腫（ATL（adult T-cell leukemia-lymphoma：成人T細胞白血病・リンパ腫））について正しいものはどれか。","ch":["感染経路は、主に飲食物による経口感染である","HTLV-1（human T-cell leukemia virus type 1：ヒト T 細胞白血病ウイルス1型） 感染者に起こり、高 Ca 血症・皮膚病変を伴う","花弁状の核をもつ、B 細胞が増える","HTLV-1（human T-cell leukemia virus type 1：ヒト T 細胞白血病ウイルス1型） の感染者の半数以上が、ATL を発症する"],"a":1,"cx":["主な経路は母乳（母子感染）、性交渉、輸血（今は献血のスクリーニングで防いでいる）。","","ATL の細胞は CD4（CD4 陽性 T 細胞、ヘルパー T 細胞） 陽性の T 細胞。花細胞（flower cell）が特徴。","感染者の生涯発症率は約5% 程度。"],"core":"ATL＝HTLV-1 による CD4（CD4 陽性 T 細胞、ヘルパー T 細胞） 陽性 T 細胞の腫瘍。九州・沖縄に多い。花細胞、高カルシウム血症（PTHrP（PTH-related protein：副甲状腺ホルモン関連蛋白））、皮膚病変、日和見感染。急性型・リンパ腫型は予後不良。","e":"治療：急性型・リンパ腫型は多剤併用化学療法（mLSG15 など）、モガムリズマブ（抗 CCR4（CC chemokine receptor 4） 抗体）、若ければ同種造血幹細胞移植。くすぶり型・慢性型（予後因子がない）は経過観察が多い。\nHTLV-1 関連脊髄症（HAM（HTLV-1-associated myelopathy：HTLV-1 関連脊髄症））：痙性対麻痺・排尿障害。\n母子感染を防ぐ：妊婦健診で抗体を調べ、陽性なら授乳の方法（人工栄養など）を相談する。","tg":[],"mt":["hemetumor"]},{"id":"hem-1ef50fc4","f":"hem","u":78,"o":244,"lv":1,"q":"凝固検査の結果と考える病態の組み合わせで正しいものはどれか。","ch":["APTT（activated partial thromboplastin time：活性化部分トロンボプラスチン時間） だけ延長・出血 ― 血友病 A","APTT（activated partial thromboplastin time：活性化部分トロンボプラスチン時間） だけ延長・血栓症 ― ビタミン K 欠乏","PT（prothrombin time：プロトロンビン時間）・APTT（activated partial thromboplastin time：活性化部分トロンボプラスチン時間） とも正常で関節内出血 ― 血友病 B","PT（prothrombin time：プロトロンビン時間） だけ延長 ― ヘパリンの投与"],"a":0,"cx":["","APTT 延長で血栓症を繰り返すなら、ループスアンチコアグラント（抗リン脂質抗体症候群）を考える。","血友病 B（第 IX 因子欠乏）は APTT が延長する。","ヘパリンは主に APTT（activated partial thromboplastin time：活性化部分トロンボプラスチン時間） を延長する。PT だけの延長は第 VII 因子（外因系）の不足：ワルファリン（ワーファリン）・ビタミン K 欠乏の初期・肝障害の初期。"],"core":"PT＝外因系（VII）＋共通系、APTT＝内因系（XII・XI・IX・VIII）＋共通系。APTT だけ延長で出血＝血友病・von Willebrand 病・後天性血友病。血栓＝ループスアンチコアグラント。","e":"区別に使う「補正試験（クロスミキシング）」：正常の血漿を混ぜて APTT が戻れば因子の欠乏、戻らなければインヒビター（抗体：ループスアンチコアグラント・後天性血友病）。\n後天性血友病 A：高齢者や産後に、第 VIII 因子への自己抗体ができ、筋肉内・皮下の広い出血。バイパス製剤・エミシズマブ・免疫抑制。\nvon Willebrand 病：最も多い先天性の出血性疾患、粘膜出血（鼻出血・過多月経）、出血時間延長。デスモプレシン（ミニリンメルト）。\n血小板の数が正常で出血時間が延長：血小板の機能異常（アスピリン・尿毒症・von Willebrand 病）。","tg":[],"fig":["coag"],"mt":["bleeding"]},{"id":"hem-217d7626","f":"hem","u":78,"o":245,"lv":3,"q":"35歳の女性。数日前から倦怠感と微熱があり、今日は言葉が出にくくなった。Hb 7.8 g/dL、血小板 1.5 万/μL、末梢血に破砕赤血球が多数、LDH（lactate dehydrogenase：乳酸脱水素酵素） 1,450 U/L、間接ビリルビン高値、直接 Coombs 試験陰性、クレアチニン 1.2 mg/dL。PT（prothrombin time：プロトロンビン時間）・APTT（activated partial thromboplastin time：活性化部分トロンボプラスチン時間） は正常。最も適切な対応はどれか。","ch":["ステロイドを使わず、ADAMTS13（von Willebrand 因子を切断する酵素） の結果が出るまで待つ","ADAMTS13（von Willebrand 因子を切断する酵素） を採血し、結果を待たずに血漿交換","血小板が少ないので、まず血小板輸血を行う","微小血栓に対して、抗凝固療法としてヘパリンを始める"],"a":1,"cx":["TTP（thrombotic thrombocytopenic purpura：血栓性血小板減少性紫斑病） は治療しなければ死亡率が非常に高い。疑ったら結果を待たない。","","TTP（thrombotic thrombocytopenic purpura：血栓性血小板減少性紫斑病） への血小板輸血は血栓を増やして病状を悪化させうるので、命にかかわる出血がなければ避ける。","TTP（thrombotic thrombocytopenic purpura：血栓性血小板減少性紫斑病） の微小血栓は血小板の血栓（von Willebrand 因子）で、凝固系の抗凝固療法は治療にならない。"],"core":"血栓性血小板減少性紫斑病（TTP（thrombotic thrombocytopenic purpura：血栓性血小板減少性紫斑病））＝ADAMTS13 活性が 10% 未満（後天性は自己抗体）。微小血管症性溶血性貧血（破砕赤血球）＋血小板減少＋臓器障害（精神神経症状・腎障害・発熱）。血漿交換＋ステロイド＋カプラシズマブ（抗 VWF（von Willebrand factor））、リツキシマブ（リツキサン）。","e":"血栓性微小血管症（TMA（thrombotic microangiopathy：血栓性微小血管症））の区別：\n・TTP：ADAMTS13 著減、神経症状が目立つ、腎障害は比較的軽い\n・志賀毒素産生性大腸菌の HUS（hemolytic uremic syndrome：溶血性尿毒症症候群）：血便の後、小児に多い、腎障害が目立つ\n・非典型 HUS（補体の異常）：補体 C5 阻害薬（エクリズマブ（ソリリス）・ラブリズマブ）\n・二次性：妊娠（HELLP（Hemolysis, Elevated Liver enzymes, Low Platelets、溶血・肝酵素上昇・血小板減少））、悪性高血圧、強皮症腎クリーゼ、移植後、薬（カルシニューリン阻害薬・ゲムシタビン・キニーネ）、癌\nDIC（disseminated intravascular coagulation：播種性血管内凝固） との違い：TMA では PT・APTT・フィブリノゲンはほぼ正常。","tg":["cs"],"mt":["anemia"]},{"id":"hem-6e9901c3","f":"hem","u":78,"o":246,"lv":2,"q":"特発性血小板減少性紫斑病（ITP（immune thrombocytopenia：特発性、免疫性血小板減少性紫斑病））について正しいものはどれか。","ch":["骨髄の巨核球は、減少している","H. pylori 陽性なら、まず除菌を考える","血小板 8 万/μL でも出血がなければ、全例でステロイドを使う","トロンボポエチン受容体作動薬は、出血を悪化させる"],"a":1,"cx":["骨髄の巨核球は正常〜増加（末梢で壊されるため）。","","出血がなく血小板が 3 万/μL 以上なら、無治療で経過を見ることが多い。","TPO（thrombopoietin：トロンボポエチン） 受容体作動薬（エルトロンボパグ（レボレード）・ロミプロスチム）は血小板をつくらせ、出血を減らす。血栓症に注意。"],"core":"成人の ITP：日本では H. pylori 陽性なら除菌がまず勧められる（約半数で血小板が増える）。治療は血小板 3 万未満や出血で、ステロイド→TPO（thrombopoietin：トロンボポエチン） 受容体作動薬・リツキシマブ・脾摘・ホスタマチニブ。","e":"診断は除外診断：偽性血小板減少（EDTA（ethylenediaminetetraacetic acid、採血管の抗凝固薬） 依存性：クエン酸採血で確かめる）、薬、肝硬変（脾機能亢進）、HIV（human immunodeficiency virus：ヒト免疫不全ウイルス）・HCV（hepatitis C virus：C型肝炎ウイルス）、SLE（systemic lupus erythematosus：全身性エリテマトーデス）・抗リン脂質抗体症候群、骨髄の病気、妊娠性。\n緊急時（重い出血・手術）：免疫グロブリン大量静注、ステロイドパルス、血小板輸血。\n妊娠中：ステロイドか免疫グロブリン。TPO 受容体作動薬は使わない。","tg":[]},{"id":"hem-597ce573","f":"hem","u":78,"o":247,"lv":3,"q":"66歳の男性。心臓手術の後、未分画ヘパリンを使っている。術後8日目、血小板が 21 万から 7 万/μL に下がり、左下肢の深部静脈血栓症が見つかった。正しい対応はどれか。","ch":["ヘパリンを中止し、アルガトロバン（スロンノン、ノバスタン）で抗凝固を続ける","ヘパリンを低分子ヘパリンに切り替える","ワルファリン（ワーファリン）だけをすぐに始める","ヘパリンを続け、血小板を輸血する"],"a":0,"cx":["","低分子ヘパリンも HIT（heparin-induced thrombocytopenia：ヘパリン起因性血小板減少症） 抗体と交差反応するので使わない。","HIT（heparin-induced thrombocytopenia：ヘパリン起因性血小板減少症） の急性期に単独でワルファリンを始めると、プロテイン C が先に下がり皮膚壊死・静脈性壊疽を起こす。血小板が戻ってから重ねて始める。","原因のヘパリンを続けてはいけない。血小板輸血は血栓を増やしうる。"],"core":"ヘパリン起因性血小板減少症（HIT（heparin-induced thrombocytopenia：ヘパリン起因性血小板減少症））＝ヘパリン開始5〜14日後に血小板が50%以上減り、血栓症を起こす（出血ではない）。ヘパリンをすべて中止（ロック・コーティングも）し、アルガトロバンなどで抗凝固。","e":"機序：ヘパリンと血小板第4因子（PF4（platelet factor 4：血小板第4因子））の複合体への IgG（immunoglobulin G：免疫グロブリン G） 抗体が血小板を活性化する。\n4T スコア（血小板減少の程度・時期・血栓症・ほかの原因）で検査前確率を評価し、HIT 抗体を測る。\n最近100日以内にヘパリンを使った人は、再投与で数日以内（急速発症）に起こることがある。\nワクチン起因性免疫性血栓性血小板減少症（VITT（vaccine-induced immune thrombotic thrombocytopenia：ワクチン起因性免疫性血栓性血小板減少症））：アデノウイルスベクターのワクチン後、抗 PF4 抗体、脳静脈洞血栓症。","tg":["cs"],"fig":["coag"]},{"id":"hem-f1bc1b90","f":"hem","u":78,"o":248,"lv":2,"q":"播種性血管内凝固（DIC（disseminated intravascular coagulation：播種性血管内凝固））について正しいものはどれか。","ch":["DIC の治療で最も大事なのは、抗凝固薬で原因に関係なく治すことである","急性前骨髄球性白血病の DIC は線溶が抑えられ、出血は少ない","敗血症の DIC は線溶が抑えられ、臓器障害が出やすい","DIC ではフィブリノゲンは必ず上がる"],"a":2,"cx":["最も大事なのは原因（敗血症・癌・産科疾患・外傷など）の治療。","APL（acute promyelocytic leukemia：急性前骨髄球性白血病）・大動脈瘤・前立腺癌の DIC は線溶が強く、出血が目立つ（線溶亢進型）。","","フィブリノゲンは消費されて下がることが多い（ただし敗血症では急性期反応で正常のこともある）。"],"core":"DIC の型：線溶抑制型（敗血症：PAI-1（plasminogen activator inhibitor-1） が増え、微小血栓で臓器障害）、線溶亢進型（APL（acute promyelocytic leukemia：急性前骨髄球性白血病）・大動脈瘤・前立腺癌：出血）、線溶均衡型（固形癌）。原因の治療が第一。","e":"検査：血小板↓、FDP（fibrin/fibrinogen degradation products：フィブリン・フィブリノゲン分解産物）・D ダイマー↑、PT（prothrombin time：プロトロンビン時間） 延長、フィブリノゲン↓、アンチトロンビン↓。TAT（thrombin-antithrombin complex：トロンビン-アンチトロンビン複合体）・PIC（plasmin-α2 plasmin inhibitor complex） で凝固と線溶の活性を見る。\n治療：原因の治療、アンチトロンビン製剤（アンチトロンビンが低いとき）、トロンボモジュリン製剤、ヘパリン類、出血には補充（新鮮凍結血漿・血小板・フィブリノゲン）。\n線溶亢進型でも、抗線溶薬（トラネキサム酸（トランサミン））は血栓症の危険があり慎重に。","tg":[]},{"id":"hem-9b1873dd","f":"hem","u":79,"o":249,"lv":2,"q":"輸血の副作用について正しいものはどれか。","ch":["輸血後 GVHD（graft-versus-host disease：移植片対宿主病） は、放射線照射した血液でも予防できない","ABO（ABO 式血液型） 不適合輸血は、輸血開始から数日たって初めて症状が出る","輸血関連循環過負荷（TACO（transfusion-associated circulatory overload：輸血関連循環過負荷））は、利尿薬で悪化する","TRALI（transfusion-related acute lung injury：輸血関連急性肺障害） は輸血中〜6時間以内の非心原性肺水腫"],"a":3,"cx":["輸血後 GVHD は放射線照射（15〜50 Gy）で予防できる。日本では照射製剤が標準。","ABO 不適合輸血は開始直後（数分〜十数分）から発熱・悪寒・血圧低下・ヘモグロビン尿・DIC（disseminated intravascular coagulation：播種性血管内凝固）。すぐに中止。","TACO（循環血液量の過剰）は利尿薬で良くなる。心不全・腎不全・高齢者で起こりやすい。",""],"core":"TRALI＝輸血中〜6時間以内の急な呼吸不全・両側肺浸潤（非心原性）。供血者の抗 HLA（human leukocyte antigen：ヒト白血球抗原）・抗好中球抗体が関わる。TACO＝心原性で、BNP（brain natriuretic peptide：脳性ナトリウム利尿ペプチド） 高値・利尿薬が効く。","e":"ほかの副作用：\n・アレルギー反応（蕁麻疹〜アナフィラキシー、IgA（immunoglobulin A：免疫グロブリン A） 欠損症の人は抗 IgA 抗体で重い反応）\n・発熱性非溶血性反応（白血球除去で減った）\n・遅発性溶血性反応（数日〜2週後、不規則抗体：Kidd など）\n・細菌感染（とくに血小板製剤は室温保存のため）\n・高カリウム（古い赤血球・大量輸血）、低カルシウム（クエン酸）、低体温\n・鉄過剰（繰り返す赤血球輸血）\n赤血球輸血の目安：多くの入院患者で Hb 7 g/dL 未満（心疾患などでは 8 程度）。","tg":["ae"]},{"id":"hem-a6b00e03","f":"hem","u":80,"o":250,"lv":3,"q":"62歳の男性。健診で白血球増加を指摘された。症状はない。白血球 28,000/μL（成熟した小型リンパ球 85%）、Hb・血小板は正常。末梢血に smudge cell（壊れた細胞）がある。フローサイトメトリーで CD5（T 細胞・一部の B 細胞の表面分子）・CD19（B 細胞の表面分子）・CD23（B 細胞の表面分子） 陽性の B 細胞。最も適切な対応はどれか。","ch":["CLL（chronic lymphocytic leukemia：慢性リンパ性白血病） として、進行や症状がなければ経過観察","慢性骨髄性白血病として、イマチニブ（グリベック）を始める","感染症による反応性のリンパ球増加として抗菌薬を投与","急性リンパ性白血病として、ただちに強力な化学療法"],"a":0,"cx":["","CML（chronic myeloid leukemia：慢性骨髄性白血病） は顆粒球の増加と BCR（breakpoint cluster region、BCR::ABL1 融合遺伝子の一部）::ABL1（ABL proto-oncogene 1、BCR::ABL1 融合遺伝子の一部）。","単クローン性（CD5・CD23 陽性の B 細胞）で、反応性ではない。","成熟した小型リンパ球の増加で、芽球ではない。急性白血病ではない。"],"core":"慢性リンパ性白血病（CLL）＝高齢者、CD5・CD23 陽性の成熟 B 細胞の増加。早期で症状がなければ治療しない（早く治療しても予後は変わらない）。症状・貧血・血小板減少・急速な増加・リンパ節/脾臓の腫大で治療（BTK（Bruton tyrosine kinase） 阻害薬・ベネトクラクス±抗 CD20（B 細胞の表面分子） 抗体）。","e":"日本では欧米より少ない。\n合併症：自己免疫性溶血性貧血・ITP（immune thrombocytopenia：特発性、免疫性血小板減少性紫斑病）、低ガンマグロブリン血症（感染症）、大細胞型リンパ腫への転化（Richter 症候群）。\nTP53（tumor protein p53、がん抑制遺伝子） 異常・del(17p) は予後不良で、化学療法より分子標的薬。\nマントル細胞リンパ腫も CD5 陽性だが、CD23 陰性・サイクリン D1 陽性（t(11;14)）。","tg":["cs"],"mt":["hemetumor","anemia"]},{"id":"hem-24b02bc9","f":"hem","u":80,"o":251,"lv":3,"q":"58歳の男性。顔が赤く、入浴後に体がかゆい。頭重感がある。Hb 19.8 g/dL、Ht 60%、白血球 12,000/μL、血小板 52万/μL。脾臓を触れる。エリスロポエチンは低値。JAK2（Janus kinase 2、遺伝子） V617F（JAK2 の変異） 変異が陽性。正しい治療はどれか。","ch":["瀉血と低用量アスピリン","赤血球輸血と鉄の補充","エリスロポエチン製剤の投与","鉄剤を大量に補う"],"a":0,"cx":["","赤血球が多すぎる病気で、輸血は全く逆。","エリスロポエチンは赤血球をさらに増やす。","瀉血で鉄欠乏になるが、鉄を補うと赤血球がまた増える。原則として補わない。"],"core":"真性多血症＝JAK2 変異による赤血球の増加（白血球・血小板も）。血栓症が最大の合併症。全員に瀉血（Ht 45% 未満）＋低用量アスピリン、高リスク（60歳以上か血栓症の既往）はヒドロキシカルバミド（ハイドレア）などの細胞減少療法（ルキソリチニブ（ジャカビ）・ロペグインターフェロン アルファ-2b も）。","e":"二次性多血症（エリスロポエチンは正常〜高値）：喫煙・低酸素（COPD（chronic obstructive pulmonary disease：慢性閉塞性肺疾患）・睡眠時無呼吸・高地）、腎癌・肝癌（エリスロポエチン産生）、テストステロン補充、SGLT2（sodium-glucose cotransporter 2：ナトリウム・グルコース共輸送体2） 阻害薬（軽い上昇）。\n相対的多血症：脱水・ストレス多血症（赤血球の量は正常）。\nアクアジェニック掻痒（入浴後のかゆみ）は真性多血症に特徴的。\n骨髄線維症・急性白血病へ移行することがある。","tg":["ae","cs"],"mt":["hemetumor"]},{"id":"hem-6e580e96","f":"hem","u":80,"o":252,"lv":2,"q":"ホジキンリンパ腫について正しいものはどれか。","ch":["Reed-Sternberg 細胞（CD15（顆粒球の表面分子）・CD30（活性化リンパ球の表面分子） 陽性）が特徴","B 症状（発熱・寝汗・体重減少）は予後と関係しない","高齢者だけに起こり、若い人にはない","病変は飛び飛びに広がり、隣のリンパ節へ連続しない"],"a":0,"cx":["","B 症状（38℃以上の発熱・寝汗・6か月で10%以上の体重減少）は予後不良因子。","若年（20歳代）と高齢の二つの山がある。","ホジキンリンパ腫は隣のリンパ節へ連続して広がりやすい（放射線治療が使える理由）。"],"core":"ホジキンリンパ腫＝Reed-Sternberg 細胞（大型・二核の「ふくろうの目」）、背景に多くの反応性細胞。ABVD（ドキソルビシン・ブレオマイシン・ビンブラスチン・ダカルバジン） 療法（± 放射線）、進行期はブレンツキシマブ ベドチン（抗 CD30）を含む治療。EB（Epstein-Barr） ウイルスとの関連。","e":"飲酒でリンパ節が痛むことがある（特徴的だがまれ）。\n若い人の治療後の晩期障害：二次がん（乳癌・肺癌）、心臓・肺の障害（アントラサイクリン・ブレオマイシン・放射線）、不妊。\n再発・難治：免疫チェックポイント阻害薬（ニボルマブ（オプジーボ）・ペムブロリズマブ）がよく効く。","tg":[],"mt":["hemetumor"]},{"id":"hem-fa533427","f":"hem","u":81,"o":253,"lv":3,"q":"34歳の女性。出産直後に大量の出血があり、ショックになった。血小板 4.2 万/μL、PT-INR（プロトロンビン時間の国際標準比） 2.4、APTT（activated partial thromboplastin time：活性化部分トロンボプラスチン時間） 延長、フィブリノゲン 62 mg/dL、FDP（fibrin/fibrinogen degradation products：フィブリン・フィブリノゲン分解産物）・D ダイマーが著明に上昇。最も適切な治療はどれか。","ch":["ビタミン B12 の筋注と葉酸の内服を行う","止血と、フィブリノゲン・FFP（fresh frozen plasma：新鮮凍結血漿）・血小板・赤血球の補充","トロンボポエチン受容体作動薬を内服させる","ヘパリンだけを大量に使って、DIC（disseminated intravascular coagulation：播種性血管内凝固） を止める"],"a":1,"cx":["凝固障害とは関係がない。","","効くまで日単位かかり、急性の出血には使えない。","大量出血の DIC では、ヘパリンは出血を悪化させる。"],"core":"産科 DIC（常位胎盤早期剥離・羊水塞栓・弛緩出血）＝線溶が強く、フィブリノゲンが急に下がる。原因の除去（止血・子宮の処置）と、フィブリノゲン（濃縮製剤・クリオプレシピテート）・新鮮凍結血漿・血小板・赤血球の早い補充。","e":"フィブリノゲン 150 mg/dL 以上を目安に保つ（100 未満は止血が困難）。\nトラネキサム酸（抗線溶薬）は分娩後出血の早期（3時間以内）に使うと死亡を減らす。\n大量輸血では、赤血球・新鮮凍結血漿・血小板をバランスよく入れる（希釈性の凝固障害を防ぐ）。低カルシウム（クエン酸）・低体温・アシドーシスにも注意。","tg":["cs"],"fig":["coag"]},{"id":"hem-dcd3f89e","f":"hem","u":81,"o":254,"lv":2,"q":"血友病 A について正しいものはどれか。","ch":["常染色体顕性遺伝で、女性に多い","PT（prothrombin time：プロトロンビン時間） が延長し、APTT（activated partial thromboplastin time：活性化部分トロンボプラスチン時間） は正常である","粘膜出血・点状出血が、主な症状である","X 連鎖潜性で、関節内出血を繰り返し、APTT（activated partial thromboplastin time：活性化部分トロンボプラスチン時間） が延長"],"a":3,"cx":["X 連鎖潜性で、ほとんどが男性（女性は保因者）。","APTT が延長し、PT は正常。","点状出血・粘膜出血は血小板の異常や von Willebrand 病の特徴。血友病は深部出血（関節・筋肉）。",""],"core":"血友病 A（第 VIII 因子欠乏）・B（第 IX 因子欠乏）＝X 連鎖潜性、関節内出血（血友病性関節症）・筋肉内出血・頭蓋内出血、APTT 延長・PT 正常・出血時間正常。","e":"治療：欠乏した因子の補充（定期補充で関節を守る）、半減期延長型製剤、エミシズマブ（第 VIII 因子の働きをまねる二重特異性抗体、皮下注で週1〜4週ごと）、遺伝子治療。\nインヒビター（因子に対する抗体）ができると補充が効かず、バイパス製剤・エミシズマブを使う。\n筋肉注射・NSAIDs（抗血小板作用）は避ける。","tg":[],"fig":["coag"],"mt":["bleeding"]},{"id":"hem-af586919","f":"hem","u":81,"o":255,"lv":2,"q":"von Willebrand 病について正しいものはどれか。","ch":["関節内出血が主な症状で、X 連鎖潜性遺伝である","PT（prothrombin time：プロトロンビン時間） が著しく延長し、APTT（activated partial thromboplastin time：活性化部分トロンボプラスチン時間） は必ず正常である","最も多い先天性の出血性疾患で、粘膜出血が多い","治療にデスモプレシン（ミニリンメルト）は効かない"],"a":2,"cx":["関節内出血・X 連鎖潜性は血友病。","von Willebrand 因子は第 VIII 因子を守るので、APTT が延長することがある。PT は正常。","","多くの1型ではデスモプレシン（von Willebrand 因子を放出させる）が効く。"],"core":"von Willebrand 病＝VWF（von Willebrand factor） の量・質の異常。血小板の粘着障害（出血時間延長）と第 VIII 因子の低下（APTT 延長）。粘膜出血・手術後の出血。治療：デスモプレシン、VWF を含む第 VIII 因子製剤、トラネキサム酸（トランサミン）。","e":"後天性 von Willebrand 症候群：大動脈弁狭窄症（Heyde 症候群）、補助人工心臓、本態性血小板血症（血小板 100万以上）、甲状腺機能低下症、リンパ増殖性疾患。\nアスピリン・NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） は出血を悪化させるので避ける。","tg":[]},{"id":"hem-1597114b","f":"hem","u":82,"o":256,"lv":2,"q":"同種造血幹細胞移植後の合併症について正しいものはどれか。","ch":["急性 GVHD（graft-versus-host disease：移植片対宿主病） は皮膚・肝・腸を侵し、ステロイドで治療","慢性 GVHD（graft-versus-host disease：移植片対宿主病） は、皮膚と口腔には現れない","移植後の CMV（cytomegalovirus：サイトメガロウイルス） 再活性化は、起こらない","GVHD（graft-versus-host disease：移植片対宿主病） は、自家移植で最も多い"],"a":0,"cx":["","慢性 GVHD は皮膚の硬化・口腔/眼の乾燥（シェーグレン様）・閉塞性細気管支炎・肝障害など多彩。","CMV の再活性化は多く、レテルモ
