10%）と運動。糖尿病の薬は肝臓にも良いもの（GLP-1（glucagon-like peptide-1） 受容体作動薬・SGLT2（sodium-glucose cotransporter 2：ナトリウム・グルコース共輸送体2） 阻害薬・ピオグリタゾン）を選ぶ。\n進んだ線維化・肝硬変では、肝癌のサーベイランス（6か月ごとの超音波など）と食道静脈瘤の評価。\nほかの肝疾患（B 型・C 型・自己免疫性・薬・Wilson 病・ヘモクロマトーシス）を除いておく。","tg":["cs"]},{"id":"gi-cd3c7332","f":"gi","u":23,"o":77,"lv":3,"q":"56歳の女性。2か月前から健康食品（ウコン）を飲み始めた。1週間前から倦怠感と黄疸がある。AST（aspartate aminotransferase） 820 U/L、ALT（alanine aminotransferase） 1,050 U/L、ALP（alkaline phosphatase：アルカリホスファターゼ） 380 U/L（基準 38〜113）、総ビリルビン 6.2 mg/dL。ウイルス性肝炎のマーカーは陰性、抗核抗体は弱陽性。最も適切な対応はどれか。","ch":["健康食品は続けたまま、ステロイドを開始する","ただちに全例で肝生検を行い、結果を待つ","原因と考えられる健康食品を中止する","抗核抗体陽性なので、自己免疫性肝炎と確定する"],"a":2,"cx":["薬物性肝障害が疑われるときは、まず原因（薬・健康食品）を止める。","肝生検は、原因が決められない・中止しても改善しないときなどに考える。","","抗核抗体の弱陽性だけで AIH（autoimmune hepatitis：自己免疫性肝炎） とは決められない（薬物性でも陽性になることがある）。止めても改善しない・IgG（immunoglobulin G：免疫グロブリン G） が高いなどで AIH を考える。"],"core":"薬物性肝障害（漢方・健康食品・サプリを含む）＝まず原因の中止。R 値（ALT 比÷ALP 比）で型を決める（この例は ALT 1,050/基準上限≒25、ALP 380/113≒3.4 → R≒7.5 で肝細胞障害型）。","e":"診断の目安：DDW-J 2004 スコア（服用から発症までの期間・中止後の経過・危険因子・ほかの原因の除外・好酸球増多・DLST（drug-induced lymphocyte stimulation test：薬剤リンパ球刺激試験）・再投与）。\n黄疸を伴う肝細胞障害型は重症化しやすい（Hy の法則：ALT 3倍以上＋総ビリルビン 2倍以上で約1割が重症）。PT（prothrombin time：プロトロンビン時間） を見て、急性肝不全の兆しがあれば専門施設へ。\n原因の多い薬：抗菌薬（アモキシシリン（サワシリン、パセトシン）・クラブラン酸）、抗結核薬、解熱鎮痛薬、抗てんかん薬、免疫チェックポイント阻害薬、漢方薬、健康食品。\n同じ薬の再投与は重い再発を起こすので避ける。","tg":["cs"]},{"id":"gi-75e3ee3e","f":"gi","u":23,"o":78,"lv":2,"q":"Budd-Chiari 症候群について正しいものはどれか。","ch":["肝静脈か肝部下大静脈の閉塞で、腹水・肝腫大を起こす","治療は経過観察だけで、血栓の原因を調べる必要はない","若い人には起こらず、高齢者だけに起こる","門脈の血栓が原因で、肝臓は小さく萎縮する"],"a":0,"cx":["","背景の血栓性素因を調べ、抗凝固療法・血管形成術・TIPS（transjugular intrahepatic portosystemic shunt：経頸静脈的肝内門脈体循環シャント）・肝移植を考える。","若い人にも起こり、骨髄増殖性腫瘍（JAK2（Janus kinase 2、遺伝子） 変異）・経口避妊薬・妊娠・PNH（paroxysmal nocturnal hemoglobinuria：発作性夜間ヘモグロビン尿症） などの血栓性素因が背景にある。","門脈血栓は肝前性の門脈圧亢進。Budd-Chiari は肝後性（肝臓からの出口の閉塞）。"],"core":"Budd-Chiari 症候群＝肝静脈〜肝部下大静脈の閉塞（肝後性の門脈圧亢進）。腹痛・腹水・肝腫大、下大静脈の閉塞では下肢浮腫と腹壁の静脈怒張（下から上に流れる）。尾状葉の腫大（独立した静脈で流れるため）。","e":"日本では下大静脈の膜様閉塞が多い。\n血栓性素因の検索：JAK2（Janus kinase 2、遺伝子） V617F（真性多血症）、PNH（paroxysmal nocturnal hemoglobinuria：発作性夜間ヘモグロビン尿症）、抗リン脂質抗体症候群、プロテイン C/S・アンチトロンビン欠乏、経口避妊薬。\n画像：造影 CT（computed tomography：コンピュータ断層撮影）・超音波ドプラで肝静脈の血流が見えない。","tg":[],"fig":["portal"]},{"id":"gi-663cce98","f":"gi","u":24,"o":79,"lv":3,"q":"62歳の男性。毎日大量に飲酒している。数年前から食後の上腹部痛を繰り返し、最近は脂っぽい下痢と体重減少がある。血糖も上がってきた。CT（computed tomography：コンピュータ断層撮影） で膵臓の萎縮と膵石（石灰化）、主膵管の拡張がある。正しい対応はどれか。","ch":["断酒・禁煙と、消化酵素の補充（パンクレリパーゼ（リパクレオン））","痛みには NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） を長期に大量に使い続ける","血糖は SU（sulfonylurea：スルホニル尿素） 薬で厳しく下げる","脂肪の多い食事にしてエネルギーを補う"],"a":0,"cx":["","痛みの管理は段階的に。改善しなければ内視鏡治療（膵石の破砕・膵管ステント）・手術。","膵性糖尿病はグルカゴンの分泌も落ちるので低血糖を起こしやすい。インスリン（少量）を慎重に使う。","脂肪便は消化酵素の不足（外分泌不全）による。脂肪は極端に制限しすぎず、高力価の消化酵素薬で補う。"],"core":"慢性膵炎＝アルコールが最多（喫煙も危険因子）。腹痛→進むと外分泌不全（脂肪便・体重減少）と内分泌不全（膵性糖尿病）。膵石・膵管の拡張。断酒・禁煙、パンクレリパーゼ、インスリン。","e":"脂溶性ビタミン（A・D・E・K）の不足、骨粗鬆症にも注意。\n膵癌の危険が上がる。体重減少・黄疸の新しい出現・急な糖尿病の悪化で疑う。\n合併症：仮性嚢胞・胆管狭窄・十二指腸狭窄・脾静脈血栓（胃静脈瘤）。\n早期慢性膵炎の診断には超音波内視鏡が使われる。","tg":["cs"]},{"id":"gi-69b6bb07","f":"gi","u":24,"o":80,"lv":2,"q":"胆嚢ポリープ・胆嚢癌について正しいものはどれか。","ch":["陶器様胆嚢（壁の石灰化）は、癌の危険と関係しない","コレステロールポリープは癌化しやすいので、全例で手術する","胆嚢癌は男性に多く、胆石とは関係がない","10 mm 以上・広基性・増大するものは癌を疑い手術を考える"],"a":3,"cx":["陶器様胆嚢（胆嚢壁の石灰化）は癌の合併が報告され、手術を考える。","5 mm 以下の有茎性で桑の実状のコレステロールポリープは良性で、経過観察。","胆嚢癌は女性・高齢者に多く、胆石の合併が多い。",""],"core":"胆嚢ポリープ：10 mm 以上・広基性（茎がない）・増大・壁の肥厚を伴うものは癌を疑う。超音波内視鏡・造影 CT（computed tomography：コンピュータ断層撮影） で評価し、胆嚢摘出術を考える。","e":"胆嚢癌の危険因子：胆石、膵・胆管合流異常（膵液が胆道に逆流）、陶器様胆嚢、原発性硬化性胆管炎。\n膵・胆管合流異常：胆管拡張型は胆管も胆嚢も切除、非拡張型は胆嚢摘出。\n無症状の胆石は原則経過観察（例外：癌が否定できない、陶器様胆嚢など）。","tg":[]},{"id":"cv-50150651","f":"cv","u":25,"o":81,"lv":1,"q":"心音について正しいものはどれか。","ch":["IV 音は、心房細動のときに最もよく聞こえる","II 音の分裂は、呼気で広くなるのが正常である","III 音は急速流入で生じ、高齢者では心不全を示す","I 音は、大動脈弁と肺動脈弁が閉じる音である"],"a":2,"cx":["IV 音は心房の収縮で生じるので、心房が収縮しない心房細動では聞こえない。","正常では吸気で右心への還流が増え、肺動脈弁の閉鎖が遅れて II 音の分裂が広がる（生理的分裂）。","","I 音は房室弁（僧帽弁・三尖弁）の閉鎖。II 音が半月弁（大動脈弁・肺動脈弁）の閉鎖。"],"core":"III 音＝拡張早期の急速流入（容量負荷：心不全・MR（mineralocorticoid receptor：ミネラルコルチコイド受容体））。IV 音＝拡張後期の心房収縮（硬い心室：高血圧・肥大型心筋症・AS（ankylosing spondylitis：強直性脊椎炎）・心筋虚血）。","e":"II 音の分裂：\n・生理的分裂：吸気で広がる\n・固定性分裂：心房中隔欠損症\n・奇異性分裂（呼気で広がる）：左脚ブロック・大動脈弁狭窄症・右室ペーシング\n・広い分裂：右脚ブロック・肺動脈弁狭窄\n雑音の聴取部位：大動脈弁＝胸骨右縁第2肋間、肺動脈弁＝胸骨左縁第2肋間、三尖弁＝胸骨左縁第4肋間、僧帽弁＝心尖部。\n右心系の雑音は吸気で大きくなる（Rivero-Carvallo 徴候）。","tg":[],"mt":["hfdrugs"]},{"id":"cv-9bb6ed72","f":"cv","u":25,"o":82,"lv":1,"q":"冠動脈と灌流域の組み合わせで正しいものはどれか。","ch":["右冠動脈 ― 前壁と心尖部だけ（下壁は養わない）","左前下行枝 ― 前壁・心室中隔の前2/3・心尖部","左回旋枝 ― 心室中隔の前2/3と心尖部","右冠動脈 ― 洞結節・房室結節を養うことはない"],"a":1,"cx":["右冠動脈は下壁・右室・心室中隔の後ろ1/3を養う。","","左回旋枝は側壁・後壁を養う。","右冠動脈は多くの人で洞結節（約6割）・房室結節（約9割）を養う。下壁梗塞で徐脈・房室ブロックが起こる理由。"],"core":"左前下行枝＝前壁・中隔の前2/3・心尖（V1〜V4）。左回旋枝＝側壁・後壁（I・aVL・V5〜6）。右冠動脈＝下壁（II・III・aVF）・右室（V4R）・房室結節。","e":"後壁梗塞：V1〜V3 の ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 低下と高い R 波（鏡像）、背部誘導（V7〜V9）で ST 上昇。\n左主幹部の病変：広い範囲の ST 低下と aVR の ST 上昇。\nWellens 症候群：V2〜V3 の深い陰性 T 波・二相性 T 波、左前下行枝近位部の高度狭窄（運動負荷は禁忌）。\nde Winter T 波：前胸部の ST の上向きの低下と高い T 波、左前下行枝の閉塞（STEMI（ST-elevation myocardial infarction：ST 上昇型心筋梗塞） と同等）。","tg":[],"fig":["coronary"]},{"id":"cv-c3fa9ae2","f":"cv","u":25,"o":83,"lv":1,"q":"頸静脈・身体所見について正しいものはどれか。","ch":["奇脈は、吸気時に収縮期血圧が 10 mmHg 以上上がること","頸静脈怒張は右房圧の上昇（心不全・タンポナーデ）","起坐呼吸は、右心不全だけに見られる症状である","下腿の浮腫があれば、それだけで左心不全と診断できる"],"a":1,"cx":["奇脈は吸気時に 10 mmHg 以上「下がる」こと（心タンポナーデ・重症喘息）。","","起坐呼吸（横になると苦しい）は肺うっ血＝左心不全の症状。","下腿浮腫は右心不全・低アルブミン・静脈不全・薬（Ca 拮抗薬）でも起こる。"],"core":"左心不全＝肺うっ血（労作時呼吸困難・起坐呼吸・発作性夜間呼吸困難・湿性ラ音・III 音）。右心不全＝体静脈うっ血（頸静脈怒張・肝腫大・下腿浮腫・腹水）。","e":"頸静脈は内頸静脈の拍動で見る（45度の半坐位で胸骨角から 4.5 cm 以上なら上昇）。\n肝頸静脈逆流：肝臓を押すと頸静脈がふくらむ（右心不全）。\nKussmaul 徴候：吸気で頸静脈がふくらむ（収縮性心膜炎・右室梗塞）。\n心不全の Framingham 基準など、症状と所見の組み合わせで診断する。","tg":[],"mt":["hfdrugs"]},{"id":"cv-b49a5bfe","f":"cv","u":26,"o":84,"lv":1,"q":"心電図の所見と原因の組み合わせで正しいものはどれか。","ch":["U 波の増高 ― 高カルシウム血症","テント状 T 波 ― 高カリウム血症","デルタ波 ― 低マグネシウム血症","QT（QT 間隔、心室の興奮の始まりから回復まで） 延長 ― 高カルシウム血症"],"a":1,"cx":["U 波が目立つのは低カリウム血症。","","デルタ波は WPW（Wolff-Parkinson-White） 症候群（副伝導路）。","高カルシウム血症は QT 短縮。QT 延長は低カルシウム血症・低カリウム・低マグネシウム。"],"core":"高 K＝テント状 T → P 消失 → QRS（QRS 波、心室の興奮） 幅広 → サイン波 → 心停止。低 K＝T 平低・U 波・ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 低下。高 Ca＝QT 短縮、低 Ca＝QT 延長。","e":"高カリウム血症の緊急治療：①心筋の安定化（グルコン酸カルシウム（カルチコール）静注、効果は数分・持続30〜60分）②細胞内へ移す（グルコース＋インスリン、β2 刺激薬吸入、アシドーシスなら重炭酸）③体外へ出す（ループ利尿薬、陽イオン交換樹脂・ジルコニウムシクロケイ酸ナトリウム、透析）。\nジギタリスの効果：盆状の ST 低下・QT 短縮。中毒では多彩な不整脈（発作性心房頻拍＋房室ブロック、二方向性心室頻拍）。\n低体温：Osborn 波（J 波）。","tg":[],"fig":["ecg","acls"],"mt":["potassium"]},{"id":"cv-2b07b073","f":"cv","u":26,"o":85,"lv":2,"q":"心房細動の脳梗塞予防について、国内のガイドラインに沿って正しいものはどれか。","ch":["機械弁の患者には、DOAC（direct oral anticoagulant：直接経口抗凝固薬） を第一選択とする","アスピリンは DOAC（direct oral anticoagulant：直接経口抗凝固薬） と同じくらい脳梗塞を予防する","発作性心房細動は脳梗塞の危険が低く、抗凝固は不要","CHADS2（心不全・高血圧・年齢・糖尿病・脳卒中のスコア） スコア1点以上で DOAC（direct oral anticoagulant：直接経口抗凝固薬） を勧める"],"a":3,"cx":["機械弁・中等症以上の僧帽弁狭窄症は「弁膜症性」で、ワルファリン（ワーファリン）を使う（DOAC は禁忌・不可）。","アスピリンは心房細動の脳梗塞をほとんど防がず、出血は増える。","発作性でも脳梗塞の危険は持続性と大きく変わらず、同じように評価する。",""],"core":"CHADS2＝心不全・高血圧・75歳以上・糖尿病（各1点）＋脳梗塞/TIA（transient ischemic attack：一過性脳虚血発作） の既往（2点）。1点以上で DOAC を勧める。弁膜症性（機械弁・僧帽弁狭窄症）はワルファリン（ワーファリン）。","e":"DOAC：ダビガトラン（トロンビン阻害、腎排泄が多い）、リバーロキサバン（イグザレルト）・アピキサバン・エドキサバン（Xa 阻害）。減量基準（腎機能・年齢・体重）を守る。\n出血の危険の評価：HAS-BLED（高血圧・腎/肝機能・脳卒中・出血・INR（international normalized ratio：国際標準比） 不安定・高齢・薬/飲酒）。高くても抗凝固をやめる理由ではなく、直せる因子を直す。\n中和薬：ダビガトランにイダルシズマブ（プリズバインド）、Xa 阻害薬にアンデキサネット アルファ（オンデキサ）。\n抗凝固が続けられない人に左心耳閉鎖術（WATCHMAN）。\n2024年の国内ガイドラインでは日本人のデータからの HELT-E2S2（日本人のデータから作られた心房細動の脳梗塞リスクスコア） スコアも紹介されたが、基本は CHADS2 で判断する。","tg":["gl"],"fig":["coag","willis"],"mt":["stroke","hfdrugs"]},{"id":"cv-f7df279e","f":"cv","u":26,"o":86,"lv":3,"q":"24歳の男性。動悸で受診。心拍数 220/分の不規則な頻拍で、QRS（QRS 波、心室の興奮） 幅は広く、形が拍ごとに少しずつ違う。血圧は 108/70 mmHg。以前の心電図で PR（PR 間隔、心房の興奮の始まりから心室の興奮の始まりまで） 短縮とデルタ波を指摘されている。避けるべき薬はどれか。","ch":["プロカインアミド（Na チャネル遮断薬）","ベラパミル（房室結節を抑える Ca 拮抗薬）","電気的除細動（同期下カルディオバージョン）","ピルシカイニド（Na チャネル遮断薬）"],"a":1,"cx":["プロカインアミドも副伝導路を抑え、使える。","","血行動態が悪ければ電気ショックが最優先。避ける理由はない。","副伝導路の伝導を抑える Na チャネル遮断薬は使える。"],"core":"WPW（Wolff-Parkinson-White） 症候群の心房細動（偽性心室頻拍）＝房室結節を抑える薬（ベラパミル・ジギタリス・β遮断薬・アデノシン）は禁忌。副伝導路を通る伝導が増えて心室細動になる。","e":"治療：不安定なら電気的除細動、安定なら Na チャネル遮断薬（プロカインアミド・ピルシカイニドなど）。根治はカテーテルアブレーション（副伝導路の焼灼）。\nWPW の発作性上室頻拍（房室回帰性頻拍、正方向性）は QRS 幅が狭く規則的で、迷走神経刺激・ATP（アデノシン）・ベラパミルが使える。区別が大事。\nデルタ波：副伝導路で心室が早く興奮しはじめるため、QRS の立ち上がりがなだらかになる。","tg":["ae","cs"],"fig":["ecg","acls"]},{"id":"cv-c472e7f0","f":"cv","u":26,"o":87,"lv":2,"q":"薬剤性の QT（QT 間隔、心室の興奮の始まりから回復まで） 延長とトルサード・ド・ポアンツ（TdP（torsade de pointes：トルサード・ド・ポアンツ））について正しいものはどれか。","ch":["徐脈は TdP を起こしにくくする","TdP にはアミオダロン（アンカロン）の追加がまず勧められる","TdP の治療に硫酸マグネシウムの静注を使う","低カリウム血症は TdP の危険を下げる"],"a":2,"cx":["徐脈・長い休止のあとに QT がさらに延び、TdP が起こりやすい（ペーシング・イソプロテレノールで心拍を上げる）。","アミオダロンは QT をさらに延ばす。原因薬を中止する。","","低カリウム・低マグネシウムは危険を上げる。補正する。"],"core":"TdP＝QT 延長に伴う多形性心室頻拍（QRS（QRS 波、心室の興奮） の向きがねじれるように変わる）。マグネシウム静注、原因薬の中止、K・Mg の補正、徐脈なら一時ペーシング。","e":"QT を延ばす薬：抗不整脈薬（Ia 群・III 群：ソタロール・アミオダロン）、マクロライド・キノロン系抗菌薬、抗真菌薬（アゾール系）、抗精神病薬・三環系抗うつ薬、制吐薬（ドンペリドン（ナウゼリン）・オンダンセトロン）、メサドンなど。\n危険因子：女性・高齢・低 K/Mg・徐脈・心不全・肝/腎障害（薬の濃度↑）・先天性 QT 延長症候群・薬の併用（CYP3A4（cytochrome P450 3A4：薬物代謝酵素） 阻害）。\n先天性 QT 延長症候群：LQT1（運動・水泳で発作、β遮断薬）、LQT2（音・驚き・産後）、LQT3（睡眠中）。","tg":["ae"],"fig":["ecg","conduct"]},{"id":"cv-fc65678f","f":"cv","u":26,"o":88,"lv":2,"q":"Brugada 症候群について正しいものはどれか。","ch":["右側胸部誘導の coved 型 ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 上昇、夜間の心室細動","心停止の既往があっても、ICD（implantable cardioverter defibrillator：植込み型除細動器） の適応にはならない","若い女性に多く、運動中の突然死が典型である","Na チャネル遮断薬で、心電図の所見が消える"],"a":0,"cx":["","心室細動・心停止から助かった人は植込み型除細動器（ICD）の適応（クラス I）。","アジアの若年〜中年男性に多い。発作は夜間・安静時（迷走神経が優位）。","Na チャネル遮断薬（ピルシカイニド（サンリズム）など）は所見を強め、診断の負荷試験に使う。"],"core":"Brugada 症候群＝V1〜V2 の coved 型 ST 上昇（type 1）。SCN5A（心筋の Na チャネルの遺伝子） 変異など。夜間・発熱時に心室細動。心停止・失神の既往があれば ICD。","e":"発熱で所見が出やすい・悪化するので、熱はすぐ下げる。\ntype 1 の心電図は、第2〜3肋間（高位）で記録すると見つかりやすい。\n症状のない type 1 は経過観察が多い（家族歴・電気生理検査などで判断）。\n心室細動の嵐（electrical storm）にはイソプロテレノール（プロタノール）、キニジン。","tg":[],"fig":["acls","ecg"]},{"id":"cv-95196de4","f":"cv","u":26,"o":89,"lv":2,"q":"房室ブロックについて正しいものはどれか。","ch":["Mobitz II 型は、アトロピンで確実に改善する","Wenckebach 型は PR（PR 間隔、心房の興奮の始まりから心室の興奮の始まりまで） が一定のまま、突然 QRS（QRS 波、心室の興奮） が抜ける","完全房室ブロックで失神があっても、経過観察でよい","Mobitz II 型は His 束以下の障害が多く、ペースメーカ"],"a":3,"cx":["アトロピンは房室結節の障害（Wenckebach）には効くが、His 束より下の障害には効かず、かえって悪くすることがある。","Wenckebach 型（Mobitz I）は PR が少しずつ延びて QRS が抜ける。PR 一定で突然抜けるのは Mobitz II。","症状のある完全房室ブロックはペースメーカの適応（Adams-Stokes 発作）。",""],"core":"Wenckebach＝房室結節・予後良好・迷走神経緊張（スポーツ選手・夜間）でも起こる。Mobitz II・高度・完全房室ブロック＝His 束以下が多く、ペースメーカ。","e":"一過性の原因を先に除く：下壁梗塞（右冠動脈→房室結節、回復しやすい）、高カリウム血症、薬（β遮断薬・Ca 拮抗薬・ジギタリス）、ライム病、心サルコイドーシス（若〜中年の房室ブロックで考える）、甲状腺機能低下。\n洞不全症候群：洞停止・徐脈頻脈症候群。症状があればペースメーカ。","tg":[],"fig":["conduct"]},{"id":"cv-372ad8fb","f":"cv","u":26,"o":90,"lv":3,"q":"30歳の女性。突然の動悸で受診した。脈拍 186/分・整、血圧 118/70 mmHg。心電図は QRS（QRS 波、心室の興奮） 幅の狭い規則的な頻拍で、P 波ははっきりしない。迷走神経刺激（修正 Valsalva 法）で止まらなかった。次に行う治療として適切なのはどれか。","ch":["ATP（アデノシン三リン酸）の急速静注","アミオダロン（アンカロン）の持続静注を長時間かけて行う","すぐに非同期の電気ショック（除細動）を行う","ジゴキシン（ジゴシン）を経口で内服させて翌日に再診する"],"a":0,"cx":["","アミオダロンは発作性上室頻拍の第一選択ではない。","血行動態が安定しているので電気ショックは不要。不安定でも同期下のカルディオバージョンを使う。","効くまで時間がかかり、急性期の停止には向かない。"],"core":"発作性上室頻拍（QRS 幅の狭い規則的な頻拍）＝①迷走神経刺激 ②ATP（アデノシン）の急速静注（喘息では注意）③ベラパミル（ワソラン）静注。根治はカテーテルアブレーション。","e":"多くは房室結節リエントリー頻拍（AVNRT（atrioventricular nodal reentrant tachycardia：房室結節リエントリー頻拍））か、副伝導路を使う房室回帰性頻拍（AVRT（atrioventricular reentrant tachycardia：房室回帰性頻拍））。\nATP は一過性の房室ブロックで頻拍を止める。顔のほてり・胸部不快感・数秒の心停止があることを説明しておく。\n心房粗動（2:1 伝導で心拍 150/分前後、鋸歯状波）も ATP で見えやすくなる。\nQRS 幅の広い頻拍は、わからなければ心室頻拍として扱う。","tg":["cs"],"fig":["ecg"]},{"id":"cv-5d79bcc6","f":"cv","u":26,"o":91,"lv":3,"q":"74歳の男性。数か月前からときどきふらつき、昨日失神した。心電図で洞停止（4秒）と、その前の発作性心房細動がある。服用薬はない。正しい対応はどれか。","ch":["β遮断薬で頻脈を抑えてから経過を見るだけ","アトロピンの内服を長期に続ける","失神は1回なので、何もせず帰宅させる","ペースメーカの植込みを検討する"],"a":3,"cx":["徐脈頻脈症候群で、徐脈の対策なしに β遮断薬を使うと洞停止が悪化する。","アトロピンの長期内服は現実的でない。","症状のある洞機能不全はペースメーカの適応。",""],"core":"徐脈頻脈症候群（洞不全症候群の一型）＝発作性心房細動などの頻脈が止まった後の長い洞停止で失神。ペースメーカで徐脈を防いだうえで、頻脈に薬を使う。心房細動があれば抗凝固も評価する。","e":"洞不全症候群（Rubenstein 分類）：I 型 洞性徐脈、II 型 洞停止・洞房ブロック、III 型 徐脈頻脈症候群。\nペースメーカの適応：症状（失神・めまい・心不全）と徐脈の関係が明らかなもの。\n一時的な原因を除く：薬（β遮断薬・Ca 拮抗薬・ジギタリス・抗不整脈薬・ドネペジル）、高カリウム血症、甲状腺機能低下、睡眠時無呼吸。","tg":["cs"],"fig":["conduct","coag"]},{"id":"cv-c62b2be7","f":"cv","u":26,"o":92,"lv":3,"q":"68歳の男性。1か月前から動悸と息切れがある。心電図は心房細動で心拍数 132/分。血圧 138/80 mmHg、左室駆出率 55%。CHADS2（心不全・高血圧・年齢・糖尿病・脳卒中のスコア） スコア 2点。腎機能は正常。初期の対応として最も適切なのはどれか。","ch":["DOAC（direct oral anticoagulant：直接経口抗凝固薬） を始め、β遮断薬で心拍数を下げる","抗凝固はせず、すぐに電気的除細動を行う","ジゴキシン（ジゴシン）を大量に使い、抗凝固は不要とする","アスピリンだけを始め、心拍数は気にしない"],"a":0,"cx":["","48時間以上続いた（または不明の）心房細動を抗凝固なしに除細動すると、脳梗塞を起こしうる（3週間の抗凝固か経食道エコーで血栓がないことを確かめてから）。","CHADS2 2点で抗凝固が必要。ジゴキシンは安静時の心拍しか下げにくく、第一選択ではない（心不全例で併用）。","アスピリンでは脳梗塞は防げない。頻脈が続くと頻脈誘発性心筋症になる。"],"core":"心房細動の初期対応＝①脳梗塞予防（CHADS2 1点以上で DOAC）②心拍数の調節（β遮断薬・非ジヒドロピリジン系 Ca 拮抗薬、心機能が悪ければ β遮断薬・ジゴキシン）③リズム調節（症状・心不全・若い人、カテーテルアブレーション）④誘因の治療（甲状腺・飲酒・睡眠時無呼吸・高血圧）。","e":"早期のリズム調節（とくにアブレーション）は、心不全を伴う心房細動の予後を改善しうる。\n心拍数の目標：安静時 110/分未満（症状があればもっと低く）。\n血行動態が不安定な心房細動は同期下カルディオバージョン（抗凝固と並行）。\n甲状腺機能亢進症による心房細動：β遮断薬と甲状腺の治療。","tg":["gl","cs"],"fig":["willis","coag"],"mt":["stroke"]},{"id":"cv-673d58ca","f":"cv","u":26,"o":93,"lv":2,"q":"抗不整脈薬と特徴の組み合わせで正しいものはどれか。","ch":["ジゴキシン（ジゴシン） ― 低カリウム血症では中毒になりにくい","ピルシカイニド（サンリズム） ― 腎機能が低くても量の調節は不要","ベラパミル（ワソラン） ― 心機能の低い心不全にも安全に使える","アミオダロン（アンカロン） ― 甲状腺機能異常・間質性肺炎"],"a":3,"cx":["低カリウム血症（利尿薬）・腎機能低下・高齢・アミオダロンなどの併用でジゴキシン中毒になりやすい。","ピルシカイニドは腎排泄で、腎機能が低いと蓄積して QRS（QRS 波、心室の興奮） 拡大・心室性不整脈を起こす。","非ジヒドロピリジン系 Ca 拮抗薬は心収縮力を落とすので、HFrEF（heart failure with reduced ejection fraction：駆出率の低下した心不全） では避ける。",""],"core":"アミオダロン（III 群）＝心機能が悪くても使える一方、ヨウ素を多く含み甲状腺機能の亢進・低下、間質性肺炎、肝障害、角膜沈着、光線過敏、QT（QT 間隔、心室の興奮の始まりから回復まで） 延長、ワルファリン（ワーファリン）の作用増強。","e":"Vaughan Williams 分類：I 群＝Na チャネル遮断（Ia：プロカインアミド（アミサリン）・ジソピラミド、Ib：リドカイン・メキシレチン、Ic：フレカイニド・ピルシカイニド）、II 群＝β遮断薬、III 群＝K チャネル遮断（アミオダロン・ソタロール）、IV 群＝Ca 拮抗薬（ベラパミル・ジルチアゼム）。\n器質的心疾患（心筋梗塞後・心機能低下）では I 群（とくに Ic）は死亡を増やす（CAST 試験）。\nジゴキシン中毒：吐き気・視覚異常（黄視）・徐脈・房室ブロック・二方向性心室頻拍。","tg":[],"fig":["ecg","coag"],"mt":["thyroid","pneumonia"]},{"id":"cv-190e9b21","f":"cv","u":27,"o":94,"lv":3,"q":"63歳の男性。1時間前から続く胸の締めつけられる痛みで救急搬送された。心電図で II・III・aVF に ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 上昇、I・aVL に ST 低下がある。血圧 86/50 mmHg、頸静脈が怒張し、肺の音はきれい。右側胸部誘導 V4R でも ST が上昇している。避けるべき対応はどれか。","ch":["細胞外液の輸液","アスピリンをかみ砕いて内服させる","緊急の冠動脈造影と再灌流療法","ニトログリセリンの舌下投与"],"a":3,"cx":["右室梗塞の低血圧には輸液（前負荷を保つ）が基本。","アスピリンの咀嚼投与は ACS（acute coronary syndrome：急性冠症候群） の基本。","STEMI（ST-elevation myocardial infarction：ST 上昇型心筋梗塞） は発症12時間以内なら緊急の再灌流（primary PCI（percutaneous coronary intervention：経皮的冠動脈インターベンション））。",""],"core":"下壁梗塞＋低血圧＋頸静脈怒張＋肺うっ血なし＝右室梗塞。前負荷に頼るので、硝酸薬・利尿薬・モルヒネは低血圧を悪化させ禁忌。","e":"心電図の部位と冠動脈：下壁（II・III・aVF）＝右冠動脈（ときに回旋枝）、前壁（V1〜V4）＝左前下行枝、側壁（I・aVL・V5〜V6）＝回旋枝・対角枝。\nSTEMI（ST-elevation myocardial infarction：ST 上昇型心筋梗塞） の治療：アスピリン＋P2Y12（血小板の ADP 受容体） 阻害薬、ヘパリン、primary PCI（来院から再灌流まで90分以内が目標）。PCI がすぐできなければ血栓溶解療法。\n心筋梗塞の合併症：不整脈（急性期の心室細動）、心不全・心原性ショック、乳頭筋断裂（急性 MR（mineralocorticoid receptor：ミネラルコルチコイド受容体））、心室中隔穿孔、左室自由壁破裂（タンポナーデ）、心室瘤、梗塞後症候群（Dressler）。","tg":["ae","cs"],"fig":["ecg","coronary"]},{"id":"cv-a543a946","f":"cv","u":27,"o":95,"lv":2,"q":"冠動脈ステント留置後の抗血小板療法（DAPT（dual antiplatelet therapy：抗血小板薬2剤併用療法））について、国内のガイドラインで正しいものはどれか。","ch":["出血の危険が高い人では、DAPT を1〜3か月に短くする","DAPT は出血の危険にかかわらず、全員で最低2年間続ける","心房細動で抗凝固薬を飲む人も、3剤を1年間続ける","日本人は出血が少ないので、期間の調整は要らない"],"a":0,"cx":["","出血の危険と虚血の危険で期間を決める。一律に長くはしない。","抗凝固薬＋抗血小板薬の3剤は出血が多い。3剤はできるだけ短く（周術期のみ〜1か月）、その後は抗凝固薬＋P2Y12（血小板の ADP 受容体） 阻害薬、1年後は抗凝固薬だけ。","日本人は出血しやすい（HBR（high bleeding risk：高出血リスク）：高出血リスクの人が多い）ので、短期間の DAPT が重視される。"],"core":"DAPT（アスピリン＋P2Y12（血小板の ADP 受容体） 阻害薬）：出血リスクが高ければ1〜3か月、そうでなければ ACS（acute coronary syndrome：急性冠症候群） は 3〜12か月が目安。その後は抗血小板薬1剤（P2Y12 阻害薬単剤も選べる）。","e":"P2Y12 阻害薬：クロピドグレル（CYP2C19（cytochrome P450 2C19：薬物代謝酵素） で活性化、日本人は効きにくい人が多い）、プラスグレル（国内は低用量 3.75 mg/日）。\n高出血リスク（日本版 HBR（high bleeding risk：高出血リスク））の例：高齢、低体重、貧血、腎不全、抗凝固薬、出血・脳出血の既往、がん、肝硬変、血小板減少、フレイル。\n手術のときの休薬：アスピリンは心血管の危険が高ければ続けることが多い。P2Y12 阻害薬はクロピドグレル5日・プラスグレル7日前後を目安に休薬（ステント留置後早期の待てる手術は延期）。","tg":["gl"],"fig":["coronary"],"mt":["bleeding"]},{"id":"cv-9caa03db","f":"cv","u":27,"o":96,"lv":2,"q":"慢性冠症候群（安定狭心症）の治療について正しいものはどれか。","ch":["冠動脈に狭窄があれば、症状がなくても全例で PCI（percutaneous coronary intervention：経皮的冠動脈インターベンション） を行う","ニトログリセリンの舌下錠は、症状が出て30分待って使う","β遮断薬は、冠攣縮性狭心症にこそ最もよく効く","薬物治療に加え、スタチンで LDL-C（LDL コレステロール） を十分に下げる"],"a":3,"cx":["安定した病変では、PCI は狭心症の症状を減らすが、死亡・心筋梗塞は薬物治療と大差がない（ISCHEMIA 試験）。虚血の範囲・症状で判断。","胸痛が出たらすぐ舌下し、5分で効かなければもう一度、3回で効かなければ救急へ。","冠攣縮性狭心症では β遮断薬は攣縮を悪くすることがある。Ca 拮抗薬が第一選択。",""],"core":"慢性冠症候群＝生活習慣の改善＋抗血小板薬＋スタチン（LDL-C＜70 mg/dL を目指す人も）＋症状に応じて β遮断薬・Ca 拮抗薬・硝酸薬。血行再建は症状と虚血の大きさで決める。","e":"LDL（low-density lipoprotein：低比重リポ蛋白） コレステロールの管理目標（二次予防）：100 mg/dL 未満、ACS（acute coronary syndrome：急性冠症候群）・家族性高コレステロール血症・糖尿病などでは 70 mg/dL 未満。スタチン→エゼチミブ（ゼチーア）→PCSK9（proprotein convertase subtilisin/kexin type 9） 阻害薬。\n冠攣縮性狭心症：夜間〜早朝の安静時の胸痛、喫煙・飲酒、日本人に多い。発作時の一過性 ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 上昇。アセチルコリン（エルゴノビン）負荷試験。Ca 拮抗薬・硝酸薬。禁煙。\nPDE5（phosphodiesterase 5：ホスホジエステラーゼ5） 阻害薬（シルデナフィル（レバチオ）など）と硝酸薬の併用は高度の低血圧で禁忌。","tg":[],"mt":["lipid"]},{"id":"cv-28930edb","f":"cv","u":27,"o":97,"lv":3,"q":"58歳の男性。2時間前から安静時の胸痛が続いている。心電図で V4〜V6 に ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 低下があり、ST 上昇はない。高感度トロポニン T は1回目 0.012 ng/mL、1時間後に 0.058 ng/mL と上がった。血圧・脈拍は安定している。正しい診断と対応はどれか。","ch":["急性心膜炎 ― NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） とコルヒチンで外来治療する","NSTEMI（non-ST-elevation myocardial infarction：非 ST 上昇型心筋梗塞） ― 抗血栓療法とリスクに応じた早期の冠動脈造影","異常なし ― トロポニンは有意な上昇ではないので帰宅","安定狭心症 ― 外来で後日、運動負荷試験を予定する"],"a":1,"cx":["心膜炎は広範な ST 上昇・PR（PR 間隔、心房の興奮の始まりから心室の興奮の始まりまで） 低下で、ST 低下ではない。","","トロポニンが短時間で上がっており、心筋の傷害がある。","安静時の持続する胸痛とトロポニンの上昇があり、安定狭心症ではない。"],"core":"急性冠症候群＝STEMI（緊急 PCI（percutaneous coronary intervention：経皮的冠動脈インターベンション））と NSTE-ACS（非 ST 上昇型心筋梗塞・不安定狭心症）。NSTE-ACS は抗血小板薬2剤＋抗凝固薬、リスク（GRACE（Global Registry of Acute Coronary Events） スコア・トロポニン・ST 変化）に応じて24時間以内などの冠動脈造影。","e":"高感度トロポニンの 0/1 時間（または 0/2 時間）アルゴリズムで、除外・確定を早く決める。\n超高リスク（ショック・治療抵抗性の胸痛・重い不整脈・急性心不全・機械的合併症）は2時間以内に造影。\nトロポニンは心筋梗塞以外でも上がる：心不全、心筋炎、肺塞栓、敗血症、腎不全、たこつぼ症候群、大動脈解離。\nたこつぼ症候群：閉経後の女性・強い精神的/身体的ストレス、心尖部のバルーン状の無収縮、冠動脈に狭窄なし。","tg":["cs"],"fig":["coronary","ecg"]},{"id":"cv-2c597d40","f":"cv","u":28,"o":98,"lv":1,"q":"左室駆出率の低下した心不全（HFrEF（heart failure with reduced ejection fraction：駆出率の低下した心不全））で、予後を改善する薬の組み合わせはどれか。","ch":["ARNI（ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬/ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬））・β遮断薬・MRA（mineralocorticoid receptor antagonist：ミネラルコルチコイド受容体拮抗薬）・SGLT2（sodium-glucose cotransporter 2：ナトリウム・グルコース共輸送体2） 阻害薬","非ジヒドロピリジン系 Ca 拮抗薬・アミオダロン・利尿薬","ループ利尿薬・ジギタリス・硝酸薬・ヒドララジンの4剤","強心薬（ドブタミン（ドブトレックス）・ミルリノン）の長期投与と利尿薬"],"a":0,"cx":["","非ジヒドロピリジン系 Ca 拮抗薬は心機能を落とし HFrEF では避ける。","ループ利尿薬はうっ血の症状を取るが、予後は改善しない。ジギタリスは入院を減らすが死亡は減らさない。","強心薬の長期内服は死亡を増やす（ピモベンダン（アカルディ）は症状緩和に限定的に使われる）。"],"core":"HFrEF の4本柱（fantastic four）＝ARNI（サクビトリル・バルサルタン（エンレスト））か ACE 阻害薬/ARB・β遮断薬（カルベジロール（アーチスト）・ビソプロロール）・MRA（スピロノラクトン（アルダクトン A）・エプレレノン）・SGLT2 阻害薬（ダパグリフロジン（フォシーガ）・エンパグリフロジン）。","e":"始め方：できるだけ早く4つとも少量から始め、少しずつ増やす。\nβ遮断薬は「少量から・ゆっくり」（急に多く使うと心不全が悪化）。うっ血が強い急性期には始めない。\nARNI は ACE 阻害薬から切り替えるとき36時間あける（血管浮腫）。\nほかに：イバブラジン（洞調律で心拍 75/分以上が残るとき）、ベルイシグアト（sGC 刺激薬）。\n器械：植込み型除細動器（ICD（implantable cardioverter defibrillator：植込み型除細動器））、心臓再同期療法（CRT（cardiac resynchronization therapy：心臓再同期療法）：左脚ブロックで QRS（QRS 波、心室の興奮） 幅が広いとき）。\nHFpEF（heart failure with preserved ejection fraction：駆出率の保たれた心不全）：SGLT2 阻害薬が入院を減らす。高血圧・心房細動・肥満・糖尿病などの併存症を治療する。","tg":[],"mt":["dmdrugs","hfdrugs"]},{"id":"cv-6e3d46e3","f":"cv","u":28,"o":99,"lv":2,"q":"BNP（brain natriuretic peptide：脳性ナトリウム利尿ペプチド）・NT-proBNP（N 末端プロ脳性ナトリウム利尿ペプチド） について正しいものはどれか。","ch":["肥満の人では低めに出やすく、腎不全では高く出やすい","心不全の診断には使えず、予後だけを反映する","心房から主に分泌され、心不全では下がる","ARNI（angiotensin receptor-neprilysin inhibitor：アンジオテンシン受容体ネプリライシン阻害薬） 内服中は NT-proBNP より BNP のほうが評価に向く"],"a":0,"cx":["","心不全の診断（とくに除外）に使え、予後も反映する。","BNP は主に心室の壁が伸びたときに分泌され、心不全で上がる。","ARNI（ネプリライシン阻害）で BNP の分解も止まり BNP が上がるので、ARNI 中は NT-proBNP で評価する。"],"core":"BNP は心室の負荷で上がる。下げる因子＝肥満。上げる因子＝腎不全・高齢・心房細動・肺塞栓・敗血症。ARNI 中は NT-proBNP を使う。","e":"心不全を疑う目安（国内の基準）：BNP 100 pg/mL 以上・NT-proBNP 400 pg/mL 以上で心不全の可能性が高い。BNP 35 pg/mL 未満・NT-proBNP 125 pg/mL 未満なら可能性は低い。\nNT-proBNP は腎排泄の影響が BNP より大きい。\n心不全の病期（ステージ A〜D）：A＝危険因子のみ、B＝構造的心疾患あり・症状なし、C＝症状あり、D＝治療抵抗性。早いステージからの予防が大事。","tg":[]},{"id":"cv-4946916a","f":"cv","u":28,"o":100,"lv":3,"q":"78歳の女性。3日前から息切れがひどくなり、夜間に横になると苦しく座って眠った。血圧 178/96 mmHg、脈拍 104/分・整、SpO₂ 88%（室内気）。両肺に湿性ラ音、下腿浮腫は軽い。胸部X線で両側の肺うっ血と胸水。手足は温かい。初期治療として最も適切なのはどれか。","ch":["NPPV（non-invasive positive pressure ventilation：非侵襲的陽圧換気） と血管拡張薬（硝酸薬）を使う","β遮断薬を、通常量からすぐに開始する","まずドブタミン（ドブトレックス）を持続静注して心収縮を強める","大量の生理食塩水を急速に輸液する"],"a":0,"cx":["","β遮断薬は急性のうっ血期には始めない（悪化する）。安定してから少量で始める。","手足が温かく血圧が高い（warm & wet）なので、強心薬はまず要らない。強心薬は低灌流（cold）のとき。","輸液はうっ血をさらに悪くする。"],"core":"急性心不全で血圧が高い（クリニカルシナリオ1）＝急な肺水腫（体液の再分布が主）。NPPV（CPAP（continuous positive airway pressure：持続陽圧呼吸） など）＋血管拡張薬（硝酸薬）。利尿薬は体液が多ければ併用。","e":"Nohria-Stevenson 分類：うっ血（wet/dry）× 低灌流（cold/warm）。warm & wet＝利尿薬・血管拡張薬、cold & wet＝強心薬＋利尿薬（ときに補助循環）、cold & dry＝輸液を考える。\nクリニカルシナリオ（CS（clinical scenario：クリニカルシナリオ））：CS1＝収縮期血圧 140 mmHg 超、CS2＝100〜140、CS3＝100 未満、CS4＝ACS（acute coronary syndrome：急性冠症候群）、CS5＝右心不全。\n増悪の誘因を探す（FAILURE）：感染・不整脈（心房細動）・高血圧・塩分と水のとりすぎ・服薬中断・虚血・腎機能悪化・NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） など。","tg":["ae","cs"],"mt":["hfdrugs"]},{"id":"cv-78dc5bd4","f":"cv","u":29,"o":101,"lv":2,"q":"大動脈弁狭窄症について正しいものはどれか。","ch":["症状が出たら予後が悪く、弁の治療（手術・TAVI（transcatheter aortic valve implantation：経カテーテル大動脈弁留置術））を考える","重症の基準は、大動脈弁口面積 2.0 cm² 未満である","雑音は心尖部の汎収縮期雑音で、腋窩に放散する","症状のある重症例でも、薬物治療で経過を見るのが基本"],"a":0,"cx":["","重症の目安は弁口面積 1.0 cm² 未満、最大流速 4.0 m/秒以上、平均圧較差 40 mmHg 以上。","心尖部の汎収縮期雑音で腋窩に放散するのは僧帽弁閉鎖不全症。AS（ankylosing spondylitis：強直性脊椎炎） は胸骨右縁第2肋間の駆出性収縮期雑音で頸部に放散。","症状のある重症 AS（ankylosing spondylitis：強直性脊椎炎） は、弁置換（外科的 SAVR（surgical aortic valve replacement：外科的大動脈弁置換術） か経カテーテル TAVI（transcatheter aortic valve implantation：経カテーテル大動脈弁留置術））を行う。"],"core":"重症 AS（ankylosing spondylitis：強直性脊椎炎） で症状が出ると平均余命は短い（狭心痛5年・失神3年・心不全2年が古典的な目安）。手術か TAVI（高齢・手術リスクが高い人）。","e":"原因：高齢者の加齢性（石灰化）、若い人の二尖弁、リウマチ性（僧帽弁の病変を伴う）。\n身体所見：遅脈・小脈（pulsus parvus et tardus）、II 音の大動脈成分が弱い・奇異性分裂。\n血管拡張薬（硝酸薬など）は前負荷を下げて失神を起こしうるので慎重に。\nHeyde 症候群：AS＋消化管の血管異形成からの出血（高いずり応力で von Willebrand 因子の大きな多量体が壊れる＝後天性 von Willebrand 病）。弁の治療で出血が減る。","tg":[]},{"id":"cv-7feecf00","f":"cv","u":29,"o":102,"lv":2,"q":"肥大型心筋症について正しいものはどれか。","ch":["常染色体潜性遺伝が多く、家族の検査は不要である","突然死の危険が高い人でも、植込み型除細動器は使わない","流出路の閉塞では、立ち上がると雑音が強くなる","左室流出路の閉塞には、硝酸薬とジギタリスがよく効く"],"a":2,"cx":["多くはサルコメアの遺伝子変異による常染色体顕性遺伝。一親等の家族に心エコー・心電図での検査を勧める。","危険の高い人（突然死の家族歴・説明のつかない失神・非持続性心室頻拍・著しい肥大など）には ICD（implantable cardioverter defibrillator：植込み型除細動器） を考える。","","硝酸薬（前負荷・後負荷を下げる）とジギタリス（収縮力を上げる）は閉塞を悪化させる。β遮断薬・ベラパミル・シベンゾリン、心筋ミオシン阻害薬（マバカムテン（カムザイオス））。"],"core":"閉塞性肥大型心筋症の雑音は、左室を小さくする操作（立位・Valsalva 法・硝酸薬・脱水）で強くなり、大きくする操作（しゃがむ・下肢挙上）で弱まる。AS（ankylosing spondylitis：強直性脊椎炎） と逆。","e":"若いスポーツ選手の突然死の原因として重要。激しい競技は個別に判断。\n心電図：左室肥大、深い陰性 T 波（心尖部肥大型では巨大陰性 T 波：日本人に多い）。\n閉塞の治療：β遮断薬→シベンゾリン（シベノール）・ジソピラミド→マバカムテン（心筋ミオシン阻害薬、国内承認済み）→中隔の治療（経皮的中隔心筋焼灼術・外科的中隔切除）。\n似た病気（ほかの原因の肥大）：高血圧・AS、Fabry 病（α-ガラクトシダーゼ A 欠損、酵素補充療法）、心アミロイドーシス、ミトコンドリア病。","tg":[]},{"id":"cv-30711021","f":"cv","u":29,"o":103,"lv":2,"q":"トランスサイレチン型心アミロイドーシス（ATTR-CM（transthyretin amyloid cardiomyopathy：トランスサイレチン型心アミロイドーシス））について正しいものはどれか。","ch":["ピロリン酸シンチグラフィで心臓は集積しない","高齢男性に多く、手根管症候群が先に出ることがある","治療薬はなく、診断しても治療の変化はない","心電図で QRS（QRS 波、心室の興奮） 電位が非常に高くなるのが特徴である"],"a":1,"cx":["テクネチウムピロリン酸シンチで心臓に強く集積する（ATTR（トランスサイレチン型アミロイドーシス） に特徴的）。","","TTR（transthyretin：トランスサイレチン） 四量体安定化薬（タファミジス（ビンダケル、ビンマック）・アコラミジス）や、TTR の産生を抑える核酸医薬（ブトリシラン（アムヴトラ））がある。","心筋は厚く見えるのに、心電図の電位は低いこと（低電位）が特徴。"],"core":"ATTR-CM（野生型が多い）＝高齢男性の HFpEF（heart failure with preserved ejection fraction：駆出率の保たれた心不全）・左室肥大・低電位・手根管症候群（両側）・脊柱管狭窄症。ピロリン酸シンチで陽性、AL（immunoglobulin light chain：免疫グロブリン軽鎖、AL アミロイドーシス） 型（単クローン性タンパク）を除いて診断。","e":"AL 型を必ず除く：血清・尿の免疫固定法、血清遊離軽鎖（FLC（free light chain：遊離軽鎖））。AL 型は進行が速く、形質細胞の治療（ダラツムマブ（ダラザレックス、静注、ダラキューロ、皮下注）など）が必要。\n心エコー：左室壁の肥厚、心尖部が保たれる長軸方向のストレイン低下（apical sparing）。\nATTR-CM の治療薬：TTR（transthyretin：トランスサイレチン） 安定化薬のタファミジス（ビンダケル・ビンマック）・アコラミジス（ビヨントラ、2025年発売）、TTR の産生を抑える siRNA のブトリシラン（アムヴトラ、3か月ごとの皮下注、2025年6月に野生型・変異型の ATTR-CM に適応追加）。\n心アミロイドーシスでは、β遮断薬・Ca 拮抗薬・ジギタリスは使いにくい（低血圧・房室ブロック・ジギタリスがアミロイドに結合して中毒）。","tg":[]},{"id":"cv-a4fb44f6","f":"cv","u":29,"o":104,"lv":3,"q":"55歳の女性。肺癌の治療中。数日前から息切れが強くなった。血圧 82/60 mmHg、脈拍 120/分。頸静脈が怒張し、心音が遠い。吸気時に収縮期血圧が 20 mmHg 下がる。心電図は低電位で、QRS（QRS 波、心室の興奮） の高さが1拍ごとに変わる。まず行うべきことはどれか。","ch":["ループ利尿薬を静注する","心エコーで確認し、心嚢穿刺を行う","ニトログリセリンを持続静注する","β遮断薬で頻脈を抑える"],"a":1,"cx":["利尿薬で前負荷を下げると、心臓がさらに広がれず血圧が下がる。","","血管拡張薬も前負荷を下げ、ショックを悪化させる。","頻脈は心拍出を保つための代償。止めるとショックが悪化する。"],"core":"心タンポナーデ＝Beck の三徴（低血圧・頸静脈怒張・心音減弱）＋奇脈（吸気で収縮期血圧が10 mmHg 以上低下）＋電気的交互脈。心嚢穿刺で排液。輸液で前負荷を保つ。","e":"心エコー：心嚢液、拡張期の右房・右室の虚脱、下大静脈の拡張と呼吸性変動の消失。\n原因：悪性腫瘍（肺癌・乳癌・リンパ腫）、心膜炎（ウイルス・結核・尿毒症・膠原病）、大動脈解離、心筋梗塞後の自由壁破裂、カテーテル治療の合併症。\n悪性心嚢液は再びたまりやすく、ドレナージの留置・心膜開窓術を考える。\n収縮性心膜炎：Kussmaul 徴候（吸気で頸静脈が怒張）、心膜ノック音、心膜の石灰化。結核・放射線・心臓手術後。","tg":["cs"],"fig":["ecg"]},{"id":"cv-18f4af36","f":"cv","u":29,"o":105,"lv":2,"q":"急性心膜炎について正しいものはどれか。","ch":["痛みは体位や呼吸で変化しないのが特徴である","ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 上昇は1つの冠動脈の領域に限られ、対側の誘導で ST 低下が出る","前かがみで胸痛が軽くなり、広い範囲の誘導で下に凸の ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 上昇が出る","治療の第一選択はステロイドの大量投与である"],"a":2,"cx":["心膜炎の痛みは呼吸（吸気）・仰臥位で悪化し、前かがみで軽くなる。","1つの冠動脈の領域の ST 上昇と対側の ST 低下（鏡像）は心筋梗塞の所見。","","第一選択は NSAIDs（アスピリン・イブプロフェン）＋コルヒチン。ステロイドは再発を増やすので、使えない・効かないときに少量で。"],"core":"急性心膜炎＝胸膜痛のような鋭い胸痛（前かがみで軽快）、心膜摩擦音、広範な誘導の下に凸の ST 上昇と PR（PR 間隔、心房の興奮の始まりから心室の興奮の始まりまで） 低下（aVR では PR 上昇）。NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）＋コルヒチン（再発を減らす）。","e":"原因の多くはウイルス性・特発性。ほかに結核、尿毒症、膠原病（SLE（systemic lupus erythematosus：全身性エリテマトーデス） など）、悪性腫瘍、心筋梗塞後、心臓手術後、放射線、薬、免疫チェックポイント阻害薬。\nトロポニンが上がれば心筋炎の合併（心筋心膜炎）を考え、激しい運動を控える。\n高リスク（38℃以上の発熱・亜急性・大量の心嚢液・タンポナーデ・抗凝固中・外傷・免疫抑制）なら入院。\nmRNA ワクチン後の心筋炎：若い男性、2回目の数日後、多くは軽症。","tg":[],"fig":["ecg"]},{"id":"cv-b52bacac","f":"cv","u":29,"o":106,"lv":3,"q":"45歳の女性。数か月前から労作時の息切れと失神があり、体位によって胸部の雑音が変わる。心エコーで左房内に茎のある可動性の腫瘤があり、拡張期に僧帽弁口へ入り込む。最も考えられる診断はどれか。","ch":["肥大型心筋症","感染性心内膜炎の疣腫","左房粘液腫","左房内血栓（心房細動による）"],"a":2,"cx":["肥大型心筋症は心筋の肥厚で、心腔内の腫瘤ではない。","疣腫は弁に付く小さな可動性の塊で、発熱・血液培養陽性を伴う。","","血栓は心房細動・僧帽弁狭窄症で左心耳に多く、茎のある大きな腫瘤の典型ではない。"],"core":"心臓粘液腫＝最も多い原発性心臓腫瘍（多くは良性）。左房に多く、心房中隔に茎をもつ。僧帽弁の通過障害（体位で変わる症状・tumor plop）、塞栓症、全身症状（発熱・体重減少・赤沈亢進・IL-6（interleukin-6：インターロイキン6））。治療は外科的切除。","e":"家族性（Carney 複合）：皮膚の色素斑・内分泌の過剰（Cushing など）。\n心臓への転移性腫瘍は原発性より多い（肺癌・乳癌・リンパ腫・悪性黒色腫）。\n乳頭状線維弾性腫：弁に付く小さな腫瘍、塞栓症。","tg":["cs"]},{"id":"cv-03b53394","f":"cv","u":30,"o":107,"lv":1,"q":"高血圧管理・治療ガイドライン 2025（JSH2025）の降圧目標として正しいものはどれか。","ch":["家庭血圧は、135/85 mmHg 未満を目標とする","75歳以上は、診察室 150/90 mmHg 未満でよい","年齢によらず、診察室 130/80 mmHg 未満","糖尿病のある人だけ、130/80 mmHg 未満を目指す"],"a":2,"cx":["家庭血圧の目標は 125/75 mmHg 未満。135/85 は家庭血圧での「高血圧」の基準。","2019年版では75歳以上は 140/90 未満だったが、2025年版で年齢の区別はなくなった（ADL（activities of daily living：日常生活動作） の低い高齢者は個別に決める）。","","糖尿病だけでなく、成人全体で 130/80 未満が目標。"],"core":"JSH2025：降圧目標は年齢にかかわらず診察室 130/80 mmHg 未満・家庭 125/75 mmHg 未満。ADL（activities of daily living：日常生活動作） が落ちた高齢者は健康状態に応じて個別に決める。","e":"高血圧の基準：診察室 140/90 mmHg 以上、家庭 135/85 mmHg 以上、24時間平均 130/80 mmHg 以上。家庭血圧を診察室より重視する。\n主な降圧薬：Ca 拮抗薬、ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬）/ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬、サイアザイド系利尿薬（2025年版では β遮断薬も主要な選択肢に戻った）。2剤目からは合剤も。\n75歳以上は通常の半量程度から始め、起立性低血圧・転倒に注意してゆっくり下げる。\n生活習慣：減塩（6 g/日未満）、減量、運動、節酒、禁煙、野菜・果物（腎機能が悪ければカリウムに注意）。","tg":["gl"]},{"id":"cv-0d4d5adb","f":"cv","u":30,"o":108,"lv":2,"q":"降圧薬と、避けるべき状態（禁忌・慎重投与）の組み合わせで正しいものはどれか。","ch":["ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬）・ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬 ― 妊娠","サイアザイド系利尿薬 ― 骨粗鬆症","β遮断薬 ― 頻脈性の心房細動","Ca 拮抗薬（ジヒドロピリジン系） ― 気管支喘息"],"a":0,"cx":["","サイアザイドは尿へのカルシウム排泄を減らすので、骨粗鬆症ではむしろ利点がある。避けるのは痛風。","β遮断薬は心房細動の心拍数を下げるのに使う。避けるのは喘息・高度の徐脈・房室ブロック。","ジヒドロピリジン系 Ca 拮抗薬は喘息でも使える。喘息で避けるのは β遮断薬（とくに非選択性）。"],"core":"ARB・ACE 阻害薬・直接的レニン阻害薬は妊娠中禁忌（胎児の腎障害・羊水過少）。妊娠を希望する女性には使わない。妊娠中はラベタロール・ニフェジピン・メチルドパ・ヒドララジン。","e":"ほかの禁忌・注意：\n・ACE 阻害薬：血管浮腫の既往、両側の腎動脈狭窄、空咳（ブラジキニン）\n・ARB・ACE 阻害薬・MRA（mineralocorticoid receptor antagonist：ミネラルコルチコイド受容体拮抗薬）：高カリウム血症（腎機能低下・併用時）\n・非ジヒドロピリジン系 Ca 拮抗薬（ベラパミル（ワソラン）・ジルチアゼム）：徐脈・房室ブロック・HFrEF（heart failure with reduced ejection fraction：駆出率の低下した心不全）\n・サイアザイド：痛風、低ナトリウム・低カリウム血症、耐糖能の悪化\n・α遮断薬：起立性低血圧（前立腺肥大の人には利点）\n積極的適応：心不全・心筋梗塞後には ARB/ACE 阻害薬・β遮断薬・MRA、CKD（蛋白尿あり）には ARB/ACE 阻害薬。","tg":["ae"]},{"id":"cv-ca292c5c","f":"cv","u":30,"o":109,"lv":2,"q":"二次性高血圧を疑うきっかけとして最も重要なものはどれか。","ch":["肥満がなく、家庭血圧が正常の白衣高血圧","60歳以上で、ゆっくり進む軽い高血圧","若年発症・急な悪化・治療抵抗性・低カリウム血症","降圧薬1剤で、目標に届く軽い高血圧"],"a":2,"cx":["白衣高血圧は二次性を疑う理由にならない（経過観察が中心）。","高齢でゆっくり進む軽い高血圧は本態性が多い。","","1剤で十分に下がる高血圧は本態性が多い。"],"core":"二次性を疑う：若年発症、急な発症・悪化、治療抵抗性（利尿薬を含む3剤で下がらない）、低カリウム血症、腹部の血管雑音、発作性の症状、睡眠時のいびき、特徴的な身体所見。","e":"代表的な原因と最初の検査：\n・原発性アルドステロン症（高血圧の 5〜10%）：アルドステロン/レニン比（ARR（absolute risk reduction：絶対リスク減少））。高血圧の人は一度は調べることが勧められる\n・腎血管性高血圧：腎動脈の超音波（線維筋性異形成は若い女性、動脈硬化は高齢者）\n・睡眠時無呼吸症候群：問診・簡易検査\n・褐色細胞腫：血中・尿中メタネフリン\n・Cushing 症候群：デキサメタゾン抑制試験\n・腎実質性：尿検査・eGFR（estimated glomerular filtration rate：推算糸球体濾過量）\n・薬剤性：NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）・甘草（偽アルドステロン症）・ステロイド・経口避妊薬・カルシニューリン阻害薬","tg":[],"mt":["potassium"]},{"id":"cv-80ceec0e","f":"cv","u":30,"o":110,"lv":3,"q":"58歳の男性。数日前から頭痛と目のかすみがあり受診した。血圧 232/138 mmHg。眼底に乳頭浮腫と火炎状出血がある。尿たんぱく 2+、クレアチニンが1か月前より上がっている。最も適切な対応はどれか。","ch":["外来で内服薬を1剤追加し、1か月後に再診する","降圧すると脳梗塞になるので、降圧はしない","入院し、静注の降圧薬で数時間かけて慎重に下げる","舌下のニフェジピン（アダラート）で数分のうちに正常まで下げる"],"a":2,"cx":["臓器障害が進んでいる高血圧緊急症で、外来で様子を見てはいけない。","臓器障害が進むので降圧は必要。下げ方（速さ）が大事。","","急激に下げると脳・心臓・腎臓の虚血を起こす。ニフェジピンの舌下は勧められない。"],"core":"高血圧緊急症（加速型-悪性高血圧）＝著しい高血圧＋急に進む臓器障害（乳頭浮腫・出血、腎障害、脳症、心不全）。静注薬（ニカルジピン（ペルジピン）など）で、最初の1時間は平均血圧を 25% 以内の低下に、その後2〜6時間で 160/100 mmHg 程度に。","e":"例外的に速く下げる：大動脈解離（収縮期 120 mmHg 未満を目標にすぐ下げる）、肺水腫、褐色細胞腫クリーゼ（α遮断薬のフェントラミン（レギチーン））、子癇。\n急性期脳梗塞では、血栓溶解療法をしないなら 220/120 mmHg を超えるまでは原則下げない。血栓溶解をするなら 185/110 未満にしてから。\n高血圧切迫症（臓器障害が急に進んでいない著しい高血圧）は内服薬で数日かけて下げる。","tg":["cs"]},{"id":"cv-284fb2a6","f":"cv","u":31,"o":111,"lv":3,"q":"66歳の男性。高血圧で治療中。突然、背中に引き裂かれるような激痛が走った。右上肢の血圧 182/96 mmHg、左上肢 128/74 mmHg。造影 CT（computed tomography：コンピュータ断層撮影） で上行大動脈から下行大動脈に解離（偽腔開存型）がある。最も適切な治療はどれか。","ch":["急性冠症候群として血栓溶解療法を行う","ヘパリンで抗凝固療法を始める","緊急手術（上行大動脈の置換）","降圧と安静だけで、経過を見る"],"a":2,"cx":["胸痛から心筋梗塞と誤って血栓溶解療法をすると致命的。","抗凝固薬は出血を悪化させるので禁忌。","","上行大動脈に及ぶ解離（Stanford A 型）は、心タンポナーデ・大動脈弁閉鎖不全・冠動脈閉塞で急死するので、原則緊急手術。"],"core":"Stanford A 型（上行大動脈を含む）＝緊急手術。B 型（上行を含まない）＝降圧・心拍数の管理（β遮断薬）が基本で、合併症（臓器虚血・破裂・急速拡大）があればステントグラフト（TEVAR（thoracic endovascular aortic repair：胸部ステントグラフト内挿術））。","e":"急性期の血圧と心拍の目標：収縮期 100〜120 mmHg、心拍 60/分程度。まず β遮断薬で心拍を下げ、次に血管拡張薬。\n危険因子：高血圧、Marfan 症候群・Loeys-Dietz 症候群・Ehlers-Danlos（血管型）、二尖弁、妊娠、大動脈炎、コカイン。\n下壁の心筋梗塞に見える解離（右冠動脈の閉塞）もある。\nD ダイマーが正常なら急性大動脈解離の可能性は低い（除外に役立つ）。","tg":["cs"]},{"id":"cv-d8a55746","f":"cv","u":31,"o":112,"lv":2,"q":"腹部大動脈瘤について正しいものはどれか。","ch":["大きさにかかわらず、症状がなければ治療は不要である","喫煙は、瘤の拡大の速さと関係しない","破裂の典型的な症状は、ゆっくり進む下肢のしびれである","最大径 5.5 cm 以上（女性 5.0 cm）で治療を考える"],"a":3,"cx":["一定の大きさを超えると破裂の危険が手術の危険を上回る。症状がなくても治療の対象になる。","喫煙は最大の危険因子で、拡大も速める。禁煙が大事。","破裂は突然の腹痛・腰背部痛と出血性ショック。",""],"core":"腹部大動脈瘤：最大径 5.5 cm 以上（女性 5.0 cm）、半年で 5 mm 以上の拡大、症状がある → 人工血管置換術かステントグラフト（EVAR（endovascular aneurysm repair：腹部ステントグラフト内挿術））。小さい瘤は定期的な画像検査と禁煙・降圧。","e":"危険因子：高齢・男性・喫煙・高血圧・家族歴・動脈硬化。\n炎症性腹部大動脈瘤：壁が厚く周りに線維化（IgG4（immunoglobulin G4：免疫グロブリン G のサブクラス4） 関連疾患の大動脈周囲炎を含む）。\n感染性（細菌性）大動脈瘤：サルモネラ・ブドウ球菌など、急に大きくなる、発熱。\n破裂の三徴：腹痛（腰背部痛）・ショック・拍動性の腫瘤。","tg":[]},{"id":"cv-3e00edc8","f":"cv","u":31,"o":113,"lv":2,"q":"末梢動脈疾患（下肢閉塞性動脈硬化症）について正しいものはどれか。","ch":["ABI（ankle-brachial index：足関節上腕血圧比） 0.90 以下で末梢動脈疾患を疑う","間欠性跛行は、安静にしていても治まらない","運動療法は症状を悪化させるので勧められない","ABI（ankle-brachial index：足関節上腕血圧比） が 1.40 を超えれば、動脈は正常と判断できる"],"a":0,"cx":["","間欠性跛行は歩くと痛み、休むと数分で治まる。","監視下の運動療法は歩ける距離を延ばす（第一選択の治療の1つ）。","ABI 1.40 超は動脈の壁が石灰化して押しつぶせない状態（糖尿病・透析）で、正しく測れない。足趾上腕血圧比（TBI（toe-brachial index：足趾上腕血圧比））などで評価する。"],"core":"ABI＝足首の収縮期血圧÷上腕の収縮期血圧。0.90 以下で末梢動脈疾患。ほかの部位（冠動脈・脳）の動脈硬化を合併しやすい。","e":"治療：禁煙、抗血小板薬、スタチン、運動療法、シロスタゾール（跛行の改善、心不全では禁忌）。生活に支障が大きければ血行再建（カテーテル・バイパス）。\n包括的高度慢性下肢虚血（CLTI（chronic limb-threatening ischemia：包括的高度慢性下肢虚血））：安静時の痛み・潰瘍・壊疽 → 早く血行再建しないと切断。\n鑑別：腰部脊柱管狭窄症（立ち止まるだけでは治まらず、前かがみ・座ると楽になる。足の脈は触れる）。\n急性動脈閉塞（塞栓：心房細動）：5P（pain・pallor・pulselessness・paresthesia・paralysis）→ 緊急の血行再建。","tg":[]},{"id":"cv-d680d359","f":"cv","u":32,"o":114,"lv":3,"q":"45歳の女性。経口避妊薬を服用中。2日前から左下腿が腫れて痛み、今朝から急に息切れが出た。脈拍 112/分、血圧 118/72 mmHg、SpO₂ 90%（室内気）。造影 CT（computed tomography：コンピュータ断層撮影） で両側の肺動脈に血栓がある。心エコーで右室の拡大はない。最も適切な治療はどれか。","ch":["外科的な血栓摘除術を緊急で行う","下大静脈フィルターだけを入れる","全身の血栓溶解療法（アルテプラーゼ（グルトパ、アクチバシン））","抗凝固療法（DOAC（direct oral anticoagulant：直接経口抗凝固薬） かヘパリンで開始）"],"a":3,"cx":["外科的摘除は高リスクで血栓溶解ができない・効かない場合。","フィルターは抗凝固療法ができない人などに限る。それだけでは治療にならない。","血栓溶解療法はショック・低血圧の高リスク例に。血圧が保たれ右室負荷がなければ出血の害が上回る。",""],"core":"急性肺血栓塞栓症：ショック・低血圧（高リスク）なら血栓溶解・カテーテル治療・手術。それ以外は抗凝固療法（リバーロキサバン（イグザレルト）・アピキサバンは最初の数週を高用量で開始、エドキサバン（リクシアナ）はヘパリン先行）。","e":"リスク評価：血圧・右室の負荷（心エコー・CT）・トロポニン・BNP（brain natriuretic peptide：脳性ナトリウム利尿ペプチド）、PESI（Pulmonary Embolism Severity Index） スコア。\n検査前確率（Wells スコア）が低ければ D ダイマーで除外、高ければすぐ造影 CT。\n抗凝固の期間：一時的な誘因（手術・外傷・薬）があれば3か月、誘因がない・がん・続く危険因子なら長く（無期限も）。\n経口避妊薬（エストロゲン）は中止する。\nがん関連血栓症：DOAC（消化器癌では出血に注意）か低分子ヘパリン（国内での適用は限られる）。\n抗リン脂質抗体症候群（とくに3つとも陽性）の血栓症はワルファリン（DOAC は避ける）。","tg":["ae","cs"],"fig":["coag"],"mt":["shock"]},{"id":"cv-b3a50045","f":"cv","u":32,"o":115,"lv":2,"q":"深部静脈血栓症の危険因子（Virchow の三徴）に含まれないものはどれか。","ch":["高い HDL（high-density lipoprotein：高比重リポ蛋白） コレステロール","血液の凝固亢進（悪性腫瘍・妊娠・エストロゲン）","血管内皮の障害（手術・外傷・カテーテル）","血流のうっ滞（長期臥床・長時間の座位）"],"a":0,"cx":["","凝固亢進は三徴の1つ。","内皮障害は三徴の1つ。","うっ滞は三徴の1つ。"],"core":"Virchow の三徴＝血流のうっ滞・血管内皮の障害・凝固能の亢進。","e":"先天性の血栓性素因：アンチトロンビン欠乏症、プロテイン C 欠乏症、プロテイン S 欠乏症（日本人に多い）。欧米で多い第 V 因子 Leiden・プロトロンビン遺伝子変異は日本人にはほとんどない。\n若い人・家族歴・まれな部位（門脈・脳静脈）・繰り返す血栓で考える。\nプロテイン C 欠乏症でワルファリン（ワーファリン）を急に始めると、皮膚壊死が起こることがある（ヘパリンを先に重ねる）。\n入院患者の予防：早期離床・弾性ストッキング・間欠的空気圧迫・抗凝固薬（危険度に応じて）。","tg":[],"fig":["coag"],"mt":["lipid"]},{"id":"cv-0321be0d","f":"cv","u":33,"o":116,"lv":3,"q":"25歳の男性。1週間前に発熱と咽頭痛があった。昨日から胸痛と息切れが出た。心電図で広い範囲の ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 上昇、トロポニン高値。心エコーで左室の壁運動がびまん性に低下している（駆出率 35%）。冠動脈造影は正常。最も考えられる診断と注意点はどれか。","ch":["急性心筋炎 ― 劇症化してショックになりうる","たこつぼ症候群 ― 高齢女性に典型で予後は常に良好","肥大型心筋症 ― 運動をすると症状が改善する","急性心筋梗塞 ― 冠動脈ステントを留置する"],"a":0,"cx":["","たこつぼ症候群は閉経後の女性・ストレス後に多い。ウイルス感染の後の若い男性ではまず心筋炎。","心筋の肥厚の記載はなく、急な発症と感染の先行は心筋炎に合う。","冠動脈造影は正常で、心筋梗塞ではない。"],"core":"急性心筋炎＝かぜ症状の後に胸痛・心不全・不整脈。トロポニン上昇、冠動脈は正常。心臓 MRI（浮腫・遅延造影）、心筋生検。劇症型は数時間で悪化するので、補助循環（IMPELLA・ECMO（extracorporeal membrane oxygenation：体外式膜型人工肺））ができる施設へ。","e":"原因：ウイルス（エンテロ・アデノ・パルボ B19・HHV-6（human herpesvirus 6：ヒトヘルペスウイルス6）・SARS-CoV-2（新型コロナウイルス））、mRNA ワクチン、免疫チェックポイント阻害薬、膠原病、好酸球性（薬・好酸球増多症）、巨細胞性心筋炎（急速に悪化、免疫抑制が必要）。\n回復後もしばらく（3〜6か月）激しい運動を控える。\n拡張型心筋症へ移行することがある。","tg":["cs"],"fig":["coronary","ecg"],"mt":["shock","hfdrugs"]},{"id":"cv-beb07483","f":"cv","u":33,"o":117,"lv":2,"q":"大動脈弁閉鎖不全症について正しいものはどれか。","ch":["脈圧が大きく、拡張期雑音（胸骨左縁）が聞こえる","急性の大動脈弁閉鎖不全でも症状はほとんど出ない","脈圧が小さく、遅脈・小脈となる","雑音は収縮期の駆出性雑音で頸部へ放散する"],"a":0,"cx":["","急性の AR（感染性心内膜炎・大動脈解離）は左室が適応できず、急な肺水腫・ショックになり緊急手術。","遅脈・小脈は大動脈弁狭窄症の所見。","収縮期駆出性雑音（頸部放散）は大動脈弁狭窄症。"],"core":"慢性 AR（aortic regurgitation：大動脈弁閉鎖不全症）＝拡張期の逆流で左室に容量負荷→左室拡大。脈圧が大きい（収縮期↑・拡張期↓）、大脈・速脈、胸骨左縁の拡張期灌水様雑音、Austin Flint 雑音。症状が出る・左室の拡大や駆出率低下で手術。","e":"原因：二尖弁・加齢、大動脈基部の拡大（Marfan 症候群・大動脈炎・高血圧）、感染性心内膜炎、大動脈解離、リウマチ性、強直性脊椎炎。\n僧帽弁閉鎖不全症：心尖部の汎収縮期雑音・腋窩へ放散。外科手術か経カテーテル的修復（MitraClip）。\n僧帽弁狭窄症：リウマチ熱の後、心尖部の拡張期ランブル・開放音、心房細動・血栓塞栓（ワルファリン（ワーファリン））、バルーン交連切開術。","tg":[],"mt":["murmur"]},{"id":"cv-0ccbdde4","f":"cv","u":33,"o":118,"lv":2,"q":"成人の心房中隔欠損症について正しいものはどれか。","ch":["左右短絡なので、肺高血圧になることはない","II 音の奇異性分裂（呼気で広がる）が特徴である","多くは小児期に自然に閉じるので、成人にはいない","II 音の固定性分裂があり、右心系が拡大する"],"a":3,"cx":["長く続く左右短絡で肺高血圧が起こり、重くなると右左短絡（Eisenmenger 症候群）になる。","奇異性分裂は左脚ブロック・大動脈弁狭窄症などで見られる。","成人で初めて見つかる先天性心疾患として最も多い。",""],"core":"心房中隔欠損症（二次孔型が多い）＝II 音の固定性分裂、肺動脈弁領域の収縮期駆出性雑音（血流の増加）、心電図の不完全右脚ブロック・右軸偏位。右心系の容量負荷。成人で心房細動・右心不全・奇異性塞栓。","e":"治療：右心系の拡大があれば閉鎖（カテーテルの閉鎖栓か手術）。不可逆な肺高血圧（Eisenmenger）になってからでは閉じられない。\n卵円孔開存：若い人の原因不明の脳梗塞（奇異性塞栓）で考え、カテーテル閉鎖を検討する。\n心室中隔欠損症：胸骨左縁の汎収縮期雑音、小さいものは雑音が大きい。\n動脈管開存症：連続性雑音。","tg":[],"fig":["ecg","conduct"],"mt":["murmur","hfdrugs"]},{"id":"cv-bd90289e","f":"cv","u":34,"o":119,"lv":3,"q":"52歳の男性。3剤（Ca 拮抗薬・ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬）・サイアザイド）を十分量飲んでも、家庭血圧が 150/95 mmHg 前後。血清 K 3.2 mEq/L。いびきが大きく日中眠い。次に行う検査として優先度の高いものはどれか。","ch":["頭部 MRI（magnetic resonance imaging：磁気共鳴画像） と脳波（てんかんの評価）","アルドステロン/レニン比と睡眠検査","甲状腺の穿刺吸引細胞診","骨密度の測定と骨代謝マーカー"],"a":1,"cx":["頭蓋内の病気は治療抵抗性高血圧の主な原因ではない。","","甲状腺の結節の評価は高血圧の原因検索ではない。","骨密度は高血圧の原因の検索に関係しない。"],"core":"治療抵抗性高血圧（利尿薬を含む3剤で目標に届かない）＝服薬の確認・家庭血圧で白衣高血圧を除く・塩分・NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）/甘草を確かめ、二次性（とくに原発性アルドステロン症・睡眠時無呼吸）を探す。","e":"治療抵抗性高血圧に加える薬：MR（mineralocorticoid receptor：ミネラルコルチコイド受容体） 拮抗薬（スピロノラクトン（アルダクトン A）・エプレレノン・エサキセレノン）が最も効果的。\n低カリウム血症を伴う高血圧：原発性アルドステロン症・偽性アルドステロン症（甘草）・Cushing 症候群・腎血管性高血圧（二次性アルドステロン症）・利尿薬。\n睡眠時無呼吸の高血圧は、夜間・早朝の血圧が高い（ノンディッパー）。CPAP（continuous positive airway pressure：持続陽圧呼吸） で下がる。","tg":["cs"],"mt":["adrenal"]},{"id":"cv-4d092cf0","f":"cv","u":34,"o":120,"lv":3,"q":"28歳の女性。半年前に高血圧（168/102 mmHg）を指摘された。肥満・家族歴はない。上腹部で血管雑音を聴取する。血清 K 3.4 mEq/L、血漿レニン活性高値、アルドステロン高値。ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬を始めたところクレアチニンが急に上がった。最も考えられる診断はどれか。","ch":["褐色細胞腫（カテコールアミン産生）","本態性高血圧（若年発症型）","原発性アルドステロン症（副腎腺腫）","線維筋性異形成による腎血管性高血圧"],"a":3,"cx":["褐色細胞腫は発作性の症状とカテコールアミンの上昇。腹部の血管雑音は典型でない。","若い女性の重い高血圧・血管雑音・高レニンは二次性を考える。","原発性アルドステロン症ではレニンは低く抑えられる。この例はレニンも高い（二次性アルドステロン症）。",""],"core":"腎血管性高血圧＝腎動脈の狭窄で腎のレニンが増える（高レニン・高アルドステロン・低 K）。若い女性は線維筋性異形成（数珠状の狭窄）、高齢者は動脈硬化。両側の狭窄（または単腎）では ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬）/ACE 阻害薬で GFR（glomerular filtration rate：糸球体濾過量） が急に下がる。","e":"診断：腎動脈の超音波ドプラ、CT（computed tomography：コンピュータ断層撮影）・MR（mineralocorticoid receptor：ミネラルコルチコイド受容体） 血管造影。\n治療：線維筋性異形成は経皮的腎動脈形成術（バルーン）がよく効く。動脈硬化性はまず薬物治療（降圧・スタチン・抗血小板薬）、ステントは限られた場合。\n突然の肺水腫を繰り返す（flash pulmonary edema）・治療抵抗性高血圧・説明のつかない腎萎縮の左右差でも疑う。","tg":["cs"]},{"id":"endo-b0292ef7","f":"endo","u":35,"o":121,"lv":1,"q":"ホルモンとその受容体の場所の組み合わせで正しいものはどれか。","ch":["コルチゾール ― 細胞膜の G 蛋白共役型受容体","ACTH（adrenocorticotropic hormone：副腎皮質刺激ホルモン） ― 核内受容体","甲状腺ホルモン ― 核内受容体","インスリン ― 核内受容体"],"a":2,"cx":["コルチゾールなどのステロイドホルモンは細胞の中（細胞質→核）の受容体。","ACTH などのペプチドホルモンは細胞膜の受容体（G 蛋白共役型→cAMP）。","","インスリンは細胞膜のチロシンキナーゼ型受容体。"],"core":"脂溶性のホルモン（ステロイド・甲状腺ホルモン・活性型ビタミン D）＝細胞の中の受容体（核内受容体）で遺伝子の発現を変える（効果はゆっくり）。水溶性（ペプチド・カテコールアミン）＝細胞膜の受容体（速い）。","e":"フィードバック：視床下部（CRH（corticotropin-releasing hormone）・TRH（thyrotropin-releasing hormone）・GnRH（gonadotropin-releasing hormone）・GHRH（GH-releasing hormone））→ 下垂体前葉（ACTH・TSH（thyroid-stimulating hormone：甲状腺刺激ホルモン）・LH（luteinizing hormone：黄体形成ホルモン）/FSH（follicle-stimulating hormone：卵胞刺激ホルモン）・GH（growth hormone：成長ホルモン））→ 標的臓器のホルモン → 上へ戻って抑える（負のフィードバック）。\n例：原発性甲状腺機能低下症は FT4（free thyroxine：遊離サイロキシン）↓・TSH↑、中枢性は FT4↓・TSH↓〜正常。\n下垂体後葉：視床下部で作られた AVP（抗利尿ホルモン）とオキシトシンを放出する。\n負荷試験の考え方：分泌が多すぎる病気には「抑制試験」、足りない病気には「刺激試験」。","tg":[],"mt":["thyroid"]},{"id":"endo-cf07db89","f":"endo","u":35,"o":122,"lv":1,"q":"副腎の構造とつくるホルモンの組み合わせで正しいものはどれか。","ch":["球状層＝アルドステロン、束状層＝コルチゾール","髄質＝アルドステロン、網状層＝カテコールアミン","球状層＝コルチゾール、束状層＝アルドステロン","束状層＝カテコールアミン、髄質＝コルチゾール"],"a":0,"cx":["","髄質はカテコールアミン（主にアドレナリン（ボスミン、自己注射はエピペン））。","球状層と束状層が逆。","束状層はコルチゾール、髄質はカテコールアミン。"],"core":"副腎皮質は外から球状層（アルドステロン：レニン-アンジオテンシンと K で調節）→束状層（コルチゾール：ACTH（adrenocorticotropic hormone：副腎皮質刺激ホルモン））→網状層（アンドロゲン：DHEA-S（dehydroepiandrosterone sulfate））。髄質はカテコールアミン。覚え方「塩・糖・性（salt・sugar・sex）、外から順に」。","e":"アルドステロンは ACTH よりもアンジオテンシン II と血清 K で調節されるので、下垂体性（二次性）の副腎不全では鉱質コルチコイドの不足は起こりにくい（高 K にならない）。\n21-水酸化酵素欠損症（先天性副腎過形成で最多）：コルチゾール・アルドステロンが不足し、アンドロゲンが増える（女児の外性器の男性化・塩類喪失）。新生児マススクリーニング（17-OHP）。\n副腎髄質の PNMT（ノルアドレナリン→アドレナリン（ボスミン、自己注射はエピペン））はコルチゾールで誘導される。","tg":[],"mt":["adrenal"]},{"id":"endo-de48a3a4","f":"endo","u":36,"o":123,"lv":1,"q":"下垂体前葉ホルモンの分泌が障害されるとき、一般に障害されやすい順として正しいものはどれか。","ch":["ACTH（adrenocorticotropic hormone：副腎皮質刺激ホルモン） → TSH（thyroid-stimulating hormone：甲状腺刺激ホルモン） → LH（luteinizing hormone：黄体形成ホルモン）/FSH（follicle-stimulating hormone：卵胞刺激ホルモン） → GH（growth hormone：成長ホルモン） の順に障害されやすい","GH（growth hormone：成長ホルモン） → LH（luteinizing hormone：黄体形成ホルモン）/FSH（follicle-stimulating hormone：卵胞刺激ホルモン） → TSH（thyroid-stimulating hormone：甲状腺刺激ホルモン） → ACTH（adrenocorticotropic hormone：副腎皮質刺激ホルモン） の順に障害されやすい","TSH（thyroid-stimulating hormone：甲状腺刺激ホルモン） → ACTH（adrenocorticotropic hormone：副腎皮質刺激ホルモン） → GH（growth hormone：成長ホルモン） → LH（luteinizing hormone：黄体形成ホルモン）/FSH（follicle-stimulating hormone：卵胞刺激ホルモン） の順に障害されやすい","プロラクチン → ACTH（adrenocorticotropic hormone：副腎皮質刺激ホルモン） → GH（growth hormone：成長ホルモン） → TSH（thyroid-stimulating hormone：甲状腺刺激ホルモン） の順に障害されやすい"],"a":1,"cx":["逆の順。ACTH・TSH は比較的最後まで保たれやすい。","","順番が違う。","プロラクチンは視床下部からドパミンで「抑えられて」いるので、茎の障害ではむしろ上がる。"],"core":"下垂体腫瘍などの圧迫では、GH→LH/FSH→TSH→ACTH の順に落ちやすい。プロラクチンは下垂体茎が圧迫されると上がる（ドパミンが届かない）。","e":"補充の順番：副腎不全と甲状腺機能低下が両方あれば、先にヒドロコルチゾン（静注はソル・コーテフ、内服はコートリル）、数日後に甲状腺ホルモン（逆にすると代謝が上がって副腎クリーゼを起こす）。\n下垂体卒中：腫瘍内の出血・梗塞で、突然の激しい頭痛・視力障害・眼球運動障害・意識障害。急性の副腎不全があるので、すぐにヒドロコルチゾン。\nSheehan 症候群：分娩時の大量出血後の下垂体壊死。産後に乳汁が出ない・月経が戻らない。\nリンパ球性下垂体炎・IgG4（immunoglobulin G4：免疫グロブリン G のサブクラス4） 関連・免疫チェックポイント阻害薬による下垂体炎も原因になる。","tg":[],"fig":["hpaxis"]},{"id":"endo-0b7c683b","f":"endo","u":36,"o":124,"lv":2,"q":"先端巨大症について正しいものはどれか。","ch":["治療の第一選択は、ドパミン作動薬の内服である","合併症として、低血圧と低血糖が多い","血中 GH（growth hormone：成長ホルモン） が1回高ければ、それだけで診断できる","ブドウ糖負荷で GH（growth hormone：成長ホルモン） が抑えられず、IGF-1（insulin-like growth factor-1） が高い"],"a":3,"cx":["第一選択は経蝶形骨洞手術。残った腫瘍や手術ができない場合にソマトスタチンアナログ・GH（growth hormone：成長ホルモン） 受容体拮抗薬など。","合併症は高血圧・糖尿病（GH（growth hormone：成長ホルモン） はインスリンに拮抗）・睡眠時無呼吸・心肥大・大腸ポリープ/癌。","GH は拍動的に分泌され、ストレス・睡眠でも上がるので1回の値では決められない。",""],"core":"先端巨大症の診断＝IGF-1 高値（年齢・性別の基準で）＋ブドウ糖負荷で GH が 0.4 ng/mL 未満に下がらない＋MRI（magnetic resonance imaging：磁気共鳴画像） で下垂体腺腫。","e":"症状：手足の肥大（靴・指輪のサイズが変わる）、顔貌の変化（眉弓・下顎の突出、鼻・口唇の肥大）、巨舌、発汗、手根管症候群、関節痛。\n薬：ソマトスタチンアナログ（オクトレオチド（サンドスタチン）・ランレオチド・パシレオチド）、GH 受容体拮抗薬（ペグビソマント（ソマバート）：IGF-1 で効果を見る）、ドパミン作動薬（カベルゴリン（カバサール））。\n大腸内視鏡と心エコー・睡眠時無呼吸の評価も行う。","tg":[],"fig":["hpaxis"]},{"id":"endo-21122a41","f":"endo","u":36,"o":125,"lv":2,"q":"プロラクチノーマについて正しいものはどれか。","ch":["抗精神病薬で高プロラクチン血症になることはない","大きな腫瘍でも、まずカベルゴリン（カバサール）で治療する","男性には、プロラクチノーマはできない","治療の第一選択は、放射線療法である"],"a":1,"cx":["ドパミン受容体を遮断する薬（スルピリド（ドグマチール）・メトクロプラミド・抗精神病薬）は高プロラクチン血症を起こす。","","男性にもでき、性欲低下・勃起障害で見つかりにくく、大きな腫瘍（視野障害）で見つかることが多い。","薬がよく効くので、放射線療法は第一選択ではない。"],"core":"プロラクチノーマ＝ドパミン作動薬（カベルゴリン）が第一選択。大きな腫瘍でも縮むことが多い。女性は無月経・乳汁漏出で見つかる。","e":"高プロラクチン血症の原因を先に除く：妊娠、薬（抗精神病薬・スルピリド・メトクロプラミド・三環系抗うつ薬・H2 遮断薬）、原発性甲状腺機能低下症（TRH（thyrotropin-releasing hormone） がプロラクチンも上げる）、腎不全、下垂体茎の圧迫。\nカベルゴリンの副作用：吐き気・起立性低血圧、高用量長期（パーキンソン病の量）で心臓弁膜症。\n巨大腺腫ではプロラクチンが極端に高くて測定値が低く出ること（フック効果）があるので、希釈して測る。","tg":[]},{"id":"endo-2c4bfa02","f":"endo","u":36,"o":126,"lv":2,"q":"アルギニンバソプレシン（AVP（arginine vasopressin：アルギニンバソプレシン、抗利尿ホルモン））分泌低下症（中枢性尿崩症）について正しいものはどれか。","ch":["高張食塩水を負荷しても AVP が上がらない","尿の浸透圧が血漿より高い濃い尿が、大量に出る","心因性多飲症とは、区別しなくてよい","治療は、サイアザイド系利尿薬が第一選択である"],"a":0,"cx":["","尿崩症では薄い尿（低張尿、尿浸透圧 300 mOsm/kg 以下）が大量に出る。","心因性多飲症は血清ナトリウムが低めで、水制限で尿が濃くなる。治療が全く違うので区別が大事。","中枢性の治療はデスモプレシン（口腔内崩壊錠・点鼻）。サイアザイドは腎性（AVP 抵抗症）で使う。"],"core":"2023年から中枢性尿崩症＝「AVP 分泌低下症」、腎性尿崩症＝「AVP 抵抗症」と呼ぶ。中枢性は高張食塩水負荷で AVP が上がらず、デスモプレシン（ミニリンメルト）で尿が濃くなる。","e":"原因：特発性、頭蓋咽頭腫・胚細胞腫（若年）、Langerhans 細胞組織球症、サルコイドーシス、リンパ球性漏斗下垂体後葉炎、頭部外傷・手術後。\nAVP 抵抗症の原因：リチウム、高カルシウム血症、低カリウム血症、遺伝性（V2 受容体・アクアポリン2）。\nデスモプレシンの副作用は水中毒（低ナトリウム血症）。飲水量を調節する。\n口渇の感覚が壊れた人（渇中枢の障害）は重い高ナトリウム血症になりやすい。","tg":[]},{"id":"endo-c9f8593b","f":"endo","u":37,"o":127,"lv":2,"q":"甲状腺中毒症の原因を区別する検査として最も役立つのはどれか。","ch":["TRAb（TSH receptor antibody：TSH 受容体抗体） と甲状腺の放射性ヨウ素摂取率","血中カルシトニンと CEA（carcinoembryonic antigen：癌胎児性抗原）","血中サイログロブリンの値だけ","抗甲状腺ペルオキシダーゼ抗体（TPOAb（thyroid peroxidase antibody：抗甲状腺ペルオキシダーゼ抗体））だけ"],"a":0,"cx":["","カルシトニンは甲状腺髄様癌のマーカー。","サイログロブリンは甲状腺が壊れても、作りすぎても上がる。外から甲状腺ホルモンを飲んでいる（作為的）ときだけ低い。","TPOAb は橋本病・Basedow 病のどちらでも陽性になり、区別には向かない。"],"core":"Basedow 病＝TRAb 陽性・摂取率が高い（作りすぎ）。無痛性甲状腺炎・亜急性甲状腺炎＝摂取率が低い（壊れて漏れる）。治療が全く違う。","e":"区別のポイント：\n・Basedow 病：眼症（眼球突出）、びまん性の甲状腺腫、FT3（free triiodothyronine：遊離トリヨードサイロニン）/FT4（free thyroxine：遊離サイロキシン） 比が高め、TRAb 陽性\n・無痛性甲状腺炎：痛みなし、産後に多い、一過性（数か月）、β遮断薬だけで経過を見る\n・亜急性甲状腺炎：痛み（移動する）・発熱・CRP（C-reactive protein：C反応性タンパク） 高値、上気道炎の後、NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） かプレドニゾロン（プレドニン）\n・機能性甲状腺結節（Plummer 病）：結節に一致した集積\n・甲状腺ホルモンの過剰内服：サイログロブリン低値\n妊娠初期の hCG による一過性の甲状腺機能亢進（妊娠悪阻に伴う）もある。","tg":["ae"],"fig":["thyrotox"],"mt":["thyroid"]},{"id":"endo-a3e76a25","f":"endo","u":37,"o":128,"lv":2,"q":"Basedow 病の抗甲状腺薬について正しいものはどれか。","ch":["チアマゾール（メルカゾール）は、妊娠初期（5〜9週）でも第一選択である","発熱・咽頭痛が出たら中止し、すぐ白血球数を測る","抗甲状腺薬で、肝障害が起こることはない","無顆粒球症は、服薬1年以降に起こることがほとんどである"],"a":1,"cx":["チアマゾールは妊娠初期に使うと奇形（頭皮欠損・臍腸管の異常など）の報告があり、この時期はプロピルチオウラシル（チウラジール、プロパジール）かヨウ化カリウムを使う。","","プロピルチオウラシル（チウラジール、プロパジール）は重い肝障害、チアマゾール（メルカゾール）は胆汁うっ滞型の肝障害を起こしうる。","無顆粒球症の多くは服薬開始から3か月以内に起こる。"],"core":"抗甲状腺薬の第一選択はチアマゾール（MMI（methimazole：チアマゾール））。無顆粒球症（多くは3か月以内）に備え、開始から2か月は2週ごとに白血球数を測り、発熱・咽頭痛ならすぐ中止して受診。","e":"ほかの副作用：皮疹・かゆみ（最も多い）、肝障害、ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） 関連血管炎（とくにプロピルチオウラシル（チウラジール、プロパジール））、関節痛。\n治療の選択肢：抗甲状腺薬・放射性ヨウ素内用療法（妊娠・授乳中は禁忌、活動性の眼症は悪化しうる）・手術。\n無機ヨウ素（ヨウ化カリウム）：速く効き、手術前や副作用で抗甲状腺薬が使えないときに。\nBasedow 病眼症：喫煙で悪化。活動性・中等症以上はステロイドパルス、テプロツムマブ（抗 IGF-1（insulin-like growth factor-1） 受容体抗体、国内承認 2024年）、放射線。","tg":[],"fig":["thyrotox"],"mt":["thyroid"]},{"id":"endo-2f65d13d","f":"endo","u":37,"o":129,"lv":3,"q":"42歳の女性。Basedow 病で治療を自己中断していた。2日前から発熱があり、今日、ひどい興奮と下痢・嘔吐が出て搬送された。体温 39.8℃、脈拍 168/分・不整（心房細動）、血圧 102/48 mmHg、黄疸がある。最も適切な治療の組み合わせはどれか。","ch":["放射性ヨウ素の内用療法を、緊急に行う","甲状腺ホルモン製剤（レボチロキシン（チラーヂン S））を静注する","抗甲状腺薬・無機ヨウ素・ステロイド・β遮断薬","アスピリンで解熱し、症状が落ち着けば帰宅させる"],"a":2,"cx":["放射性ヨウ素は効くまで時間がかかり、一時的に悪化させることもある。クリーゼでは使わない。","甲状腺ホルモンの投与は全く逆。","","アスピリンはサイロキシン結合グロブリンからホルモンを遊離させるので避ける（解熱はアセトアミノフェン（カロナール）・冷却）。外来で帰すのは危険。"],"core":"甲状腺クリーゼ＝抗甲状腺薬（合成を止める）→ 1時間以上あけて無機ヨウ素（放出を止める）＋ステロイド（T4→T3 変換を抑え、相対的副腎不全を補う）＋β遮断薬（心拍数、ランジオロール（オノアクト）など）＋誘因（感染・中断・手術）の治療。","e":"診断：甲状腺中毒症＋発熱・中枢神経症状（不穏・意識障害）・頻脈・心不全・消化器症状（下痢・嘔吐・黄疸）。死亡率が高く、集中治療が必要。\n抗甲状腺薬はチアマゾール（大量、静注も可）。\n心不全が強いときの β遮断薬は短時間作用の静注薬で慎重に。\n効かなければ血漿交換。","tg":["cs"],"fig":["thyrotox"],"mt":["thyroid"]},{"id":"endo-f83d93e7","f":"endo","u":37,"o":130,"lv":2,"q":"甲状腺結節の評価について正しいものはどれか。","ch":["未分化癌は若い人に多く、ゆっくり進む","乳頭癌は血行性に肺へ転移しやすく、予後は悪い","超音波で悪性を疑えば、穿刺吸引細胞診を行う","髄様癌は濾胞細胞から発生し、サイログロブリンが上がる"],"a":2,"cx":["未分化癌は高齢者に多く、急に大きくなり、予後が非常に悪い。","乳頭癌は最も多く（約9割）、リンパ節転移は多いが予後は非常に良い。","","髄様癌は傍濾胞細胞（C 細胞）から発生し、カルシトニン・CEA（carcinoembryonic antigen：癌胎児性抗原） が上がる。"],"core":"甲状腺結節は超音波（形が不整・境界不明瞭・微細な石灰化・低エコー・縦長）で悪性を疑い、穿刺吸引細胞診で診断する。","e":"組織型：\n・乳頭癌：最も多い、すりガラス状の核・核溝・核内封入体・砂粒体、リンパ節転移\n・濾胞癌：細胞診で良性の濾胞腺腫と区別できない（被膜・脈管への浸潤で診断）、血行性転移（骨・肺）\n・髄様癌：RET（rearranged during transfection、がん遺伝子） 遺伝子（MEN2（多発性内分泌腫瘍症2型） では手術前に褐色細胞腫を除く）\n・未分化癌：高齢、急速に増大\n・悪性リンパ腫：橋本病を背景に急に大きくなる\n分化癌の術後：甲状腺ホルモンで TSH（thyroid-stimulating hormone：甲状腺刺激ホルモン） を抑える、放射性ヨウ素（アブレーション）、サイログロブリンで再発を監視。","tg":[],"mt":["thyroid"]},{"id":"endo-b75aedee","f":"endo","u":37,"o":131,"lv":2,"q":"潜在性甲状腺機能低下症（TSH（thyroid-stimulating hormone：甲状腺刺激ホルモン） が高く FT4（free thyroxine：遊離サイロキシン） は正常）で、治療（レボチロキシン（チラーヂン S））を考えるべき状況はどれか。","ch":["ヨウ素の多い食事（昆布）の後の一過性の TSH 上昇","80歳以上で TSH 6 µIU（international unit：国際単位）/mL、症状なし","重い病気から回復するときの一過性の TSH 上昇","妊娠中、または妊娠を希望している"],"a":3,"cx":["日本人はヨウ素の摂取が多く、昆布などで一過性に TSH が上がることがある。まず控えて測り直す。","高齢者では軽い TSH の上昇は年齢相応のことが多く、治療しないことが多い。","重い病気の回復期にも TSH が一時的に上がる（non-thyroidal illness の回復）。",""],"core":"潜在性甲状腺機能低下症：TSH 10 µIU/mL 以上、妊娠・妊娠希望、症状がある若い人では治療を考える。高齢者の軽い上昇は経過観察が多い。","e":"妊娠中は胎児の神経発達のため、TSH を妊娠初期 2.5 µIU/mL 未満程度に保つ。もともと補充している人は妊娠がわかったら量を 20〜30% 増やす。\nレボチロキシン：朝の空腹時に飲む（鉄・カルシウム・PPI（proton pump inhibitor：プロトンポンプ阻害薬） で吸収が落ちる）。高齢者・心疾患では少量から。\n粘液水腫性昏睡：重い甲状腺機能低下症に感染・寒冷・鎮静薬が重なる。低体温・意識障害・低ナトリウム・CO₂ 貯留。ヒドロコルチゾン（静注はソル・コーテフ、内服はコートリル）を先に（同時に）、甲状腺ホルモンを静注・経管で。","tg":[],"fig":["hpaxis"],"mt":["thyroid"]},{"id":"endo-20bd2f87","f":"endo","u":37,"o":132,"lv":3,"q":"46歳の女性。2週間前にかぜをひき、その後から前頸部の痛みが右から左へ移り、38℃の発熱と動悸がある。甲状腺は硬く圧痛がある。FT4（free thyroxine：遊離サイロキシン） 3.8 ng/dL、TSH（thyroid-stimulating hormone：甲状腺刺激ホルモン） 0.01 µIU（international unit：国際単位）/mL 未満、CRP（C-reactive protein：C反応性タンパク） 6.2 mg/dL、TRAb（TSH receptor antibody：TSH 受容体抗体） 陰性。甲状腺の放射性ヨウ素摂取率は低い。最も適切な治療はどれか。","ch":["NSAIDs（強ければプレドニゾロン（プレドニン））","放射性ヨウ素内用療法（アイソトープ）","チアマゾール（抗甲状腺薬）の内服","甲状腺の全摘術（手術）"],"a":0,"cx":["","摂取率が低く、放射性ヨウ素は取り込まれない。適応がない。","破壊性の甲状腺中毒症で、ホルモンを作りすぎてはいない。抗甲状腺薬は効かない。","自然に治る病気で、手術は不要。"],"core":"亜急性甲状腺炎＝上気道炎の後の有痛性甲状腺腫（痛みが移動する）・発熱・CRP 高値・摂取率低値の破壊性甲状腺中毒症。NSAIDs、強ければプレドニゾロン（再燃に注意してゆっくり減らす）。動悸には β遮断薬。","e":"経過：中毒期（数週）→ 一過性の低下期 → 多くは回復（一部で永続的な低下症）。\n無痛性甲状腺炎：痛みなし、CRP 正常、産後・橋本病が背景、ICI（免疫チェックポイント阻害薬）やアミオダロン（アンカロン）でも起こる。β遮断薬だけで経過を見る。\n急性化膿性甲状腺炎：小児・若年の左葉に多い、下咽頭梨状窩瘻、抗菌薬・排膿。\n甲状腺のエコーで、圧痛部位の低エコー域（亜急性）と血流の増加（Basedow 病）を区別できる。","tg":["ae","cs"],"fig":["thyrotox"],"mt":["thyroid","antidote"]},{"id":"endo-21f6b7c8","f":"endo","u":37,"o":133,"lv":2,"q":"甲状腺ホルモンの検査値の読み方で正しいものはどれか。","ch":["ビオチン（サプリメント）を飲んでいても、測定値は影響を受けない","重い全身疾患では FT3（free triiodothyronine：遊離トリヨードサイロニン） が下がっても TSH（thyroid-stimulating hormone：甲状腺刺激ホルモン） は正常のことがある","TSH（thyroid-stimulating hormone：甲状腺刺激ホルモン） が正常なら、下垂体性の甲状腺機能低下症は否定できる","TSH（thyroid-stimulating hormone：甲状腺刺激ホルモン） 産生腫瘍では、FT4（free thyroxine：遊離サイロキシン） が低く TSH も低い"],"a":1,"cx":["大量のビオチンは免疫測定法を妨げ、甲状腺の検査値（ほかのホルモンも）を誤らせる。","","中枢性（下垂体・視床下部）の低下症では TSH が正常〜低値のことがあり、FT4（free thyroxine：遊離サイロキシン） の低値で気づく。","TSH 産生腫瘍では FT4 が高いのに TSH が抑えられない（不適切 TSH 分泌症候群）。"],"core":"low T3 症候群（nonthyroidal illness）＝重い病気・飢餓で T4→T3 の変換が落ちる。甲状腺ホルモンの補充はしない。原病が良くなると戻る。","e":"不適切 TSH 分泌症候群（FT4 高値なのに TSH が抑えられない）：TSH 産生下垂体腺腫、甲状腺ホルモン不応症（THR（thyroid hormone receptor：甲状腺ホルモン受容体）β 遺伝子）、測定の干渉（異好性抗体）。\n薬の影響：アミオダロン（中毒症・低下症の両方）、リチウム（低下症）、ヨード（造影剤・昆布）、ICI（甲状腺炎）、ドパミン・ステロイド（TSH を抑える）、エストロゲン（TBG（thyroxine-binding globulin：サイロキシン結合グロブリン）↑で総 T4↑、FT4 は正常）。","tg":[],"fig":["hpaxis"],"mt":["thyroid"]},{"id":"endo-3cf015ec","f":"endo","u":38,"o":134,"lv":2,"q":"原発性副甲状腺機能亢進症について正しいものはどれか。","ch":["PTH（parathyroid hormone：副甲状腺ホルモン） の作用で、高リン血症になる","高カルシウム血症なのに、PTH（parathyroid hormone：副甲状腺ホルモン） が抑えられていない","原因の大部分は、副甲状腺癌である","高カルシウム血症で、PTH（parathyroid hormone：副甲状腺ホルモン） は強く抑えられている"],"a":1,"cx":["PTH は尿へのリン排泄を増やすので、低リン血症になる。","","原因の約8〜9割は1腺の腺腫。癌はまれ（1% 程度）。","PTH が抑えられていれば、PTH 以外の原因（悪性腫瘍の PTHrP（PTH-related protein：副甲状腺ホルモン関連蛋白）・骨転移・ビタミンD・サルコイドーシス・薬）を考える。"],"core":"高カルシウム血症で PTH が正常〜高値＝原発性副甲状腺機能亢進症（外来の高カルシウム血症で最多）。PTH が低い＝悪性腫瘍など（入院の高カルシウム血症で最多）。","e":"症状：骨（骨粗鬆症・骨折）、腎（尿路結石・腎機能低下）、消化器（消化性潰瘍・膵炎）、精神（うつ・倦怠感）。無症状で健診で見つかることが多い。\n手術の適応：症状がある、Ca が上限より 1 mg/dL 以上高い、骨粗鬆症・骨折、腎機能低下・結石・高カルシウム尿、50歳未満。\n局在診断：頸部超音波・MIBI（methoxyisobutylisonitrile、シンチグラフィの薬） シンチ。\n家族性低カルシウム尿性高カルシウム血症（FHH（familial hypocalciuric hypercalcemia：家族性低カルシウム尿性高カルシウム血症））：尿中 Ca 排泄が低い（Ca/Cr クリアランス比 0.01 未満）、手術は不要。\n手術できないときはシナカルセト（レグパラ）・エボカルセト（カルシウム受容体作動薬）。\nMEN1（multiple endocrine neoplasia type 1：多発性内分泌腫瘍症1型） では多腺の過形成。","tg":[],"mt":["thyroid"]},{"id":"endo-d0dc1589","f":"endo","u":38,"o":135,"lv":2,"q":"低カルシウム血症について正しいものはどれか。","ch":["低マグネシウム血症は低カルシウム血症と関係しない","Trousseau・Chvostek 徴候、QT（QT 間隔、心室の興奮の始まりから回復まで） 延長","手指のしびれはなく、QT（QT 間隔、心室の興奮の始まりから回復まで） は短縮する","甲状腺の手術の後に起こることはない"],"a":1,"cx":["低マグネシウム血症は PTH（parathyroid hormone：副甲状腺ホルモン） の分泌と作用を落とし、Mg を補わないと Ca が戻らない。","","QT 短縮は高カルシウム血症。低カルシウムでは口の周り・手指のしびれ、テタニー、けいれん。","甲状腺・副甲状腺の手術後の副甲状腺機能低下症は、低カルシウム血症の代表的な原因。"],"core":"低 Ca の所見：テタニー、Trousseau 徴候（血圧計で圧迫すると手が助産師の手の形になる）、Chvostek 徴候（顔面神経を叩くと口角がピクつく）、QT 延長。まずアルブミンで補正し、Mg を確かめる。","e":"原因と PTH（parathyroid hormone：副甲状腺ホルモン）：PTH が低い＝副甲状腺機能低下症（術後・自己免疫・低マグネシウム）、PTH が高い＝ビタミン D 不足・CKD（chronic kidney disease：慢性腎臓病）・偽性副甲状腺機能低下症（PTH が効かない）・急性膵炎・腫瘍崩壊症候群・ビスホスホネートやデノスマブ（とくに腎機能低下で）。\n急性の症状にはグルコン酸カルシウム（カルチコール）の静注。慢性には活性型ビタミン D（アルファカルシドール（アルファロール、ワンアルファ））＋カルシウム。\n過換気（アルカローシス）ではイオン化カルシウムが下がって、手のしびれ・テタニーが出る。","tg":[],"fig":["ecg"],"mt":["paraneo"]},{"id":"endo-f7cb0c21","f":"endo","u":38,"o":136,"lv":3,"q":"66歳の女性。肺の扁平上皮癌で治療中。数日前から口渇・多尿・便秘・倦怠感が強くなり、もうろうとしている。血清 Ca 14.6 mg/dL（アルブミン 3.6 g/dL）、P 2.1 mg/dL、intact PTH（parathyroid hormone：副甲状腺ホルモン） 6 pg/mL（低値）。最も考えられる機序と、最初の治療の組み合わせはどれか。","ch":["原発性副甲状腺機能亢進症 ― 副甲状腺の緊急手術","PTHrP（PTH-related protein：副甲状腺ホルモン関連蛋白） ― 輸液とビスホスホネート","ビタミン D 欠乏 ― 活性型ビタミン D の内服","家族性低カルシウム尿性高カルシウム血症 ― 経過観察"],"a":1,"cx":["PTH が抑えられており、原発性副甲状腺機能亢進症ではない。","","ビタミン D の不足では低カルシウム血症になる。","FHH（familial hypocalciuric hypercalcemia：家族性低カルシウム尿性高カルシウム血症） は軽い高カルシウム血症で症状がなく、悪性腫瘍の経過とは合わない。"],"core":"悪性腫瘍に伴う高カルシウム血症（最多は PTHrP：扁平上皮癌・腎癌・ATL（adult T-cell leukemia-lymphoma：成人T細胞白血病・リンパ腫））＝PTH 低値・リン低値。脱水を生理食塩水で直し、ゾレドロン酸（かデノスマブ（プラリア、骨粗鬆症））、即効性のためにカルシトニンを併用。","e":"高カルシウム血症の症状：口渇・多尿（腎性尿崩症）、脱水、便秘・吐き気、膵炎、意識障害、QT（QT 間隔、心室の興奮の始まりから回復まで） 短縮。\nループ利尿薬は脱水を直した後で、体液過剰のときに限る。\nビタミン D を介するもの（リンパ腫・サルコイドーシス・結核）：1,25(OH)₂D 高値、ステロイドが効く。\n腎機能が非常に悪ければ透析。\n乳癌・骨髄腫の骨転移（局所性骨溶解）でも起こる。","tg":["ae","cs"],"mt":["paraneo"]},{"id":"endo-ff7244ba","f":"endo","u":39,"o":137,"lv":2,"q":"原発性アルドステロン症について正しいものはどれか。","ch":["副腎 CT（computed tomography：コンピュータ断層撮影） で腫瘍が見えれば、その側の腺腫と決めてよい","ARR（absolute risk reduction：絶対リスク減少） でスクリーニング、負荷試験で確定、AVS（adrenal venous sampling：副腎静脈サンプリング） で局在","低カリウム血症がなければ、否定できる","片側性でも手術はせず、全員を薬で治療する"],"a":1,"cx":["CT の小さな腫瘍は非機能性のこともあり、反対側が原因のこともある。手術を考えるなら副腎静脈サンプリング（AVS（adrenal venous sampling：副腎静脈サンプリング））で左右を決める。","","低カリウム血症があるのは一部（3〜4割程度）。カリウムが正常でも否定できない。","片側性（多くはアルドステロン産生腺腫）は手術（腹腔鏡下副腎摘出）で治癒・改善を期待できる。両側性は MR（mineralocorticoid receptor：ミネラルコルチコイド受容体） 拮抗薬（エサキセレノン（ミネブロ）・スピロノラクトン・エプレレノン）。"],"core":"原発性アルドステロン症：ARR（アルドステロン÷レニン活性）高値でスクリーニング → 確認検査（カプトプリル（カプトリル）負荷・生理食塩水負荷など）→ CT → 手術希望なら AVS。","e":"同じ血圧でも、本態性高血圧より脳卒中・心房細動・心肥大・腎障害が多い（アルドステロンそのものの害）。\n採血の注意：ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬）/ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬・利尿薬・β遮断薬は結果を変える。可能なら Ca 拮抗薬・α遮断薬に替えて測る。低カリウムは補正してから。\n偽性アルドステロン症：甘草（グリチルリチン）で 11β-HSD2（11β-hydroxysteroid dehydrogenase type 2） が阻害され、コルチゾールが鉱質コルチコイド受容体を刺激する。レニンもアルドステロンも低い。\nLiddle 症候群：上皮型 Na チャネルの機能亢進、アルドステロン低値、アミロライド・トリアムテレンが効く。","tg":[],"mt":["adrenal"]},{"id":"endo-a5d6d116","f":"endo","u":39,"o":138,"lv":2,"q":"Cushing 症候群のスクリーニング検査として正しいものはどれか。","ch":["迅速 ACTH（コシントロピン）負荷試験","随時の血中コルチゾール1回の測定","血中アルドステロン濃度の測定","1 mg デキサメタゾン抑制試験"],"a":3,"cx":["迅速 ACTH 負荷試験は副腎不全（コルチゾールが足りない）の検査。","コルチゾールは日内変動とストレスで大きく変わるので、1回の値では判断できない。","アルドステロンは原発性アルドステロン症の検査。",""],"core":"Cushing 症候群のスクリーニング：1 mg デキサメタゾン抑制試験（翌朝コルチゾール 1.8 µg/dL 以上で疑い）、深夜の血中/唾液コルチゾール、24時間尿中遊離コルチゾール。","e":"特徴的な所見：満月様顔貌・中心性肥満・野牛肩、赤紫色の幅広い皮膚線条、皮膚が薄くあざができやすい、近位筋の筋力低下、高血圧・糖尿病・骨粗鬆症、感染症。\n原因の区別：ACTH が低い→副腎性（腺腫）、ACTH が正常〜高い→Cushing 病（下垂体）か異所性 ACTH（肺の小細胞癌・カルチノイド：低カリウムが強い）。大量（8 mg）デキサメタゾンで抑えられる・CRH（corticotropin-releasing hormone） 試験で反応するのは Cushing 病。下垂体の静脈洞サンプリング。\n医原性（ステロイドの長期使用）が最も多い。\n副腎偶発腫のサブクリニカル Cushing 症候群：典型的な身体所見がなく、自律的なコルチゾール分泌がある。","tg":[],"mt":["adrenal"]},{"id":"endo-24a24dff","f":"endo","u":39,"o":139,"lv":3,"q":"35歳の女性。発作的な頭痛・動悸・発汗を繰り返している。発作時の血圧は 220/120 mmHg。血中メタネフリン・ノルメタネフリンが高く、CT（computed tomography：コンピュータ断層撮影） で右副腎に 4 cm の腫瘍がある。手術の前にまず使う薬はどれか。","ch":["β遮断薬（プロプラノロール（インデラル））単独","ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬（エナラプリル（レニベース））単独","α遮断薬（ドキサゾシン（カルデナリン））","ループ利尿薬（フロセミド（ラシックス））"],"a":2,"cx":["α遮断より先に β遮断薬を使うと、α作用（血管収縮）が打ち消されずに残り、高血圧クリーゼ・肺水腫を起こす。","カテコールアミンの過剰には α遮断薬が基本。ACE 阻害薬単独では不十分。","","褐色細胞腫は循環血漿量が減っていることが多く、利尿薬は脱水・起立性低血圧を悪化させる。"],"core":"褐色細胞腫の術前＝α遮断薬（ドキサゾシン）を十分に（10〜14日以上）＋塩分・水分の補給。頻脈が残れば α遮断のあとに β遮断薬を加える。","e":"診断：血中遊離メタネフリン・尿中メタネフリン → CT/MRI（MRI の T2 で高信号）→ MIBG（metaiodobenzylguanidine、シンチグラフィの薬） シンチ（転移・多発の検索）。\n造影剤・メトクロプラミド・グルカゴン・β遮断薬単独・副腎の生検は、発作を誘発しうるので注意（生検は禁忌）。\n約3〜4割に遺伝子変異（RET（rearranged during transfection、がん遺伝子）＝MEN2（多発性内分泌腫瘍症2型）、VHL（von Hippel-Lindau）＝von Hippel-Lindau、NF1（neurofibromatosis type 1：神経線維腫症1型）、SDHx（コハク酸脱水素酵素の遺伝子群）：悪性・副腎外に多い）。若い・両側・副腎外・家族歴では遺伝学的検査を考える。\n悪性度は組織だけでは決められず、生涯の経過観察が必要。","tg":["cs"],"mt":["adrenal"]},{"id":"endo-b40fa4d8","f":"endo","u":39,"o":140,"lv":3,"q":"70歳の女性。関節リウマチで10年以上プレドニゾロン（プレドニン） 7.5 mg/日を飲んでいた。1週間前から自己判断で中止した。2日前から嘔吐と腹痛があり、意識がもうろうとして搬送された。血圧 76/40 mmHg、血清 Na 126 mEq/L、K 4.6 mEq/L、血糖 58 mg/dL。最も適切な対応はどれか。","ch":["採血後すぐ、ヒドロコルチゾン（静注はソル・コーテフ、内服はコートリル）静注と生理食塩水","まず迅速 ACTH（adrenocorticotropic hormone：副腎皮質刺激ホルモン） 負荷試験の結果を待ってから治療する","3% 食塩水だけで、低ナトリウム血症を急いで補正する","フルドロコルチゾン（鉱質コルチコイド）だけを内服させる"],"a":0,"cx":["","副腎クリーゼは命にかかわる。検査の結果を待たずに治療する（採血だけは先に）。","原因は副腎不全。食塩水だけでは血圧・血糖は戻らない。","内服では吸収が不確実で、鉱質コルチコイドだけでは不十分。"],"core":"副腎クリーゼ＝ヒドロコルチゾン 100 mg 静注（その後 200 mg/日 程度）＋生理食塩水＋ブドウ糖。長期ステロイドの急な中止は二次性（続発性）副腎不全の最も多い原因。","e":"一次性（Addison 病：副腎そのもの）と二次性（下垂体・長期ステロイド）の違い：一次性は ACTH 高値で色素沈着、鉱質コルチコイドも足りず高カリウム。二次性は色素沈着なし、カリウムは保たれる。\n原因：自己免疫性（多腺性自己免疫症候群）、結核、両側副腎の出血（抗凝固薬・敗血症：Waterhouse-Friderichsen）、転移、免疫チェックポイント阻害薬（下垂体炎）。\nシックデイ・ルール：発熱・嘔吐などのときはステロイドを 2〜3倍に増やす。内服できなければ受診（注射）。手術のときはストレス量を補う。\n長期にステロイドを使う人は、急にやめず少しずつ減らす。","tg":["cs"],"fig":["hpaxis"],"mt":["adrenal"]},{"id":"endo-34125fdd","f":"endo","u":39,"o":141,"lv":3,"q":"56歳の男性。腹部 CT（computed tomography：コンピュータ断層撮影） で偶然、左副腎に 2.5 cm の腫瘍が見つかった。境界は明瞭で、CT 値は 8 HU（脂肪が多い）。高血圧がある。次に行う検査として正しいものはどれか。","ch":["副腎腫瘍の針生検を行い、組織型を確かめる","ホルモン検査（コルチゾール・アルドステロン・カテコールアミン）","何もせず、偶然の所見なので一生検査しないと説明する","機能を調べずに、すぐに腹腔鏡下副腎摘出術を行う"],"a":1,"cx":["副腎の生検は褐色細胞腫なら危険で、腺腫と癌の区別にも役立たない。原則行わない（転移が疑われる特殊な場合を除く）。","","偶発腫でも、ホルモンの過剰（サブクリニカル Cushing 症候群・原発性アルドステロン症・褐色細胞腫）を必ず調べる。","機能性か・悪性を疑うかを確かめてから手術を決める。"],"core":"副腎偶発腫＝①ホルモン検査（1 mg デキサメタゾン抑制試験・ARR（absolute risk reduction：絶対リスク減少）〔高血圧・低 K がある人〕・血中/尿中メタネフリン）②画像で悪性を評価（4 cm 以上・CT 値 10 HU 超・不均一・増大は癌や褐色細胞腫も考える）。","e":"CT 値 10 HU 以下（脂肪に富む）の均一な腫瘍はほぼ良性の腺腫。\n造影 CT の washout（早く抜ける）も腺腫を示唆。\n両側の副腎腫瘍：転移、リンパ腫、褐色細胞腫、先天性副腎過形成、出血、結核・真菌。\n悪性を疑う・機能性・大きい（4 cm 以上）なら手術を考える。","tg":["cs"],"mt":["adrenal"]},{"id":"endo-f202fc95","f":"endo","u":40,"o":142,"lv":2,"q":"多発性内分泌腫瘍症（MEN（multiple endocrine neoplasia：多発性内分泌腫瘍症））について正しい組み合わせはどれか。","ch":["MEN2A（多発性内分泌腫瘍症2A 型） ― 下垂体腺腫・インスリノーマ・副甲状腺","MEN1（multiple endocrine neoplasia type 1：多発性内分泌腫瘍症1型） ― 副甲状腺・膵消化管神経内分泌腫瘍・下垂体","MEN1（multiple endocrine neoplasia type 1：多発性内分泌腫瘍症1型） ― 甲状腺髄様癌・褐色細胞腫・副甲状腺","MEN2B（多発性内分泌腫瘍症2B 型） ― 副甲状腺機能亢進症が必ず合併する"],"a":1,"cx":["下垂体・膵消化管の腫瘍は MEN1（multiple endocrine neoplasia type 1：多発性内分泌腫瘍症1型）。","","甲状腺髄様癌・褐色細胞腫は MEN2（RET（rearranged during transfection、がん遺伝子） 遺伝子）。","MEN2B は副甲状腺の病変はまれで、粘膜神経腫・Marfan 様体型を伴う。"],"core":"MEN1（MEN1 遺伝子、menin）＝3P：副甲状腺（Parathyroid、ほぼ全例）・膵消化管神経内分泌腫瘍（Pancreas：ガストリノーマなど）・下垂体（Pituitary）。MEN2（RET（rearranged during transfection、がん遺伝子） 遺伝子）＝甲状腺髄様癌・褐色細胞腫（＋2A は副甲状腺）。","e":"MEN2 の家系では、RET 変異の保因者に予防的な甲状腺全摘を考える（変異の型で時期が違う）。\n髄様癌の手術前には必ず褐色細胞腫を除く（あれば先に副腎を手術）。\nMEN1 の副甲状腺は多腺性なので、手術は亜全摘か全摘＋自家移植。\nガストリノーマは十二指腸に多く、小さく多発する。","tg":[],"fig":["hpaxis"],"mt":["thyroid","adrenal"]},{"id":"endo-ab0a0b2a","f":"endo","u":41,"o":143,"lv":3,"q":"42歳の女性。数か月前から、空腹時や朝方に冷汗・動悸・異常な言動があり、甘いものを食べると治る。糖尿病の薬は飲んでいない。絶食試験中に血糖 42 mg/dL のとき、インスリン 12 µU/mL、C ペプチド 2.1 ng/mL（いずれも抑えられていない）、スルホニル尿素薬の血中濃度は陰性。最も考えられる診断はどれか。","ch":["インスリノーマ","外因性インスリンの投与（作為的低血糖）","インスリン自己免疫症候群","副腎不全による低血糖"],"a":0,"cx":["","外からインスリンを注射すると、C ペプチドは抑えられて低くなる。","インスリン自己免疫症候群はインスリン抗体が陽性で、インスリン値が著しく高く（数百〜）、食後の低血糖が多い。","副腎不全ではインスリンは適切に抑えられる。"],"core":"Whipple の三徴（低血糖の症状・その時の低血糖・糖で改善）。低血糖時にインスリン・C ペプチドが抑えられていない＋SU（sulfonylurea：スルホニル尿素） 薬陰性＝インスリノーマ（膵の神経内分泌腫瘍）。","e":"インスリノーマ：多くは小さく良性で単発、10% 程度は MEN1（multiple endocrine neoplasia type 1：多発性内分泌腫瘍症1型）。局在は造影 CT（computed tomography：コンピュータ断層撮影）・MRI（magnetic resonance imaging：磁気共鳴画像）・超音波内視鏡、選択的動脈内カルシウム注入試験。手術（核出術）で治る。\n低血糖の区別：\n・外因性インスリン＝インスリン高値・C ペプチド低値\n・SU 薬・グリニド薬＝インスリン・C ペプチドとも高値、薬の検出\n・インスリン自己免疫症候群＝インスリン抗体、SH（スルフヒドリル基） 基をもつ薬（メチマゾール・α-リポ酸）\n・非膵島細胞腫瘍（IGF-II（insulin-like growth factor-II） 産生）＝インスリン・C ペプチドとも低値\n・副腎不全・下垂体機能低下・肝不全・腎不全・敗血症・アルコール","tg":["cs"],"mt":["dmdrugs"]},{"id":"endo-4d7d4b95","f":"endo","u":41,"o":144,"lv":2,"q":"男性の性腺機能低下症について正しいものはどれか。","ch":["Klinefelter 症候群は高ゴナドトロピン性で、精巣が小さく硬い","テストステロン補充は、前立腺癌があっても安全に使える","加齢による男性ホルモンの低下（LOH（late-onset hypogonadism：加齢男性性腺機能低下） 症候群）は治療の対象外","Kallmann 症候群は高ゴナドトロピン性で、嗅覚は正常である"],"a":0,"cx":["","前立腺癌・乳癌はテストステロン補充の禁忌。多血症にも注意。","LOH 症候群（加齢男性性腺機能低下症）は症状とテストステロンの低値で、補充療法を考える。","Kallmann 症候群は視床下部の GnRH（gonadotropin-releasing hormone） 不足による低ゴナドトロピン性で、嗅覚の低下・消失を伴う。"],"core":"原発性（精巣）＝LH（luteinizing hormone：黄体形成ホルモン）・FSH（follicle-stimulating hormone：卵胞刺激ホルモン） 高値（Klinefelter・精巣炎・化学療法）。続発性（視床下部・下垂体）＝LH・FSH 低〜正常（Kallmann・下垂体腫瘍・高プロラクチン血症・オピオイド・肥満）。","e":"Klinefelter 症候群：男性不妊の原因として多い、長身、乳癌・自己免疫疾患・静脈血栓の危険。\n女性化乳房の原因：薬（スピロノラクトン（アルダクトン A）・抗アンドロゲン薬・ジギタリス・シメチジン）、肝硬変、甲状腺機能亢進、精巣腫瘍（hCG）、腎不全、思春期・高齢。\n女性の無月経：妊娠を必ず除く。高プロラクチン血症、多嚢胞性卵巣症候群、視床下部性（やせ・ストレス・運動）、早発卵巣不全。","tg":[],"fig":["hpaxis"]},{"id":"meta-80f45df5","f":"meta","u":42,"o":145,"lv":1,"q":"インスリンの作用として正しいものはどれか。","ch":["肝臓での糖新生とケトン体の産生を抑える","筋肉でのブドウ糖の取り込みを減らす","細胞外から細胞内へのカリウムの取り込みを抑える","脂肪組織での脂肪分解を促す"],"a":0,"cx":["","インスリンは筋肉・脂肪で GLUT4（glucose transporter 4） を細胞膜に移し、ブドウ糖の取り込みを増やす。","インスリンは Na⁺/K⁺-ATPase を介してカリウムを細胞内へ取り込ませる（高 K の治療に使う理由）。","インスリンは脂肪の分解を抑え、合成を促す。不足すると脂肪分解→遊離脂肪酸→ケトン体。"],"core":"インスリン＝同化ホルモン：糖の取り込み（GLUT4（glucose transporter 4））・グリコーゲン合成・脂肪合成・たんぱく合成を促し、糖新生・脂肪分解・ケトン体産生を抑える。K を細胞内へ。","e":"インスリンに拮抗するホルモン：グルカゴン・コルチゾール・アドレナリン・GH（暁現象＝明け方の GH・コルチゾールで血糖が上がる）。\nC ペプチド：インスリンと同じ量だけ分泌され、注射のインスリンには含まれないので、自分の分泌能の指標になる。\nインスリン抵抗性の指標：HOMA-IR（空腹時インスリン×空腹時血糖÷405、2.5 以上で抵抗性）。\nインスリン分泌指数：OGTT（oral glucose tolerance test：経口ブドウ糖負荷試験） の 30分の値で評価（0.4 未満は分泌の低下）。","tg":[]},{"id":"meta-359f9329","f":"meta","u":42,"o":146,"lv":1,"q":"リポ蛋白とその主な役割の組み合わせで正しいものはどれか。","ch":["HDL（high-density lipoprotein：高比重リポ蛋白） ― 肝臓でつくった TG（triglyceride：トリグリセリド、中性脂肪） を末梢へ運ぶ","VLDL（very low-density lipoprotein：超低比重リポ蛋白） ― 食事の脂質を、腸から運ぶ","LDL（low-density lipoprotein：低比重リポ蛋白） ― 末梢のコレステロールを肝臓へ戻す","カイロミクロン ― 食事の TG（triglyceride：トリグリセリド、中性脂肪） を腸から運ぶ"],"a":3,"cx":["肝臓でつくった TG を運ぶのは VLDL（very low-density lipoprotein：超低比重リポ蛋白）。","腸から運ぶのはカイロミクロン。","末梢から肝臓へコレステロールを戻すのは HDL（high-density lipoprotein：高比重リポ蛋白）。",""],"core":"カイロミクロン（腸→食事由来 TG）、VLDL（肝→内因性 TG）→ IDL（intermediate-density lipoprotein：中間比重リポ蛋白） → LDL（コレステロールを末梢へ、LDL 受容体で取り込まれる）、HDL（末梢→肝へコレステロールを戻す）。","e":"リポ蛋白リパーゼ（LPL（lipoprotein lipase：リポ蛋白リパーゼ））：カイロミクロン・VLDL の TG を分解する。インスリンで活性化（コントロール不良の糖尿病で高 TG）。\nスタチン：HMG-CoA 還元酵素を阻害→肝細胞のコレステロールが減る→ LDL 受容体が増える→ 血中 LDL が下がる。\nPCSK9（proprotein convertase subtilisin/kexin type 9）：LDL 受容体の分解を促す。阻害すると LDL 受容体が増える。\nLp(a)：遺伝的に決まり、動脈硬化・大動脈弁狭窄症の危険因子。","tg":[],"mt":["lipid"]},{"id":"meta-3e8753ca","f":"meta","u":42,"o":147,"lv":1,"q":"カルシウムとリンの調節について正しいものはどれか。","ch":["活性型ビタミン D は、腸でのカルシウム吸収を減らす","カルシトニンは骨吸収を促して、血中カルシウムを上げる","FGF23（fibroblast growth factor 23：線維芽細胞増殖因子23） は、腎でのリンの再吸収を増やす","PTH（parathyroid hormone：副甲状腺ホルモン） は腎でリン排泄↑・活性型ビタミン D 産生↑"],"a":3,"cx":["活性型ビタミン D（1,25(OH)₂D）は腸のカルシウム・リンの吸収を増やす。","カルシトニンは破骨細胞を抑え、血中カルシウムを下げる（ヒトでの役割は小さい）。","FGF23 は骨から分泌され、腎でのリンの再吸収を減らし（排泄↑）、活性型ビタミン D の産生を抑える。",""],"core":"PTH＝骨吸収↑・腎で Ca 再吸収↑・リン排泄↑・1α-水酸化（活性型ビタミン D）↑ → 血中 Ca↑・P↓。ビタミン D は皮膚（紫外線）→肝（25 位）→腎（1α 位）で活性化。","e":"ビタミン D の評価：25(OH)D（体内の貯蔵）を測る。20 ng/mL 未満で不足。\n肉芽腫（サルコイドーシス・結核）やリンパ腫ではマクロファージが 1α-水酸化を行い、高カルシウム血症。\nマグネシウム不足は PTH の分泌と作用を落とす。\n骨代謝マーカー：形成＝骨型 ALP（alkaline phosphatase：アルカリホスファターゼ）・P1NP（I 型プロコラーゲン N 末端プロペプチド、骨形成マーカー）、吸収＝TRACP-5b（tartrate-resistant acid phosphatase 5b：骨吸収マーカー）・NTX（I 型コラーゲン架橋 N-テロペプチド、骨吸収マーカー）・CTX（I 型コラーゲン架橋 C-テロペプチド、骨吸収マーカー）。","tg":[]},{"id":"meta-75657df3","f":"meta","u":43,"o":148,"lv":1,"q":"糖尿病の診断について正しいものはどれか。","ch":["HbA1c（ヘモグロビン A1c、過去1〜2か月の平均血糖の指標） 6.5% 以上が2回続けば、血糖なしで診断できる","同じ採血で血糖と HbA1c（ヘモグロビン A1c、過去1〜2か月の平均血糖の指標） が糖尿病型なら1回で診断","75 g OGTT（oral glucose tolerance test：経口ブドウ糖負荷試験） の2時間値 140 mg/dL 以上で糖尿病と診断","随時血糖 180 mg/dL 以上は、糖尿病型である"],"a":1,"cx":["HbA1c だけを繰り返しても診断はできない。血糖値の糖尿病型が少なくとも1回は必要。","","2時間値 140〜199 mg/dL は境界型（耐糖能異常）。糖尿病型は 200 mg/dL 以上。","随時血糖の糖尿病型は 200 mg/dL 以上。"],"core":"糖尿病型：空腹時血糖 126 以上・75 g OGTT 2時間値 200 以上・随時血糖 200 以上（mg/dL）・HbA1c 6.5% 以上。血糖と HbA1c が両方糖尿病型なら1回で診断。血糖が糖尿病型で典型的症状か確実な網膜症があれば1回で診断。","e":"別の日に再検査して、再び糖尿病型なら診断（ただし少なくとも一方は血糖値）。\nHbA1c が実際の血糖より低く出る：溶血・出血・鉄剤やエリスロポエチン治療中・肝硬変・妊娠（赤血球の寿命が短い・若い赤血球が多い）。高く出る：鉄欠乏性貧血。→ グリコアルブミン（血糖の約2週間）・持続血糖測定で補う。\n1型糖尿病を疑う：やせ・急な発症・ケトーシス、膵島関連自己抗体（GAD（glutamic acid decarboxylase：グルタミン酸脱炭酸酵素） 抗体など）、C ペプチドが低い。緩徐進行1型（成人で GAD 抗体陽性、最初はインスリンなしでも保たれる）。","tg":[]},{"id":"meta-4c9f5380","f":"meta","u":43,"o":149,"lv":2,"q":"2型糖尿病の薬と特徴の組み合わせで正しいものはどれか。","ch":["SGLT2（sodium-glucose cotransporter 2：ナトリウム・グルコース共輸送体2） 阻害薬 ― 正常血糖ケトアシドーシス","スルホニル尿素薬 ― 単独では低血糖を起こさない","メトホルミン（メトグルコ） ― 低血糖を起こしやすく、体重が増える","DPP-4（dipeptidyl peptidase-4） 阻害薬 ― 尿路・性器感染症が増える"],"a":0,"cx":["","スルホニル尿素薬はインスリンを出させ、遷延する低血糖を起こしやすい（高齢者・腎機能低下で特に）。","メトホルミンは単独では低血糖を起こしにくく、体重は増えにくい。注意は乳酸アシドーシス（腎機能低下・脱水・造影剤）と消化器症状。","尿路・性器感染症は SGLT2（sodium-glucose cotransporter 2：ナトリウム・グルコース共輸送体2） 阻害薬の副作用。DPP-4 阻害薬は類天疱瘡・急性膵炎に注意。"],"core":"SGLT2 阻害薬：尿に糖を出す。心不全・CKD（chronic kidney disease：慢性腎臓病） の進行を抑える。注意＝脱水、正常血糖ケトアシドーシス（絶食・手術・インスリン減量時、シックデイは休薬）、尿路・性器感染症。","e":"薬の選び方（日本糖尿病学会のアルゴリズム）：肥満の有無で病態（インスリン抵抗性か分泌不全か）を考え、安全性（低血糖・腎機能・心不全）、併存症（心血管病・心不全・CKD には SGLT2 阻害薬・GLP-1（glucagon-like peptide-1） 受容体作動薬）、続けやすさ・費用で選ぶ。\nGLP-1 受容体作動薬（セマグルチド（オゼンピック・リベルサス、糖尿病、ウゴービ、肥満症）・デュラグルチドなど）、GIP（glucose-dependent insulinotropic polypeptide）/GLP-1 受容体作動薬（チルゼパチド（マンジャロ、糖尿病、ゼップバウンド、肥満症））：体重減少、吐き気・胃の排出遅延（手術・内視鏡前に注意）。\nチアゾリジン薬（ピオグリタゾン（アクトス））：浮腫・心不全（禁忌）、骨折、体重増加。\nインスリンが必要：1型、DKA（diabetic ketoacidosis：糖尿病ケトアシドーシス）・HHS（hyperosmolar hyperglycemic state：高浸透圧高血糖状態）、妊娠、重い感染症・手術、著しい高血糖。","tg":["ae"],"fig":["acidbase"],"mt":["dmdrugs","hfdrugs"]},{"id":"meta-c8cc4d71","f":"meta","u":43,"o":150,"lv":2,"q":"高齢者糖尿病の血糖コントロール目標（日本糖尿病学会・日本老年医学会）について正しいものはどれか。","ch":["高齢者でも全員 HbA1c（ヘモグロビン A1c、過去1〜2か月の平均血糖の指標） 6.0% 未満を目指す","低血糖を起こしにくい薬だけを使う人には目標値を決めない","認知機能や ADL（activities of daily living：日常生活動作） は目標の決め方に関係しない","重症低血糖が心配な薬を使う人は、目標に下限も設ける"],"a":3,"cx":["高齢者で厳しすぎる管理は低血糖・転倒・認知症の悪化を招く。","低血糖を起こしにくい薬だけでも目標（7.0% 未満など）は決める。","認知機能・ADL（カテゴリー I〜III）と、低血糖を起こしやすい薬の有無で目標を決める。",""],"core":"高齢者の HbA1c 目標：カテゴリー（認知機能と ADL）と、インスリン・SU（sulfonylurea：スルホニル尿素） 薬・グリニド薬を使っているかで決める。これらの薬を使う人には下限（例：7.0% 未満で下限 6.5%）を設ける。","e":"高齢者の低血糖は、典型的な交感神経症状（冷汗・動悸）が出にくく、ふらつき・せん妄・転倒として現れる。\nシックデイ（発熱・下痢・嘔吐・食事がとれない）：水分を十分に、SGLT2（sodium-glucose cotransporter 2：ナトリウム・グルコース共輸送体2） 阻害薬・メトホルミン・SU 薬は休む、インスリンは自己判断でやめず主治医に相談。\n一般成人の目標：合併症予防に HbA1c 7.0% 未満、正常化を目指すなら 6.0% 未満、治療強化が難しければ 8.0% 未満。","tg":[]},{"id":"meta-5503d435","f":"meta","u":43,"o":151,"lv":3,"q":"19歳の男性。1型糖尿病でインスリン治療中。3日前から胃腸炎で食事がとれず、インスリンを自己判断で中止していた。嘔吐と腹痛、深く速い呼吸で搬送された。血糖 486 mg/dL、動脈血 pH 7.08、HCO₃⁻ 7 mEq/L、血清 K 5.6 mEq/L、尿ケトン体 3+。最初に行う治療として最も適切なのはどれか。","ch":["まず炭酸水素ナトリウムを大量に静注し、pH を正常にする","生理食塩水の輸液、K を確かめてインスリン持続静注","K が高いので、カリウムは入院中ずっと補充しない","K が高いので、インスリンだけを大量に皮下注する"],"a":1,"cx":["重炭酸は pH 6.9 未満など限られた場合だけ。インスリンと輸液でケトン体の産生が止まればアシドーシスは戻る。","","体全体のカリウムは不足している。インスリンで K は細胞内へ移り急に下がるので、5.0〜5.5 mEq/L 未満になったら補充を始める。","脱水が強く、まず輸液が最優先。インスリンは静注で持続投与し、皮下注は吸収が不安定。"],"core":"DKA（diabetic ketoacidosis：糖尿病ケトアシドーシス） の治療＝①輸液（生理食塩水 1時間に 1 L 程度から）②インスリン持続静注（0.1 単位/kg/時 程度）③カリウムの補充（K が 3.3 未満ならインスリンより先に補う）④誘因の治療。血糖 250〜300 mg/dL になったらブドウ糖を加えて続ける。","e":"DKA の機序：インスリンの欠乏＋拮抗ホルモン → 脂肪分解 → ケトン体（アニオンギャップ開大性の代謝性アシドーシス）。Kussmaul 呼吸、アセトン臭、腹痛。\n高浸透圧高血糖状態（HHS（hyperosmolar hyperglycemic state：高浸透圧高血糖状態））：高齢の2型、著しい高血糖（600 mg/dL 以上）と高浸透圧、ケトアシドーシスは軽い。脱水がより強く、意識障害・血栓症。輸液が治療の中心。\n治療中の注意：低カリウム、低血糖、脳浮腫（とくに小児、血糖・浸透圧を急に下げすぎない）、低リン。\nインスリンの静注は、アシドーシスが治り（アニオンギャップが閉じ）食事ができるようになったら、皮下注を始めて1〜2時間重ねてから止める。","tg":["cs"],"mt":["potassium"]},{"id":"meta-93d5e1ed","f":"meta","u":43,"o":152,"lv":2,"q":"糖尿病網膜症・腎症・神経障害について正しいものはどれか。","ch":["網膜症は眼の症状が出てから眼科を受診すれば十分","神経障害は運動神経から始まり、手から症状が出る","腎症の早期発見には、血清クレアチニンが最も感度が高い","急に血糖を下げると、網膜症が一時的に悪化しうる"],"a":3,"cx":["網膜症はかなり進むまで症状がない。診断時から定期的な眼底検査が必要。","糖尿病の多発神経障害は、感覚神経優位で足先から始まる（手袋・靴下型）。","早期の腎症は尿中アルブミン（尿アルブミン/クレアチニン比 30 mg/gCr 以上）で見つける。クレアチニンの上昇は進んでから。",""],"core":"血糖を急に・大きく下げると、網膜症の悪化（early worsening）や治療後有痛性神経障害が起こりうる。網膜症が進んでいる人はゆっくり下げ、眼科と連携する。","e":"網膜症：単純→増殖前（軟性白斑・静脈の数珠状変化）→増殖（新生血管→硝子体出血・網膜剥離）。黄斑浮腫は視力低下の原因で、抗 VEGF（vascular endothelial growth factor：血管内皮増殖因子） 薬の硝子体注射。\n腎症の病期：尿アルブミン正常（1期）→微量アルブミン尿（2期）→顕性アルブミン尿（3期）→ GFR（glomerular filtration rate：糸球体濾過量） 30 未満（4期）→透析（5期）。ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬）/ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬・SGLT2（sodium-glucose cotransporter 2：ナトリウム・グルコース共輸送体2） 阻害薬・フィネレノン（非ステロイド型 MR（mineralocorticoid receptor：ミネラルコルチコイド受容体） 拮抗薬）で進行を抑える。\n自律神経障害：起立性低血圧、胃不全麻痺、下痢・便秘、勃起障害、無自覚性低血糖、無痛性心筋虚血。\n足病変：足の観察・靴、モノフィラメントでの感覚検査。","tg":[]},{"id":"meta-0dce3e87","f":"meta","u":43,"o":153,"lv":3,"q":"52歳の女性。2型糖尿病で、メトホルミン（メトグルコ）・DPP-4（dipeptidyl peptidase-4） 阻害薬・SGLT2（sodium-glucose cotransporter 2：ナトリウム・グルコース共輸送体2） 阻害薬（エンパグリフロジン（ジャディアンス））を飲んでいる。大腸内視鏡の前日から絶食し、当日は吐き気と腹痛、深い呼吸がある。血糖 168 mg/dL、pH 7.18、HCO₃⁻ 9 mEq/L、血中 β-ヒドロキシ酪酸 6.2 mmol/L。最も考えられる病態はどれか。","ch":["高浸透圧高血糖状態（HHS（hyperosmolar hyperglycemic state：高浸透圧高血糖状態））","低血糖による交感神経症状","メトホルミンによる乳酸アシドーシス","SGLT2 阻害薬による正常血糖 DKA（diabetic ketoacidosis：糖尿病ケトアシドーシス）"],"a":3,"cx":["HHS は著しい高血糖（600 mg/dL 以上）で、ケトアシドーシスは軽い。","血糖は低くない。","乳酸アシドーシスでは乳酸が上がり、ケトン体の著増はない。",""],"core":"SGLT2 阻害薬は尿に糖を出すため、絶食・手術・脱水・インスリン不足のときに血糖があまり高くないまま DKA になる（正常血糖 DKA）。検査・手術の前は3日前（エルツグリフロジンは4日前）から休薬し、シックデイも休む。","e":"治療は DKA と同じ（輸液・インスリン・カリウム）だが、血糖が高くないので最初からブドウ糖を一緒に入れる。\n危険因子：インスリン分泌の低下（やせ型・長い罹病・1型の併用）、低炭水化物ダイエット、アルコール、急性疾患。\nメトホルミンも検査（ヨード造影剤）・手術・脱水のときに休む（乳酸アシドーシス予防）。","tg":["ae","cs"],"mt":["dmdrugs"]},{"id":"meta-e0d968eb","f":"meta","u":43,"o":154,"lv":3,"q":"78歳の男性。2型糖尿病でグリメピリド（アマリール） 4 mg/日を飲んでいる。最近食欲が落ち、eGFR（estimated glomerular filtration rate：推算糸球体濾過量） 28 mL/分/1.73m²。今朝、意識がもうろうとして家族に発見された。血糖 32 mg/dL。ブドウ糖の静注でいったん意識は戻った。正しい対応はどれか。","ch":["入院して24時間以上ブドウ糖を続け、血糖を頻回に測る","グルカゴンだけを自宅で使わせ、受診は不要とする","グリメピリドを倍量に増やす","意識が戻ったのですぐ帰宅させ、明日もグリメピリドを続ける"],"a":0,"cx":["","グルカゴンは一時的。SU（sulfonylurea：スルホニル尿素） 薬の低血糖は持続するので入院での観察が必要。","増量は全く逆。SU（sulfonylurea：スルホニル尿素） 薬は中止か大幅に減らす。","SU（sulfonylurea：スルホニル尿素） 薬（とくに腎機能低下・高齢）の低血糖は長く続き、数時間後に再び下がる。帰宅させるのは危険。"],"core":"スルホニル尿素薬による低血糖は遷延・再発する（腎機能低下・高齢・食事量の低下で起こりやすい）。入院してブドウ糖の持続投与と頻回の血糖測定。再発予防に SU（sulfonylurea：スルホニル尿素） 薬を中止・変更し、低血糖を起こしにくい薬を選ぶ。","e":"高齢者の低血糖：症状が非典型（ふらつき・せん妄・片麻痺のような症状）、転倒・骨折・心血管イベント・認知症の悪化につながる。\n難治の SU 薬の低血糖にはオクトレオチド（インスリン分泌を抑える）が使われることがある。\n腎機能が落ちた人の血糖の薬：DPP-4（dipeptidyl peptidase-4） 阻害薬（リナグリプチン（トラゼンタ）は調整不要）、インスリン（減量しながら）、GLP-1（glucagon-like peptide-1） 受容体作動薬。","tg":["cs"],"mt":["dmdrugs"]},{"id":"meta-198967c7","f":"meta","u":43,"o":155,"lv":2,"q":"妊娠と糖代謝について正しいものはどれか。","ch":["妊娠糖尿病は食事療法とインスリン、産後も糖尿病の危険","妊娠中の HbA1c（ヘモグロビン A1c、過去1〜2か月の平均血糖の指標） の目標は、8.0% 未満で十分である","妊娠糖尿病は、出産すれば将来の糖尿病の危険はなくなる","妊娠中の高血糖には、メトホルミン（メトグルコ）・SU（sulfonylurea：スルホニル尿素） 薬が国内の第一選択"],"a":0,"cx":["","妊娠前・妊娠中はできるだけ正常に近づける（妊娠前の HbA1c 6.5% 未満が目安）。高血糖は奇形・巨大児の原因。","妊娠糖尿病の既往は将来の2型糖尿病の大きな危険因子。産後6〜12週に OGTT（oral glucose tolerance test：経口ブドウ糖負荷試験）、その後も定期的に検査する。","国内では妊娠中の薬物療法はインスリンが基本。"],"core":"妊娠糖尿病＝妊娠中に初めて見つかった、糖尿病に至らない糖代謝異常。75 g OGTT（oral glucose tolerance test：経口ブドウ糖負荷試験） で空腹時 92・1時間 180・2時間 153 mg/dL のどれか1つ以上。食事療法（分割食）→インスリン。","e":"妊娠中の明らかな糖尿病（overt diabetes）：非妊時の糖尿病の基準を満たすもの。\n糖尿病のある女性は計画妊娠：妊娠前に血糖・網膜症・腎症を整える。妊娠初期の高血糖は先天奇形を増やす。\n母体の合併症：妊娠高血圧症候群・羊水過多・網膜症の悪化。胎児：巨大児・新生児低血糖・呼吸窮迫。","tg":[]},{"id":"meta-6e7799fd","f":"meta","u":43,"o":156,"lv":2,"q":"糖尿病足病変について正しいものはどれか。","ch":["足の潰瘍は、血流が保たれていれば骨髄炎にはならない","靴ずれは自然に治るので、受診は不要である","神経障害・血流障害・感染が重なり、足の観察で予防","痛みがないので、重症ではないと判断してよい"],"a":2,"cx":["深い潰瘍・骨が見える（触れる：probe-to-bone）潰瘍では骨髄炎を疑い、MRI（magnetic resonance imaging：磁気共鳴画像） で調べる。","小さな傷・靴ずれから潰瘍・壊疽・切断に進むことがある。早く受診する。","","神経障害で痛みを感じないため、気づかないうちに重症化する。"],"core":"糖尿病足病変＝神経障害（痛みを感じない・変形）＋末梢動脈疾患（血流障害）＋感染。予防：毎日の観察、適切な爪切り、合う靴、胼胝・白癬の治療、禁煙、血糖の管理。","e":"評価：モノフィラメント（感覚）、アキレス腱反射・振動覚、足背動脈の触知、ABI（石灰化で偽高値なら TBI（toe-brachial index：足趾上腕血圧比）・皮膚灌流圧）。\nシャルコー足：神経障害による骨・関節の破壊、急性期は赤く腫れて蜂窩織炎と間違えやすい。免荷（ギプス）。\n感染した足病変：深い組織の培養、抗菌薬、デブリドマン、血行再建。","tg":[]},{"id":"meta-1f9b2a19","f":"meta","u":43,"o":157,"lv":3,"q":"30歳の女性。1型糖尿病で、超速効型インスリン（毎食前）と持効型インスリン（就寝前）を使っている。最近、早朝の空腹時血糖が 60 mg/dL 前後と低く、夜中に寝汗をかいている。夕食前・就寝前の血糖は 150 mg/dL 前後。まず考える調整として適切なのはどれか。","ch":["朝食前の超速効型インスリンを増やす","夕食をとらないようにする","就寝前の持効型インスリンを増やす","就寝前の持効型インスリンを減らす"],"a":3,"cx":["朝食前の超速効型は朝食後〜昼の血糖に効く。早朝の低血糖の対策ではない。","食事を抜くと低血糖がさらに起こりやすくなる。","早朝の低血糖（夜間の低血糖）なので、持効型を増やすと悪化する。",""],"core":"基礎インスリン（持効型）は空腹時（早朝）の血糖を決める。夜間の低血糖（寝汗・悪夢・朝の頭痛）で早朝が低ければ持効型を減らす。持続血糖測定（CGM）で夜間の動きを確かめる。","e":"早朝高血糖の区別：\n・暁現象：明け方の GH（growth hormone：成長ホルモン）・コルチゾールで血糖が上がる（夜間は低くない）→ 基礎インスリンの調整・ポンプ\n・Somogyi 効果：夜間の低血糖の後の反跳性の高血糖 → 基礎インスリンを減らす（CGM の普及で頻度は低いとされる）\nカーボカウント：食事の炭水化物量に合わせて追加インスリンを調整する。\nインスリンポンプ（CSII）・CGM を組み合わせたシステム（SAP・ハイブリッドクローズドループ）。\n1型の低血糖の対策：ブドウ糖を携帯、重症低血糖にはグルカゴン（点鼻製剤がある）。","tg":["cs"]},{"id":"meta-a80ee5c2","f":"meta","u":44,"o":158,"lv":2,"q":"動脈硬化性疾患予防ガイドライン2022で、LDL（low-density lipoprotein：低比重リポ蛋白） コレステロールの管理目標が 70 mg/dL 未満とされるのはどれか。","ch":["喫煙だけがある45歳男性の一次予防","急性冠症候群の既往がある人の二次予防","危険因子のない40歳の一次予防（低リスク）","高血圧だけがある50歳女性の一次予防"],"a":1,"cx":["一次予防の管理目標は 160・140・120 mg/dL のいずれか（リスク区分で）。","","低リスクの一次予防は 160 mg/dL 未満。","中リスクは 140 mg/dL 未満（点数・吹田スコアで判断）。"],"core":"LDL-C（LDL コレステロール） 目標：一次予防＝低リスク 160・中リスク 140・高リスク 120（糖尿病の一部は 100）。二次予防（冠動脈疾患の既往）＝100 未満、ACS（acute coronary syndrome：急性冠症候群）・家族性高コレステロール血症・糖尿病・アテローム血栓性脳梗塞の合併などは 70 未満（mg/dL）。","e":"LDL-C の計算（Friedewald 式）：総コレステロール－HDL（high-density lipoprotein：高比重リポ蛋白）－TG（triglyceride：トリグリセリド、中性脂肪）/5（TG 400 mg/dL 以上や食後は使えず、直接法か non-HDL-C（HDL コレステロール） で）。\nnon-HDL-C の目標は LDL-C の目標＋30 mg/dL。\n薬：スタチン（第一選択）→エゼチミブ（ゼチーア）→PCSK9（proprotein convertase subtilisin/kexin type 9） 阻害薬（エボロクマブ（レパーサ））・PCSK9 の合成を抑える siRNA（インクリシラン（レクビオ））。\nスタチンの副作用：筋肉痛・横紋筋融解症（フィブラートとの併用・腎機能低下・甲状腺機能低下で増える）、肝障害、糖尿病の新規発症がわずかに増える。","tg":["gl"],"fig":["willis","coronary"],"mt":["lipid","stroke"]},{"id":"meta-912e00f4","f":"meta","u":44,"o":159,"lv":2,"q":"家族性高コレステロール血症（ヘテロ接合体）を最も疑う所見はどれか。","ch":["トリグリセリドが 1,000 mg/dL 以上で、急性膵炎を繰り返す","LDL-C（LDL コレステロール） が 90 mg/dL で、眼瞼黄色腫がある","LDL-C（LDL コレステロール） 180 mg/dL 以上で、アキレス腱の肥厚がある","HDL（high-density lipoprotein：高比重リポ蛋白） コレステロールが 100 mg/dL 以上である"],"a":2,"cx":["著しい高トリグリセリド血症は、リポタンパクリパーゼの異常などの別の病気。","LDL-C が正常なら家族性高コレステロール血症は考えにくい（眼瞼黄色腫は脂質正常の人にも出る）。","","HDL が高いのは CETP（cholesteryl ester transfer protein） 欠損などで、家族性高コレステロール血症ではない。"],"core":"成人の家族性高コレステロール血症（ヘテロ）の診断：①未治療 LDL-C 180 mg/dL 以上 ②腱黄色腫（アキレス腱の肥厚 X 線で男性 8.0 mm・女性 7.5 mm 以上）か皮膚結節性黄色腫 ③家族性高コレステロール血症か若い冠動脈疾患の家族歴（二親等以内）。2つ以上で診断。","e":"原因：LDL（low-density lipoprotein：低比重リポ蛋白） 受容体・アポ B・PCSK9（機能獲得型）の遺伝子変異。常染色体顕性。日本人の約300人に1人。\n若いうちから冠動脈疾患を起こす。LDL-C 100 mg/dL 未満（二次予防は 70 未満）を目標に、スタチンを最大量まで→エゼチミブ（ゼチーア）→PCSK9 阻害薬。\n家族のスクリーニング（子どもも 10歳頃から治療を考える）。\nホモ接合体は LDL-C 500 mg/dL 以上が多く、LDL アフェレシス・ロミタピド。","tg":[],"fig":["coronary"],"mt":["lipid"]},{"id":"meta-333f8469","f":"meta","u":45,"o":160,"lv":2,"q":"痛風発作と高尿酸血症の治療について正しいものはどれか。","ch":["無症候性の高尿酸血症は値にかかわらず全員を薬で治療する","発作の最中に尿酸降下薬を新しく始めない","尿酸降下薬は血清尿酸値を 8.0 mg/dL 程度にすれば十分である","発作の痛みはアスピリンで治療するのがよい"],"a":1,"cx":["無症候性は 8.0 mg/dL 以上で合併症（腎障害・尿路結石・高血圧・糖尿病など）があれば考え、9.0 以上で薬を考える。","","痛風の治療目標は 6.0 mg/dL 以下。","アスピリンは量によって尿酸の値を動かし、発作を長引かせうる。NSAIDs（高用量を短期間）・コルヒチン・ステロイドを使う。"],"core":"痛風発作中は尿酸降下薬を新しく始めない（値の変動で発作が長引く）。すでに飲んでいれば続ける。発作が治まって2週間ほどしてから始め、目標は 6.0 mg/dL 以下。","e":"発作の治療：NSAIDs（パルス療法）・コルヒチン（前兆期に1錠、発作中は少量）・ステロイド（腎機能が悪い人にも使いやすい）。\n尿酸降下薬：産生抑制（アロプリノール（ザイロリック）：腎機能で減量、HLA-B（ヒト白血球抗原 B）*58:01 で重症薬疹／フェブキソスタット（フェブリク）・トピロキソスタット）、排泄促進（ベンズブロマロン（ユリノーム）：劇症肝炎に注意、ドチヌラド（ユリス））。\n始めたら少量から増やし、最初の数か月は発作予防に少量のコルヒチンを使うこともある。\n関節液の偏光顕微鏡：痛風は負の複屈折性の針状結晶（尿酸ナトリウム）、偽痛風は正の複屈折性の菱形の結晶（ピロリン酸カルシウム）。\n二次性の高尿酸血症：利尿薬・少量アスピリン・ピラジナミド・腫瘍崩壊症候群・腎不全。","tg":[]},{"id":"meta-b016b476","f":"meta","u":46,"o":161,"lv":2,"q":"肥満症の治療薬として国内で承認されている GLP-1（glucagon-like peptide-1） 受容体作動薬について正しいものはどれか。","ch":["週1回、自宅で内服する飲み薬である","健康障害と BMI（body mass index：体格指数） の条件を満たす肥満症で、生活療法に加えて使う","BMI（body mass index：体格指数） 25 以上なら、健康障害がなくても誰でも使える","効果が出たらすぐやめても、体重は戻らない"],"a":1,"cx":["ウゴービは週1回の皮下注射。","","肥満症（BMI 25 以上で健康障害がある）の中でも、BMI 27 以上で2つ以上の健康障害、または BMI 35 以上などの条件がある。","中止すると体重は戻りやすい。生活習慣の改善と組み合わせる。"],"core":"肥満と肥満症：BMI 25 以上が肥満。肥満に、減量が必要な健康障害（糖尿病・脂質異常症・高血圧・高尿酸血症・脂肪肝・睡眠時無呼吸・運動器疾患など11）があるか内臓脂肪型なら肥満症。BMI 35 以上は高度肥満。","e":"承認の条件（ウゴービ）：高血圧・脂質異常症・2型糖尿病のいずれかがあり、食事・運動療法で効果が不十分で、BMI 27 以上で2つ以上の健康障害、または BMI 35 以上。専門の施設・医師に限られる。\nチルゼパチド（ゼップバウンド）も肥満症に承認されている（2024年）。\n副作用：吐き気・便秘・下痢、胆石、膵炎、筋肉量の減少。\n外科治療：高度肥満で内科治療が効かないときの減量・代謝改善手術（スリーブ状胃切除など）。","tg":["ae"]},{"id":"meta-c62520e2","f":"meta","u":46,"o":162,"lv":2,"q":"骨粗鬆症の薬と注意すべき副作用の組み合わせで正しいものはどれか。","ch":["ロモソズマブ（イベニティ） ― 心血管疾患の既往があっても最も安全である","ビスホスホネート ― 高カルシウム血症を起こしやすい","テリパラチド（フォルテオ、テリボン） ― 生涯にわたって続けて使える","デノスマブ（プラリア、骨粗鬆症） ― 中止すると骨折（多発椎体骨折）が増える"],"a":3,"cx":["ロモソズマブ（抗スクレロスチン抗体）は心筋梗塞・脳卒中の報告があり、1年以内の既往がある人には使わない。","ビスホスホネートは低カルシウム血症（とくにビタミン D 不足・腎機能低下）、顎骨壊死、非定型大腿骨骨折、上部消化管障害。","テリパラチドの使用期間は一生のうち24か月（製剤による）まで。",""],"core":"デノスマブ（抗 RANKL（receptor activator of NF-κB ligand） 抗体）は6か月ごとの皮下注。中止すると骨吸収が急に戻り多発椎体骨折が起こるので、やめるならビスホスホネートなどに切り替える。低カルシウム血症にも注意。","e":"骨粗鬆症の診断：脆弱性骨折（椎体・大腿骨近位部）があれば診断。ほかの脆弱性骨折＋骨密度が若年成人平均（YAM（young adult mean：若年成人平均値））の80%未満、骨折なしで YAM 70% 以下（−2.5 SD 以下）。\n薬の選び方：骨折の危険が非常に高い（多発骨折・骨密度が非常に低い）→骨をつくる薬（テリパラチド・アバロパラチド・ロモソズマブ）から始め、骨吸収抑制薬へ。\n二次性骨粗鬆症を除く：ステロイド、甲状腺・副甲状腺機能亢進、性腺機能低下、糖尿病、CKD（chronic kidney disease：慢性腎臓病）、関節リウマチ、COPD（chronic obstructive pulmonary disease：慢性閉塞性肺疾患）。\nステロイド性骨粗鬆症：プレドニゾロン（プレドニン）換算 5 mg/日以上を3か月以上なら予防の対象を考える。","tg":["ae"]},{"id":"meta-13918130","f":"meta","u":47,"o":163,"lv":3,"q":"52歳の男性。アルコール依存症で、この2週間ほとんど食事をとっていない。ふらついて歩けず、つじつまの合わないことを言う。眼振と外眼筋麻痺がある。救急外来でまず行うべき治療はどれか。","ch":["ブドウ糖の前にビタミン B1 を静注する","ベンゾジアゼピン系薬で鎮静してから考える","まず 50% ブドウ糖液だけを、急いで静注する","ビタミン B12 の筋注だけを行う"],"a":0,"cx":["","離脱症状があれば鎮静も要るが、まず Wernicke 脳症の治療（B1）が最優先。","B1 が不足したままブドウ糖を入れると、糖の代謝で B1 が使い果たされ脳症が悪化しうる。B1 を先に（同時に）。","Wernicke 脳症の原因は B1 不足。B12 では治らない。"],"core":"Wernicke 脳症の三徴＝意識障害（せん妄）・眼球運動障害（眼振・外転神経麻痺）・失調性歩行。疑ったらすぐビタミン B1 を十分量静注。放置すると Korsakoff 症候群（作話・健忘）が残る。","e":"ビタミン B1 不足の原因：アルコール・低栄養・妊娠悪阻・胃の手術後・長期の B1 なし高カロリー輸液・利尿薬。\n脚気（かっけ）：末梢神経障害（乾性）、高拍出性心不全・浮腫（湿性）、乳酸アシドーシス（急性の衝心脚気）。\nほかのビタミン：\n・B12：巨赤芽球性貧血・亜急性連合性脊髄変性症（胃切除・萎縮性胃炎・メトホルミン長期）\n・葉酸：巨赤芽球性貧血、妊娠初期の神経管閉鎖障害\n・ナイアシン：ペラグラ（皮膚炎・下痢・認知症）\n・C：壊血病（歯肉出血・毛包周囲の出血）\n・D：くる病・骨軟化症\n・K：出血（PT（prothrombin time：プロトロンビン時間） 延長）\nリフィーディング症候群：低栄養の人に急に栄養を入れると、低リン・低カリウム・低マグネシウム血症、心不全。少量から始める。","tg":["cs"],"mt":["emergency_dx"]},{"id":"meta-c4ea7f71","f":"meta","u":47,"o":164,"lv":3,"q":"24歳の男性。子どもの頃から手足の焼けるような痛みがあり、汗をかきにくい。腹部に小さな赤紫色の皮疹（被角血管腫）が多数ある。蛋白尿があり、心エコーで左室肥大。母方の叔父が若くして透析を受けている。最も考えられる診断と治療の組み合わせはどれか。","ch":["Fabry 病 ― 酵素補充療法","Alport 症候群 ― 酵素補充療法","糖尿病性ニューロパチー ― 血糖の管理だけ","家族性地中海熱 ― コルヒチンの内服"],"a":0,"cx":["","Alport 症候群は IV 型コラーゲンの異常（血尿・難聴・眼症状）で、酵素補充療法はない。","小児期からの四肢末端痛・低汗症・被角血管腫・家族歴は糖尿病では説明できない。","家族性地中海熱は周期的な発熱と漿膜炎で、被角血管腫や左室肥大は起こさない。"],"core":"Fabry 病＝X 連鎖性の α-ガラクトシダーゼ A 欠損でグロボトリアオシルセラミド（Gb3）がたまる。四肢末端痛・低汗症・被角血管腫・角膜混濁・蛋白尿〜腎不全・左室肥大・脳梗塞。酵素補充療法（アガルシダーゼ）か、一部の変異にシャペロン療法（ミガーラスタット）。","e":"女性（ヘテロ）も症状が出ることがある。\n左室肥大（肥大型心筋症の鑑別）・原因不明の蛋白尿・若年の脳梗塞で疑う。\n診断：男性は酵素活性、女性は遺伝学的検査、尿沈渣のマルベリー小体。","tg":["cs"],"fig":["willis"],"mt":["stroke"]},{"id":"meta-5287681b","f":"meta","u":48,"o":165,"lv":3,"q":"42歳の男性。急な上腹部痛で受診。飲酒歴はほとんどない。採血すると血清が白く濁っており、トリグリセリド 2,850 mg/dL、リパーゼ高値。CT（computed tomography：コンピュータ断層撮影） で膵臓の腫大と周囲の脂肪織の濃度上昇がある。正しいものはどれか。","ch":["高 TG（triglyceride：トリグリセリド、中性脂肪） 血症の急性膵炎には、スタチン単剤が第一選択","高 TG（triglyceride：トリグリセリド、中性脂肪） 血症による膵炎で、TG を下げ再発を防ぐ","TG（triglyceride：トリグリセリド、中性脂肪） が高いと、アミラーゼ・リパーゼが必ず著しく上がる","脂質は膵炎と関係しないので、膵炎だけを治療すればよい"],"a":1,"cx":["TG を下げる主な薬はフィブラート（ペマフィブラート（パルモディア））・ω-3 脂肪酸。スタチンは LDL（low-density lipoprotein：低比重リポ蛋白） を下げる薬。","","著しい高 TG ではアミラーゼの測定が干渉されて低く出ることがある。","TG（triglyceride：トリグリセリド、中性脂肪） 1,000 mg/dL 以上は急性膵炎の原因になる。下げないと再発する。"],"core":"高 TG 血症（1,000 mg/dL 以上、とくに 2,000 以上）は急性膵炎の原因。急性期は絶食・輸液（インスリンの持続静注で TG が下がる、重症では血漿交換）、その後は脂肪制限・禁酒・フィブラート・血糖の管理。","e":"二次性の高 TG 血症の原因：コントロール不良の糖尿病、飲酒、肥満、甲状腺機能低下、ネフローゼ、妊娠、薬（エストロゲン・レチノイド・ステロイド・抗精神病薬・プロテアーゼ阻害薬）。\n家族性：リポ蛋白リパーゼ欠損症（I 型、小児期から）、家族性 III 型高脂血症（アポ E2/E2、手掌線状黄色腫）。\nTG が高いと LDL-C（LDL コレステロール） の計算（Friedewald 式）は使えない。","tg":["cs"]},{"id":"meta-9ab1e3a1","f":"meta","u":48,"o":166,"lv":2,"q":"骨軟化症について正しいものはどれか。","ch":["治療は、ビスホスホネートが第一選択である","原因はエストロゲンの不足だけである","石灰化の障害で、ALP（alkaline phosphatase：アルカリホスファターゼ） 高値・低リン・偽骨折を示す","骨の量が減るだけで、ALP（alkaline phosphatase：アルカリホスファターゼ）・リン・カルシウムはすべて正常"],"a":2,"cx":["ビスホスホネートは石灰化を悪化させうる。原因に応じてビタミン D・リンを補う。","原因はビタミン D 不足（日光不足・吸収不良・腎/肝障害）、低リン血症（FGF23（fibroblast growth factor 23：線維芽細胞増殖因子23） の過剰・Fanconi 症候群）など。","","骨粗鬆症は検査値が正常。骨軟化症は ALP 高値・低リン・低カルシウムなどの異常を伴う。"],"core":"骨軟化症（小児はくる病）＝石灰化が不十分な類骨が増える。骨の痛み・近位筋の筋力低下、ALP 高値、低リン・（低カルシウム）、偽骨折。ビタミン D 欠乏か低リン血症が原因。","e":"FGF23（fibroblast growth factor 23：線維芽細胞増殖因子23） 関連低リン血症：腫瘍性骨軟化症（小さな間葉系腫瘍が FGF23 を出す、切除で治る）、X 連鎖性低リン血症性くる病（ブロスマブ（クリースビータ）：抗 FGF23 抗体）、含糖酸化鉄の静注（FGF23 を上げて低リン）。\n骨粗鬆症の薬を始める前にビタミン D とカルシウムを確かめる（とくにデノスマブ（プラリア、骨粗鬆症）・ゾレドロン酸で低カルシウム血症）。","tg":[]},{"id":"kid-0a271c36","f":"kid","u":49,"o":167,"lv":1,"q":"利尿薬と作用する部位・輸送体の組み合わせで正しいものはどれか。","ch":["ループ利尿薬 ― ヘンレ上行脚の NKCC2（Na⁺-K⁺-2Cl⁻ cotransporter 2）","スピロノラクトン（アルダクトン A） ― 遠位尿細管の NaCl 共輸送体","サイアザイド系 ― 近位尿細管の炭酸脱水酵素","アセタゾラミド（ダイアモックス） ― 集合管のミネラルコルチコイド受容体"],"a":0,"cx":["","スピロノラクトンは集合管のミネラルコルチコイド受容体の拮抗薬。","サイアザイドは遠位尿細管の Na⁺-Cl⁻ 共輸送体（NCC（Na⁺-Cl⁻ cotransporter））。","アセタゾラミドは近位尿細管の炭酸脱水酵素の阻害薬。"],"core":"近位尿細管＝炭酸脱水酵素（アセタゾラミド）・SGLT2（SGLT2 阻害薬）。ヘンレ上行脚＝NKCC2（ループ利尿薬）。遠位尿細管＝NCC（サイアザイド）。集合管＝ENaC（トリアムテレン（トリテレン）・アミロライド）・MR（スピロノラクトン・エプレレノン・エサキセレノン・フィネレノン）・V2 受容体（トルバプタン（サムスカ））。","e":"副作用の違い：\n・ループ：低 K・低 Mg・代謝性アルカローシス・高尿酸・聴力障害（大量静注）、尿中 Ca↑\n・サイアザイド：低 Na（高齢女性）・低 K・高尿酸・高血糖、尿中 Ca↓（骨には良い・結石の予防）\n・MR 拮抗薬：高 K・女性化乳房（スピロノラクトン）\n・アセタゾラミド：代謝性アシドーシス（高山病・緑内障に使う）\n利尿薬の効きが悪いとき：ループ＋サイアザイドの併用（連続ネフロン遮断）で強く効くが、電解質異常に注意。","tg":[],"fig":["nephron"]},{"id":"kid-1d5ef036","f":"kid","u":49,"o":168,"lv":1,"q":"腎機能の評価について正しいものはどれか。","ch":["薬の量の調節には、体表面積で補正した eGFR（estimated glomerular filtration rate：推算糸球体濾過量） だけを使う","シスタチン C は、筋肉量の影響を強く受ける","BUN（blood urea nitrogen：血中尿素窒素） は腎機能だけを反映し、消化管出血や脱水の影響を受けない","やせた高齢者ではクレアチニンで腎機能を高く見積もりやすい"],"a":3,"cx":["薬の量の調節には、体表面積で補正しない eGFR（mL/分）や
