ビル（プレバイミス）で予防し、ウイルス量を監視する。","GVHD はドナーの T 細胞が患者を攻撃するもので、同種移植で起こる（自家移植ではほぼない）。"],"core":"急性 GVHD＝皮疹（手掌・足底から）・黄疸（胆汁うっ滞）・下痢（大量の水様便）。予防はカルシニューリン阻害薬＋MTX（methotrexate：メトトレキサート） など。治療はステロイド、効かなければルキソリチニブ（ジャカビ）など。","e":"ほかの合併症：生着前の感染症（細菌・真菌）、肝類洞閉塞症候群（VOD（veno-occlusive disease：肝類洞閉塞症候群）：体重増加・黄疸・右上腹部痛）、TMA（thrombotic microangiopathy：血栓性微小血管症）、晩期の感染（水痘・帯状疱疹・莢膜をもつ菌）、二次がん。\n移植片対白血病効果（GVL（graft-versus-leukemia：移植片対白血病効果））：GVHD とともに再発を減らす。\n移植後はワクチンを打ち直す（生ワクチンは2年以上たってから、GVHD・免疫抑制がない場合）。","tg":[]},{"id":"neuro-171fc8a7","f":"neuro","u":83,"o":257,"lv":1,"q":"脳の血管と、閉塞したときの症状の組み合わせで正しいものはどれか。","ch":["前大脳動脈 ― 反対側の下肢に強い麻痺","中大脳動脈 ― 同名半盲だけが起こり麻痺は出ない","後大脳動脈 ― 下肢に強い麻痺と尿失禁","前大脳動脈 ― 優位半球なら失語・顔と上肢に強い麻痺"],"a":0,"cx":["","中大脳動脈は顔・上肢に強い片麻痺と感覚障害、優位半球で失語、劣位半球で半側空間無視。","後大脳動脈は反対側の同名半盲（黄斑回避）・視覚失認・視床の感覚障害。","顔と上肢に強い麻痺・失語は中大脳動脈の症状。"],"core":"前大脳動脈＝反対側の下肢に強い麻痺・尿失禁・意欲低下。中大脳動脈＝顔・上肢に強い片麻痺・感覚障害・失語（優位）/半側空間無視（劣位）・共同偏視（病巣を見る）。後大脳動脈＝反対側の同名半盲。","e":"椎骨脳底動脈系：めまい・複視・構音障害・嚥下障害・失調・交叉性の麻痺・意識障害（脳底動脈閉塞は重い）。\nラクナ梗塞（穿通枝の小梗塞）：純粋運動性片麻痺・純粋感覚性卒中・失調性片麻痺・構音障害-手不器用症候群。皮質症状（失語・無視・半盲）はない。\n失語：Broca（運動性、話せないが理解できる、前頭葉）、Wernicke（感覚性、流暢だが意味が通らず理解できない、側頭葉）、伝導失語（復唱障害）。","tg":[],"fig":["willis"]},{"id":"neuro-57488ba2","f":"neuro","u":83,"o":258,"lv":1,"q":"髄液検査の所見と病気の組み合わせで正しいものはどれか。","ch":["ウイルス性髄膜炎 ― リンパ球優位・糖は正常","細菌性髄膜炎 ― リンパ球優位・糖は上昇","結核性髄膜炎 ― 好中球優位・ADA（adenosine deaminase：アデノシンデアミナーゼ） 低値","Guillain-Barré 症候群 ― 細胞数が著しく増え、蛋白は正常"],"a":0,"cx":["","細菌性は好中球優位・糖低下（髄液/血糖比 0.4 未満）・蛋白上昇。","結核性はリンパ球優位・糖低下・蛋白上昇・ADA 高値（髄液の Cl も低下）。","Guillain-Barré は蛋白細胞解離（蛋白↑・細胞数正常）。"],"core":"髄液：細菌性＝好中球・糖↓・蛋白↑。ウイルス性＝リンパ球・糖正常。結核性・真菌性（クリプトコッカス）・癌性＝リンパ球・糖↓・蛋白↑。蛋白細胞解離＝GBS（Guillain-Barré syndrome）・CIDP（chronic inflammatory demyelinating polyneuropathy：慢性炎症性脱髄性多発根ニューロパチー）・脊髄腫瘍（Froin 症候群）。","e":"髄液の初圧：正常 60〜180 mmH₂O。高い＝クリプトコッカス髄膜炎（排液で下げる）・特発性頭蓋内圧亢進症（肥満女性・視神経乳頭浮腫）。低い＝低髄液圧症候群（起立性頭痛）。\nキサントクロミー（黄色）：くも膜下出血の数時間後から（ビリルビン）。\nオリゴクローナルバンド：多発性硬化症。\n腰椎穿刺の禁忌：頭蓋内の占拠性病変（ヘルニア）・凝固異常・穿刺部位の感染。","tg":[],"fig":["spinal"],"mt":["csf"]},{"id":"neuro-5750f802","f":"neuro","u":83,"o":259,"lv":1,"q":"脊髄の伝導路について正しいものはどれか。","ch":["温痛覚は脊髄ですぐ交叉し、反対側を上る","錐体路の大部分は、脊髄の中で交叉する","振動覚・位置覚の線維は、脊髄に入ってすぐ交叉する","後索は、温痛覚を伝える"],"a":0,"cx":["","錐体路の大部分は延髄の錐体で交叉する。","振動覚・位置覚（後索）は同側を上り、延髄で交叉する。","後索は深部感覚（振動覚・位置覚）と識別性の触覚を伝える。"],"core":"温痛覚＝脊髄ですぐ交叉→反対側の脊髄視床路。深部感覚＝同側の後索→延髄で交叉。運動（錐体路）＝延髄で交叉→反対側の外側皮質脊髄路。だから脊髄の片側障害（Brown-Séquard）では、同側の運動麻痺・深部感覚障害と反対側の温痛覚障害。","e":"脊髄の障害のパターン：\n・前脊髄動脈症候群：運動麻痺と温痛覚障害、深部感覚は保たれる（大動脈の手術・解離）\n・後索の障害：深部感覚障害・Romberg 陽性（B12 欠乏・脊髄癆）\n・脊髄空洞症：宙づり型の温痛覚障害（解離性感覚障害）\n・中心性脊髄損傷：上肢に強い麻痺（頸椎の過伸展、後縦靱帯骨化症）\n・馬尾症候群：会陰部の感覚障害・膀胱直腸障害（緊急手術）","tg":[],"fig":["spinal"]},{"id":"neuro-08fa65d0","f":"neuro","u":84,"o":260,"lv":1,"q":"上位運動ニューロン障害の所見として正しいものはどれか。","ch":["感覚障害が手袋・靴下型に出る","筋の萎縮と線維束性収縮が早くから目立つ","腱反射の亢進とバビンスキー徴候","腱反射の消失と筋緊張の低下が続く"],"a":2,"cx":["手袋・靴下型の感覚障害は多発ニューロパチー。","萎縮・線維束性収縮は下位運動ニューロン（前角細胞・末梢神経）の障害。","","反射の消失・筋緊張低下は下位運動ニューロンや末梢神経の障害（急性期の脊髄ショックでも一時的に起こる）。"],"core":"上位運動ニューロン（錐体路）障害＝痙縮・腱反射亢進・病的反射（Babinski）。下位運動ニューロン障害＝弛緩・反射低下・筋萎縮・線維束性収縮。両方そろうのは ALS（amyotrophic lateral sclerosis：筋萎縮性側索硬化症）。","e":"局在の考え方：\n・大脳皮質：失語・失認・半側空間無視・皮質性感覚障害\n・内包：顔・上肢・下肢の均等な片麻痺（純粋運動性）\n・脳幹：交叉性の麻痺（同側の脳神経・反対側の手足）。例：Wallenberg 症候群（延髄外側：同側の顔面の温痛覚低下・Horner・嗄声/嚥下障害・失調、反対側の体の温痛覚低下）\n・脊髄：レベルのある感覚障害・膀胱直腸障害。Brown-Séquard（半側障害：同側の運動麻痺と深部感覚低下、反対側の温痛覚低下）\n・末梢神経：神経の支配に一致","tg":[],"fig":["spinal"]},{"id":"neuro-ec93569b","f":"neuro","u":85,"o":261,"lv":3,"q":"72歳の男性。朝6時に起きたときは普通だったが、7時に右手足が動かなくなり、言葉が出なくなった。8時に病院に着いた。血圧 168/94 mmHg、心房細動がある。頭部 CT（computed tomography：コンピュータ断層撮影） で出血はない。MRI（magnetic resonance imaging：磁気共鳴画像） で左中大脳動脈の閉塞があり、梗塞の範囲は小さい。抗凝固薬は飲んでいない。最も適切な治療はどれか。","ch":["血圧を 120/80 mmHg 未満まで急いで下げ、経過を見る","静注血栓溶解療法（アルテプラーゼ（グルトパ、アクチバシン））と血栓回収療法","発症から24時間たつまで待ってから治療を考える","まずアスピリンとヘパリンを併用する"],"a":1,"cx":["急性期脳梗塞で血栓溶解をするときの血圧の目標は 185/110 mmHg 未満で、急に下げすぎない。","","再開通の治療は早いほど効果が高い。待つ理由はない。","血栓溶解療法の前後24時間は抗血栓薬を使わない（出血の危険）。"],"core":"急性期脳梗塞：発症（最終健常時刻）から4.5時間以内なら静注血栓溶解療法、主幹動脈の閉塞なら血栓回収療法（6時間以内、画像で条件を満たせば24時間まで）。時間が脳（time is brain）。","e":"最終健常時刻＝最後に普段どおりだった時刻（この例では6時）。起きたときに気づいた（いつ起こったかわからない）場合でも、MRI の DWI-FLAIR（fluid-attenuated inversion recovery、MRI の撮り方） ミスマッチなどで血栓溶解ができることがある。\n血栓溶解の主な禁忌：頭蓋内出血の既往、最近の大きな手術・出血、血小板 10万未満、DOAC（direct oral anticoagulant：直接経口抗凝固薬） を最近飲んだ（中和できる場合を除く）、治療で下げられない著しい高血圧。\nテネクテプラーゼ（1回の静注で済む）は海外で脳梗塞に承認されているが、国内では脳梗塞の適応がない（先進医療として比較試験が行われた）。\n心原性脳塞栓症の再発予防：DOAC を、梗塞の大きさに応じて発症後数日以内（小さければ早く）から始める。","tg":["cs"],"fig":["willis"],"mt":["stroke"]},{"id":"neuro-66709308","f":"neuro","u":85,"o":262,"lv":2,"q":"一過性脳虚血発作（TIA（transient ischemic attack：一過性脳虚血発作））について正しいものはどれか。","ch":["症状がすっかり消えたので、急いで検査する必要はない","数日以内に脳梗塞を起こしやすく、すぐに評価する","TIA の再発予防には、抗血小板薬は使わない","症状は、必ず24時間以上続く"],"a":1,"cx":["TIA の後の脳梗塞は、48時間以内に多い。症状が消えても救急で扱う。","","非心原性の TIA には抗血小板薬（高リスクでは短期間の2剤併用：アスピリン＋クロピドグレル（プラビックス））を使う。","TIA は多くが1時間以内に消える。MRI（magnetic resonance imaging：磁気共鳴画像） で梗塞があれば脳梗塞と診断する（組織に基づく定義）。"],"core":"TIA＝脳梗塞の前ぶれ。ABCD2 スコア（年齢・血圧・症状・持続時間・糖尿病）で危険を評価し、頸動脈・心臓・MRI（magnetic resonance imaging：磁気共鳴画像） をすぐ調べる。原因が心房細動なら抗凝固薬、頸動脈の高度狭窄なら内膜剥離術・ステント。","e":"一過性黒内障（片眼が急に見えなくなる）は、同側の内頸動脈の病変による TIA。\n高リスクの非心原性 TIA・軽症脳梗塞：アスピリン＋クロピドグレル（プラビックス）を発症早期から 21日間程度、その後は1剤に。\nTIA と似るもの：低血糖、てんかん発作後の麻痺（Todd 麻痺）、片頭痛の前兆、失神。","tg":[],"fig":["willis","coag"],"mt":["stroke"]},{"id":"neuro-f9a09aa7","f":"neuro","u":85,"o":263,"lv":3,"q":"52歳の女性。トイレで力んだときに、突然、今までで一番ひどい頭痛が起こり、嘔吐した。項部硬直がある。発症3時間後の頭部 CT（computed tomography：コンピュータ断層撮影） で異常はなかった。次に行う検査として適切なのはどれか。","ch":["腰椎穿刺か MRI（magnetic resonance imaging：磁気共鳴画像） で出血を確かめる","頸椎の X 線写真を撮る","CT が正常なので、片頭痛として帰宅させる","翌月に外来で、脳波を記録する"],"a":0,"cx":["","頸椎の X 線では頭蓋内の出血はわからない。","CT で出血が見えないくも膜下出血もある（時間がたつほど・少量ほど）。雷鳴頭痛は見逃してはいけない。","脳波ではくも膜下出血は診断できない。"],"core":"雷鳴頭痛（突然の人生最悪の頭痛）＝くも膜下出血を最も疑う。CT（発症6時間以内なら感度が高い）が正常でも、腰椎穿刺か MRI で確かめる。見つかれば CTA（CT angiography：CT 血管造影） などで動脈瘤を探す。","e":"くも膜下出血の治療：再出血の予防（降圧・鎮痛・鎮静）、動脈瘤のクリッピングかコイル塞栓術。\n合併症：再出血（24時間以内に多い）、脳血管攣縮（4〜14日目、ファスジル（エリル）・クラゾセンタン）、水頭症、低ナトリウム血症（SIADH（syndrome of inappropriate secretion of antidiuretic hormone：抗利尿ホルモン不適合分泌症候群）・脳性塩類喪失）、たこつぼ型の心筋障害・心電図異常。\n雷鳴頭痛のほかの原因：可逆性脳血管攣縮症候群（RCVS（reversible cerebral vasoconstriction syndrome：可逆性脳血管攣縮症候群）：産後・薬・入浴）、脳静脈洞血栓症、頸動脈・椎骨動脈解離、下垂体卒中、低髄液圧。","tg":["cs"],"fig":["willis"],"mt":["csf","stroke"]},{"id":"neuro-1607d751","f":"neuro","u":85,"o":264,"lv":2,"q":"脳出血について正しいものはどれか。","ch":["皮質下出血を繰り返す高齢者でも、アミロイドアンギオパチーは考えない","被殻・視床に多く、急性期は収縮期 140 mmHg 未満に","脳出血の急性期には、まずアスピリンを始める","抗凝固薬内服中の脳出血でも、中和はせずに経過を見る"],"a":1,"cx":["高齢者の皮質下（脳葉）出血の繰り返し・MRI（magnetic resonance imaging：磁気共鳴画像） の微小出血・脳表ヘモジデリン沈着はアミロイドアンギオパチーを考える。","","急性期の抗血小板薬は出血を広げうる。","ワルファリン（ワーファリン）はプロトロンビン複合体製剤＋ビタミン K、ダビガトラン（プラザキサ）はイダルシズマブ（プリズバインド）、Xa 阻害薬はアンデキサネット アルファ（またはプロトロンビン複合体）で急いで中和する。"],"core":"高血圧性脳出血の好発部位：被殻＞視床＞皮質下＞小脳・橋。急性期はできるだけ早く収縮期 140 mmHg 未満（下げすぎず 110 以上）に。抗血栓薬を飲んでいれば中和する。","e":"手術の適応：小脳出血（3 cm 以上・脳幹の圧迫・水頭症）、意識障害のある大きな皮質下・被殻出血など。視床・脳幹出血は原則手術しない（脳室ドレナージは別）。\n若い人や高血圧のない人の脳出血：脳動静脈奇形、もやもや病、海綿状血管腫、腫瘍内出血、薬物（覚醒剤・コカイン）、静脈洞血栓症。","tg":[],"mt":["stroke"]},{"id":"neuro-c08a7307","f":"neuro","u":86,"o":265,"lv":3,"q":"45歳の男性。全身のけいれんが止まらず搬送された。来院時もけいれんが続いており、発作が始まって10分以上たつ。血糖は 112 mg/dL。最初に使う薬として最も適切なのはどれか。","ch":["全身麻酔薬プロポフォールの持続静注を最初に行う","フェノバルビタール（フェノバール）の内服","カルバマゼピン（テグレトール）の内服","ジアゼパム（またはロラゼパム（ロラピタ、静注）・ミダゾラム）の静注"],"a":3,"cx":["麻酔薬はベンゾジアゼピン・第二段階の薬で止まらないとき（難治性）に、気管挿管して使う。","内服では間に合わない。","けいれん中の内服は誤嚥の危険があり、効くまで時間もかかる。",""],"core":"てんかん重積状態＝5分以上続く発作（または意識が戻らないまま繰り返す）。①気道・呼吸・循環、血糖、（アルコール依存・低栄養ならビタミン B1）②ベンゾジアゼピン静注（静脈路がなければミダゾラム（ドルミカム）の筋注・口腔内投与）③ホスフェニトイン（ホストイン）・レベチラセタム・フェノバルビタールなどの静注 ④難治なら全身麻酔＋持続脳波。","e":"原因を探す：抗てんかん薬の怠薬、アルコール離脱、低血糖・低ナトリウム・低カルシウム、脳卒中・脳炎・外傷・腫瘍、薬（テオフィリン（テオドール）・抗菌薬など）。\n非けいれん性てんかん重積：けいれんがないのに意識が戻らない。脳波で診断（高齢者の意識障害で考える）。\n抗てんかん薬の選び方（妊娠を考える女性）：バルプロ酸（デパケン）は催奇形性・発達への影響があり避ける。レベチラセタム（イーケプラ）・ラモトリギンが選ばれる。","tg":["cs"]},{"id":"neuro-9cc7f046","f":"neuro","u":86,"o":266,"lv":2,"q":"片頭痛について正しいものはどれか。","ch":["トリプタンは、虚血性心疾患がある人にも安全に使える","体を動かすと、頭痛が軽くなる","鎮痛薬を毎日使うほど、片頭痛は良くなる","早めにトリプタン、頻回なら予防薬"],"a":3,"cx":["トリプタンは血管を収縮させるので、虚血性心疾患・脳血管障害・コントロールの悪い高血圧には禁忌。","片頭痛は日常の動作で悪化する（階段を上るなど）。","鎮痛薬・トリプタンを月10〜15日以上使うと薬剤の使用過多による頭痛になる。",""],"core":"片頭痛＝片側・拍動性・中等度以上・動作で悪化、吐き気か光/音過敏。急性期はトリプタン（早めに）・NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）、ラスミジタン（レイボー）。予防はロメリジン（ミグシス）・バルプロ酸・プロプラノロール・アミトリプチリン、抗 CGRP（calcitonin gene-related peptide） 関連抗体（ガルカネズマブ（エムガルティ）・フレマネズマブ・エレヌマブ）。","e":"群発頭痛：若い男性、片側の眼の奥の激痛（15分〜3時間）、同じ側の流涙・結膜充血・鼻汁・Horner、じっとしていられない、毎日同じ時刻（夜間）に数週〜数か月続く。発作には純酸素吸入・スマトリプタン皮下注、予防にベラパミル（ワソラン）。\n危ない頭痛のサイン（SNOOP など）：突然、50歳以降に初めて、増悪し続ける、発熱・項部硬直、神経症状、免疫不全・癌、妊娠、体位で変わる、外傷後。\n巨細胞性動脈炎：50歳以上の新しい頭痛・顎跛行・側頭動脈の圧痛・赤沈高値→失明の危険があり、すぐステロイド。","tg":[],"mt":["headache"]},{"id":"neuro-ea879b53","f":"neuro","u":86,"o":267,"lv":2,"q":"急性のめまいで、脳卒中（中枢性）を疑う所見はどれか。","ch":["寝返りで数十秒の回転性めまい、Dix-Hallpike で眼振","上気道炎の後の持続するめまいで、head impulse 異常","一側の難聴・耳鳴を伴う数時間のめまい発作を繰り返す","持続するめまいで head impulse 正常・方向交代性眼振"],"a":3,"cx":["これは良性発作性頭位めまい症（BPPV（benign paroxysmal positional vertigo：良性発作性頭位めまい症））。Epley 法などの頭位治療で治る。","head impulse test の異常（眼が頭と一緒に動いてから戻る）は末梢性（前庭神経炎）を示す。","これは Ménière 病（内リンパ水腫）。",""],"core":"持続するめまいの HINTS：①head impulse test が正常 ②方向が変わる眼振 ③斜偏倚（skew deviation）のどれかがあれば中枢性（小脳・脳幹の梗塞）を疑い、MRI（早期は偽陰性もある）。","e":"小脳梗塞では手足の失調がはっきりせず、立てない・歩けない（体幹失調）だけのことがある。必ず歩かせてみる。\n高齢・血管の危険因子・頭痛や頸部痛（椎骨動脈解離）・神経症状があれば中枢性を強く疑う。\n前庭神経炎：一方向性の水平回旋性眼振、head impulse 異常、聴力は正常。\n突発性難聴を伴うめまいでは、前下小脳動脈の梗塞も考える。","tg":[]},{"id":"neuro-51945929","f":"neuro","u":87,"o":268,"lv":2,"q":"Parkinson 病について正しいものはどれか。","ch":["安静時振戦よりも、動作時振戦が典型である","MIBG（metaiodobenzylguanidine、シンチグラフィの薬） 心筋シンチで取り込みが低下する","発症早期から、転倒と垂直方向の眼球運動障害が目立つ","L-ドパが、全く効かないのが特徴である"],"a":1,"cx":["Parkinson 病の振戦は安静時振戦（丸薬をまるめるような動き）。動作時振戦は本態性振戦。","","早期からの転倒・垂直性の眼球運動障害は進行性核上性麻痺（PSP（progressive supranuclear palsy：進行性核上性麻痺））。","Parkinson 病は L-ドパがよく効く（効かなければ別の病気を考える）。"],"core":"Parkinson 病＝黒質のドパミン神経の変性（α-シヌクレイン、Lewy 小体）。安静時振戦・筋強剛・無動・姿勢反射障害。L-ドパ・ドパミンアゴニストがよく効く。MIBG 心筋シンチで心臓の交感神経の低下。","e":"運動以外の症状：便秘・嗅覚低下・レム睡眠行動異常症（運動症状より前に出る）、起立性低血圧、うつ、認知症、幻視。\n薬の合併症：wearing-off（薬の効く時間が短くなる）、ジスキネジア、幻覚。進んだら L-ドパの持続皮下注・経腸療法、脳深部刺激療法。\n悪性症候群：L-ドパの急な中止で高熱・筋強剛・CK（creatine kinase：クレアチンキナーゼ） 上昇。\n薬剤性パーキンソニズム：抗精神病薬・メトクロプラミド・スルピリドなど（左右差が少ない、MIBG 正常）。\n多系統萎縮症：自律神経障害・小脳失調、MRI（magnetic resonance imaging：磁気共鳴画像） で十字サイン。","tg":[]},{"id":"neuro-0a177523","f":"neuro","u":87,"o":269,"lv":2,"q":"Alzheimer 病の抗アミロイドβ抗体薬（レカネマブ（レケンビ）・ドナネマブ）について正しいものはどれか。","ch":["中等度〜高度の認知症の人に、最も効果が高い","抗凝固薬を飲んでいる人にも、出血の心配なく使える","ARIA（amyloid-related imaging abnormalities：アミロイド関連画像異常） は起こらないので、MRI（magnetic resonance imaging：磁気共鳴画像） での経過観察は不要","MCI（mild cognitive impairment：軽度認知障害）〜軽度認知症でアミロイドを確かめた人が対象"],"a":3,"cx":["対象は早期（MCI（mild cognitive impairment：軽度認知障害）〜軽度認知症）。進んだ人は対象外。","抗凝固薬を使っている人では脳出血の危険が高く、慎重な判断が必要。","アミロイド関連画像異常（ARIA：脳浮腫・微小出血）が起こるので、定期的な MRI が必要。",""],"core":"レカネマブ（2週ごと点滴）・ドナネマブ（4週ごと点滴）＝アミロイドβを除き、早期 Alzheimer 病の進行を遅らせる。アミロイド PET（positron emission tomography） か髄液検査で確かめてから使う。副作用は ARIA（APOE（apolipoprotein E：アポリポ蛋白 E） ε4 を2本もつ人で多い）と点滴の反応。","e":"Alzheimer 病の特徴：近時記憶障害から始まり、見当識障害・取り繕い・もの盗られ妄想、海馬の萎縮、脳血流 SPECT（single photon emission computed tomography） で後部帯状回・楔前部・頭頂葉の低下。\n対症療法：コリンエステラーゼ阻害薬（ドネペジル（アリセプト）・ガランタミン・リバスチグミン：徐脈・吐き気）、NMDA（N-methyl-D-aspartate） 受容体拮抗薬（メマンチン（メマリー））。\nほかの認知症：Lewy 小体型（幻視・認知の変動・パーキンソニズム・レム睡眠行動異常、抗精神病薬に過敏）、前頭側頭型（人格変化・脱抑制・常同行動、若い発症）、血管性（段階的な悪化）。\n治せる認知症を除く：甲状腺機能低下・B12 欠乏・正常圧水頭症（歩行障害・認知症・尿失禁）・慢性硬膜下血腫・うつ・薬・神経梅毒。","tg":["ae"],"mt":["csf"]},{"id":"neuro-a5d0afe3","f":"neuro","u":87,"o":270,"lv":2,"q":"筋萎縮性側索硬化症（ALS（amyotrophic lateral sclerosis：筋萎縮性側索硬化症））について正しいものはどれか。","ch":["上位と下位の運動ニューロンが障害され、感覚は保たれる","感覚障害が、初発症状のことが多い","膀胱直腸障害が、早くから目立つ","治療で進行を止め、もとに戻すことができる"],"a":0,"cx":["","ALS では感覚障害は目立たない（陰性徴候の1つ）。","膀胱直腸障害・褥瘡・眼球運動障害は起こりにくい（陰性四徴候）。","リルゾール（リルテック）・エダラボンは進行をわずかに遅らせるが、止めたり戻したりはできない。"],"core":"ALS＝上位＋下位運動ニューロンの変性。四肢の筋力低下・萎縮・線維束性収縮・球麻痺（構音・嚥下障害）・呼吸筋麻痺。感覚・眼球運動・膀胱直腸は保たれやすい。","e":"針筋電図で広い範囲の脱神経（線維自発電位・線維束電位）と再支配所見。\n治療：リルゾール（内服）、エダラボン（点滴・内服）、SOD1（superoxide dismutase 1、遺伝子） 遺伝子変異にトフェルセン（髄注、国内承認）。高用量メコバラミン（2024年承認）。\n呼吸不全への対応（NPPV（non-invasive positive pressure ventilation：非侵襲的陽圧換気）・気管切開人工呼吸）、胃ろう、コミュニケーション手段は、早めに本人・家族と話し合っておく（ACP（advance care planning：アドバンス・ケア・プランニング））。\n前頭側頭型認知症を合併することがある（C9orf72）。","tg":[]},{"id":"neuro-2be4e5fc","f":"neuro","u":88,"o":271,"lv":2,"q":"重症筋無力症について正しいものはどれか。","ch":["夕方に悪化する眼瞼下垂・複視、抗 AChR（acetylcholine receptor：アセチルコリン受容体） 抗体","運動を繰り返すと、筋力がだんだん強くなる","反復刺激試験で、漸増（waxing）現象が見られる","胸腺腫を合併することはない"],"a":0,"cx":["","筋力は使うと弱くなり（易疲労性）、休むと戻る。繰り返して強くなるのは Lambert-Eaton 筋無力症候群。","重症筋無力症は低頻度反復刺激で漸減（waning）。漸増は Lambert-Eaton（高頻度刺激）。","胸腺腫を約2〜3割で合併し、胸腺摘除の適応になる。"],"core":"重症筋無力症＝神経筋接合部のシナプス後膜の自己免疫（抗 AChR 抗体、抗 MuSK（muscle-specific kinase） 抗体など）。易疲労性・日内変動。治療：コリンエステラーゼ阻害薬、ステロイド・免疫抑制薬、胸腺摘除、補体阻害薬・FcRn（neonatal Fc receptor：胎児性 Fc 受容体） 阻害薬。","e":"クリーゼ（呼吸筋の麻痺）：感染・手術・薬で誘発。気管挿管・人工呼吸、血漿交換・免疫グロブリン大量静注。\n悪化させる薬：アミノグリコシド・マクロライド・キノロン系抗菌薬、マグネシウム、β遮断薬、免疫チェックポイント阻害薬（筋炎・心筋炎と重なる）、筋弛緩薬。\n新しい薬：補体 C5 阻害薬（エクリズマブ（ソリリス）・ラブリズマブ・ジルコプラン）、FcRn 阻害薬（エフガルチギモド（ウィフガート）・ロザノリキシズマブ）。\nLambert-Eaton：シナプス前の電位依存性カルシウムチャネル抗体、小細胞肺癌、近位筋の筋力低下・腱反射低下・口渇など自律神経症状。","tg":[]},{"id":"neuro-8fb355d0","f":"neuro","u":88,"o":272,"lv":3,"q":"32歳の男性。2週間前に下痢があった。3日前から両足のしびれと力の入りにくさが出て、今日は歩けなくなり、両手にも広がった。両側の顔面神経麻痺もある。四肢の腱反射は消失している。髄液は蛋白 112 mg/dL、細胞数 2/μL。最も考えられる診断と治療の組み合わせはどれか。","ch":["Guillain-Barré 症候群 ― IVIG（intravenous immunoglobulin：免疫グロブリン大量静注療法） か血漿交換","脊髄梗塞 ― 静注の血栓溶解療法","重症筋無力症 ― コリンエステラーゼ阻害薬","多発性硬化症 ― ステロイドパルス療法"],"a":0,"cx":["","脊髄梗塞は突然発症で、髄液の蛋白細胞解離は起こらない。","重症筋無力症では腱反射は保たれ、感覚障害はない。","多発性硬化症は中枢神経の脱髄で、腱反射はむしろ亢進する。"],"core":"Guillain-Barré 症候群＝感染（カンピロバクター・CMV（cytomegalovirus：サイトメガロウイルス）・EBV（Epstein-Barr virus） など）の1〜3週後に、急に進む左右対称の四肢の筋力低下・腱反射消失、髄液の蛋白細胞解離（蛋白↑・細胞数正常）。IVIG か血漿交換（効果は同等、併用はしない）。ステロイドは効かない。","e":"呼吸筋麻痺（肺活量の低下）・自律神経障害（不整脈・血圧の変動）で死亡しうるので、肺活量と心電図を見る。\n抗ガングリオシド抗体：カンピロバクター後の軸索型（抗 GM1（ガングリオシド GM1） 抗体）、Fisher 症候群（外眼筋麻痺・失調・腱反射消失、抗 GQ1b（ガングリオシド GQ1b） 抗体）。\n発症から4週以上かけて進む・再発を繰り返すなら CIDP（慢性炎症性脱髄性多発根ニューロパチー：ステロイド・IVIG・血漿交換が効く）。","tg":["ae","cs"],"mt":["csf"]},{"id":"neuro-a2b81034","f":"neuro","u":88,"o":273,"lv":2,"q":"視神経脊髄炎スペクトラム障害（NMOSD（neuromyelitis optica spectrum disorder：視神経脊髄炎スペクトラム障害））について正しいものはどれか。","ch":["男性に多く、視神経炎は軽いことが多い","抗 AQP4（aquaporin-4：アクアポリン4） 抗体陽性で、長い脊髄病変を起こしやすい","多発性硬化症の治療薬（インターフェロンβ）で悪化しない","急性期には、ステロイドも血漿交換も効かない"],"a":1,"cx":["女性に多い（約9割）。視神経炎は重く、失明しうる。","","インターフェロンβやフィンゴリモド（イムセラ、ジレニア）などの多発性硬化症の薬で NMOSD は悪化しうる。区別が大事。","急性期はステロイドパルス、効かなければ血漿交換。"],"core":"NMOSD＝抗アクアポリン4（AQP4）抗体によるアストロサイトの障害。重い視神経炎・長い横断性脊髄炎（3椎体以上）・最後野症候群（しゃっくり・嘔吐が続く）。再発予防にステロイド・免疫抑制薬・生物学的製剤（エクリズマブ（ソリリス）・ラブリズマブ・サトラリズマブ・イネビリズマブ・リツキシマブ）。","e":"多発性硬化症（MS（multiple sclerosis：多発性硬化症））：若い女性、時間的・空間的に多発する中枢神経の脱髄。脳室周囲の楕円形の病変（Dawson の指）・短い脊髄病変。髄液のオリゴクローナルバンド。Uhthoff 現象（体温が上がると症状が悪化）。再発予防にインターフェロンβ・フィンゴリモド・ナタリズマブ（進行性多巣性白質脳症に注意）・オクレリズマブ・オファツムマブなど。\nMOG（myelin oligodendrocyte glycoprotein） 抗体関連疾患：視神経炎（両側）・急性散在性脳脊髄炎（小児）。","tg":[],"fig":["spinal","nephron"],"mt":["autoab"]},{"id":"neuro-5e241d1d","f":"neuro","u":88,"o":274,"lv":3,"q":"24歳の女性。2週間前から発熱・頭痛があり、その後、人が変わったように興奮し、幻覚を訴えるようになった。今日は口をもぐもぐ動かす不随意運動と、意識の低下が出てきた。MRI（magnetic resonance imaging：磁気共鳴画像） は軽い異常だけで、髄液はリンパ球が軽く増えている。骨盤の MRI で右卵巣に奇形腫がある。最も考えられる診断はどれか。","ch":["単純ヘルペス脳炎","統合失調症の急性期","抗 NMDA（N-methyl-D-aspartate） 受容体脳炎","Creutzfeldt-Jakob 病"],"a":2,"cx":["ヘルペス脳炎は側頭葉の病変が多く、まずアシクロビル（ゾビラックス）を始めて除くべき鑑別。卵巣奇形腫との関連はない。","発熱・不随意運動・意識障害・髄液の細胞増加は、精神疾患では説明できない。","","CJD（Creutzfeldt-Jakob disease） は高齢者に多く、急速に進む認知症とミオクローヌス、MRI の拡散強調像の皮質の高信号。"],"core":"抗 NMDA 受容体脳炎＝若い女性、風邪のような症状→精神症状→けいれん・口の不随意運動・意識障害・中枢性低換気・自律神経障害。卵巣奇形腫を探して摘出し、ステロイド・IVIG（intravenous immunoglobulin：免疫グロブリン大量静注療法）・血漿交換、効かなければリツキシマブ（リツキサン）など。","e":"髄液（と血清）の抗 NMDA 受容体抗体で診断する。\n回復には時間がかかるが、早く治療すれば多くが良くなる。\nほかの自己免疫性脳炎：抗 LGI1（leucine-rich glioma-inactivated 1） 抗体脳炎（高齢男性、顔と腕のけいれん発作（FBDS（faciobrachial dystonic seizures））、低ナトリウム）。\n急性の脳炎を見たら、結果を待たずにアシクロビル（ゾビラックス）を始める（ヘルペス脳炎は治療の遅れで予後が悪くなる）。","tg":["cs"],"mt":["emergency_dx"]},{"id":"neuro-61684845","f":"neuro","u":89,"o":275,"lv":3,"q":"40歳の男性。今朝起きると右の顔が動かず、水を飲むと口からこぼれる。右のおでこにしわを寄せられず、目を閉じられない。耳の痛みや水疱はなく、ほかの神経症状はない。正しいものはどれか。","ch":["額のしわ寄せができないので、中枢性（脳梗塞）と考える","自然に治らないので、全例ですぐ手術する","Bell 麻痺として、早めにステロイドを使う","目は閉じられないが、角膜の保護は不要である"],"a":2,"cx":["額のしわ寄せができないのは末梢性。中枢性（上位ニューロン）では額は両側支配のため保たれる。","Bell 麻痺の多くは自然に（ステロイドでより良く）回復する。手術は原則不要。","","閉眼できないと角膜が乾いて傷つく。点眼・眼帯・テープで守る。"],"core":"Bell 麻痺＝突然の一側の末梢性顔面神経麻痺（額も含む）。発症72時間以内のプレドニゾロン（プレドニン）、重ければ抗ヘルペスウイルス薬を併用。","e":"Ramsay Hunt 症候群：水痘・帯状疱疹ウイルスの再活性化、耳介・外耳道の水疱、耳痛、難聴・めまい。Bell 麻痺より回復が悪く、ステロイド＋抗ウイルス薬。\n両側の顔面神経麻痺：Guillain-Barré 症候群、サルコイドーシス、ライム病、HIV（human immunodeficiency virus：ヒト免疫不全ウイルス）。\n顔面神経の枝：涙腺（大錐体神経）、アブミ骨筋（聴覚過敏）、味覚（鼓索神経：舌の前2/3）で障害部位を推定する。","tg":["ae","cs"]},{"id":"neuro-d941fe71","f":"neuro","u":89,"o":276,"lv":3,"q":"50歳の女性。2週間前から両手のしびれが夜にひどく、手を振ると楽になる。母指〜環指の母指側にしびれがあり、母指球が少しやせている。Tinel 徴候・Phalen 徴候が陽性。甲状腺機能低下症の治療が不十分である。最も考えられる診断はどれか。","ch":["肘部管症候群（尺骨神経の圧迫）","橈骨神経麻痺（上腕での圧迫）","頸髄症（脊髄の圧迫）","手根管症候群（正中神経の圧迫）"],"a":3,"cx":["尺骨神経は小指と環指の小指側。骨間筋の萎縮・Froment 徴候。","橈骨神経麻痺は下垂手（手首が上がらない）。","頸髄症では両手のしびれに加え、手の巧緻運動障害・下肢の腱反射亢進・歩行障害が出る。",""],"core":"手根管症候群＝正中神経の手関節での圧迫。母指〜環指の母指側のしびれ（夜間・明け方に悪化）、母指球の萎縮（ペットボトルのふたが開けにくい）。神経伝導検査で確かめる。","e":"原因：女性・妊娠・更年期、甲状腺機能低下症、糖尿病、関節リウマチ、透析アミロイドーシス、先端巨大症、アミロイドーシス（ATTR（トランスサイレチン型アミロイドーシス）：両側の手根管症候群が心アミロイドーシスに先行）。\n治療：装具（夜間の固定）、ステロイド注射、手術（手根管開放術）。\n腓骨神経麻痺（膝の外側での圧迫）：下垂足、足背のしびれ。足を組む・ギプス・やせ。","tg":["cs"]},{"id":"neuro-464bcaa2","f":"neuro","u":89,"o":277,"lv":3,"q":"58歳の男性。重喫煙者。数週間前から右の上まぶたが少し下がり、右の瞳孔が小さく、右の顔に汗をかかない。最近、右肩から腕の内側（小指側）に痛みがある。最も考えられる原因はどれか。","ch":["重症筋無力症（眼筋型）","右の動眼神経麻痺（脳動脈瘤）","右の末梢性顔面神経麻痺","右肺尖部の肺癌（Pancoast 腫瘍）"],"a":3,"cx":["重症筋無力症は瞳孔に異常がなく、症状が夕方に悪化する。","動眼神経麻痺では眼瞼下垂は高度で、瞳孔は散大し、眼球が外下方に偏位する。","顔面神経麻痺は顔の表情筋の麻痺で、瞳孔・発汗の異常はない。",""],"core":"Horner 症候群＝交感神経の障害で、軽い眼瞼下垂・縮瞳・顔の無汗（同側）。原因の場所：脳幹（Wallenberg 症候群）、頸髄、肺尖部（Pancoast 腫瘍）、頸部（頸動脈解離・手術）、海綿静脈洞。","e":"Pancoast 腫瘍：肺尖部の肺癌が交感神経幹（星状神経節）と腕神経叢（C8・T1：尺側の痛み・手の筋萎縮）を侵す。\n急な Horner 症候群＋頸部痛・頭痛は内頸動脈解離を考える（脳梗塞の原因）。\n散瞳を伴う眼瞼下垂（動眼神経麻痺）は、内頸-後交通動脈分岐部の脳動脈瘤を急いで除く。","tg":["cs"]},{"id":"neuro-941e2955","f":"neuro","u":89,"o":278,"lv":2,"q":"むずむず脚症候群（レストレスレッグス症候群）について正しいものはどれか。","ch":["日中の運動中に症状が強く、休むと必ず消える","腎不全や妊娠とは関係がない","安静時に脚の不快感と動かしたい衝動、鉄欠乏で悪化","治療の第一選択は、ドパミン受容体を遮断する薬である"],"a":2,"cx":["安静時（とくに夕方・夜）に強く、動かすと一時的に軽くなる。","鉄欠乏・腎不全（透析）・妊娠は二次性の代表的な原因。","","ドパミンを遮断する薬（抗精神病薬・制吐薬）・抗ヒスタミン薬は悪化させる。治療はドパミン作動薬・α2δリガンド。"],"core":"むずむず脚症候群＝安静時の脚の異常感覚と動かしたい衝動、動かすと軽快、夕方〜夜に悪化。不眠の原因。まずフェリチンを測り、75 ng/mL 未満なら鉄を補う。薬はガバペンチン エナカルビル・プレガバリン、ドパミン作動薬（プラミペキソール・ロチゴチン）。","e":"ドパミン作動薬の長期使用で、症状が早い時間・広い範囲に広がる「augmentation（症状の悪化）」が問題になる。\n周期性四肢運動（睡眠中の足のぴくつき）を伴うことが多い。\n糖尿病などの末梢神経障害との区別：安静で悪化し動かすと軽くなるのはむずむず脚。","tg":[],"mt":["anemia"]},{"id":"neuro-483983df","f":"neuro","u":90,"o":279,"lv":3,"q":"78歳の男性。2か月前に転倒して頭を打った。最近、物忘れと歩行のふらつきが進み、左手の力が入りにくくなった。抗血小板薬を飲んでいる。最も考えられる診断と検査はどれか。","ch":["Parkinson 病 ― DAT（dopamine transporter：ドパミントランスポーター） スキャンを最初に行う","Alzheimer 病 ― アミロイド PET（positron emission tomography） を最初に行う","正常圧水頭症 ― 腰椎穿刺を最初に行う","慢性硬膜下血腫 ― 頭部 CT（computed tomography：コンピュータ断層撮影）"],"a":3,"cx":["半身の筋力低下は Parkinson 病では説明しにくい。","頭部外傷の後に数週〜数か月で進む症状。まず CT（computed tomography：コンピュータ断層撮影） で治せる血腫を除く。","頭蓋内の占拠性病変があれば腰椎穿刺は危険。まず画像。",""],"core":"慢性硬膜下血腫＝高齢者・軽い頭部外傷（覚えていないことも）から数週〜数か月後の認知機能低下・歩行障害・片麻痺・頭痛。危険因子：飲酒・抗血栓薬・脳萎縮。CT で三日月型の血腫。穿頭ドレナージで治る「治せる認知症」。","e":"正常圧水頭症：歩行障害（小刻み・すり足・開脚）・認知機能低下・尿失禁。CT/MRI（magnetic resonance imaging：磁気共鳴画像） で脳室拡大・高位円蓋部の脳溝の狭小化（DESH（disproportionately enlarged subarachnoid-space hydrocephalus））。髄液排除試験（タップテスト）→ シャント手術。\n治せる認知症：慢性硬膜下血腫・正常圧水頭症・甲状腺機能低下・B12 欠乏・神経梅毒・うつ・薬・脳腫瘍。","tg":["cs"]},{"id":"neuro-6a6ba7dd","f":"neuro","u":90,"o":280,"lv":3,"q":"68歳の男性。3か月前から急速に認知機能が悪くなり、今では会話も難しい。体のぴくつき（ミオクローヌス）が目立つ。MRI（magnetic resonance imaging：磁気共鳴画像） の拡散強調像で大脳皮質と線条体に高信号がある。脳波で周期性同期性放電（PSD（periodic synchronous discharge：周期性同期性放電））。最も考えられる診断はどれか。","ch":["Alzheimer 型認知症（急速進行型）","Lewy 小体型認知症（DLB（dementia with Lewy bodies：Lewy 小体型認知症））","Creutzfeldt-Jakob 病","特発性正常圧水頭症（iNPH）"],"a":2,"cx":["Alzheimer 病は数年単位でゆっくり進み、早期のミオクローヌス・PSD は典型でない。","Lewy 小体型は幻視・認知の変動・パーキンソニズムが特徴で、数か月での急速な進行・PSD は合わない。","","正常圧水頭症は歩行障害が先行し、ミオクローヌス・皮質の高信号はない。"],"core":"孤発性 Creutzfeldt-Jakob 病＝急速に進む認知症（数か月）・ミオクローヌス・無動性無言。MRI 拡散強調像の皮質（リボン状）・基底核の高信号、脳波の PSD、髄液の 14-3-3 蛋白・総タウ・RT-QuIC（real-time quaking-induced conversion、異常プリオンの検出）。多くは1〜2年以内に死亡。","e":"感染予防：通常の接触では感染しないが、脳・脊髄・眼などの高リスク組織に触れた手術器具は特別な処理（高温のアルカリ洗浄など）が必要。\n種類：孤発性（最多）、遺伝性（PRNP（プリオン蛋白の遺伝子） 変異）、獲得性（硬膜移植・変異型＝牛海綿状脳症）。\n急速に進む認知症の鑑別：自己免疫性脳炎（治せる）・橋本脳症（抗 NAE（α-エノラーゼの N 末端） 抗体、ステロイドが効く）・感染症・代謝性・中毒・悪性腫瘍（リンパ腫）。","tg":["cs"],"mt":["csf"]},{"id":"neuro-ae73335a","f":"neuro","u":91,"o":281,"lv":2,"q":"本態性振戦について正しいものはどれか。","ch":["治療薬として、β遮断薬は禁忌である","振戦とともに、筋強剛・無動が必ず見られる","安静時振戦が主で、L-ドパがよく効く","姿勢時・動作時の振戦で、飲酒で軽くなる"],"a":3,"cx":["プロプラノロール（β遮断薬）とプリミドンが第一選択。","筋強剛・無動はない（あれば Parkinson 病などを考える）。","安静時振戦・L-ドパが効くのは Parkinson 病。",""],"core":"本態性振戦＝手を伸ばす・コップを持つ・字を書くときの振戦（姿勢時・動作時）、頭部・声の振戦、少量の飲酒で軽くなる、家族歴。プロプラノロール（インデラル）・プリミドン（アロチノロールも国内で適用）、重ければ脳深部刺激・集束超音波治療。","e":"ほかの振戦の原因：甲状腺機能亢進症、薬（β刺激薬・バルプロ酸・リチウム・アミオダロン）、カフェイン、アルコール離脱、低血糖、不安。\n小脳性の企図振戦：目標に近づくほど大きくなる。\n書痙・ジストニア：特定の動作のときの異常姿勢。","tg":[]},{"id":"neuro-070773a2","f":"neuro","u":91,"o":282,"lv":2,"q":"成人の初発のけいれん発作の対応として正しいものはどれか。","ch":["発作後は、翌日から車の運転をしてよい","脳波が正常なら、てんかんは完全に否定できる","1回の発作でも、全員にすぐ抗てんかん薬を一生続ける","原因を調べ、運転について説明する"],"a":3,"cx":["日本では、一定期間（原則2年）発作がないなどの条件を満たすまで運転は控える。医師は運転について説明する義務がある。","発作間欠期の脳波は正常のことも多く、正常でもてんかんは否定できない。","1回目の誘因のない発作では、再発の危険（脳波異常・MRI（magnetic resonance imaging：磁気共鳴画像） の病変・夜間の発作）をみて開始を決める。",""],"core":"初発のけいれん＝誘発された発作（低血糖・低 Na・低 Ca・アルコール離脱・薬・脳炎・脳卒中）を除き、脳波・MRI（magnetic resonance imaging：磁気共鳴画像）。誘因のない2回以上の発作（または再発の危険が高い1回）でてんかんと診断。","e":"失神との区別：けいれん性失神（短い・すぐ回復）、てんかん発作（舌の外側の咬傷・発作後のもうろう状態・長いけいれん）。\n高齢者の初発てんかん：脳卒中後・認知症・腫瘍が原因になりやすく、非けいれん性の発作（ぼんやり）も多い。レベチラセタム（イーケプラ）・ラモトリギンなど。\n運転：道路交通法で一定の病気の届け出制度がある。\n抗てんかん薬の相互作用：カルバマゼピン（テグレトール）・フェニトインは酵素誘導（ワルファリン（ワーファリン）・DOAC（direct oral anticoagulant：直接経口抗凝固薬）・経口避妊薬の効果を下げる）。","tg":[]},{"id":"neuro-6aaa65cb","f":"neuro","u":92,"o":283,"lv":3,"q":"64歳の男性。数か月前から両手のしびれと、箸の使いにくさ、ボタンのかけにくさがある。最近歩くとふらつく。両上肢の腱反射は亢進し、Hoffmann 反射陽性、下肢の腱反射も亢進している。最も考えられる診断はどれか。","ch":["Guillain-Barré 症候群","頸椎症性脊髄症","多発性筋炎","手根管症候群"],"a":1,"cx":["Guillain-Barré 症候群は急性で、腱反射は消失する。","","多発性筋炎は近位筋の筋力低下で、しびれ・腱反射亢進はない。","手根管症候群は正中神経の領域だけのしびれで、腱反射亢進・歩行障害はない。"],"core":"頸椎症性脊髄症＝中高年の手のしびれ・巧緻運動障害（myelopathy hand）・歩行障害・膀胱障害、腱反射亢進・病的反射。MRI（magnetic resonance imaging：磁気共鳴画像） で脊髄の圧迫。進行すれば手術（除圧）。","e":"頸椎後縦靱帯骨化症（OPLL（ossification of the posterior longitudinal ligament：後縦靱帯骨化症））：日本人に多い、軽い外傷で重い脊髄損傷（中心性脊髄損傷）。\n上肢は下位運動ニューロン（圧迫の高さ）、下肢は上位運動ニューロンの障害が混ざることがある。ALS（amyotrophic lateral sclerosis：筋萎縮性側索硬化症） と区別（ALS は感覚障害なし・球麻痺あり）。\n亜急性連合性脊髄変性症（B12 欠乏）・銅欠乏・HTLV-1（human T-cell leukemia virus type 1：ヒト T 細胞白血病ウイルス1型） 関連脊髄症も鑑別。","tg":["cs"],"fig":["spinal"]},{"id":"neuro-43a3adc9","f":"neuro","u":92,"o":284,"lv":2,"q":"筋強直性ジストロフィー（1型）について正しいものはどれか。","ch":["常染色体潜性遺伝で、小児期のみに発症する","近位筋優位の筋力低下だけで、全身の合併症はない","CK（creatine kinase：クレアチンキナーゼ） が数万に上がるのが特徴である","ミオトニア・白内障・心伝導障害などを伴う"],"a":3,"cx":["常染色体顕性遺伝（DMPK（dystrophia myotonica protein kinase、遺伝子） の CTG（シトシン・チミン・グアニンの3塩基） リピートの伸長）で、成人期に見つかることが多い。世代を経て重くなる（表現促進）。","遠位筋優位の筋力低下と、多くの全身合併症（心・眼・内分泌・中枢神経）がある。","CK は正常〜軽い上昇。",""],"core":"筋強直性ジストロフィー＝成人で最も多い筋ジストロフィー。手を握ると離しにくい（把握性ミオトニア）、斧様顔貌・前頭部の脱毛、白内障、不整脈（伝導障害・突然死：心電図・ペースメーカ）、糖尿病、日中の眠気、麻酔のリスク。","e":"Duchenne 型筋ジストロフィー：X 連鎖潜性、男児、ジストロフィンの欠損、Gowers 徴候・ふくらはぎの仮性肥大、CK 著明高値。心筋症・呼吸不全。\n顔面肩甲上腕型：顔と肩甲帯の筋力低下（翼状肩甲）。\n筋疾患の評価：CK、筋電図、筋 MRI（magnetic resonance imaging：磁気共鳴画像）、筋生検、遺伝学的検査。","tg":[]},{"id":"neuro-f83c44b1","f":"neuro","u":92,"o":285,"lv":3,"q":"45歳の男性。数日前から下肢の脱力としびれが急に進み、尿が出にくい。2週間前に発熱があった。胸髄 T8 以下の感覚障害、両下肢の筋力低下があり、腱反射は亢進している。MRI（magnetic resonance imaging：磁気共鳴画像） で胸髄に3椎体にわたる T2 高信号がある。抗アクアポリン4抗体陰性。まず行うべき検査として正しいものはどれか。","ch":["神経伝導検査だけで、診断を確定する","脳波だけを記録して、てんかんを除く","圧迫病変の除外と、髄液・感染症・自己抗体の検索","筋生検だけを行い、筋炎を診断する"],"a":2,"cx":["神経伝導検査は末梢神経の検査。脊髄の病変は MRI と髄液で評価する。","脳波は脊髄の病変の評価に役立たない。","","筋生検は筋疾患の検査で、脊髄の病変には役立たない。"],"core":"急性横断性脊髄炎＝数時間〜数日で進む両下肢の麻痺・感覚レベル・膀胱直腸障害。まず圧迫病変（腫瘍・膿瘍・椎間板・血腫）を MRI で除き、髄液、感染症（ウイルス・梅毒・HIV（human immunodeficiency virus：ヒト免疫不全ウイルス）・HTLV-1（human T-cell leukemia virus type 1：ヒト T 細胞白血病ウイルス1型））、自己抗体（AQP4（aquaporin-4：アクアポリン4）・MOG（myelin oligodendrocyte glycoprotein））、膠原病（SLE（systemic lupus erythematosus：全身性エリテマトーデス）・シェーグレン病）、サルコイドーシスを調べる。治療はステロイドパルス、効かなければ血漿交換。","e":"3椎体以上の長い病変：視神経脊髄炎（AQP4 抗体）、MOG 抗体関連疾患、サルコイドーシス、SLE。\n短い病変：多発性硬化症。\n脊髄梗塞は突然発症（数分）で、前脊髄動脈症候群（深部感覚は保たれる）が多い。大動脈の手術・解離の後。\n急速に進む脊髄圧迫（転移性・硬膜外膿瘍）は緊急の除圧。","tg":["cs"],"fig":["spinal"],"mt":["autoab","csf"]},{"id":"allergy-da7999d8","f":"allergy","u":93,"o":286,"lv":1,"q":"アレルギーの型と代表的な病気・検査の組み合わせで正しいものはどれか。","ch":["I 型 ― 血清病 ― パッチテスト（48時間後）","IV 型 ― 接触皮膚炎 ― パッチテスト","II 型 ― 接触皮膚炎 ― 特異的 IgE（immunoglobulin E：免疫グロブリン E） 抗体","III 型 ― アナフィラキシー ― プリックテスト"],"a":1,"cx":["血清病は III 型（免疫複合体）。I 型の検査は特異的 IgE（immunoglobulin E：免疫グロブリン E）・プリックテスト。","","接触皮膚炎は IV 型。II 型は自己免疫性溶血性貧血・不適合輸血・Goodpasture など。","アナフィラキシーは I 型（IgE（immunoglobulin E：免疫グロブリン E）・マスト細胞）。"],"core":"I 型＝IgE（数分〜1時間：アナフィラキシー・喘息・蕁麻疹）。II 型＝抗体が細胞を攻撃（溶血・ITP（immune thrombocytopenia：特発性、免疫性血小板減少性紫斑病）・Basedow 病）。III 型＝免疫複合体（数時間：血清病・SLE（systemic lupus erythematosus：全身性エリテマトーデス）・過敏性肺炎）。IV 型＝T 細胞（48〜72時間：接触皮膚炎・ツベルクリン反応・重症薬疹）。","e":"検査の使い分け：\n・I 型：特異的 IgE（陽性でも症状が出るとは限らない＝感作だけ）、皮膚プリックテスト、食物経口負荷試験（確定の標準、専門施設で）、好塩基球活性化試験\n・IV 型：パッチテスト、薬剤リンパ球刺激試験（DLST（drug-induced lymphocyte stimulation test：薬剤リンパ球刺激試験））\n・トリプターゼ：アナフィラキシーの発症1〜2時間後に上がり、診断の助けになる\n非アレルギー性（IgE を介さない）のマスト細胞の活性化：造影剤・バンコマイシン（レッドマン症候群）・オピオイド・NSAIDs（不耐症）。","tg":[],"fig":["thyrotox"],"mt":["pneumonia","ild"]},{"id":"allergy-c300ef32","f":"allergy","u":93,"o":287,"lv":2,"q":"アナフィラキシーの初期治療について正しいものはどれか。","ch":["アドレナリン（ボスミン、自己注射はエピペン）は、皮下注が最も速く効く","まず抗ヒスタミン薬を静注し、効かなければアドレナリン（ボスミン、自己注射はエピペン）を考える","症状が治まればすぐに帰宅させてよく、経過観察は不要である","アドレナリン（ボスミン、自己注射はエピペン） 0.01 mg/kg を大腿外側に筋注（反復可）"],"a":3,"cx":["筋注（大腿外側）のほうが皮下注より血中濃度が早く上がる。","抗ヒスタミン薬・ステロイドは補助。アドレナリンを遅らせると死亡が増える。","二相性反応（数時間後の再燃）があるので、重い例は数時間〜一晩の観察を考える。",""],"core":"アナフィラキシー＝第一選択はアドレナリン筋注（0.01 mg/kg、成人 0.3〜0.5 mg、大腿外側）。仰臥位（足を上げる）、酸素、大量の輸液（細胞外液）。","e":"β遮断薬を飲んでいる人ではアドレナリンが効きにくく、グルカゴンを使う。\n再発の予防：原因の特定、アドレナリン自己注射薬（エピペン）の処方と使い方の指導、原因食物・薬の回避、アレルギーの情報カード。\n診断の基準：皮膚・粘膜症状に加えて呼吸器症状か血圧低下・臓器障害、またはアレルゲンに曝露した後の急な血圧低下・気管支攣縮・喉頭症状（皮膚症状がなくてもよい）。\n心停止になったら通常の心肺蘇生とアドレナリン静注。","tg":[]},{"id":"allergy-9286d9fa","f":"allergy","u":93,"o":288,"lv":3,"q":"22歳の男性。昼食にパンを食べ、その30分後にサッカーをしていたところ、全身に蕁麻疹が出て、息苦しくなり倒れた。以前にもパンを食べた後の運動で蕁麻疹が出たが、パンを食べただけ・運動しただけでは何も起こらない。最も考えられる原因と、診断に役立つ検査の組み合わせはどれか。","ch":["小麦依存性運動誘発アナフィラキシー ― ω-5 グリアジン IgE（immunoglobulin E：免疫グロブリン E）","遺伝性血管性浮腫 ― C1 インヒビター活性と C4","花粉-食物アレルギー症候群 ― シラカバ花粉の特異的 IgE（immunoglobulin E：免疫グロブリン E）","コリン性蕁麻疹 ― 発汗試験（入浴・運動負荷）"],"a":0,"cx":["","遺伝性血管性浮腫は蕁麻疹を伴わない深い浮腫で、食物・運動の組み合わせとは関係しない。","花粉-食物アレルギー症候群は果物・野菜で口の中のかゆみ（口腔アレルギー症候群）が中心。","コリン性蕁麻疹は小さな膨疹が汗とともに出るもので、食べ物と関係しない。"],"core":"食物依存性運動誘発アナフィラキシー＝原因の食物を食べて（2時間以内に）運動したときだけ起こる。原因は小麦（ω-5 グリアジン）が最多、次いで甲殻類。NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）・アルコール・疲労・入浴も誘因。","e":"予防：原因食物を食べてから2〜4時間は運動しない（または運動前には食べない）。エピペンを持つ。\n加水分解コムギ（石鹸）による小麦アレルギー：顔・まぶたの腫れが目立った（皮膚から感作）。\n花粉-食物アレルギー症候群（PFAS（pollen-food allergy syndrome：花粉-食物アレルギー症候群））：シラカバ花粉→バラ科の果物（りんご・もも）、ブタクサ→メロン・スイカ。加熱すると食べられることが多い。\nα-Gal 症候群：マダニに咬まれて感作され、牛肉・豚肉を食べて数時間後に遅れて蕁麻疹・アナフィラキシー。セツキシマブでも即時の反応。","tg":["cs"]},{"id":"allergy-3463048e","f":"allergy","u":94,"o":289,"lv":2,"q":"重症薬疹について正しいものはどれか。","ch":["DIHS（drug-induced hypersensitivity syndrome：薬剤性過敏症症候群） の原因薬は、ペニシリン系抗菌薬が最も多い","DIHS（drug-induced hypersensitivity syndrome：薬剤性過敏症症候群） は開始2〜6週後に発症し、HHV-6（human herpesvirus 6：ヒトヘルペスウイルス6） が再活性化する","SJS（Stevens-Johnson syndrome：Stevens-Johnson 症候群）/TEN は、薬を始めて数分以内に起こる I 型アレルギーである","TEN は、表皮の剥離面積が体表面積の 5% 未満のものをいう"],"a":1,"cx":["DIHS の原因は抗てんかん薬（カルバマゼピン（テグレトール）・フェニトイン・フェノバルビタール・ラモトリギン）、アロプリノール（ザイロリック）、サラゾスルファピリジン（アザルフィジンEN）、ジアフェニルスルホン、メキシレチンなどが多い。","","SJS/TEN は IV 型（細胞傷害性 T 細胞）。多くは服薬開始から数日〜数週で起こる。","剥離・びらんの面積が 10% 未満は SJS（Stevens-Johnson syndrome：Stevens-Johnson 症候群）、10% 以上が TEN。"],"core":"DIHS（薬剤性過敏症症候群）＝原因薬を始めて2〜6週後の高熱・紅斑・リンパ節腫脹・肝障害・好酸球増多・異型リンパ球、HHV-6 の再活性化。薬を止めても悪化・再燃しうる。","e":"SJS/TEN：粘膜（口唇・眼・陰部）のびらん、発熱、表皮の壊死。原因はアロプリノール（ザイロリック）・抗てんかん薬・抗菌薬・NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）・解熱鎮痛薬など。眼の後遺症（失明）に注意し、眼科と一緒に診る。治療は原因薬の中止、ステロイド（パルス）、IVIG（intravenous immunoglobulin：免疫グロブリン大量静注療法）、血漿交換。\nHLA（human leukocyte antigen：ヒト白血球抗原） との関連：アロプリノール＝HLA-B（ヒト白血球抗原 B）*58:01、カルバマゼピン（テグレトール）＝HLA-A（ヒト白血球抗原 A）*31:01（日本人）・HLA-B*15:02（漢民族など）。\n薬疹を疑ったら：始めた日と症状の出た日の時系列を作り、疑わしい薬を止める。","tg":["ae"]},{"id":"allergy-fe132276","f":"allergy","u":94,"o":290,"lv":2,"q":"ヨード造影剤の副作用について正しいものはどれか。","ch":["甲殻類アレルギーがあれば、造影剤は禁忌である","前投薬（ステロイド）をすれば、重い反応は確実に防げる","造影剤の反応は、必ず投与後24時間たってから起こる","前回中等度以上の即時型反応があれば、必要性を見直す"],"a":3,"cx":["甲殻類やヨードのアレルギーは造影剤の反応と関係しない（ヨードそのものはアレルゲンではない）。","ステロイドの前投薬で完全には防げない（breakthrough reaction）。救急の備えが必要。","多くは投与直後〜1時間以内の即時型。遅発型（数時間〜数日後の皮疹）もある。",""],"core":"造影剤の即時型反応の最大の危険因子＝以前の造影剤での反応。ほかに喘息、多くのアレルギー歴。造影は必要性を見直し、行うなら別の造影剤・前投薬（ステロイド＋抗ヒスタミン薬）・救急の準備。","e":"ガドリニウム造影剤（MRI（magnetic resonance imaging：磁気共鳴画像））：腎機能が非常に悪い人で腎性全身性線維症（NSF（nephrogenic systemic fibrosis：腎性全身性線維症））。脳への沈着の報告。\nヨード造影剤と腎：造影剤腎症（eGFR（estimated glomerular filtration rate：推算糸球体濾過量） 30〜45 未満で注意、輸液で予防）。メトホルミン（メトグルコ）は腎機能に応じて造影前後に休む（乳酸アシドーシス）。\n甲状腺：ヨードで甲状腺機能異常が起こることがある（Basedow 病・甲状腺腫の人）。","tg":["ae"]},{"id":"allergy-b165f9d9","f":"allergy","u":94,"o":291,"lv":3,"q":"56歳の男性。痛風に対してアロプリノール（ザイロリック）を始めて3週間後に、38.5℃の発熱と全身の紅斑が出て、顔がむくみ、頸部リンパ節が腫れた。白血球 14,000/μL（好酸球 22%、異型リンパ球あり）、AST（aspartate aminotransferase）・ALT（alanine aminotransferase） が数百に上昇。正しい対応はどれか。","ch":["症状が治まったら、同じ量でアロプリノールを再開する","感染症として、抗菌薬を開始して経過を見る","原因薬を中止し、ステロイドを検討、HHV-6（human herpesvirus 6：ヒトヘルペスウイルス6） を確かめる","アロプリノールは続け、抗ヒスタミン薬だけを追加する"],"a":2,"cx":["原因薬の再投与は禁忌。尿酸降下薬はほかの系統（フェブキソスタット（フェブリク）など）を慎重に検討する。","感染症も除くが、時系列・好酸球・異型リンパ球は薬疹（DIHS（drug-induced hypersensitivity syndrome：薬剤性過敏症症候群））を強く示す。","","DIHS（drug-induced hypersensitivity syndrome：薬剤性過敏症症候群） が疑われ、原因薬を続けると悪化・死亡しうる。"],"core":"DIHS（薬剤性過敏症症候群）＝原因薬（アロプリノール・抗てんかん薬など）開始2〜6週後の高熱・紅斑・顔面浮腫・リンパ節腫脹・好酸球増多・異型リンパ球・臓器障害（肝・腎）。HHV-6 の再活性化。原因薬の中止とステロイド。","e":"経過中に CMV（cytomegalovirus：サイトメガロウイルス） の再活性化（消化管出血・肺炎）、薬を止めた後の再燃、数か月〜数年後の自己免疫疾患（甲状腺炎・1型糖尿病）が起こりうる。\nステロイドは急に減らさない。\nアロプリノールは腎機能に合わせて減量する（腎障害で重症薬疹が増える）。HLA-B（ヒト白血球抗原 B）*58:01 は日本人では少ない。","tg":["ae","cs"]},{"id":"allergy-546f933a","f":"allergy","u":94,"o":292,"lv":2,"q":"ペニシリンアレルギーの申告がある患者への対応として正しいものはどれか。","ch":["申告があれば、すべての β-ラクタム系を一生使えない","症状・時期・薬を詳しく聞き、リスクを評価する","セファゾリン（セファメジン α）との交差反応は、50% 以上である","本当のアレルギーかどうかを、確かめる方法はない"],"a":1,"cx":["申告の多くは本当の IgE（immunoglobulin E：免疫グロブリン E） アレルギーではない（9割以上が使える）。決めつけると広域・副作用の多い薬を使うことになる。","","ペニシリンとセフェム系の交差反応は低く（2% 未満）、側鎖が違えばさらに低い。セファゾリンは側鎖が独特で交差しにくい。","問診によるリスク評価、皮膚テスト、少量から段階的に投与する負荷試験（ドラッグチャレンジ）で確かめられる。"],"core":"「ペニシリンアレルギー」の多くは、昔の皮疹・胃腸症状・ウイルス性の発疹などで、真のアレルギーではない。問診でリスクを分類し、低リスクなら直接の負荷試験、必要なら皮膚テスト。アレルギーのラベルを外すこと（delabeling）は大事。","e":"真の即時型反応（アナフィラキシー・蕁麻疹・気管支攣縮が投与1時間以内）の既往は高リスク。\nSJS（Stevens-Johnson syndrome：Stevens-Johnson 症候群）/TEN・DIHS（drug-induced hypersensitivity syndrome：薬剤性過敏症症候群） など重症薬疹の既往があれば、その薬と類似の薬は再投与しない（負荷試験も禁忌）。\nカルバペネムとペニシリンの交差反応も低い（1% 前後）。","tg":[]},{"id":"allergy-b48b8c2a","f":"allergy","u":95,"o":293,"lv":2,"q":"遺伝性血管性浮腫（HAE（hereditary angioedema：遺伝性血管性浮腫））について正しいものはどれか。","ch":["喉頭浮腫は起こらないので、命にかかわることはない","C1-INH の欠損でブラジキニンが増え、浮腫と腹痛発作","ヒスタミンによる浮腫で、抗ヒスタミン薬とアドレナリン（ボスミン、自己注射はエピペン）がよく効く","血清 C4 は、発作のない時期でも高い"],"a":1,"cx":["喉頭浮腫は窒息で死亡しうる、最も危険な症状。","","HAE はブラジキニンが原因で、抗ヒスタミン薬・ステロイド・アドレナリンはほとんど効かない。","C4 は発作のない時期も低いことが多く、スクリーニングに使う。"],"core":"HAE＝C1 インヒビター（C1-INH）の量または機能の低下（常染色体顕性）。かゆみのない深い浮腫（顔・手足・陰部）、腸管の浮腫による激しい腹痛、喉頭浮腫。C4 低値・C1-INH 活性低値。","e":"発作の治療：C1 インヒビター製剤の静注、イカチバント（ブラジキニン B2 受容体拮抗薬）の皮下注。\n長期予防：ラナデルマブ（血漿カリクレイン阻害抗体）、ベロトラルスタット（内服）、C1-INH 製剤の定期投与。手術・抜歯の前の短期予防。\nACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬による血管性浮腫：ブラジキニンの分解が止まる。飲み始めて何年たってからでも起こる。唇・舌の腫れ。原因薬を中止（ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬） へ変えるときは慎重に）。\n後天性血管性浮腫：リンパ増殖性疾患・自己抗体（C1q が低い）。","tg":[]},{"id":"allergy-eafa3195","f":"allergy","u":95,"o":294,"lv":2,"q":"慢性特発性蕁麻疹の治療について正しいものはどれか。","ch":["第2世代抗ヒスタミン薬→増量→オマリズマブ（ゾレア）など","第1世代抗ヒスタミン薬が、眠気も少なく第一選択である","血液検査をくまなく行い、原因を必ず見つける","まず全身ステロイドを、長期に続けるのが標準である"],"a":0,"cx":["","第1世代は眠気・抗コリン作用が強い。第2世代（非鎮静性）が第一選択。","慢性特発性蕁麻疹の多くは原因が見つからない。網羅的な検査は勧められない。","全身ステロイドは急な悪化時に短期間だけ。長期使用は副作用が多い。"],"core":"慢性蕁麻疹（6週以上）の多くは特発性。第2世代抗ヒスタミン薬 → 増量 → H2 遮断薬・ロイコトリエン受容体拮抗薬の追加 → オマリズマブ（抗 IgE（immunoglobulin E：免疫グロブリン E））・デュピルマブ・シクロスポリン。","e":"蕁麻疹の膨疹は24時間以内に消え、跡を残さない。24時間以上続き、紫斑・色素沈着を残すなら蕁麻疹様血管炎（低補体なら SLE（systemic lupus erythematosus：全身性エリテマトーデス） などを考える）。\n刺激で起こる蕁麻疹：機械性（皮膚描記症）、寒冷、日光、コリン性（入浴・運動・緊張の汗）、遅延性圧。\n血管性浮腫を伴う蕁麻疹は、ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬・NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） も確かめる。","tg":[]},{"id":"allergy-29e7683e","f":"allergy","u":96,"o":295,"lv":2,"q":"末梢血の好酸球増多（1,500/μL 以上）の原因として考えにくいものはどれか。","ch":["Cushing 症候群（コルチゾール過剰）","薬剤性（DIHS（drug-induced hypersensitivity syndrome：薬剤性過敏症症候群） を含む薬の副作用）","好酸球性多発血管炎性肉芽腫症","寄生虫感染（糞線虫など組織侵入性）"],"a":0,"cx":["","薬剤性は好酸球増多の最も多い原因の1つ。","EGPA（eosinophilic granulomatosis with polyangiitis：好酸球性多発血管炎性肉芽腫症） は喘息・好酸球増多・血管炎。","寄生虫（とくに組織に侵入するもの）は好酸球増多の代表的な原因。糞線虫はステロイドで重症化（播種性）するので先に除く。"],"core":"グルココルチコイドは好酸球を減らす（Cushing 症候群・ステロイド投与で減る）。逆に副腎不全では好酸球が増える。","e":"好酸球増多の原因（考える順）：アレルギー（喘息・アトピー）、薬、寄生虫、膠原病・血管炎（EGPA（eosinophilic granulomatosis with polyangiitis：好酸球性多発血管炎性肉芽腫症））、副腎不全、腫瘍（リンパ腫・固形癌）、骨髄性腫瘍（FIP1L1（PDGFRA と融合する遺伝子）-PDGFRA（platelet-derived growth factor receptor α） 融合遺伝子：イマチニブ（グリベック）がよく効く）、特発性好酸球増多症候群（HES（hypereosinophilic syndrome：好酸球増多症候群））。\n臓器障害：心臓（好酸球性心筋炎・心内膜線維化・血栓）、肺、皮膚、神経。\nHES の治療：ステロイド、抗 IL-5（interleukin-5：インターロイキン5） 抗体（メポリズマブ（ヌーカラ））、イマチニブ（PDGFRA）。","tg":[],"fig":["hpaxis"],"mt":["adrenal"]},{"id":"allergy-0c20d545","f":"allergy","u":97,"o":296,"lv":2,"q":"アレルゲン免疫療法（舌下免疫療法）について正しいものはどれか。","ch":["スギ・ダニの鼻炎に使い、3〜5年続けると効果が残る","重い喘息がコントロールされていない人にも、安全に使える","アナフィラキシーなど全身の副作用の危険は全くない","効果はすぐ現れるので、花粉が飛び始めてから始めればよい"],"a":0,"cx":["","コントロール不良の重い喘息では、重い反応の危険があり禁忌。","まれにアナフィラキシーが起こりうるので、初回は医療機関で投与し観察する。口の中のかゆみ・腫れは多い。","効果が出るまで数か月かかる。スギは飛散時期を避けて始める（6〜12月頃）。"],"core":"アレルゲン免疫療法＝原因のアレルゲンを少しずつ投与して体を慣らす、症状を根本から変えうる唯一の治療。舌下錠（スギ・ダニ）は自宅で毎日。3〜5年続ける。","e":"重症のスギ花粉症にはオマリズマブ（抗 IgE（immunoglobulin E：免疫グロブリン E） 抗体）も使える（季節性、条件あり）。\n抗ヒスタミン薬：第2世代（眠気が少ない）。鼻噴霧ステロイドが鼻閉にも効く。\n鼻閉が強いときの点鼻用血管収縮薬は長く使うと薬剤性鼻炎になる。","tg":[]},{"id":"rheum-6c1d74b6","f":"rheum","u":98,"o":297,"lv":2,"q":"急性の単関節炎（膝の腫れと熱感）で、最初に必ず行うべき検査はどれか。","ch":["リウマトイド因子と抗 CCP（cyclic citrullinated peptide：環状シトルリン化ペプチド） 抗体","膝の MRI（magnetic resonance imaging：磁気共鳴画像） と単純X線写真","関節穿刺（細胞数・培養・結晶）","血清尿酸値（発作中の値）だけ"],"a":2,"cx":["急性の単関節炎で最も見逃してはならないのは化膿性関節炎。自己抗体では除けない。","MRI では感染と結晶性関節炎を区別できない。","","発作中の尿酸値は正常のことがあり、尿酸だけでは痛風とも感染とも決められない。"],"core":"急性単関節炎＝まず関節穿刺で化膿性関節炎を除く。白血球 5万/μL 以上・好中球優位なら感染を強く疑う。結晶があっても感染は否定できない（合併がある）。","e":"化膿性関節炎：黄色ブドウ球菌が最多、若い性的に活発な人では淋菌（皮疹・腱鞘炎）。人工関節・関節リウマチ・糖尿病・ステロイドが危険因子。抗菌薬＋排膿（洗浄・ドレナージ）。\n偽痛風（CPPD（calcium pyrophosphate deposition：ピロリン酸カルシウム沈着症））：高齢者の膝・手関節、軟骨の石灰化、正の複屈折性の菱形結晶。副甲状腺機能亢進症・ヘモクロマトーシス・低マグネシウムを考える。\n多関節炎：関節リウマチ、SLE（systemic lupus erythematosus：全身性エリテマトーデス）、ウイルス（パルボウイルスB19・B型肝炎・風疹）、脊椎関節炎、リウマチ性多発筋痛症、RS3PE（remitting seronegative symmetrical synovitis with pitting edema）。","tg":[]},{"id":"rheum-b681fe7c","f":"rheum","u":98,"o":298,"lv":2,"q":"関節リウマチの治療について正しいものはどれか。","ch":["ステロイドを、長期の主な治療として使う","関節の破壊が見えてから、抗リウマチ薬を始める","MTX（methotrexate：メトトレキサート） が第一選択で、不十分なら生物学的製剤か JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬","寛解を目指さず、痛みが取れれば十分である"],"a":2,"cx":["ステロイドは抗リウマチ薬が効くまでの「つなぎ」として短期に。長期の使用は副作用が多い。","関節の破壊は発症早期から進むので、診断したらすぐ抗リウマチ薬を始める。","","目標は寛解（難しければ低疾患活動性）。3か月ごとに評価し、届かなければ治療を変える（T2T（treat to target：目標達成に向けた治療））。"],"core":"関節リウマチ＝MTX（週1回、葉酸を併用）が土台。3〜6か月で目標に届かなければ生物学的製剤（TNF（tumor necrosis factor：腫瘍壊死因子）・IL-6（interleukin-6：インターロイキン6）・T 細胞共刺激）か JAK 阻害薬。治療前に結核・B型肝炎・間質性肺炎を調べる。","e":"MTX の副作用：肝障害、骨髄抑制（腎機能低下・脱水・ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 合剤の併用で重い、ホリナート（ロイコボリン）で救済）、間質性肺炎（MTX 肺炎）、口内炎、リンパ増殖性疾患。妊娠は禁忌。\n生物学的製剤・JAK 阻害薬：結核（IGRA（interferon-gamma release assay：インターフェロンγ遊離試験）・胸部画像、潜在性結核にはイソニアジド（イスコチン））、B型肝炎の再活性化、ニューモシスチス肺炎、帯状疱疹（とくに JAK 阻害薬、組換えワクチン）。\n関節外症状：間質性肺炎（UIP（usual interstitial pneumonia：通常型間質性肺炎） 型は予後不良）、リウマトイド結節、血管炎、強膜炎、二次性アミロイドーシス、Felty 症候群（脾腫・好中球減少）、環軸椎亜脱臼。","tg":["ae"],"mt":["pneumonia","ild"]},{"id":"rheum-9c28d3ff","f":"rheum","u":99,"o":299,"lv":2,"q":"SLE（systemic lupus erythematosus：全身性エリテマトーデス） の検査について正しいものはどれか。","ch":["抗核抗体が陰性でも、SLE はよくある","抗 Sm 抗体は、活動性と最もよく相関する","抗 dsDNA（double-stranded DNA：二本鎖DNA） 抗体と低補体は活動性・腎炎と関係する","SLE の活動期には、CRP（C-reactive protein：C反応性タンパク） が著しく上がるのが典型である"],"a":2,"cx":["SLE の 95% 以上で抗核抗体は陽性。陰性なら SLE は考えにくい（2019年の分類基準の入口条件）。","抗 Sm 抗体は SLE に特異的だが、活動性とは相関しない。","","SLE の活動期は CRP があまり上がらない（赤沈は上がる）。CRP が高ければ感染症・漿膜炎・関節炎を考える。"],"core":"SLE：抗核抗体（入口）、抗 dsDNA 抗体・低補体（活動性・腎炎）、抗 Sm 抗体（特異的）。CRP が低いのに赤沈が高い。","e":"2019 EULAR（European Alliance of Associations for Rheumatology：欧州リウマチ学会）/ACR（American College of Rheumatology：米国リウマチ学会） 分類基準：抗核抗体 80 倍以上を入口に、臨床（発熱・血球減少・神経・皮膚粘膜・漿膜・関節・腎）と免疫（抗リン脂質抗体・補体・SLE 特異的抗体）の点数で10点以上。\nほかの抗体：抗リボソーム P（精神症状）、抗 SS-A（新生児ループス・先天性房室ブロック）、抗ヒストン（薬剤誘発性ループス：プロカインアミド（アミサリン）・ヒドララジン・イソニアジド・TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬）。\n補体の先天的な欠損（C1q・C2・C4）は SLE を起こしやすい。","tg":[],"mt":["autoab","glomerular"]},{"id":"rheum-3ce0727e","f":"rheum","u":99,"o":300,"lv":2,"q":"ループス腎炎の治療について正しいものはどれか。","ch":["III・IV 型はステロイド＋MMF（mycophenolate mofetil：ミコフェノール酸モフェチル） か IVCY（intravenous cyclophosphamide：シクロホスファミド間欠静注）","ループス腎炎は腎生検をせず、尿所見だけで全例同じ治療をする","ヒドロキシクロロキン（プラケニル）は腎炎には効かないので中止する","腎炎の治療では、ステロイドは使わない"],"a":0,"cx":["","腎生検で病型（ISN/RPS（International Society of Nephrology/Renal Pathology Society） 分類）と活動性・慢性度を確かめ、治療を決める。","ヒドロキシクロロキンは禁忌がなければ SLE（systemic lupus erythematosus：全身性エリテマトーデス） の全員に勧められ、再燃・腎炎の悪化・血栓を減らす（網膜症の定期検査）。","ステロイドは寛解導入の基本（できるだけ早く減らす）。"],"core":"ループス腎炎（III・IV 型±V 型）：寛解導入＝ステロイド＋MMF か IVCY（低用量の Euro-Lupus 法）。ベリムマブ（ベンリスタ）・カルシニューリン阻害薬（ボクロスポリンは国内未承認、タクロリムス（プログラフ））を加える選択肢。維持は MMF かアザチオプリン（イムラン、アザニン）。","e":"ほかの SLE（systemic lupus erythematosus：全身性エリテマトーデス） の治療：皮膚・関節にはヒドロキシクロロキン、ベリムマブ（BLyS（B lymphocyte stimulator：B細胞活性化因子、BAFF） 阻害）、アニフロルマブ（I 型インターフェロン受容体阻害）。\nSLE の妊娠：病気が落ち着いてから計画妊娠。抗 SS-A（Sjögren syndrome A、Ro） 抗体陽性なら胎児の房室ブロックを監視、抗リン脂質抗体があれば低用量アスピリン±ヘパリン。MMF・シクロホスファミド・MTX（methotrexate：メトトレキサート） は催奇形性で妊娠前に中止。\nSLE の死因：感染症・腎不全・心血管病（早期の動脈硬化）。","tg":["ae"],"mt":["glomerular"]},{"id":"rheum-ee376dc4","f":"rheum","u":100,"o":301,"lv":3,"q":"45歳の女性。半年前から手指がこわばり、冷えると白→紫→赤に変わる。この1か月で皮膚の硬化が前腕から上腕・体幹に急に広がった。抗 RNA（ribonucleic acid：リボ核酸） ポリメラーゼ III 抗体が陽性。今朝から頭痛があり、血圧 196/110 mmHg、クレアチニンが 0.7 から 1.9 mg/dL に上がり、破砕赤血球が見られる。最も適切な治療はどれか。","ch":["血漿交換だけを行う","ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬で血圧を下げる","Ca 拮抗薬を少量使い、ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬は禁忌とする","高用量ステロイドのパルス療法"],"a":1,"cx":["血漿交換は TTP（thrombotic thrombocytopenic purpura：血栓性血小板減少性紫斑病） の治療。強皮症腎クリーゼの第一選択は ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬。","","ACE 阻害薬が第一選択で、腎機能が悪くても使う。Ca 拮抗薬は追加の薬。","高用量ステロイドは強皮症腎クリーゼの誘因になる（プレドニゾロン（プレドニン） 15 mg/日以上で危険が上がる）。"],"core":"強皮症腎クリーゼ＝びまん皮膚硬化型・早期・抗 RNA ポリメラーゼ III 抗体・ステロイド大量で起こりやすい。急な高血圧・急性腎障害・TMA（thrombotic microangiopathy：血栓性微小血管症）。ACE 阻害薬（カプトプリル（カプトリル））で治療する。","e":"強皮症の抗体と特徴：抗トポイソメラーゼ I（Scl-70）＝びまん型・間質性肺疾患、抗セントロメア＝限局型・肺高血圧（晩期）・PBC（primary biliary cholangitis：原発性胆汁性胆管炎）、抗 RNA ポリメラーゼ III＝急速な皮膚硬化・腎クリーゼ・癌の合併。\n間質性肺疾患：ミコフェノール酸モフェチル（セルセプト）・シクロホスファミド・トシリズマブ・リツキシマブ・ニンテダニブ。\n肺高血圧症：PAH（pulmonary arterial hypertension：肺動脈性肺高血圧症） の3系統の薬。\nレイノー現象・指尖潰瘍：Ca 拮抗薬、PDE5（phosphodiesterase 5：ホスホジエステラーゼ5） 阻害薬、ボセンタン（潰瘍の予防）、禁煙と保温。\n逆流性食道炎（下部食道の運動低下）・腸の偽性閉塞・小腸の細菌過剰増殖。","tg":["cs"]},{"id":"rheum-37d12ae4","f":"rheum","u":100,"o":302,"lv":2,"q":"抗 MDA5（melanoma differentiation-associated gene 5） 抗体陽性の皮膚筋炎について正しいものはどれか。","ch":["高齢者の悪性腫瘍の合併が、最も多い","急速進行性の間質性肺疾患が多く、早く強く治療する","CK（creatine kinase：クレアチンキナーゼ） が著しく上がり、筋力低下が最も目立つ","肺の病変はゆっくり進み、無治療で経過を見る"],"a":1,"cx":["悪性腫瘍の合併が多いのは抗 TIF1-γ 抗体・抗 NXP2 抗体陽性の成人の皮膚筋炎。","","抗 MDA5 抗体陽性例は筋症状が軽い（臨床的無筋症性皮膚筋炎：CADM（clinically amyopathic dermatomyositis：臨床的無筋症性皮膚筋炎））ことが多い。","急速進行性で致死率が高く、診断したらすぐに強力な治療をする。"],"core":"抗 MDA5 抗体陽性皮膚筋炎＝CADM（clinically amyopathic dermatomyositis：臨床的無筋症性皮膚筋炎）・急速進行性間質性肺疾患・フェリチン高値（予後不良の指標）。高用量ステロイド＋カルシニューリン阻害薬＋シクロホスファミド（エンドキサン）の3剤併用を早く始める。","e":"皮膚筋炎の皮疹：ヘリオトロープ疹（まぶたの紫紅色の腫れ）、Gottron 丘疹・徴候（手指の関節の伸側）、V ネック・ショール徴候、機械工の手（抗 ARS（aminoacyl-tRNA synthetase：アミノアシルtRNA合成酵素） 抗体）。\n抗体と特徴：抗 ARS（Jo-1 など）＝間質性肺疾患・関節炎・発熱・機械工の手、ステロイドは効くが再燃しやすい。抗 SRP（signal recognition particle：シグナル認識粒子）・抗 HMGCR（3-hydroxy-3-methylglutaryl-CoA reductase：HMG-CoA還元酵素）＝免疫介在性壊死性ミオパチー（CK 著明高値、HMGCR はスタチンとの関連）。抗 Mi-2＝典型的な皮膚筋炎で予後良好。\n封入体筋炎：高齢男性、大腿四頭筋と手指の屈筋の萎縮、免疫治療は効きにくい。","tg":["ae"],"mt":["ild","autoab"]},{"id":"rheum-fdb35581","f":"rheum","u":100,"o":303,"lv":2,"q":"シェーグレン病（シェーグレン症候群）について正しいものはどれか。","ch":["悪性リンパ腫（MALT（mucosa-associated lymphoid tissue：粘膜関連リンパ組織） リンパ腫など）の合併が多い","抗 SS-A（Sjögren syndrome A、Ro） 抗体は陰性のことがほとんどである","治療で唾液腺の機能は必ず元に戻る","腺外症状は起こらず、乾燥症状だけの病気である"],"a":0,"cx":["","抗 SS-A 抗体は約7割で陽性（抗 SS-B（Sjögren syndrome B、La） 抗体は約3割）。","乾燥症状は対症療法（人工涙液・ピロカルピン・セビメリンなど）が中心で、元に戻すことは難しい。","腺外症状として間質性肺疾患・尿細管性アシドーシス（遠位型）・間質性腎炎・末梢神経障害・紫斑・リンパ腫がある。"],"core":"シェーグレン病＝涙腺・唾液腺のリンパ球浸潤による乾燥（ドライアイ・ドライマウス）。抗 SS-A・SS-B（Sjögren syndrome B、La） 抗体、口唇小唾液腺生検。リンパ腫（とくに唾液腺の MALT リンパ腫）の危険が健常人の十数倍。","e":"リンパ腫の危険を示すサイン：持続する耳下腺の腫れ、紫斑（クリオグロブリン血症）、低補体（C4）、M 蛋白、脾腫・リンパ節腫大。\n妊娠：抗 SS-A 抗体で新生児ループス・先天性房室ブロック（約1〜2%）。妊娠16〜26週頃に胎児心拍を見る。ヒドロキシクロロキン（プラケニル）が再発を減らす可能性。\n乾燥症状：ムスカリン受容体作動薬（ピロカルピン（サラジェン）・セビメリン）、点眼（ジクアホソル（ジクアス）・レバミピド）、涙点プラグ。\n2023年に「シェーグレン症候群」から「シェーグレン病」へ呼び方が変わりつつある。","tg":[],"mt":["hemetumor","autoab"]},{"id":"rheum-f4eca3f0","f":"rheum","u":101,"o":304,"lv":3,"q":"74歳の女性。2週間前から両肩と両大腿の痛みとこわばりがあり、朝は着替えに時間がかかる。最近、右のこめかみが痛く、硬いものを噛むと顎がだるくなる。赤沈 98 mm/時、CRP（C-reactive protein：C反応性タンパク） 8.6 mg/dL。今朝から右眼がかすむ。最も適切な対応はどれか。","ch":["NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） で2週間様子を見る","側頭動脈の生検の結果が出るまで治療を待つ","リウマチ性多発筋痛症として少量のステロイド（10〜15 mg/日）だけを使う","高用量ステロイドをすぐに始め、側頭動脈の超音波・生検を手配する"],"a":3,"cx":["NSAIDs では GCA（giant cell arteritis：巨細胞性動脈炎） は治らず、失明の危険がある。","視力障害は失明の切迫で、治療を待ってはいけない（生検はステロイド開始後1〜2週以内なら診断できる）。","GCA（giant cell arteritis：巨細胞性動脈炎） の症状（頭痛・顎跛行・視力障害）があり、少量では足りない。プレドニゾロン（プレドニン） 40〜60 mg/日（視力障害があればパルス）。",""],"core":"巨細胞性動脈炎（GCA（giant cell arteritis：巨細胞性動脈炎））＝50歳以上・新しい頭痛・側頭動脈の圧痛・顎跛行・視力障害・赤沈著明高値。約半数でリウマチ性多発筋痛症（PMR（polymyalgia rheumatica：リウマチ性多発筋痛症））を合併。視力障害があれば直ちに高用量ステロイド。","e":"ステロイドを減らすための薬：トシリズマブ（IL-6（interleukin-6：インターロイキン6） 受容体阻害）、ウパダシチニブ（国内承認 2025年）。\n大型血管（大動脈とその分枝）の病変：大動脈瘤・解離の危険があり、画像で経過を見る。\nPMR：50歳以上、両肩・腰帯部の痛みとこわばり、赤沈・CRP 高値、少量のプレドニゾロン（12.5〜25 mg/日）が劇的に効く。効かなければ別の病気（関節リウマチ・悪性腫瘍・感染症）を考える。\n高安動脈炎：若い女性、上肢の脈の左右差・血管雑音、HLA-B52（ヒト白血球抗原 B52）、潰瘍性大腸炎の合併。","tg":["ae","cs"],"mt":["vasculitis"]},{"id":"rheum-93a61350","f":"rheum","u":101,"o":305,"lv":2,"q":"IgA（immunoglobulin A：免疫グロブリン A） 血管炎（Henoch-Schönlein 紫斑病）について正しいものはどれか。","ch":["下肢の触知性紫斑・腹痛・関節痛・腎炎","紫斑は顔と体幹に多く、下肢にはまれである","ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） が陽性になる小型血管炎である","血小板が著しく減って、紫斑が出る"],"a":0,"cx":["","紫斑は下肢・殿部（重力のかかる所）に多い。","IgA の免疫複合体による血管炎で、ANCA は陰性。","血小板数は正常。血管炎による紫斑（触れる紫斑）。"],"core":"IgA 血管炎＝IgA の免疫複合体が小血管に沈着。下肢の触知性紫斑・腹痛（腸重積・消化管出血）・関節痛・腎炎（IgA 腎症と同じ組織）。小児に多いが、成人は腎炎が重く慢性化しやすい。","e":"皮膚生検で血管壁への IgA 沈着（蛍光抗体法）。\n成人発症では悪性腫瘍の合併を探す。\n腎炎が重ければ（ネフローゼ・腎機能低下・半月体）ステロイド・免疫抑制薬。\n血管炎の大きさによる分類（Chapel Hill 2012）：大型（GCA（giant cell arteritis：巨細胞性動脈炎）・高安）、中型（結節性多発動脈炎・川崎病）、小型（ANCA 関連：MPA（microscopic polyangiitis：顕微鏡的多発血管炎）・GPA（granulomatosis with polyangiitis：多発血管炎性肉芽腫症）・EGPA（eosinophilic granulomatosis with polyangiitis：好酸球性多発血管炎性肉芽腫症）、免疫複合体：IgA 血管炎・クリオグロブリン血症性・抗 GBM（glomerular basement membrane：糸球体基底膜） 病・低補体性蕁麻疹様血管炎）。","tg":[],"mt":["glomerular","vasculitis"]},{"id":"rheum-b0b9d0c4","f":"rheum","u":101,"o":306,"lv":2,"q":"多発血管炎性肉芽腫症（GPA（granulomatosis with polyangiitis：多発血管炎性肉芽腫症））について正しいものはどれか。","ch":["日本では、MPO-ANCA（ミエロペルオキシダーゼに対する ANCA） 陽性の顕微鏡的多発血管炎より多い","上気道・肺・腎の病変が典型で、PR3-ANCA（プロテイナーゼ3に対する ANCA） が多い","喘息と好酸球増多が先行するのが特徴である","肉芽腫は形成せず、腎臓だけを障害する"],"a":1,"cx":["日本では MPO-ANCA 陽性の MPA（microscopic polyangiitis：顕微鏡的多発血管炎） が最も多い。","","喘息・好酸球増多の先行は EGPA（eosinophilic granulomatosis with polyangiitis：好酸球性多発血管炎性肉芽腫症）。","壊死性肉芽腫性炎症（上気道・肺）が特徴。"],"core":"GPA＝上気道（鞍鼻・中耳炎・副鼻腔炎）→肺（結節・空洞）→腎（糸球体腎炎）。PR3-ANCA（日本では MPO-ANCA 陽性例もある）。治療はステロイド＋リツキシマブ（またはシクロホスファミド（エンドキサン））、アバコパン（タブネオス）でステロイドを減らせる。","e":"MPA（microscopic polyangiitis：顕微鏡的多発血管炎）：高齢者、MPO-ANCA、RPGN（rapidly progressive glomerulonephritis：急速進行性糸球体腎炎）・肺胞出血・間質性肺炎、肉芽腫はない。\nEGPA（eosinophilic granulomatosis with polyangiitis：好酸球性多発血管炎性肉芽腫症）：喘息・副鼻腔炎→好酸球増多→血管炎（多発単神経炎・紫斑・心臓）、MPO-ANCA は約3〜4割で陽性。メポリズマブ（ヌーカラ）・ベンラリズマブ。\nANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） 関連血管炎の治療中は、ニューモシスチス肺炎の予防（ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 合剤（スルファメトキサゾール・トリメトプリム：バクタ））・感染症・骨粗鬆症に注意。\n寛解維持：リツキシマブの定期投与かアザチオプリン（イムラン、アザニン）。","tg":[],"mt":["vasculitis"]},{"id":"rheum-18c2c145","f":"rheum","u":101,"o":307,"lv":2,"q":"抗リン脂質抗体症候群（APS（antiphospholipid syndrome：抗リン脂質抗体症候群））について正しいものはどれか。","ch":["ループスアンチコアグラントは、APTT（activated partial thromboplastin time：活性化部分トロンボプラスチン時間） を短縮させる","血栓症か妊娠合併症＋抗体が12週以上あけて2回陽性","抗リン脂質抗体が1回陽性なら、症状がなくても APS と診断する","血栓症の再発予防には、DOAC（direct oral anticoagulant：直接経口抗凝固薬） がワルファリン（ワーファリン）より優れている"],"a":1,"cx":["ループスアンチコアグラントは試験管の中で APTT を延長させる（体の中では血栓をつくる）。","","抗体は一時的に陽性になる（感染症など）ことがあるので、12週以上あけて2回確かめる。症状がなければ APS ではない。","3種類とも陽性の高リスク APS や動脈血栓では、DOAC で血栓が増えた。ワルファリンが基本。"],"core":"APS＝血栓症（静脈・動脈・微小血管）か妊娠の合併症（繰り返す流産・子癇前症・胎盤機能不全）＋抗リン脂質抗体（ループスアンチコアグラント・抗カルジオリピン抗体・抗 β2GPI 抗体）の持続陽性。","e":"血栓症の治療：ワルファリン（PT-INR（プロトロンビン時間の国際標準比） 2〜3）。\n妊娠：低用量アスピリン＋ヘパリン（ワルファリンは催奇形性）。\n劇症型 APS（CAPS（catastrophic APS：劇症型抗リン脂質抗体症候群））：短期間に多臓器の血栓、抗凝固＋ステロイド＋血漿交換/IVIG（intravenous immunoglobulin：免疫グロブリン大量静注療法）。\nAPS の検査の注意：抗凝固薬を飲んでいるとループスアンチコアグラントの検査が偽陽性になることがある。\n血小板減少・網状皮斑・心臓弁膜症（Libman-Sacks 心内膜炎）・腎の微小血管症を伴うことがある。","tg":[]},{"id":"rheum-8c7be07d","f":"rheum","u":102,"o":308,"lv":2,"q":"成人発症スチル病（AOSD（adult-onset Still disease：成人発症スチル病））について正しいものはどれか。","ch":["弛張熱・サーモンピンク疹・フェリチン著明高値","感染症・悪性リンパ腫を除かなくても、診断できる","白血球は減少し、好中球はほとんどない","抗核抗体とリウマトイド因子が、高率に陽性になる"],"a":0,"cx":["","除外診断で、感染症・悪性腫瘍（とくにリンパ腫）・膠原病を必ず除く。","白血球（好中球）は増える。","抗核抗体・RF（rheumatoid factor：リウマトイド因子） は陰性（陰性であることが山口の分類基準の項目）。"],"core":"AOSD＝弛張熱（1日のうちに 39℃以上と平熱を行き来）＋熱と一緒に出るサーモンピンク疹＋関節痛＋咽頭痛＋好中球増加＋肝障害＋フェリチン著明高値。ステロイド、効かなければトシリズマブ（アクテムラ）・カナキヌマブ。","e":"マクロファージ活性化症候群（MAS（macrophage activation syndrome：マクロファージ活性化症候群））：血球減少・フェリチンの急上昇・トリグリセリド↑・フィブリノゲン↓・肝障害・DIC（disseminated intravascular coagulation：播種性血管内凝固）。命にかかわり、ステロイドパルス・シクロスポリン・エトポシドなど。\n不明熱で考える病気の1つ。\n家族性地中海熱：周期的な発熱（1〜3日）・漿膜炎（腹膜炎・胸膜炎）、MEFV（Mediterranean fever 遺伝子） 遺伝子、コルヒチンで予防（AA（amyloid A、AA アミロイドーシス） アミロイドーシスを防ぐ）。効かなければカナキヌマブ（イラリス）。","tg":[],"mt":["anemia"]},{"id":"rheum-e3c7e1f8","f":"rheum","u":102,"o":309,"lv":2,"q":"Behçet 病について正しいものはどれか。","ch":["主症状は乾燥症状で、抗 SS-A（Sjögren syndrome A、Ro） 抗体が陽性になる","血管病変（静脈血栓・動脈瘤）は起こらない","腸管 Behçet 病は、直腸に浅い潰瘍が連続するのが特徴","口腔内アフタ・外陰部潰瘍・ぶどう膜炎・皮膚症状"],"a":3,"cx":["乾燥症状と抗 SS-A 抗体はシェーグレン病。","血管型（静脈血栓・動脈瘤）、神経型、腸管型は特殊型として重い。","腸管 Behçet 病は回盲部の深い打ち抜き潰瘍（穿孔しやすい）。",""],"core":"Behçet 病＝4主症状（口腔内アフタ・外陰部潰瘍・眼症状・皮膚症状：結節性紅斑・毛嚢炎様皮疹）。HLA-B51（ヒト白血球抗原 B51）。針反応。特殊型（腸管・血管・神経）は予後に関わる。","e":"治療：粘膜皮膚症状にコルヒチン・アプレミラスト（口腔潰瘍）、眼病変にコルヒチン・シクロスポリン・インフリキシマブ・アダリムマブ、特殊型にステロイド・TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬。\n神経型では、シクロスポリン（ネオーラル）で誘発・悪化することがある。\n血管型の深部静脈血栓は、抗凝固薬より免疫抑制が中心（肺動脈瘤があれば抗凝固は出血の危険）。\nシルクロード沿い（日本・トルコ・中東）に多い。","tg":[]},{"id":"rheum-8d5ba846","f":"rheum","u":102,"o":310,"lv":2,"q":"体軸性脊椎関節炎（強直性脊椎炎を含む）の特徴として正しいものはどれか。","ch":["40歳未満で始まり、安静で悪化し運動で軽くなる腰痛","仙腸関節は侵されず、末梢の関節だけが侵される","リウマトイド因子が陽性で、手の小関節が対称性に侵される","高齢で始まり、動くと悪化し休むと軽くなる腰痛"],"a":0,"cx":["","仙腸関節炎は体軸性脊椎関節炎の中心的な病変（MRI（magnetic resonance imaging：磁気共鳴画像） で骨髄浮腫、X 線で骨びらん・硬化・強直）。","脊椎関節炎は血清反応陰性（RF（rheumatoid factor：リウマトイド因子） 陰性）で、下肢の大関節の少関節炎・付着部炎が多い。","これは機械的腰痛（変形性脊椎症・椎間板症など）の特徴。"],"core":"炎症性腰痛：40歳未満の発症・3か月以上・徐々に始まる・朝のこわばり・夜間に痛む・運動で軽快・安静で悪化。HLA-B27（日本人は陽性率が低い）、付着部炎（アキレス腱）、ぶどう膜炎、乾癬・炎症性腸疾患の合併。","e":"治療：運動療法、NSAIDs（第一選択）、効果不十分なら TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬・IL-17（interleukin-17：インターロイキン17） 阻害薬（セクキヌマブ（コセンティクス）・イキセキズマブ・ビメキズマブ）・JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬。従来の抗リウマチ薬（MTX（methotrexate：メトトレキサート））は体軸の病変には効かない。\n乾癬性関節炎：DIP（distal interphalangeal：遠位指節間） 関節・指趾炎（ソーセージ指）・爪の病変・付着部炎。\n反応性関節炎：尿道炎（クラミジア）・腸炎（サルモネラ・カンピロバクターなど）の1〜4週後の下肢の少関節炎・結膜炎。","tg":[]},{"id":"rheum-3a46c925","f":"rheum","u":103,"o":311,"lv":3,"q":"24歳の女性。1か月前から発熱、両手の関節痛、頬の紅斑（鼻をまたいで広がる）、口内炎がある。尿蛋白 1.8 g/gCr、尿沈渣に赤血球円柱。白血球 2,800/μL、血小板 9.8 万/μL、C3・C4 低値、抗核抗体 1,280 倍（均質型）、抗 dsDNA（double-stranded DNA：二本鎖DNA） 抗体高値。まず行う検査として最も重要なものはどれか。","ch":["頬の紅斑の皮膚生検だけ","骨髄穿刺・骨髄生検","腎生検（病型と活動性の評価）","両手の関節の MRI（magnetic resonance imaging：磁気共鳴画像） 検査"],"a":2,"cx":["皮膚の生検は診断の助けになるが、治療方針を決めるのは腎生検。","血球減少は SLE（systemic lupus erythematosus：全身性エリテマトーデス） で説明でき、まず骨髄生検の必要はない（ほかの原因が疑わしければ考える）。","","関節痛の評価より、腎炎の評価が予後と治療の決定に大事。"],"core":"SLE（systemic lupus erythematosus：全身性エリテマトーデス） に蛋白尿 0.5 g/gCr 以上や活動性の尿沈渣（赤血球円柱）があれば、腎生検で ISN/RPS（International Society of Nephrology/Renal Pathology Society） 分類と活動性・慢性度を評価して治療を決める。","e":"SLE の初期評価：血球・補体・抗 dsDNA、尿検査（蛋白・沈渣）、抗リン脂質抗体（血栓・妊娠のリスク）、感染症の検査（結核・B 型肝炎）、眼科（ヒドロキシクロロキン（プラケニル）を使う前）、骨密度。\n治療：ヒドロキシクロロキンは基本、ステロイドはできるだけ少なく短く、免疫抑制薬・生物学的製剤で減らす。\nSLE の発熱では感染症をまず除く（CRP（C-reactive protein：C反応性タンパク） が高ければ感染症を疑う）。","tg":["cs"],"mt":["autoab"]},{"id":"rheum-5836f71f","f":"rheum","u":103,"o":312,"lv":3,"q":"34歳の女性。冷えると手指が白くなり、指がソーセージのように腫れている。疲れやすく、関節痛と軽い筋力低下がある。抗 U1-RNP 抗体が高い力価で陽性。最近、労作時の息切れが強い。最も注意すべき合併症はどれか。","ch":["肺動脈性肺高血圧症","重症筋無力症","強皮症腎クリーゼだけ","甲状腺機能亢進症"],"a":0,"cx":["","重症筋無力症は MCTD（mixed connective tissue disease：混合性結合組織病） の典型的な合併症ではない。","腎クリーゼは全身性強皮症（とくに抗 RNA（ribonucleic acid：リボ核酸） ポリメラーゼ III 抗体）に典型で、MCTD（mixed connective tissue disease：混合性結合組織病） ではまれ。","MCTD（mixed connective tissue disease：混合性結合組織病） で甲状腺機能亢進症が特徴的に起こるわけではない。"],"core":"混合性結合組織病（MCTD（mixed connective tissue disease：混合性結合組織病））＝レイノー現象・手指の腫脹・抗 U1-RNP 抗体高力価＋SLE（systemic lupus erythematosus：全身性エリテマトーデス）・強皮症・筋炎の症状の混在。死因として肺動脈性肺高血圧症が重要で、心エコーで定期的にスクリーニングする。","e":"肺高血圧症の評価：心エコー（三尖弁逆流速度）、NT-proBNP（N 末端プロ脳性ナトリウム利尿ペプチド）、DLco（diffusing capacity for carbon monoxide：肺拡散能）、右心カテーテル。\nMCTD の PAH（pulmonary arterial hypertension：肺動脈性肺高血圧症） は免疫抑制療法（ステロイド・シクロホスファミド）が効くことがあり、肺血管拡張薬と組み合わせる。\n無菌性髄膜炎（NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） で誘発されることも）・三叉神経障害も特徴的。","tg":["cs"],"mt":["autoab"]},{"id":"rheum-f7d1466d","f":"rheum","u":104,"o":313,"lv":3,"q":"74歳の女性。昨日から右膝が赤く腫れて痛み、38.2℃の発熱がある。関節穿刺で黄色の混濁した関節液、白血球 32,000/μL（好中球 90%）、偏光顕微鏡で正の複屈折を示す菱形の結晶。グラム染色は陰性。X 線で膝の半月板に石灰化がある。正しい対応はどれか。","ch":["関節リウマチとして、メトトレキサート（リウマトレックス）を始める","偽痛風として治療し、培養結果まで感染を否定しない","結晶があるので、化膿性関節炎は完全に否定できる","尿酸を下げるため、ただちにアロプリノール（ザイロリック）を始める"],"a":1,"cx":["急性の単関節炎で、関節リウマチの経過ではない。","","結晶性関節炎と化膿性関節炎は合併しうる。培養の結果を確かめる。","アロプリノールは尿酸を下げる薬で、ピロリン酸カルシウムの病気には効かない。"],"core":"偽痛風（急性 CPP（calcium pyrophosphate：ピロリン酸カルシウム） 結晶性関節炎）＝高齢者の膝・手関節の急性関節炎、発熱も多い。正の複屈折の菱形の結晶、X 線で軟骨石灰化。NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）・関節内ステロイド注射・コルヒチン。","e":"背景の病気：副甲状腺機能亢進症、ヘモクロマトーシス、低マグネシウム血症、低ホスファターゼ症（若い人の CPPD（calcium pyrophosphate deposition：ピロリン酸カルシウム沈着症） では調べる）。\n手術後・入院中の高齢者の急な発熱で考える（環軸関節の偽痛風＝crowned dens 症候群：発熱・頸部痛、髄膜炎と間違えやすい）。\n痛風：負の複屈折の針状結晶、第1中足趾節関節に多い。","tg":["cs"]},{"id":"rheum-22f97762","f":"rheum","u":104,"o":314,"lv":3,"q":"35歳の男性。2週間前に下痢があった。数日前から両膝・左足関節が腫れ、両眼が赤い。排尿時の痛みもある。右踵の痛み（アキレス腱付着部）もある。関節液は無菌性で結晶はない。最も考えられる診断はどれか。","ch":["化膿性関節炎（淋菌）","関節リウマチ","痛風","反応性関節炎"],"a":3,"cx":["淋菌性関節炎では移動性の関節痛・腱鞘炎・膿疱性の皮疹があり、関節液や粘膜の培養・核酸増幅検査で淋菌が見つかる。","関節リウマチは手の小関節の対称性多関節炎が多く、腸炎の後の下肢の少関節炎・付着部炎・結膜炎は脊椎関節炎を考える。","関節液に結晶がない。",""],"core":"反応性関節炎＝腸炎（サルモネラ・シゲラ・エルシニア・カンピロバクター）や尿道炎（クラミジア）の1〜4週後の、下肢優位の非対称の少関節炎＋付着部炎＋結膜炎・尿道炎。HLA-B27（ヒト白血球抗原 B27） と関連（脊椎関節炎の1つ）。","e":"治療：NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）、関節内ステロイド注射、長引けばサラゾスルファピリジン（アザルフィジンEN）。クラミジアが見つかれば本人とパートナーを治療する。\n皮膚・粘膜の所見：連環状亀頭炎、膿漏性角化症（足底）。\n多くは数か月で治るが、慢性化することもある。","tg":["cs"]},{"id":"rheum-31f50487","f":"rheum","u":105,"o":315,"lv":3,"q":"58歳の男性。B 型肝炎の既往がある。数か月前から発熱・体重減少・筋肉痛があり、最近、右足が下垂し（腓骨神経麻痺）、左手のしびれも出た。下腿に網状皮斑と有痛性の皮下結節がある。腎機能はやや低下し、血圧が上がっている。ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） 陰性。腹部の血管造影で腎動脈・腸間膜動脈に多発する小動脈瘤がある。最も考えられる診断はどれか。","ch":["高安動脈炎","結節性多発動脈炎","IgA（immunoglobulin A：免疫グロブリン A） 血管炎","顕微鏡的多発血管炎"],"a":1,"cx":["高安動脈炎は若い女性の大動脈とその分枝の病変。","","IgA 血管炎は小血管の紫斑・腹痛・腎炎（IgA 沈着）。","MPA（microscopic polyangiitis：顕微鏡的多発血管炎） は ANCA（MPO（myeloperoxidase：ミエロペルオキシダーゼ））陽性が多く、糸球体腎炎・肺胞出血を起こす小型血管炎。小動脈瘤はない。"],"core":"結節性多発動脈炎（PAN（polyarteritis nodosa：結節性多発動脈炎））＝中型動脈の壊死性血管炎、ANCA 陰性。多発単神経炎・皮下結節・網状皮斑・腎血管性高血圧・腸間膜虚血・精巣痛。血管造影で小動脈瘤・狭窄。糸球体腎炎・肺病変は起こさない。","e":"B 型肝炎に関連する PAN：抗ウイルス薬（核酸アナログ）＋短期のステロイド＋血漿交換。\n特発性の PAN：ステロイド±シクロホスファミド（エンドキサン）。\n多発単神経炎（神経が一本ずつ障害される）は血管炎（PAN・ANCA 関連血管炎、とくに EGPA（eosinophilic granulomatosis with polyangiitis：好酸球性多発血管炎性肉芽腫症））を強く疑う所見。\nADA2（adenosine deaminase 2） 欠損症：若い発症の PAN 様の血管炎・脳梗塞。","tg":["cs"],"mt":["vasculitis","glomerular"]},{"id":"rheum-9454f1e0","f":"rheum","u":105,"o":316,"lv":3,"q":"66歳の女性。2か月前から階段を上りにくく、両腕を上げにくい。まぶたに紫紅色の腫れがあり、手指の関節の背側に紅斑がある。CK（creatine kinase：クレアチンキナーゼ） 2,400 U/L。抗 TIF1-γ 抗体が陽性。治療とともに行うべき検査として最も重要なものはどれか。","ch":["骨髄穿刺と骨髄生検だけ","頭部 MRI（magnetic resonance imaging：磁気共鳴画像） と脳波だけ","悪性腫瘍の全身検索","心臓カテーテル検査だけ"],"a":2,"cx":["骨髄の病気を疑う所見はない。","筋炎の評価に頭部の検査は必要ない。","","心筋の障害の評価（心電図・心エコー・トロポニン）は大切だが、カテーテルが第一ではない。"],"core":"成人の皮膚筋炎、とくに抗 TIF1-γ 抗体・抗 NXP2 抗体陽性は悪性腫瘍（卵巣癌・胃癌・肺癌・乳癌・大腸癌など）の合併が多い。診断時と、その後数年は定期的に検索する。","e":"治療：高用量ステロイド、免疫抑制薬（タクロリムス（プログラフ）・メトトレキサート・アザチオプリン）、難治例に IVIG（intravenous immunoglobulin：免疫グロブリン大量静注療法）。悪性腫瘍を治療すると筋炎も良くなることがある。\n嚥下障害（誤嚥性肺炎）・呼吸筋の障害・心筋炎にも注意。\n筋炎の評価：近位筋の筋力（MMT（manual muscle testing：徒手筋力テスト））、CK・アルドラーゼ、筋電図、筋 MRI（浮腫）、筋生検。","tg":["cs"],"mt":["autoab"]},{"id":"inf-5df7726c","f":"inf","u":106,"o":317,"lv":1,"q":"グラム染色の所見と考える菌の組み合わせで正しいものはどれか。","ch":["グラム陽性の連鎖状の球菌 ― 大腸菌","グラム陰性の双球菌（髄液） ― 肺炎球菌","グラム陰性の太い桿菌 ― 化膿レンサ球菌","グラム陽性・ブドウの房状の球菌 ― 黄色ブドウ球菌"],"a":3,"cx":["大腸菌はグラム陰性桿菌。連鎖状のグラム陽性球菌はレンサ球菌・腸球菌。","髄液のグラム陰性双球菌は髄膜炎菌。肺炎球菌はグラム陽性双球菌（ランセット型）。","レンサ球菌はグラム陽性球菌。",""],"core":"グラム陽性球菌：房状＝ブドウ球菌、連鎖状＝レンサ球菌・腸球菌、双球菌＝肺炎球菌。グラム陰性球菌：淋菌・髄膜炎菌・モラクセラ。グラム陰性桿菌：大腸菌・クレブシエラ・緑膿菌・インフルエンザ菌（小さい）。グラム陽性桿菌：リステリア・コリネバクテリウム・クロストリジウム・バシラス・ノカルジア（分枝）。","e":"グラム染色で見えにくい・染まらない：マイコプラズマ（細胞壁がない）、クラミジア・リケッチア（細胞内）、レジオネラ（染まりにくい）、抗酸菌（抗酸菌染色）、スピロヘータ（梅毒）。\n貪食像（好中球が菌を取り込んでいる）は、その菌が原因である可能性を高める。\n喀痰の質：扁平上皮が少なく好中球が多いものが良い検体（Geckler 分類）。","tg":[],"mt":["pneumonia","csf"]},{"id":"inf-a1d297eb","f":"inf","u":106,"o":318,"lv":1,"q":"抗菌薬と主な対象の組み合わせで正しいものはどれか。","ch":["セフトリアキソン（ロセフィン） ― 緑膿菌の第一選択","セファゾリン（セファメジン α） ― MSSA（methicillin-susceptible S. aureus：メチシリン感受性黄色ブドウ球菌）・レンサ球菌","メトロニダゾール（フラジール） ― MRSA（methicillin-resistant Staphylococcus aureus：メチシリン耐性黄色ブドウ球菌） とレンサ球菌","バンコマイシン（塩酸バンコマイシン） ― 大腸菌などのグラム陰性桿菌"],"a":1,"cx":["セフトリアキソンは緑膿菌に効かない。抗緑膿菌薬はセフタジジム・セフェピム・タゾバクタム/ピペラシリン・カルバペネム・キノロン・アミノグリコシド。","","メトロニダゾールは嫌気性菌（バクテロイデス・クロストリジウム）と原虫（アメーバ・トリコモナス・ジアルジア）。","バンコマイシンはグラム陽性菌だけに効く（外膜を通れない）。"],"core":"MSSA の第一選択＝セファゾリン（または抗ブドウ球菌ペニシリン）。MRSA＝バンコマイシン・ダプトマイシン・リネゾリド。緑膿菌＝抗緑膿菌活性のある β-ラクタム。嫌気性菌（横隔膜より下）＝メトロニダゾール・β-ラクタマーゼ阻害薬配合剤・カルバペネム。","e":"セフェム系が効かない菌：腸球菌・リステリア（アンピシリン（ビクシリン））、MRSA、非定型菌。\n非定型菌（マイコプラズマ・クラミジア・レジオネラ）：マクロライド・テトラサイクリン・キノロン。\nMSSA の菌血症にバンコマイシンを続けると、セファゾリンより成績が悪い。感受性がわかったら変える。\n抗菌薬の副作用：ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 合剤（高 K・骨髄抑制）、アミノグリコシド（腎・耳）、キノロン（QT（QT 間隔、心室の興奮の始まりから回復まで） 延長・腱障害・低血糖・大動脈瘤）、リネゾリド（血小板減少）、カルバペネム（バルプロ酸（デパケン）の濃度を急に下げる）。","tg":[],"mt":["abx"]},{"id":"inf-51bb6585","f":"inf","u":106,"o":319,"lv":1,"q":"感染症法の分類と届け出について正しいものはどれか。","ch":["腸管出血性大腸菌感染症は、届け出が不要である","麻疹は五類感染症で、届け出は1週間以内でよい","結核は二類感染症で、ただちに届け出る","エボラ出血熱は、五類感染症である"],"a":2,"cx":["腸管出血性大腸菌感染症は三類感染症で、ただちに届け出る（無症状の保菌者も）。","麻疹は五類だが全数把握で、ただちに届け出る（風疹も同じ）。","","エボラ出血熱は一類感染症。"],"core":"一類（エボラ・ペストなど）・二類（結核・ジフテリア・SARS（severe acute respiratory syndrome：重症急性呼吸器症候群） など）・三類（コレラ・細菌性赤痢・腸管出血性大腸菌感染症・腸チフスなど）・四類（A 型・E 型肝炎、マラリア、つつが虫病、日本紅斑熱、SFTS（severe fever with thrombocytopenia syndrome：重症熱性血小板減少症候群）、レジオネラなど）はただちに届け出る。五類は全数（梅毒・HIV（human immunodeficiency virus：ヒト免疫不全ウイルス）・麻疹・風疹・侵襲性髄膜炎菌感染症など）と定点。","e":"麻疹・風疹・侵襲性髄膜炎菌感染症はただちに、ほかの五類全数（梅毒・HIV 感染症・カルバペネム耐性腸内細菌目細菌感染症・劇症型溶血性レンサ球菌感染症など）は7日以内。\n新型コロナウイルス感染症は2023年5月から五類（定点）。\n届け出は医師の義務で、守秘義務に反しない。\n結核の入院勧告：喀痰塗抹陽性など感染性が高い場合。","tg":[],"mt":["infectlaw","csf"]},{"id":"inf-d18211f9","f":"inf","u":107,"o":320,"lv":1,"q":"血液培養の採り方として正しいものはどれか。","ch":["カテーテルからだけ採れば、末梢から採る必要はない","発熱のピークを待ってから採らないと、陽性にならない","抗菌薬の前に、別々の部位から2セット採る","1セットだけで十分で、2セット目は無駄である"],"a":2,"cx":["カテーテル関連血流感染を疑うときは、カテーテルと末梢の両方から採る（陽性になる時間の差で判断）。","熱のピークを待つ必要はない。疑ったらすぐ採る。","","1セットでは感度が落ち、皮膚の常在菌（コアグラーゼ陰性ブドウ球菌など）の汚染と区別できない。"],"core":"血液培養は抗菌薬の前に2セット以上（1セット＝好気＋嫌気、各 8〜10 mL）。悪寒戦慄・敗血症・感染性心内膜炎を疑うときは必ず。","e":"1セットだけ陽性のコアグラーゼ陰性ブドウ球菌・コリネバクテリウム・バシラスは汚染のことが多い。黄色ブドウ球菌・レンサ球菌・グラム陰性桿菌・カンジダは1本でも本物として扱う。\n黄色ブドウ球菌菌血症：必ず感染症の専門家と診る。血液培養の陰性化の確認、心エコー（経食道も考える）、感染源（カテーテル・骨・関節）の除去、2週以上（合併症があれば4〜6週）の静注抗菌薬。\n感染性心内膜炎を疑えば3セット以上。","tg":[],"mt":["abx"]},{"id":"inf-ed4020cc","f":"inf","u":107,"o":321,"lv":2,"q":"敗血症の初期対応について正しいものはどれか。","ch":["第一選択の昇圧薬は、ドパミンである","原因菌が分かるまで、抗菌薬は始めない","培養を採り、1時間以内に抗菌薬を始め、乳酸を測る","平均血圧が低くても、輸液はせずに昇圧薬だけを使う"],"a":2,"cx":["第一選択はノルアドレナリン（平均血圧 65 mmHg 以上を目標）。足りなければバソプレシンを加える。","抗菌薬の開始が1時間遅れるごとに死亡が増える。培養を採ったらすぐ始める。","","低血圧・乳酸高値には、まず細胞外液を 30 mL/kg を目安に（心機能・反応を見ながら）。"],"core":"敗血症＝感染症による臓器障害（SOFA（Sequential Organ Failure Assessment） スコア 2点以上の上昇）。敗血症性ショック＝輸液をしても昇圧薬が必要で、乳酸 2 mmol/L 超。対応：培養→抗菌薬（1時間以内）→輸液→ノルアドレナリン→感染源の除去（ドレナージ）。","e":"qSOFA（呼吸数 22 以上・意識の変化・収縮期血圧 100 以下）は病棟外で重症化を疑うきっかけ。\nステロイド：昇圧薬が必要なショックでヒドロコルチゾン（200 mg/日程度）を考える。\n抗菌薬の選び方：感染部位・市中か院内か・耐性菌の危険（最近の入院・抗菌薬の使用）・免疫状態から、原因菌を想定して選ぶ。培養結果が出たら狭いものへ変える（de-escalation）。\n感染源の除去：膿瘍のドレナージ、閉塞した尿路・胆道の解除、感染したカテーテルの抜去、壊死組織の切除。","tg":["gl"],"mt":["abx","shock"]},{"id":"inf-33422e50","f":"inf","u":108,"o":322,"lv":3,"q":"76歳の男性。2日前から発熱と咳、膿性の痰があり受診した。意識は清明、呼吸数 26/分、SpO₂ 89%（室内気）、血圧 112/70 mmHg、BUN（blood urea nitrogen：血中尿素窒素） 28 mg/dL。胸部X線で右下葉に浸潤影。喀痰のグラム染色で莢膜をもつグラム陽性双球菌を多数認め、好中球による貪食像がある。最も考えられる原因菌と治療の組み合わせはどれか。","ch":["インフルエンザ菌 ― バンコマイシン（塩酸バンコマイシン）の点滴","緑膿菌 ― アモキシシリン（サワシリン、パセトシン）の内服","レジオネラ ― セファゾリン（セファメジン α）の点滴","肺炎球菌 ― アンピシリン（かセフトリアキソン（ロセフィン））"],"a":3,"cx":["インフルエンザ菌はグラム陰性の小さな短桿菌。バンコマイシンは効かない。","緑膿菌はグラム陰性桿菌。アモキシシリンは効かない。","レジオネラはグラム染色で見えにくく、β-ラクタム系は細胞内に届かず効かない（キノロン・マクロライド）。",""],"core":"市中肺炎で最も多いのは肺炎球菌（グラム陽性双球菌・莢膜）。A-DROP（年齢・脱水 BUN 21 以上・呼吸 SpO₂ 90% 以下・意識・血圧）2項目以上は中等症（入院）。尿中抗原も役立つ。","e":"A-DROP：A（男性70歳以上・女性75歳以上）、D（BUN 21 以上か脱水）、R（SpO₂ 90% 以下か PaO₂ 60 以下）、O（意識障害）、P（収縮期血圧 90 以下）。0＝軽症（外来）、1〜2＝中等症、3＝重症、4〜5（ショックなら1つでも）＝超重症。この例は年齢・BUN・SpO₂ の3項目で重症。\n非定型肺炎（マイコプラズマ・クラミジア・レジオネラ）：若い・頑固な咳・痰が少ない・聴診所見が少ない・白血球が上がらない。マクロライド・テトラサイクリン・キノロン。\nレジオネラ：温泉・循環式の風呂、高熱・意識障害・低ナトリウム・肝障害・CK（creatine kinase：クレアチンキナーゼ） 上昇、尿中抗原（主に血清群1）。\n誤嚥性肺炎：高齢・嚥下障害、口腔内の嫌気性菌も考える（スルバクタム・アンピシリン）。","tg":["cs"],"mt":["pneumonia"]},{"id":"inf-ed4f5545","f":"inf","u":108,"o":323,"lv":2,"q":"肺結核の診断と治療について正しいものはどれか。","ch":["塗抹陽性でも、外来の一般の待合で診察してよい","IGRA（interferon-gamma release assay：インターフェロンγ遊離試験） が陽性なら、活動性結核と確定してよい","喀痰検査を3回、治療は4剤2か月→2剤4か月","治療は、症状が良くなれば1か月でやめてよい"],"a":2,"cx":["塗抹陽性は感染性が高い。空気感染対策（陰圧個室・N95 マスク）が必要で、保健所に届け出る。","IGRA（QFT（QuantiFERON、IGRAの一つ）・T-SPOT（T-SPOT.TB、IGRAの一つ））は結核菌に感染したことを示すが、活動性か潜在性かは区別できない。","","短くやめると再発・耐性化する。服薬を確かめる（DOTS（directly observed treatment, short-course：直接服薬確認療法））。"],"core":"肺結核の標準治療：イソニアジド（イスコチン）＋リファンピシン（リファジン）＋エタンブトール（エサンブトール、エブトール）＋ピラジナミド（2か月）→ イソニアジド＋リファンピシン（4か月）。80歳以上・肝障害などでピラジナミドを使えなければ9か月。","e":"副作用：イソニアジド（肝障害・末梢神経障害→ビタミン B6）、リファンピシン（肝障害・体液がオレンジ色・多くの薬の濃度を下げる：DOAC（direct oral anticoagulant：直接経口抗凝固薬）・ワルファリン・ステロイド・経口避妊薬・抗 HIV（human immunodeficiency virus：ヒト免疫不全ウイルス） 薬・タクロリムス）、エタンブトール（視神経障害：視力・色覚の検査）、ピラジナミド（肝障害・高尿酸血症）。\n潜在性結核感染症：生物学的製剤・免疫抑制の前、接触者健診で IGRA 陽性 → イソニアジド6〜9か月（またはリファンピシン4か月）。\n結核性胸膜炎：リンパ球優位の滲出性胸水・ADA（adenosine deaminase：アデノシンデアミナーゼ） 高値。\n粟粒結核：免疫が落ちた人、全身に小粒状影、骨髄・肝生検、髄膜炎の合併。","tg":[]},{"id":"inf-fb373f19","f":"inf","u":108,"o":324,"lv":2,"q":"肺 MAC（Mycobacterium avium complex） 症（非結核性抗酸菌症）について正しいものはどれか。","ch":["人から人へ空気感染するので、隔離が必要である","中高年女性の結節・気管支拡張型、多剤併用で治療","治療は2週間で終わる（短期間の内服）","クラリスロマイシン（クラリス）単剤での治療が、最も勧められる"],"a":1,"cx":["NTM（nontuberculous mycobacteria：非結核性抗酸菌） は環境（土・水・浴室）から感染し、人から人へはほぼうつらない。隔離は不要。","","菌の陰性化から1年以上（全体で1年半〜2年以上）続ける。","マクロライド単剤はすぐに耐性化する。必ず多剤で。"],"core":"肺 MAC 症＝日本で増えている。中高年の非喫煙女性に多い結節・気管支拡張型（中葉・舌区）と、男性・喫煙者の線維空洞型。治療はクラリスロマイシン（またはアジスロマイシン（ジスロマック））＋エタンブトール（エサンブトール、エブトール）＋リファンピシン（リファジン）、重症・空洞はアミカシン（アミカシン、吸入はアリケイス）を加える。","e":"難治例：アミカシンリポソーム吸入。\n診断の基準：画像の所見＋喀痰で2回以上の培養陽性（または気管支洗浄液で1回）。\n血清の抗 GPL（glycopeptidolipid、MAC の細胞壁成分）-core IgA（immunoglobulin A：免疫グロブリン A） 抗体（MAC の診断の補助）。\n軽い結節・気管支拡張型は治療をせず経過を見ることもある。\n肺 M. abscessus 症は治療が難しい。","tg":["ae"]},{"id":"inf-abfc95f9","f":"inf","u":109,"o":325,"lv":2,"q":"尿路感染症について正しいものはどれか。","ch":["無症候性細菌尿は、妊婦などを除いて治療しない","急性腎盂腎炎の原因菌は、腸球菌が最も多い","男性の尿路感染症は、単純性として3日間の治療で十分である","尿の培養で菌が出れば、症状がなくても全員に抗菌薬を使う"],"a":0,"cx":["","最も多いのは大腸菌（ESBL（extended-spectrum β-lactamase：基質特異性拡張型 β-ラクタマーゼ） 産生菌が増えている）。","男性の尿路感染症は複雑性として扱い（前立腺炎・解剖学的異常を考える）、長めに治療する。","無症候性細菌尿を治療しても予後は良くならず、耐性菌と副作用が増える。"],"core":"無症候性細菌尿で治療する：妊婦（腎盂腎炎・早産の予防）、粘膜から出血する泌尿器の処置の前。それ以外（高齢者・糖尿病・カテーテル留置）は治療しない。","e":"急性腎盂腎炎：発熱・肋骨脊柱角の叩打痛、血液培養も採る。閉塞（結石・腫瘍）があれば緊急にドレナージ（腎瘻・尿管ステント）。\n単純性膀胱炎（若い女性）：ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 合剤（スルファメトキサゾール・トリメトプリム：バクタ）・セファレキシン・ホスホマイシン（キノロンは耐性が多く第一選択にしない）。\nカテーテル関連：不要なカテーテルを抜くことが最大の予防。\n気腫性腎盂腎炎：糖尿病、ガスの産生、重症（ドレナージ・腎摘）。","tg":[]},{"id":"inf-5e4bf67c","f":"inf","u":109,"o":326,"lv":3,"q":"82歳の女性。誤嚥性肺炎で入院し、アンピシリン・スルバクタム（ユナシン-S）で治療して10日目。1日に7〜8回の水様下痢と 38℃の発熱が出て、白血球 18,000/μL。便の GDH（glutamate dehydrogenase、C. difficile の抗原） 抗原陽性、トキシン陽性。最も適切な治療はどれか。","ch":["メトロニダゾール（フラジール）の静注だけで治療する","バンコマイシン（内服）かフィダキソマイシン（ダフクリア）","バンコマイシン（塩酸バンコマイシン）の点滴静注で治療する","ロペラミドで下痢を止めて、経過を見る"],"a":1,"cx":["メトロニダゾールは軽症の代替。重症（白血球 15,000 以上・Cr 上昇）や内服できるなら第一選択にしない。静注だけは重症イレウスのときの併用。","","バンコマイシンの静注は腸管に届かず、CDI（Clostridioides difficile infection：C. difficile 感染症） には効かない（内服で使う）。","止痢薬は毒素の排出を遅らせ、中毒性巨大結腸症の危険がある。"],"core":"Clostridioides difficile 感染症（CDI（Clostridioides difficile infection：C. difficile 感染症））＝抗菌薬使用後の下痢。原因抗菌薬をできればやめ、バンコマイシン内服かフィダキソマイシン（再発が少ない）。重症（白血球 15,000 以上・Cr 1.5 以上）でも内服。","e":"再発の予防：フィダキソマイシン、ベズロトクスマブ（毒素 B に対する抗体、再発の危険が高い人に）。\n感染対策：芽胞はアルコールで死なないので、石けんと流水の手洗い、接触予防策、次亜塩素酸での環境の清掃。\n危険因子：抗菌薬（とくにクリンダマイシン・キノロン・セフェム）、PPI（proton pump inhibitor：プロトンポンプ阻害薬）、高齢、入院。\n劇症型（ショック・イレウス・巨大結腸）：バンコマイシン内服（高用量）＋メトロニダゾール静注、外科へ相談。","tg":["cs"],"mt":["abx"]},{"id":"inf-c6c378a7","f":"inf","u":109,"o":327,"lv":3,"q":"28歳の男性。前日から高熱と激しい頭痛、嘔吐があり、意識がもうろうとしてきた。項部硬直とケルニッヒ徴候がある。下肢に点状の紫斑が出てきた。頭部 CT（computed tomography：コンピュータ断層撮影） は正常。最も適切な対応はどれか。","ch":["血液培養→すぐにデキサメタゾンと抗菌薬→腰椎穿刺","解熱鎮痛薬だけで、翌日まで様子を見る","まず MRI（magnetic resonance imaging：磁気共鳴画像） を撮り、異常がなければ帰宅させる","腰椎穿刺の結果が出るまで、抗菌薬を始めない"],"a":0,"cx":["","命にかかわる緊急疾患。","画像の検査で治療を遅らせてはいけない。","細菌性髄膜炎は治療の遅れが死亡・後遺症に直結する。穿刺の前でも、遅れるなら抗菌薬を先に。"],"core":"細菌性髄膜炎（成人）＝発熱・頭痛・項部硬直・意識障害。紫斑＋急激な経過は髄膜炎菌を疑う。デキサメタゾン（抗菌薬の直前か同時）＋セフトリアキソン（ロセフィン）＋バンコマイシン（50歳以上・免疫不全ではアンピシリン（ビクシリン）を加えてリステリアに備える）。","e":"髄液所見：細菌性＝多核球優位・糖低下（髄液/血糖比 0.4 未満）・蛋白上昇。ウイルス性＝リンパ球優位・糖正常。結核性・真菌性（クリプトコッカス）＝リンパ球優位・糖低下・蛋白上昇、ADA（adenosine deaminase：アデノシンデアミナーゼ）・墨汁染色・抗原。\n腰椎穿刺の前に CT を撮る場合：意識障害・巣症状・けいれん・乳頭浮腫・免疫不全（脳膿瘍などで脳ヘルニアの危険）。CT を待つなら先に抗菌薬。\n髄膜炎菌：濃厚接触者に予防投与（リファンピシン（リファジン）・シプロフロキサシンなど）、飛沫予防策。補体欠損（とくに補体阻害薬を使っている人）は重症化しやすい。\nデキサメタゾンは肺炎球菌の髄膜炎で死亡・難聴を減らす。","tg":["cs"],"mt":["csf","abx"]},{"id":"inf-e71ff2e4","f":"inf","u":110,"o":328,"lv":3,"q":"45歳の男性。2週間前から 38℃台の発熱と倦怠感が続いている。3週間前に歯科で抜歯を受けた。心尖部に新しい汎収縮期雑音があり、手掌に無痛性の小さな出血斑、爪の下に線状出血がある。血液培養2セットから緑色レンサ球菌が出た。経胸壁心エコーで僧帽弁に 12 mm の可動性の疣腫がある。正しいものはどれか。","ch":["血液培養が陽性でも、心エコーで疣腫がなければ否定できる","抜歯が原因なので、経口抗菌薬を1週間使えば十分である","感染性心内膜炎として静注抗菌薬を4週以上","疣腫は、抗凝固薬で溶かすのが治療の中心である"],"a":2,"cx":["経胸壁エコーの感度は限られ、疑いが強ければ経食道エコーを行う。","感染性心内膜炎は長期の静注抗菌薬が必要。","","抗凝固薬は疣腫を溶かさず、脳出血（感染性動脈瘤）の危険を上げる。"],"core":"感染性心内膜炎＝修正 Duke 基準（大基準：典型菌の血液培養・心エコーの疣腫/弁輪膿瘍/新しい逆流）。緑色レンサ球菌（口腔）は亜急性、黄色ブドウ球菌は急性・破壊的。","e":"手術を考える：弁の破壊による心不全（最も多い適応）、抗菌薬で制御できない感染（弁輪膿瘍・真菌・耐性菌）、塞栓の予防（10 mm 超の大きな可動性の疣腫）。\n末梢の所見：Osler 結節（有痛性、指先）、Janeway 病変（無痛性、手掌・足底）、爪下線状出血、Roth 斑（眼底）、結膜の点状出血。\n合併症：脳塞栓・感染性脳動脈瘤、脾梗塞・膿瘍、腎炎（免疫複合体）、椎体炎。\n予防投与（抜歯前のアモキシシリン（サワシリン、パセトシン））は、人工弁・心内膜炎の既往・一部の先天性心疾患など高リスクの人に限る。\n血液培養が陰性の心内膜炎：抗菌薬の先行投与、HACEK（心内膜炎を起こす発育の遅いグラム陰性桿菌のグループ）、Bartonella、Coxiella（Q 熱）、真菌。","tg":["cs"],"mt":["abx"]},{"id":"inf-303b1acc","f":"inf","u":110,"o":329,"lv":3,"q":"62歳の男性。糖尿病がある。2日前に左下腿の傷から赤みが広がり、今日は皮膚の色が紫色になり、触った範囲を超える強い痛みがある。体温 39.4℃、血圧 84/50 mmHg。皮膚に水疱があり、触ると握雪感がある。CK（creatine kinase：クレアチンキナーゼ） 2,800 U/L。最も適切な対応はどれか。","ch":["蜂窩織炎としてセファレキシン（ケフレックス）を内服させ、外来で経過を見る","MRI（magnetic resonance imaging：磁気共鳴画像） を撮り、結果を見てから翌日に治療を決める","抗菌薬は使わず、患部を冷やして安静にする","広域抗菌薬と緊急の外科的デブリドマン"],"a":3,"cx":["見た目に比べて強すぎる痛み・ショック・水疱・握雪感・CK 上昇は壊死性軟部組織感染症のサイン。外来治療は危険。","画像で手術を遅らせてはいけない。疑ったら外科へ（試験切開で診断）。","壊死性筋膜炎は時間単位で進み、死亡率が高い。",""],"core":"壊死性筋膜炎＝外科的デブリドマン（最も大事）＋広域抗菌薬（グラム陽性・陰性・嫌気性をカバー）＋クリンダマイシン（毒素の産生を抑える）。A群溶血性レンサ球菌や混合感染、ビブリオ・バルニフィカス（肝硬変・海水・生の魚介）。","e":"LRINEC（Laboratory Risk Indicator for Necrotizing Fasciitis） スコア（CRP（C-reactive protein：C反応性タンパク）・白血球・Hb・Na・Cr・血糖）が補助になるが、低くても否定できない。\nレンサ球菌性毒素性ショック症候群（劇症型溶連菌感染症）：急な多臓器不全、ペニシリン＋クリンダマイシン、免疫グロブリン。\nガス壊疽（クロストリジウム）：外傷・手術後、溶血。\nFournier 壊疽：会陰部の壊死性筋膜炎（糖尿病）。\n蜂窩織炎との区別：蜂窩織炎は境界不明瞭な紅斑・熱感・腫脹で、全身状態は保たれることが多い。","tg":["cs"],"mt":["abx"]},{"id":"inf-348291a4","f":"inf","u":111,"o":330,"lv":2,"q":"HIV（human immunodeficiency virus：ヒト免疫不全ウイルス） 感染症について正しいものはどれか。","ch":["診断がついたら CD4（CD4 陽性 T 細胞、ヘルパー T 細胞） 数にかかわらず、早く抗 HIV 療法（ART（antiretroviral therapy：抗 HIV 療法））を始める","CD4（CD4 陽性 T 細胞、ヘルパー T 細胞） 数が 200/μL を下回るまで ART（antiretroviral therapy：抗 HIV 療法） は始めない","ニューモシスチス肺炎の予防は CD4（CD4 陽性 T 細胞、ヘルパー T 細胞） 数が 50/μL 未満になってから始める","ART（antiretroviral therapy：抗 HIV 療法） でウイルス量が検出限界未満でも、性行為で他の人にうつる"],"a":0,"cx":["","今は CD4 数にかかわらず全員に早く始めることが勧められる。","ニューモシスチス肺炎の予防（ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 合剤（スルファメトキサゾール・トリメトプリム：バクタ））は CD4 200/μL 未満で始める。","ウイルス量が検出限界未満を6か月以上保てば、性行為で他の人にうつさない（U＝U）。"],"core":"HIV＝全員に早期の ART（多くはインテグラーゼ阻害薬を含む2〜3剤）。日和見感染症の予防：CD4 200 未満でニューモシスチス（ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 合剤（スルファメトキサゾール・トリメトプリム：バクタ））、100 未満でトキソプラズマ（抗体陽性なら）、50 未満で MAC（ウイルス量が抑えられていれば不要とされる）。","e":"日和見感染症の治療を始めたあと ART を始めると、免疫が戻って炎症が悪化すること（IRIS（immune reconstitution inflammatory syndrome：免疫再構築症候群））がある。ニューモシスチス肺炎は2週以内に ART を始める。クリプトコッカス髄膜炎・結核性髄膜炎は ART を少し遅らせる。\nHIV を疑う：性感染症（梅毒・淋菌・B型肝炎・アメーバ赤痢）、帯状疱疹（若い人・多発）、口腔カンジダ、原因不明の体重減少・リンパ節腫脹、急性 HIV 感染症（伝染性単核球症に似る）。\n曝露前予防（PrEP（pre-exposure prophylaxis：曝露前予防））・曝露後予防（PEP（post-exposure prophylaxis：曝露後予防）：72時間以内）。\nニューモシスチス肺炎：β-D グルカン高値、両側のすりガラス影、LDH（lactate dehydrogenase：乳酸脱水素酵素） 上昇。ST 合剤、PaO₂ 70 Torr 未満ならステロイドを加える。","tg":[]},{"id":"inf-0690a9b5","f":"inf","u":111,"o":331,"lv":2,"q":"梅毒について正しいものはどれか。","ch":["急増しており、ペニシリン（筋注か内服）で治療する","第2期梅毒の皮疹は、強いかゆみを伴うのが特徴である","TP（Treponema pallidum：梅毒トレポネーマ） 抗体は治療で陰性になり、効果の判定に使う","神経梅毒は、感染から数十年たたないと起こらない"],"a":0,"cx":["","第2期の皮疹（バラ疹・手掌足底の皮疹・扁平コンジローマ）はかゆみが乏しい。","TP 抗体（梅毒トレポネーマ抗体）は治っても陽性が続く。治療効果は RPR（非トレポネーマ）の低下で見る。","神経梅毒（髄膜炎・眼梅毒・耳梅毒）は早期にも起こりうる。"],"core":"梅毒：第1期（硬性下疳・無痛性の鼠径リンパ節腫脹）→ 第2期（バラ疹・手掌足底の皮疹・扁平コンジローマ・脱毛）→ 潜伏 → 晩期。RPR（活動性・治療効果）と TP 抗体（感染の既往）を組み合わせて読む。","e":"治療：ベンジルペニシリンベンザチン（ステルイズ）の筋注（早期は1回、晩期・時期不明は週1回を3回）、またはアモキシシリン（サワシリン、パセトシン）内服。神経梅毒はペニシリン G の大量静注。\nJarisch-Herxheimer 反応：治療を始めて数時間後の発熱・悪寒・皮疹の悪化（菌が壊れるため）。\n先天梅毒を防ぐため、妊婦健診で調べる。\n梅毒を見たら HIV（human immunodeficiency virus：ヒト免疫不全ウイルス） など他の性感染症も調べ、パートナーも治療する。\n生物学的偽陽性（RPR だけ陽性）：抗リン脂質抗体症候群・SLE（systemic lupus erythematosus：全身性エリテマトーデス）・妊娠など。","tg":[]},{"id":"inf-21e70aa9","f":"inf","u":112,"o":332,"lv":3,"q":"58歳の男性。山で農作業をした10日後から 39℃の発熱があり受診した。体幹に紅斑が広がり、右鼠径部に黒い痂皮がある。肝酵素が軽く上がり、CRP（C-reactive protein：C反応性タンパク） 12 mg/dL。最も適切な治療はどれか。","ch":["バンコマイシン（グリコペプチド系）","セファゾリン（第1世代セフェム）","アモキシシリン（ペニシリン系）","ドキシサイクリン（かミノサイクリン（ミノマイシン））"],"a":3,"cx":["バンコマイシンはリケッチアに効かない。","β-ラクタム系はリケッチア（細胞内寄生）に効かない。","β-ラクタム系はリケッチアに効かない。",""],"core":"ダニ媒介のリケッチア症（つつが虫病・日本紅斑熱）＝発熱・発疹・刺し口（黒い痂皮）の三徴。テトラサイクリン系（ドキシサイクリン・ミノサイクリン）を疑った時点ですぐ始める。日本紅斑熱の重症例ではキノロンの併用を考える。","e":"つつが虫病：秋〜初冬（と春）、全国。日本紅斑熱：春〜秋、西日本（太平洋側）に多く、手掌の発疹・重症化しやすい。\n重症熱性血小板減少症候群（SFTS（severe fever with thrombocytopenia syndrome：重症熱性血小板減少症候群））：マダニ、西日本、発熱・消化器症状・血小板減少・白血球減少・意識障害、致死率が高い。ファビピラビル（国内承認 2024年）。ネコ・イヌからの感染、患者の血液・体液から医療者への感染もある。\nライム病（北海道）：遊走性紅斑。\nダニを見つけたら無理に引き抜かず、皮膚科などで取ってもらう。","tg":["ae","cs"]},{"id":"inf-4d4c739d","f":"inf","u":112,"o":333,"lv":3,"q":"35歳の女性。2週間前にアフリカ（ナイジェリア）から帰国した。3日前から 40℃の発熱・悪寒・頭痛がある。予防内服はしていない。血小板 5.2 万/μL、総ビリルビン 3.1 mg/dL。最も優先すべき検査はどれか。","ch":["デングウイルスの IgG（immunoglobulin G：免疫グロブリン G） 抗体を2週後に測る","血液塗抹（ギムザ染色）とマラリア迅速キット","便の虫卵検査と便培養","胸部 CT（computed tomography：コンピュータ断層撮影） と喀痰の抗酸菌検査"],"a":1,"cx":["デング熱も考えるが、熱帯熱マラリアは急速に重症化するのでまず除く（抗体の結果を待たない）。","","便の検査では、命にかかわる熱帯熱マラリアを見逃す。","胸部 CT ではマラリアは診断できない。"],"core":"アフリカからの帰国後の発熱＝まず熱帯熱マラリアを除く（血液塗抹・迅速診断キット）。1回陰性でも、12〜24時間ごとに繰り返す。重症（意識障害・腎障害・高寄生率など）なら静注のアルテスネイト。","e":"潜伏期でしぼる：10日未満＝デング熱・チクングニア・リケッチア、10日以上＝マラリア・腸チフス・ウイルス性肝炎・結核。\nデング熱：発熱・頭痛・眼の奥の痛み・発疹・白血球減少・血小板減少、NS1（non-structural protein 1、デングウイルスの抗原） 抗原。NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）・アスピリンは出血の危険から避ける。重症デング（2回目の別の型の感染）。\n腸チフス：比較的徐脈・バラ疹、血液培養、セフトリアキソン（ロセフィン）・アジスロマイシン（キノロン耐性が多い）。\n三日熱・卵形マラリアは肝臓に休眠体が残るので、プリマキン（G6PD（glucose-6-phosphate dehydrogenase：グルコース-6-リン酸脱水素酵素） 欠損症を調べてから）。","tg":["cs"]},{"id":"inf-a556030f","f":"inf","u":113,"o":334,"lv":3,"q":"58歳の男性。急性骨髄性白血病の化学療法中。好中球 200/μL。今朝から 38.6℃の発熱があるが、ほかに症状はなく、血圧は保たれている。まず行う対応として最も適切なのはどれか。","ch":["血液培養2セット後、すぐにセフェピム（マキシピーム）などを始める","解熱薬だけで、24時間様子を見る","感染源がわかるまで、抗菌薬は始めない","まず抗真菌薬だけを始め、抗菌薬は使わない"],"a":0,"cx":["","解熱薬で様子を見るのは危険。","発熱性好中球減少症は急速に敗血症になる。60分以内の抗菌薬が目標。","抗真菌薬は、広域抗菌薬で4〜7日たっても熱が続くときなどに考える（経験的・先制的治療）。"],"core":"発熱性好中球減少症（好中球 500 未満か 1,000 未満で 500 未満に下がる見込み、腋窩 37.5℃以上）＝血液培養→抗緑膿菌 β-ラクタム（セフェピム・タゾバクタム/ピペラシリン・メロペネム）を1時間以内に。ショック・カテーテル感染・MRSA（methicillin-resistant Staphylococcus aureus：メチシリン耐性黄色ブドウ球菌） 保菌などではバンコマイシン（塩酸バンコマイシン）を加える。","e":"MASCC（Multinational Association for Supportive Care in Cancer） スコアで低リスクなら経口抗菌薬・外来治療も考える。\n好中球減少が長く続くと：アスペルギルス（CT（computed tomography：コンピュータ断層撮影） の halo sign・ガラクトマンナン抗原）、カンジダ（β-D グルカン）、ムーコル。\n予防：高リスクの化学療法ではキノロンの予防内服、G-CSF（colony-stimulating factor：コロニー刺激因子）。\n感染源の診察：口腔・肛門周囲（直腸診は避ける）・カテーテル刺入部・肺・皮膚。","tg":["cs"],"mt":["abx","shock"]},{"id":"inf-49528056","f":"inf","u":113,"o":335,"lv":2,"q":"カンジダ血症について正しいものはどれか。","ch":["血液培養のカンジダは汚染なので、治療しない","治療は、フルコナゾール（ジフルカン）が全例で第一選択である","カテーテルは残したままでも、治療成績は変わらない","カテーテルを抜き、眼内炎を調べ、陰性化から2週間"],"a":3,"cx":["血液培養のカンジダは1本でも本物として治療する。","重症・最近アゾールを使った人・C. glabrata・C. krusei などではエキノキャンディン系（ミカファンギン（ファンガード）・カスポファンギン）が第一選択。","カテーテルを残すと治りにくく、再発しやすい。",""],"core":"カンジダ血症＝エキノキャンディン系（重症・耐性の危険）かフルコナゾール。中心静脈カテーテルの抜去、眼科診察（眼内炎）、血液培養の陰性化から14日以上。","e":"危険因子：中心静脈カテーテル、高カロリー輸液、広域抗菌薬、腹部手術、好中球減少、ステロイド。\nCandida auris：多剤耐性で院内に広がる新興の真菌。\nクリプトコッカス：鳥（ハト）の糞、免疫不全者の髄膜炎、墨汁染色・抗原。アムホテリシン B（ファンギゾン、アムビゾーム）＋フルシトシン（アンコチル）→フルコナゾール。\n喀痰のカンジダは、多くは定着で治療しない。","tg":[]},{"id":"inf-95b631ea","f":"inf","u":113,"o":336,"lv":2,"q":"薬剤耐性菌と治療の組み合わせで正しいものはどれか。","ch":["ESBL（extended-spectrum β-lactamase：基質特異性拡張型 β-ラクタマーゼ） 産生大腸菌の菌血症 ― セフトリアキソン（ロセフィン）","カルバペネム耐性腸内細菌目細菌 ― アンピシリン（ビクシリン）","MRSA（methicillin-resistant Staphylococcus aureus：メチシリン耐性黄色ブドウ球菌） 菌血症 ― バンコマイシン（塩酸バンコマイシン）かダプトマイシン（キュビシン）","MRSA（methicillin-resistant Staphylococcus aureus：メチシリン耐性黄色ブドウ球菌） 肺炎 ― ダプトマイシン（高用量）"],"a":2,"cx":["ESBL 産生菌は第3世代セフェムを分解する。重症の菌血症ではカルバペネム系が第一選択。","CRE（carbapenem-resistant Enterobacterales：カルバペネム耐性腸内細菌目細菌） にはアンピシリンは効かない。新しい β-ラクタマーゼ阻害薬の合剤（セフタジジム・アビバクタムなど）やコリスチン、専門家に相談。","","ダプトマイシンは肺のサーファクタントで不活化されるので、肺炎には使えない（リネゾリド（ザイボックス）・バンコマイシン）。"],"core":"MRSA＝バンコマイシン（TDM（therapeutic drug monitoring：薬物血中濃度モニタリング） で腎障害を防ぐ）・ダプトマイシン（肺炎は不可・CK（creatine kinase：クレアチンキナーゼ） 上昇）・リネゾリド（血小板減少・セロトニン症候群）。ESBL＝カルバペネム系（軽症の尿路感染は感受性のある経口薬も）。","e":"耐性菌を増やさないために（抗菌薬適正使用）：培養を採ってから始める、結果を見て狭いものへ、期間を必要最小限に、感染症でないもの（無症候性細菌尿・ウイルス性の上気道炎）に使わない。\n接触予防策（ガウン・手袋・個室）と手指衛生で院内の広がりを防ぐ。\nPK/PD：β-ラクタム系＝時間依存（TAM（time above MIC）：1日の投与回数を増やす・持続投与）、アミノグリコシド・キノロン＝濃度依存（1日1回で高い濃度）、バンコマイシン＝AUC（area under the curve：血中濃度曲線下面積）/MIC（minimum inhibitory concentration：最小発育阻止濃度）。","tg":[],"mt":["abx"]},{"id":"inf-6b3301b0","f":"inf","u":114,"o":337,"lv":2,"q":"感染経路と予防策の組み合わせで正しいものはどれか。","ch":["インフルエンザ ― 空気予防策（陰圧個室が必須）","麻疹・水痘・結核 ― 空気予防策（陰圧個室・N95 マスク）","Clostridioides difficile ― アルコールの手指消毒だけで十分","疥癬（通常型）― 空気予防策"],"a":1,"cx":["インフルエンザは飛沫予防策（サージカルマスク・個室か集団隔離）。","","CDI（Clostridioides difficile infection：C. difficile 感染症） の芽胞はアルコールで死なない。石けんと流水の手洗い＋接触予防策。","疥癬は接触予防策（角化型疥癬は感染力が強く、より厳重な接触予防策）。"],"core":"空気感染＝麻疹・水痘（播種性帯状疱疹を含む）・結核の3つ。飛沫＝インフルエンザ・髄膜炎菌・マイコプラズマ・風疹・百日咳など。接触＝MRSA（methicillin-resistant Staphylococcus aureus：メチシリン耐性黄色ブドウ球菌）・耐性菌・CDI（Clostridioides difficile infection：C. difficile 感染症）・ノロウイルス・疥癬など。標準予防策はすべての患者に。","e":"新型コロナウイルス感染症：飛沫・エアロゾル。エアロゾルの出る処置（挿管・吸引）では N95。\nノロウイルス：アルコールが効きにくく、次亜塩素酸ナトリウムで消毒。嘔吐物の処理に注意。\n医療者の針刺し：B型肝炎（ワクチン未接種なら HBIG（hepatitis B immunoglobulin：抗 HBs ヒト免疫グロブリン）＋ワクチン）、C型肝炎（経過観察、感染すれば DAA（direct-acting antiviral：直接作用型抗ウイルス薬））、HIV（2時間以内を目標に抗 HIV 薬の予防内服）。\n医療者の抗体検査とワクチン：麻疹・風疹・水痘・ムンプスは2回接種、B型肝炎。","tg":[],"mt":["csf","abx"]},{"id":"inf-0506b858","f":"inf","u":114,"o":338,"lv":2,"q":"インフルエンザの治療について正しいものはどれか。","ch":["重症・高リスクなら48時間を過ぎても抗ウイルス薬を考える","発症から48時間を過ぎたら、どんな人にも抗ウイルス薬は無意味","バロキサビル（ゾフルーザ）では、耐性ウイルスができることはない","小児・若者の解熱には、アスピリンが最も勧められる"],"a":0,"cx":["","重症・入院例では48時間を過ぎても効果が期待され、使うことが勧められる。","バロキサビル（キャップ依存性エンドヌクレアーゼ阻害）では、とくに小児で耐性変異が出やすい。","小児・若者のアスピリンは Reye 症候群（脳症・肝障害）の危険があり避ける。解熱はアセトアミノフェン（カロナール）。"],"core":"インフルエンザの抗ウイルス薬：オセルタミビル（内服5日）、ザナミビル（リレンザ）・ラニナミビル（吸入）、ペラミビル（点滴）、バロキサビル（1回内服）。発症48時間以内が基本だが、重症・高リスクは時間を問わず考える。","e":"高リスク：65歳以上、妊婦、慢性の心肺疾患・糖尿病・腎疾患、免疫不全、高度肥満、施設入所者。\n合併症：細菌性肺炎（肺炎球菌・黄色ブドウ球菌）、脳症（小児）、心筋炎。\n予防投与：家族などの濃厚接触者のうち高リスクの人にオセルタミビルなど（保険適用外）。\n新型コロナウイルス感染症の治療：重症化リスクのある人にニルマトレルビル・リトナビル（併用薬との相互作用が多い）・モルヌピラビル・エンシトレルビル、重症にはレムデシビル（ベクルリー）・デキサメタゾン・トシリズマブ・バリシチニブ。","tg":[]},{"id":"inf-508d2252","f":"inf","u":114,"o":339,"lv":3,"q":"19歳の男性。1週間前から発熱・咽頭痛・倦怠感がある。両側の後頸部リンパ節が腫れ、扁桃に白苔、脾臓を触れる。白血球 12,000/μL（リンパ球 60%、異型リンパ球 18%）、AST（aspartate aminotransferase）・ALT（alanine aminotransferase） が軽く上昇。溶連菌迅速検査は陰性。正しいものはどれか。","ch":["アンピシリン（ビクシリン）などは皮疹が出やすく使わない","診断は、VCA（viral capsid antigen）-IgG（immunoglobulin G：免疫グロブリン G） 陽性だけで確定する","脾腫があっても、すぐに激しい運動をしてよい","β-ラクタム系抗菌薬を、10日間しっかり使う"],"a":0,"cx":["","VCA-IgG は既往感染でも陽性。急性感染は VCA-IgM（immunoglobulin M：免疫グロブリン M） 陽性・EBNA（EBV nuclear antigen） 抗体陰性。","脾破裂の危険があり、少なくとも3〜4週は接触の多いスポーツ・激しい運動を控える。","伝染性単核球症に抗菌薬は効かない（細菌の重複感染がなければ不要）。"],"core":"伝染性単核球症（EB（Epstein-Barr） ウイルス）＝発熱・咽頭痛（偽膜を伴う扁桃炎）・後頸部リンパ節腫脹・脾腫・肝障害・異型リンパ球。アンピシリンで高率に皮疹。治療は対症療法。","e":"CMV（cytomegalovirus：サイトメガロウイルス）・急性 HIV（human immunodeficiency virus：ヒト免疫不全ウイルス） 感染症・トキソプラズマ・HHV-6（human herpesvirus 6：ヒトヘルペスウイルス6） でも似た症状（伝染性単核球症様症候群）。性交渉歴があれば HIV を調べる。\n合併症：脾破裂、上気道の閉塞（ステロイド）、溶血性貧血・血小板減少、髄膜炎、HLH（血球貪食症候群）。\n慢性活動性 EB ウイルス感染症：発熱・リンパ節腫脹・肝脾腫が長く続く、予後不良。","tg":["cs"]},{"id":"inf-e8c5ccfe","f":"inf","u":114,"o":340,"lv":2,"q":"帯状疱疹について正しいものはどれか。","ch":["腎機能で量を調節した抗ウイルス薬を早く始める","鼻尖部に皮疹があっても、眼の合併症は起こらない","帯状疱疹は、人にうつることはない","帯状疱疹後神経痛は、若い人に多い"],"a":0,"cx":["","鼻尖部の皮疹（Hutchinson 徴候：鼻毛様体神経）は眼部帯状疱疹の合併を示す。眼科で診る。","水痘にかかったことのない人には、水疱の内容物から水痘としてうつる。播種性の帯状疱疹は空気感染予防策。","帯状疱疹後神経痛は高齢者に多い。"],"core":"帯状疱疹＝水痘・帯状疱疹ウイルスの再活性化。神経の支配に一致した痛みと水疱。発症早期（72時間以内が目安）に抗ウイルス薬（バラシクロビル（バルトレックス）・ファムシクロビル：腎機能で減量、アメナメビル（アメナリーフ）：腎機能で調整不要）。","e":"バラシクロビル・アシクロビルは腎機能低下で蓄積し、意識障害（アシクロビル（ゾビラックス）脳症）・腎障害を起こす。高齢者・透析患者は減量。\n帯状疱疹後神経痛：プレガバリン（リリカ）・ミロガバリン・三環系抗うつ薬・神経ブロック。\nRamsay Hunt 症候群（顔面神経麻痺・耳の水疱・難聴）。\n予防：組換え帯状疱疹ワクチン（50歳以上・免疫抑制者、2025年から65歳などで定期接種）。\n免疫不全者の帯状疱疹は播種・内臓病変（肝炎・肺炎・脳炎）を起こしうるので静注のアシクロビル。","tg":["ae"]},{"id":"inf-8b9a1c43","f":"inf","u":114,"o":341,"lv":3,"q":"32歳の男性。海外旅行から帰国して10日後に、38℃の発熱・咳・鼻汁・結膜充血が出た。3日後に耳の後ろから顔・体へ広がる紅斑が出た。頬粘膜に白い小さな斑点がある。ワクチンの接種歴は1回。最も適切な対応はどれか。","ch":["空気感染予防策をとり、保健所へ届け出る","妊婦の医療従事者に担当させる","飛沫予防策だけで一般の外来の待合で診察してよい","抗菌薬で治療し、届け出は不要である"],"a":0,"cx":["","免疫のない人・妊婦は担当させない。抗体が十分ある職員が担当する。","麻疹は空気感染。同じ空間にいるだけで感染しうる。","麻疹は全数届出の感染症（ただちに）。抗菌薬は効かない（細菌の合併症は別）。"],"core":"麻疹＝カタル期（発熱・咳・鼻汁・結膜充血）→ Koplik 斑 → いったん解熱して再び高熱とともに発疹（耳後部から全身へ）。空気感染で感染力が非常に強い。ただちに保健所へ届け出る（5類・全数・直ちに）。","e":"接触者：72時間以内の緊急ワクチン、6日以内の免疫グロブリン（ワクチンを打てない人）。\n合併症：肺炎（死因として多い）、中耳炎、脳炎、亜急性硬化性全脳炎（数年後）。\n修飾麻疹：ワクチン1回など免疫が不十分な人で症状が軽く、典型的でない。\n風疹：発熱・発疹・後頸部/耳介後部のリンパ節腫脹、妊娠初期の感染で先天性風疹症候群（難聴・白内障・心疾患）。","tg":["cs"],"mt":["infectlaw"]},{"id":"inf-8cf89295","f":"inf","u":115,"o":342,"lv":3,"q":"58歳の男性。糖尿病がある。2週間前から発熱が続き、右上腹部の痛みがある。CT（computed tomography：コンピュータ断層撮影） で肝右葉に 6 cm の多房性の低吸収域があり、辺縁が造影される。血液培養で Klebsiella pneumoniae が出た。治療として最も適切なのはどれか。","ch":["抗菌薬を3日間だけ使い、症状が消えたら終了","ドレナージと長期の抗菌薬、転移性感染も確認","診断と治療のため、肝切除をすぐに行う","抗アメーバ薬（メトロニダゾール（フラジール））だけで治療"],"a":1,"cx":["肝膿瘍は4〜6週間程度の抗菌薬が必要。","","多くはドレナージと抗菌薬で治る。肝切除はまれ。","アメーバ性肝膿瘍は単房性が多く、男性間性交渉・海外渡航歴。この例は Klebsiella が血液から出ており、細菌性。"],"core":"化膿性肝膿瘍＝胆道系の感染（胆石・腫瘍）や門脈からの感染。アジアでは Klebsiella pneumoniae（高病原性）による肝膿瘍が多く、糖尿病で起こりやすく、眼内炎・髄膜炎・肺膿瘍などの転移性感染を起こす。","e":"ドレナージの目安：5 cm 以上など。小さいものは抗菌薬だけで治ることもある。\n大腸癌が原因（門脈から）の Klebsiella・Streptococcus 肝膿瘍があり、大腸内視鏡を考える。\nアメーバ性肝膿瘍：赤痢アメーバ、アンチョビソース状の膿、抗体検査、メトロニダゾール＋腸管内の嚢子にパロモマイシン（アメパロモ）。","tg":["cs"],"fig":["portal"],"mt":["csf","abx"]},{"id":"inf-c8cb53c1","f":"inf","u":115,"o":343,"lv":3,"q":"72歳の男性。腰の痛みが3週間続き、最近は夜間も痛む。微熱があり、CRP（C-reactive protein：C反応性タンパク） 9.2 mg/dL。2か月前に尿路感染症で入院していた。MRI（magnetic resonance imaging：磁気共鳴画像） で L3〜4 の椎間板と隣り合う椎体に炎症所見がある。まず行うべきことはどれか。","ch":["ステロイドを開始して、炎症を抑える","血液培養（陰性なら生検）で原因菌を確かめる","鎮痛薬だけを使い、それ以上の検査はしない","原因菌を調べずに、すぐに2週間の抗菌薬を使う"],"a":1,"cx":["ステロイドは感染を悪化させる。","","化膿性脊椎炎は治療が長期になるので、原因菌を確かめることが大事。","全身状態が安定していれば、培養をとってから始める（敗血症・神経症状なら急ぐ）。治療期間は6週以上が目安。"],"core":"化膿性脊椎炎（椎体椎間板炎）＝高齢者・糖尿病・菌血症の既往（尿路・皮膚・カテーテル・心内膜炎）。安静時・夜間の腰痛、発熱、CRP 高値。MRI が最も鋭敏。原因菌：黄色ブドウ球菌が最多、大腸菌など。","e":"感染性心内膜炎の合併を考えて心エコー（とくに黄色ブドウ球菌・レンサ球菌）。\n結核性脊椎炎（脊椎カリエス）：ゆっくり進む、胸椎〜腰椎、椎間板が比較的保たれ、傍脊柱の冷膿瘍。\n腰痛の危険なサイン（red flags）：発熱、がんの既往、体重減少、50歳以上の新しい腰痛、夜間痛、神経症状、免疫抑制、外傷。\n硬膜外膿瘍：背部痛・発熱・神経症状 → 緊急の除圧。","tg":["cs"]},{"id":"inf-ec2d7a5c","f":"inf","u":115,"o":344,"lv":2,"q":"感染性腸炎の原因と特徴の組み合わせで正しいものはどれか。","ch":["カンピロバクター ― 生の牡蠣を食べた数時間後に嘔吐が中心","EHEC（enterohemorrhagic E. coli：腸管出血性大腸菌） O157 ― 血便、のちに HUS（hemolytic uremic syndrome：溶血性尿毒症症候群） のことがある","ノロウイルス ― 抗菌薬で治療すると早く治る","黄色ブドウ球菌（毒素型） ― 鶏肉の生食の2〜5日後に血便"],"a":1,"cx":["カンピロバクターは鶏肉（生・加熱不足）の2〜5日後の下痢・発熱・腹痛・血便。後に Guillain-Barré 症候群。","","ノロウイルスに抗菌薬は効かない。脱水の補正が治療の中心。","黄色ブドウ球菌の毒素型は食後1〜6時間の嘔吐が中心（おにぎり・弁当）。発熱は少ない。"],"core":"EHEC（O157 など）＝牛肉・生野菜、3〜5日の潜伏期、腹痛と水様便→血便、発熱は軽い。5〜10% で HUS（とくに小児・高齢者）。止痢薬は使わない。抗菌薬の是非は議論がある。3類感染症で届け出。","e":"ほかの原因：\n・サルモネラ：卵・鶏肉、発熱、菌血症（高齢者・免疫不全で血管感染）\n・腸炎ビブリオ：海産物、夏\n・ウェルシュ菌：大量調理のカレー・煮物、腹痛と下痢\n・セレウス菌：チャーハン（嘔吐型）\n・エルシニア：豚肉、回盲部の炎症（虫垂炎に似る）\n・アニサキス：生のサバ・イカ、激しい胃痛（内視鏡で除去）\n旅行者下痢症：毒素原性大腸菌が多い。","tg":[],"mt":["infectlaw","abx"]},{"id":"inf-e3296409","f":"inf","u":115,"o":345,"lv":3,"q":"65歳の男性。アルコール依存症で脾臓の摘出歴がある。2日前に飼い犬に手を咬まれた。今日から高熱と意識障害があり、血圧 76/40 mmHg、四肢に紫斑が広がっている。血小板 3.1万/μL、DIC（disseminated intravascular coagulation：播種性血管内凝固） を伴う。最も考えられる原因菌はどれか。","ch":["Clostridioides difficile","Streptococcus pyogenes（咬傷とは無関係）","Mycoplasma pneumoniae","Capnocytophaga canimorsus"],"a":3,"cx":["C. difficile は抗菌薬使用後の腸炎で、咬傷とは関係しない。","化膿レンサ球菌も劇症化するが、イヌ咬傷・無脾・アルコール依存の組み合わせはカプノサイトファーガを強く示す。","マイコプラズマは呼吸器感染症で、咬傷からの敗血症は起こさない。",""],"core":"イヌ・ネコ咬傷の後の電撃性敗血症＝Capnocytophaga canimorsus（無脾・アルコール依存・免疫不全で重症）。咬傷感染の主な菌：Pasteurella multocida（ネコに多い、数時間〜1日で急な蜂窩織炎）、口腔内の嫌気性菌、黄色ブドウ球菌。","e":"咬傷の治療：十分な洗浄、縫合は原則避ける（顔などは例外）、アモキシシリン（サワシリン、パセトシン）・クラブラン酸（予防も含む）、破傷風の予防、狂犬病（日本は清浄国だが海外での咬傷は暴露後の予防接種）。\nネコひっかき病：Bartonella henselae、リンパ節腫脹。\n脾摘後：肺炎球菌・髄膜炎菌・インフルエンザ菌b型のワクチン、発熱時はすぐ受診。","tg":["cs"]},{"id":"inf-2a2e1c04","f":"inf","u":115,"o":346,"lv":3,"q":"74歳の女性。畑仕事で足に小さな刺し傷を負い、10日後から口が開きにくく、首と背中がこわばってきた。物音で全身の筋肉がけいれんする。意識は清明。破傷風トキソイドの接種歴は不明。最も適切な対応はどれか。","ch":["意識がはっきりしているので、筋弛緩薬を処方して帰宅","まず腰椎穿刺を行い、髄膜炎として治療する","抗菌薬だけを使えば、毒素の作用はすぐに消える","破傷風免疫グロブリン・傷の処置・入院で全身管理"],"a":3,"cx":["けいれん・喉頭けいれん・自律神経の嵐で急変しうる。入院（集中治療）が必要。","意識は清明で開口障害・後弓反張・刺激によるけいれんは破傷風に典型。髄膜炎ではない。","すでに神経に結合した毒素は抗菌薬では消えない。中和されていない毒素を免疫グロブリンで中和する。",""],"core":"破傷風＝Clostridium tetani の毒素（テタノスパスミン）が抑制性の神経伝達を止める。開口障害（牙関緊急）→ 痙笑・後弓反張・全身のけいれん（意識は清明）。破傷風免疫グロブリン・傷のデブリドマン・メトロニダゾール・鎮静/筋弛緩・気道管理。","e":"治った後も免疫はできないので、破傷風トキソイドの接種を行う。\n外傷時の予防：汚染された傷で、接種歴が不明か3回未満ならトキソイド＋免疫グロブリン。3回以上でも最終接種から5年以上（汚染創）ならトキソイド。\n高齢者は小児期の定期接種がなかった世代が多い。","tg":["cs"]},{"id":"inf-83d28d57","f":"inf","u":115,"o":347,"lv":3,"q":"70歳の男性。沖縄出身。COPD（chronic obstructive pulmonary disease：慢性閉塞性肺疾患） の増悪でプレドニゾロン（プレドニン） 40 mg/日を始めて10日後、腹痛・下痢・呼吸状態の悪化があり、グラム陰性桿菌の菌血症と髄膜炎を起こした。喀痰と便に線虫の幼虫が多数見られる。最も考えられる病態はどれか。","ch":["蟯虫症（肛門周囲）","糞線虫の過剰感染","アニサキス症（胃）","エキノコックス症（肝）"],"a":1,"cx":["蟯虫は肛門周囲のかゆみが主で、重症化しない。","","アニサキスは生の魚介を食べた数時間後の激しい胃痛で、免疫抑制で播種しない。","エキノコックス（北海道）は肝臓の嚢胞性病変を起こす。"],"core":"糞線虫症＝南西諸島・東南アジアの出身者・HTLV-1（human T-cell leukemia virus type 1：ヒト T 細胞白血病ウイルス1型） 感染者に多い。ステロイドなどの免疫抑制で幼虫が大量に体内を移行し（過剰感染）、腸内細菌を連れて敗血症・髄膜炎を起こし、致死率が高い。イベルメクチンで治療。","e":"ステロイド・免疫抑制薬を始める前、流行地の出身者・HTLV-1 陽性者では糞線虫を調べ（便検査・抗体）、陽性なら先に治療する。\n好酸球増多はステロイドで隠されることがある。\n寄生虫と食べ物：アニサキス（サバ・イカ）、日本海裂頭条虫（サケ・マス）、肺吸虫（サワガニ・イノシシ肉）、旋毛虫（クマ肉）、肝吸虫（淡水魚）。","tg":["cs"],"mt":["csf"]},{"id":"inf-adb5cb2e","f":"inf","u":116,"o":348,"lv":3,"q":"64歳の女性。関節リウマチでプレドニゾロン（プレドニン） 15 mg/日とメトトレキサート（リウマトレックス）を使っている。1週間前から乾いた咳と息切れが急に悪化した。SpO₂ 88%（室内気）。CT（computed tomography：コンピュータ断層撮影） で両側の広いすりガラス影、血清 β-D グルカン高値、LDH（lactate dehydrogenase：乳酸脱水素酵素） 上昇。予防の ST（ST 部分、心電図の QRS の終わりから T 波の始まりまで） 合剤（スルファメトキサゾール・トリメトプリム：バクタ）は飲んでいなかった。最も考えられる診断と治療はどれか。","ch":["細菌性肺炎 ― セファゾリン（セファメジン α）の点滴","肺 MAC（Mycobacterium avium complex） 症 ― クラリスロマイシン（クラリス）の単剤","ニューモシスチス肺炎 ― ST 合剤（治療量）","インフルエンザ肺炎 ― 抗菌薬なしで経過観察"],"a":2,"cx":["すりガラス影・β-D グルカン高値・免疫抑制は細菌性肺炎より PCP（Pneumocystis pneumonia：ニューモシスチス肺炎） を示す。","MAC はゆっくり進む結節・気管支拡張・空洞で、急な呼吸不全は典型でない。単剤治療は禁忌。","","季節性やウイルス検査の情報がなく、β-D グルカン高値は PCP（Pneumocystis pneumonia：ニューモシスチス肺炎） に合う。"],"core":"非 HIV（human immunodeficiency virus：ヒト免疫不全ウイルス） のニューモシスチス肺炎（ステロイド・免疫抑制薬・リツキシマブ）＝急に進む呼吸不全（HIV 患者より速く重い）、両側すりガラス影、β-D グルカン高値。ST 合剤（治療量）、低酸素ならステロイド。ST 合剤が使えなければペンタミジン（ベナンバック
